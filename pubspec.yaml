name: qd_and_d
description: "QD&D - Your Roleplay Companion for D&D 5e"
publish_to: 'none'
version: 0.13.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Theming
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # XML Parsing
  xml: ^6.5.0
  intl: ^0.20.2

  # Utilities
  archive: ^4.0.7
  crypto: ^3.0.7
  uuid: ^4.2.2
  path_provider: ^2.1.1
  path: ^1.9.1
  file_picker: ^8.1.4

  # Animations
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/data/fc5_examples/
    - assets/data/spells/
    - assets/data/races/
    - assets/data/classes/
    - assets/data/backgrounds/
    - assets/data/features/
    - assets/data/items.json
    - assets/fonts/Rubik-OFL.txt
    - assets/fonts/Inter-OFL.txt

  # Bundled for offline use; static instances of the variable fonts,
  # subset to Latin, Cyrillic and common symbols (see AppType).
  fonts:
    # Rubik is optically heavier than the Roboto these weights were tuned
    # for: the files registered as 700/800 carry semibold outlines and 900
    # carries bold ones (their OS/2 weight matches), so headings keep their
    # lightness and hierarchy comes from size.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-SemiBold-w700.ttf
          weight: 700
        - asset: assets/fonts/Rubik-SemiBold-w800.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Bold-w900.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
