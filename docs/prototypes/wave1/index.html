<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>QDnD · Волна 1</title>
<style>
/* Wave 1 prototype: lobby, hero sheet frame, Overview and Stats, as one
   living app. Fonts are the app's own assets; colors mirror AppPalettes;
   springs mirror AppMotion (snappy .9, gentle 1.0, bouncy .75). */
@font-face{font-family:Rubik;font-weight:400;src:url(../../../assets/fonts/Rubik-Regular.ttf)}
@font-face{font-family:Rubik;font-weight:500;src:url(../../../assets/fonts/Rubik-Medium.ttf)}
@font-face{font-family:Rubik;font-weight:600;src:url(../../../assets/fonts/Rubik-SemiBold.ttf)}
@font-face{font-family:Rubik;font-weight:700;src:url(../../../assets/fonts/Rubik-SemiBold-w700.ttf)}
@font-face{font-family:Inter;font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(../../../assets/fonts/Inter-Bold.ttf)}

/* Layout: a phone-sized app; on a real phone it fills the screen, on a
   desktop it sits beside the variant controls. */
:root{
  --page:#221f19; --surface:#2A2720; --fg:#FAF7F0; --muted:#c3bfb5; --low:#302D26; --cont:#3C382E;
  --high:#4C473C; --highest:#5E594B; --primary:#FE5685; --on-primary:#191512; --secondary:#66D9EF;
  --tertiary:#FD971F; --pc:#49313C; --sc:#314146; --tc:#473B2C; --outline:#79705B; --line:#3a362e;
  --heal:#A6E22E; --a0:#FE5685; --a1:#FD971F; --a2:#FFD866; --a3:#A6E22E; --a4:#66D9EF; --a5:#AB9DF2;
  --display:Rubik,"Segoe UI",Roboto,system-ui,sans-serif; --body:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-lgp:20px; --r-xl:28px; --r-xlp:32px;
  --e-snappy:cubic-bezier(.2,0,0,1); --e-gentle:cubic-bezier(.2,0,0,1); --d-snappy:450ms; --d-gentle:620ms;
  --e-standard:cubic-bezier(.2,0,0,1); --e-enter:cubic-bezier(.05,.7,.1,1); --e-exit:cubic-bezier(.3,0,.8,.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  transition:background-color 500ms var(--e-standard)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.reduce *,.reduce *::before,.reduce *::after{transition-duration:1ms!important;animation:none!important}

/* Stage */
.stage{min-height:100%;display:flex;gap:36px;align-items:flex-start;justify-content:center;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:46px;overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 10px #12110e,0 30px 70px -20px rgba(0,0,0,.7);isolation:isolate}
.panel{width:340px;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.panel h1{font:600 30px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.panel p{margin:0;color:var(--muted);font-size:14px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lbl{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt .hint{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){
  .stage{padding:0;gap:0;display:block}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .panel{display:none}
}
/* Prototype-only control: a small tab on the right edge, clear of app UI. */
.vbtn{position:absolute;right:0;top:46%;z-index:40;width:34px;height:44px;border-radius:14px 0 0 14px;
  display:grid;place-items:center;color:var(--fg);opacity:.85}
.vbtn .icon{width:18px;height:18px}
@media (min-width:761px){.vbtn{display:none}}

/* Segments: the indicator flows, the selected label firms up */
.seg{position:relative;display:inline-flex;background:var(--low);border-radius:999px;padding:4px;isolation:isolate;max-width:100%}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--sc);z-index:-1}
.seg button{position:relative;padding:9px 14px;border-radius:999px;font:600 13px/1.1 var(--body);color:var(--muted);white-space:nowrap;transition:color 240ms var(--e-snappy)}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg.wide{display:flex}.seg.wide button{flex:1;text-align:center}
.toggle{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--body);color:var(--muted)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--high);position:relative;transition:background-color 240ms var(--e-snappy)}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:999px;background:var(--muted);
  transition:left var(--d-snappy) var(--e-snappy),background-color 240ms}
.toggle[aria-checked="true"] .switch{background:var(--secondary)}
.toggle[aria-checked="true"] .switch::after{left:22px;background:var(--surface)}

/* Glass: only for layers floating over live content */
.glass{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 .7px 0 color-mix(in srgb,var(--fg) 14%,transparent),0 10px 30px -12px rgba(0,0,0,.55)}

/* App layers */
.layer{position:absolute;inset:0;overflow:hidden}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.topbar{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 10px;
  display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(-6px);pointer-events:none}
.topbar.on{pointer-events:auto}
.tb-title{font:600 17px/1.2 var(--display);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 8%,transparent);flex:none;
  transition:transform var(--d-snappy) var(--e-snappy),background-color 200ms}
.round:active{transform:scale(.92);background:color-mix(in srgb,var(--fg) 14%,transparent)}

/* Lobby A */
.lobby-inner{padding:calc(56px + env(safe-area-inset-top,0px)) 16px 120px;display:flex;flex-direction:column;gap:12px}
.lg-title{font:600 36px/1.08 var(--display);letter-spacing:-.03em;margin:0;transform-origin:left bottom}
.lg-sub{color:var(--muted);margin:2px 0 8px;font-size:14.5px}
.hcard{position:relative;display:flex;gap:14px;align-items:center;width:100%;padding:14px;border-radius:var(--r-xl);background:var(--low);overflow:hidden;
  transition:transform var(--d-snappy) var(--e-snappy)}
.hcard:active{transform:scale(.98)}
.flow{position:absolute;inset:-40% -30% auto auto;width:70%;height:180%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);opacity:.55;transform:rotate(-12deg)}
.hav{position:relative;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--acc) 18%,var(--cont));color:var(--acc)}
.hav .icon{width:28px;height:28px}
.hmain{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hname{font:600 18px/1.2 var(--display);letter-spacing:-.01em}
.hline{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hvitals{display:flex;align-items:center;gap:10px;margin-top:8px}
.mini-hp{flex:1;height:6px;border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.mini-hp i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.vtxt{font:600 13px/1 var(--display);font-variant-numeric:tabular-nums}
.acchip{display:inline-flex;align-items:center;gap:5px;font:600 12.5px/1 var(--body);color:var(--muted)}
.acchip .icon{width:15px;height:15px;color:var(--secondary)}
.fab{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;height:56px;padding:0 22px 0 18px;border-radius:20px;
  display:flex;align-items:center;gap:10px;font:600 15px/1 var(--body);background:var(--pc);color:var(--fg);
  box-shadow:0 12px 26px -10px rgba(0,0,0,.6);transition:transform var(--d-snappy) var(--e-snappy)}
.fab:active{transform:scale(.96)}

/* Lobby B: a wallet-like deck */
.deck{position:relative;transition:height var(--d-gentle) var(--e-gentle)}
.dcard{position:absolute;left:0;right:0;height:214px;border-radius:var(--r-xl);padding:18px;overflow:hidden;
  background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 26%,var(--cont)),var(--low) 75%);
  box-shadow:0 -1px 0 color-mix(in srgb,var(--fg) 8%,transparent) inset,0 -10px 24px -14px rgba(0,0,0,.6);
  transition:top var(--d-gentle) var(--e-gentle),transform var(--d-snappy) var(--e-snappy);display:flex;flex-direction:column;gap:6px;width:100%}
.dcard:active{transform:scale(.99)}
.dcard .row{display:flex;align-items:center;gap:12px}
.dcard .hav{width:44px;height:44px;border-radius:14px}
.dcard .big{font:600 22px/1.15 var(--display);letter-spacing:-.015em}
.dcard .stats{display:flex;gap:18px;margin-top:auto}
.dcard .stat b{display:block;font:600 22px/1 var(--display);font-variant-numeric:tabular-nums}
.dcard .stat span{font-size:12px;color:var(--muted)}
.lobby-head{position:absolute;left:0;right:0;top:0;padding:calc(54px + env(safe-area-inset-top,0px)) 18px 8px;z-index:3;
  background:linear-gradient(var(--surface) 78%,transparent)}
.deck-scroll{position:absolute;left:0;right:0;bottom:0;top:calc(152px + env(safe-area-inset-top,0px));overflow-y:auto;scroll-snap-type:y mandatory;
  overscroll-behavior:contain;scrollbar-width:none;padding:0 16px}
.deck-scroll::-webkit-scrollbar{display:none}
.deck-pin{position:sticky;top:0;height:0;z-index:2}
.snap{display:block;height:84px;scroll-snap-align:start}
.dcard{top:12px;transform-origin:50% 0;will-change:transform;transition:transform 0s,filter 0s}
.dcard:active{transform:none}
.drow{display:flex;align-items:center;gap:12px;position:relative}
.dname{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.dcls{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.ccls{display:inline-flex;align-items:center;gap:5px;color:var(--fg);font-weight:600}
.ccls i{width:7px;height:7px;border-radius:50%}
.csub{color:var(--muted)}
.dlvl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;
  background:color-mix(in srgb,var(--fg) 8%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 60%,transparent)}
.dbody{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:auto;opacity:var(--open,0);transform:translateY(calc((1 - var(--open,0)) * 10px))}
.dhp{display:flex;flex-direction:column;gap:6px}
.dhp-top{display:flex;justify-content:space-between;align-items:baseline;font:600 12px/1 var(--body);letter-spacing:.06em;color:var(--muted)}
.dhp-top b{font-size:20px;color:var(--fg);letter-spacing:0}
.dhp-top small{font-size:14px;color:var(--muted)}
.dhp .mini-hp{flex:none;height:8px}
.dcard .stats{margin-top:0;align-items:flex-end}
.dcard .open{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:600 13px/1 var(--body);color:var(--fg);opacity:.85}
.icon.fwd{width:16px;height:16px;transform:scaleX(-1)}

/* Sheet */
.sheet-layer{background:var(--surface)}
.hhead{position:relative;padding:calc(58px + env(safe-area-inset-top,0px)) 18px 14px;overflow:hidden}
.hhead .flow{inset:-60% -20% auto auto;width:90%;height:160%;opacity:.6}
.hhead .back{position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top,0px))}
.hrow{position:relative;display:flex;gap:16px;align-items:center}
.hhead .hav{width:72px;height:72px;border-radius:22px}
.hhead .hav .icon{width:34px;height:34px}
.hn{font:600 30px/1.08 var(--display);letter-spacing:-.025em;margin:0}
.hl{color:var(--muted);font-size:14px;margin-top:4px}
.lvl{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:600 13px/1 var(--body);padding:7px 12px;border-radius:999px;
  background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--fg)}
.hhead .flow.two{inset:auto auto -70% -30%;width:80%;height:150%}
.mcls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent);font:600 13px/1 var(--body)}
.mchip i{width:8px;height:8px;border-radius:50%}
.hacts{position:relative;display:flex;gap:10px;margin-top:16px;align-items:stretch}
.lvlbtn{flex:1;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:22px;background:color-mix(in srgb,var(--acc) 15%,color-mix(in srgb,var(--fg) 4%,transparent));
  transition:transform var(--d-snappy) var(--e-snappy)}
.lvlbtn:active{transform:scale(.98)}
.lvn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--acc) 26%,transparent);flex:none}
.lvlbtn b{display:block;font:600 14.5px/1.2 var(--body)}
.lvlbtn small{font-size:12px;color:var(--muted)}
.lvlbtn .upi{margin-left:auto;width:20px;height:20px;color:var(--acc)}
.d20btn{width:56px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 7%,transparent);transition:transform var(--d-snappy) var(--e-snappy)}
.d20btn:active{transform:scale(.94)}
.compact .hav{width:32px;height:32px;border-radius:11px}
.compact .hav .icon{width:17px;height:17px}
.cmhp{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:78px}
.cmhp .vtxt{font-size:14px}
.cmhp .mini-hp{width:78px;flex:none;height:4px}

.dock{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:22;transform:translateX(-50%);
  width:min(360px,calc(100% - 28px));border-radius:999px;padding:6px;display:flex;isolation:isolate}
.dock .ind,.island .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;z-index:-1;
  background:color-mix(in srgb,var(--secondary) 24%,color-mix(in srgb,var(--surface) 40%,transparent))}
.dock button,.island button{flex:1;height:50px;display:grid;place-items:center;border-radius:999px;color:var(--muted);transition:color 220ms var(--e-snappy)}
.dock button[aria-selected="true"],.island button[aria-selected="true"]{color:var(--fg)}
.dock button .icon,.island button .icon{transition:transform var(--d-snappy) var(--e-snappy)}
.dock button[aria-selected="true"] .icon,.island button[aria-selected="true"] .icon{transform:scale(1.1)}
.island-wrap{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:12;padding:6px 14px 10px}
.island{position:relative;display:flex;padding:6px;border-radius:999px;isolation:isolate}

.strip-wrap{position:relative;overflow:hidden;touch-action:pan-y;transition:height 380ms var(--e-standard)}
.strip{display:flex;align-items:flex-start;will-change:transform}
.page{flex:0 0 100%;padding:6px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-title{font:600 20px/1.2 var(--display);letter-spacing:-.015em;margin:8px 2px 0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-title small{font:500 13px/1 var(--body);color:var(--muted);letter-spacing:0}

/* Overview */
.vitals{position:relative;border-radius:var(--r-xlp) var(--r-xlp) var(--r-xlp) var(--r-lgp);padding:18px;display:flex;flex-direction:column;gap:12px;
  background:color-mix(in srgb,var(--secondary) 10%,var(--cont));overflow:hidden}
.v-top{display:flex;justify-content:space-between;align-items:flex-end}
.v-lbl{font:600 13px/1 var(--body);letter-spacing:.06em;color:var(--muted)}
.v-val{display:flex;align-items:baseline;gap:6px;cursor:pointer}
.v-cur{font:600 52px/1 var(--display);letter-spacing:-.03em;color:var(--primary);display:inline-flex;transition:color 300ms}
.v-max{font:500 22px/1 var(--display);color:var(--muted)}
.odo{display:inline-flex;overflow:hidden;height:1em;line-height:1}
.odo .col{display:inline-block;height:1em;overflow:hidden;width:.6em;transition:width var(--d-snappy) var(--e-standard),opacity 200ms}
.odo .col.blank{width:0;opacity:0}
.odo .strip-d{display:flex;flex-direction:column;transition:transform var(--d-snappy) var(--e-snappy)}
.odo .strip-d span{height:1em;display:block;text-align:center}
.bar{position:relative;height:10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.bar>i{position:absolute;top:0;bottom:0;left:0;border-radius:999px}
.bar .ghost{background:color-mix(in srgb,var(--primary) 45%,var(--fg));opacity:.5;transition:width 520ms var(--e-standard) 380ms}
.bar .fill{background:var(--primary);transition:width var(--d-snappy) var(--e-standard)}
.bar .temp{background:var(--secondary);left:auto;right:0;transition:width var(--d-snappy) var(--e-standard)}
.v-sub{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.v-acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;font:600 14px/1 var(--body);
  background:var(--high);color:var(--fg);box-shadow:inset 0 0 0 100px transparent;
  transition:transform var(--d-snappy) var(--e-snappy),box-shadow 260ms var(--e-standard),background-color 200ms}
.btn:active{transform:scale(.975);box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--fg) 9%,transparent);transition:transform 160ms var(--e-standard),box-shadow 120ms}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:color-mix(in srgb,var(--secondary) 16%,var(--low))}
.btn.flex{flex:1}
.btn[disabled]{opacity:.45;pointer-events:none}
.v-hit{animation:hit 300ms var(--e-exit)}
@keyframes hit{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}100%{transform:none}}
.v-heal::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--heal);animation:fade 700ms var(--e-exit) forwards;pointer-events:none}
@keyframes fade{from{opacity:1}to{opacity:0}}
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--d-gentle) var(--e-standard),opacity 180ms var(--e-exit)}
.reveal>.reveal-in{overflow:hidden;min-height:0}
.reveal.open{grid-template-rows:1fr;opacity:1;transition:grid-template-rows var(--d-gentle) var(--e-standard),opacity 300ms var(--e-enter) 80ms}
.saves{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:var(--r-lgp);background:color-mix(in srgb,var(--primary) 12%,var(--low));margin-top:2px}
.marks{display:flex;gap:8px;align-items:center}
.mark{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--outline);transition:background-color 200ms,box-shadow 200ms,border-radius var(--d-snappy) var(--e-snappy),transform var(--d-snappy) var(--e-snappy)}
.mark.ok{background:var(--heal);box-shadow:none}
.mark.bad{background:var(--primary);box-shadow:none;border-radius:4px;transform:rotate(45deg) scale(.86)}

.now{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lgp);background:var(--tc)}
.now .nicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tertiary) 22%,transparent);color:var(--tertiary);flex:none}
.now .ntext{flex:1;min-width:0}
.now b{display:block;font:600 14.5px/1.3 var(--body)}
.now span{font-size:13px;color:var(--muted)}
.now .btn{height:38px;padding:0 14px;font-size:13px}

.qstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qs{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;border-radius:var(--r-lgp);background:var(--low);
  transition:transform var(--d-snappy) var(--e-snappy)}
.qs:active{transform:scale(.96)}
.qs .icon{width:18px;height:18px;color:var(--secondary)}
.qs b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.qs span{font:600 11px/1 var(--body);letter-spacing:.06em;color:var(--muted)}
.qs.ac{position:relative}
.qs.ac::before{content:"";position:absolute;inset:6px 10px;border-radius:12px 12px 22px 22px;background:color-mix(in srgb,var(--secondary) 9%,transparent)}
.qs.ac>*{position:relative}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:18px;font:600 13px/1.2 var(--body);
  color:var(--muted);box-shadow:inset 0 0 0 1.4px var(--outline);
  transition:border-radius var(--d-snappy) var(--e-standard),background-color 220ms,color 220ms,box-shadow 220ms,padding var(--d-snappy) var(--e-standard),transform var(--d-snappy) var(--e-snappy)}
.chip .tick{width:0;overflow:hidden;display:inline-flex;opacity:0;transform:scale(.4);transition:opacity 220ms,transform var(--d-snappy) var(--e-snappy)}
.chip[aria-pressed="true"]{border-radius:12px;background:var(--tc);color:var(--fg);box-shadow:inset 0 0 0 1.4px transparent;padding-left:10px}
.chip[aria-pressed="true"] .tick{width:16px;opacity:1;transform:none}
.chip{transition-property:border-radius,background-color,color,box-shadow,transform}
.chip:active{transform:scale(.97)}
.chip.add{color:var(--fg);box-shadow:inset 0 0 0 1.4px color-mix(in srgb,var(--fg) 22%,transparent)}
.cond{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 8px 6px 12px;border-radius:12px;background:var(--tc);font:600 13px/1.2 var(--body)}
.cond .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.cond .x .icon{width:13px;height:13px}
.empty{color:var(--muted);font-size:13.5px}

.wcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-xl) var(--r-xl) var(--r-xl) var(--r-lg);background:var(--low);width:100%;
  transition:transform var(--d-snappy) var(--e-snappy)}
.wcard:active{transform:scale(.985)}
.wcard .tile{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--sc);color:var(--secondary);flex:none}
.wcard .wn{font:600 16.5px/1.2 var(--display)}
.wcard .ws{color:var(--muted);font-size:13px}
.wcard .atk{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wcard .atk b{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums}
.wcard .atk span{font-size:11.5px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard2{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--r-xl) var(--r-xl) var(--r-xl) var(--r-lg);overflow:hidden;
  background:linear-gradient(140deg,color-mix(in srgb,var(--wk) 12%,var(--low)),var(--low) 60%);cursor:pointer;transition:transform var(--d-snappy) var(--e-snappy)}
.wcard2:active{transform:scale(.99)}
.wflow{position:absolute;right:-30%;top:-60%;width:70%;height:160%;background:radial-gradient(closest-side,color-mix(in srgb,var(--wk) 22%,transparent),transparent 70%);pointer-events:none}
.whead{position:relative;display:flex;align-items:center;gap:12px}
.wtile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--wk) 18%,var(--cont));color:var(--wk);flex:none}
.wtitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.wtitle b{font:600 18px/1.2 var(--display);letter-spacing:-.01em}
.wtitle span{font-size:12.5px;color:var(--muted)}
.wacts{position:relative;display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.wpill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:color-mix(in srgb,var(--fg) 6%,transparent);
  transition:transform var(--d-snappy) var(--e-snappy),background-color 160ms}
.wpill:active{transform:scale(.96);background:color-mix(in srgb,var(--fg) 11%,transparent)}
.wpill small{display:block;font:600 11px/1.1 var(--body);letter-spacing:.04em;color:var(--muted)}
.wpill b{display:block;font-size:22px;line-height:1.1}
.facet-ic{width:30px;height:30px;flex:none;fill:color-mix(in srgb,var(--primary) 20%,transparent);stroke:var(--primary);stroke-width:5;stroke-linejoin:round}
.facet-ic polyline{fill:none;stroke-width:3.5;opacity:.55}
.dtype{width:30px;height:30px;border-radius:10px;flex:none;background:color-mix(in srgb,var(--dt) 22%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--dt) 70%,transparent);
  position:relative}
.dtype::after{content:"";position:absolute;inset:8px;border-radius:4px;background:var(--dt);transform:rotate(45deg) scale(.8)}
.wtags{position:relative;display:flex;flex-wrap:wrap;gap:6px}
.wtags span{font:600 12px/1 var(--body);padding:6px 10px;border-radius:999px;color:var(--muted);box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--fg) 14%,transparent)}
.acrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--low)}
.acrow .ai{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--sc);color:var(--secondary);flex:none}
.acrow span{flex:1}
.acrow b{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums}
.actotal{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--secondary) 14%,var(--low));font:600 15px/1 var(--body)}
.actotal b{font:600 32px/1 var(--display)}
.rest{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rtile{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--r-lgp);background:var(--low);font:600 14px/1.2 var(--body);
  transition:transform var(--d-snappy) var(--e-snappy)}
.rtile:active{transform:scale(.97)}
.rtile .icon{color:var(--a5)}
.combat{height:58px;border-radius:29px;background:color-mix(in srgb,var(--primary) 22%,var(--low));font:600 16px/1 var(--body);display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform var(--d-snappy) var(--e-snappy)}
.combat:active{transform:scale(.98)}

/* Stats A: abilities that open into their own skills */
.passive{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--low);font:600 12.5px/1 var(--body);color:var(--muted)}
.pchip b{color:var(--fg);font-family:var(--display)}
.ab{border-radius:var(--r-xl);background:var(--low);overflow:hidden;transition:background-color 300ms}
.ab.open{background:var(--cont)}
.ab-head{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px}
.ab-mod{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;flex:none;font:600 24px/1 var(--display);font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--acc) 16%,var(--cont));transition:border-radius var(--d-snappy) var(--e-standard),transform var(--d-snappy) var(--e-snappy)}
.ab.open .ab-mod{border-radius:29px}
.ab-mod:active{transform:scale(.94)}
.ab-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ab-name b{font:600 17px/1.2 var(--display)}
.ab-name span{color:var(--muted);font-size:12.5px}
.save{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--body);padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--fg) 6%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--outline)}
.dot.on{background:var(--secondary);box-shadow:none}
.chev{color:var(--muted);transition:transform var(--d-snappy) var(--e-standard)}
.ab.open .chev{transform:rotate(180deg)}
.skills{padding:0 10px 10px;display:flex;flex-direction:column;gap:4px}
.sk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;width:100%;transition:background-color 160ms,transform var(--d-snappy) var(--e-snappy)}
.sk:active{background:color-mix(in srgb,var(--fg) 7%,transparent);transform:scale(.99)}
.sk span{flex:1}
.sk b{font:600 16px/1 var(--display);font-variant-numeric:tabular-nums}
.skills .none{padding:6px 12px 8px;color:var(--muted);font-size:13px}
/* Stats B: compact grid and grouped list */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.at{display:flex;flex-direction:column;align-items:stretch;border-radius:var(--r-lgp);background:var(--low);overflow:hidden}
.at-main{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 8px;transition:transform var(--d-snappy) var(--e-snappy),background-color 160ms}
.at-main:active{transform:scale(.96);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.at .sv{justify-content:center;margin:0;padding:9px 6px;color:var(--muted);border-top:1px solid color-mix(in srgb,var(--fg) 7%,transparent);transition:background-color 160ms}
.at .sv:active{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.tap-hint{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tap-hint .icon{width:15px;height:15px}
.at small{font:600 11.5px/1 var(--body);letter-spacing:.06em;color:var(--muted)}
.at b{font:600 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.at span{font-size:12px;color:var(--muted)}
.at .sv{display:flex;align-items:center;gap:5px;margin-top:4px;font:600 12px/1 var(--body)}
.glist{border-radius:var(--r-xl);background:var(--low);padding:6px}
.ghead{font:600 12px/1 var(--body);letter-spacing:.08em;color:var(--muted);padding:12px 12px 6px;text-transform:uppercase}

/* Bottom sheets */
.modal{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,8,6,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0}
.bsheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:var(--cont);box-shadow:0 -14px 40px -16px rgba(0,0,0,.6);transform:translateY(100%);touch-action:none}
.grab{height:28px;display:grid;place-items:center;flex:none;cursor:grab}
.grab i{width:36px;height:4px;border-radius:999px;background:var(--outline)}
.bs-body{overflow-y:auto;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.bs-title{font:600 24px/1.15 var(--display);letter-spacing:-.02em;margin:0}
.bs-sub{color:var(--muted);font-size:13.5px;margin-top:-8px}
/* Keypad */
.kp-display{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:6px 0;font:600 56px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kp-display small{font:500 18px/1 var(--display);color:var(--muted)}
.kp-display.zero{color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:56px;border-radius:18px;background:var(--low);font:600 22px/1 var(--display);display:grid;place-items:center;
  transition:transform var(--d-snappy) var(--e-snappy),background-color 140ms}
.key:active{transform:scale(.94);background:var(--high)}
.qamt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* Dice */
.dice-row{display:flex;justify-content:center;gap:22px;align-items:flex-end;min-height:170px;padding-top:26px}
.die-wrap{position:relative;display:grid;justify-items:center;gap:12px;transition:opacity 320ms var(--e-standard),transform var(--d-snappy) var(--e-snappy),filter 320ms}
.die{width:112px;height:112px;display:grid;place-items:center;position:relative;z-index:1}
.die-wrap.small .die{width:92px;height:92px}
.die svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.die .face{fill:var(--pc);stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;transition:fill 420ms,stroke 420ms}
.die .facet{fill:none;stroke:color-mix(in srgb,var(--primary) 45%,transparent);stroke-width:1.5}
.die .rim{fill:none;stroke:var(--tertiary);stroke-width:4;stroke-linejoin:round;stroke-dasharray:18 82;opacity:0}
.die .n{position:relative;font:600 36px/1 var(--display);font-variant-numeric:tabular-nums;transition:color 420ms}
.die-wrap.small .n{font-size:28px}
.die-shadow{width:66%;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.42),transparent)}
.die-glow{position:absolute;left:50%;top:56px;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--tertiary) 40%,transparent),transparent)}
.die-wrap.crit .face{stroke:var(--tertiary)} .die-wrap.crit .n{color:var(--tertiary)}
.die-wrap.fail .face{fill:var(--high);stroke:var(--outline)} .die-wrap.fail .n{color:var(--muted)}
.die-wrap.dropped{opacity:.38;transform:translateY(8px) scale(.86);filter:saturate(.35)}
.rline{display:flex;align-items:baseline;justify-content:center;gap:10px;font:600 22px/1.2 var(--display);font-variant-numeric:tabular-nums;min-height:36px}
.rline>span{opacity:0;transform:translateY(8px);transition:opacity 240ms var(--e-enter),transform var(--d-snappy) var(--e-snappy)}
.rline>span.in{opacity:1;transform:none}
.rline .m,.rline .e{color:var(--muted)}
.rline .t{font-size:30px}
.rwhy{text-align:center;color:var(--muted);font-size:13.5px;min-height:20px}
.toast{position:absolute;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;padding:13px 16px;border-radius:var(--r-lgp);
  font-size:14px;transform:translateY(30px);opacity:0;transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms;pointer-events:none}
.toast.show{transform:none;opacity:1}
.placeholder{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:22px;border-radius:var(--r-xl);background:var(--low);color:var(--muted)}
.placeholder b{color:var(--fg);font:600 18px/1.2 var(--display)}
</style>
</head>

<script>
'use strict';
/* ---------- palette (AppPalettes after U10, warm Monokai) ---------- */
const PALETTES = {
  monokai:{dark:true,surface:'#2A2720',on:'#FAF7F0',low:'#302D26',cont:'#3C382E',high:'#4C473C',highest:'#5E594B',primary:'#FE5685',secondary:'#66D9EF',tertiary:'#FD971F',pc:'#49313C',sc:'#314146',tc:'#473B2C',outline:'#79705B',heal:'#A6E22E',muted:.72,
    acc:['#FE5685','#FD971F','#FFD866','#A6E22E','#66D9EF','#AB9DF2']},

/* ---------- segments with a flowing indicator ---------- */
function flowing(ind, inset){
  let left, right, render = () => { ind.style.left = left.x+'px'; ind.style.width = Math.max(0, right.x-left.x)+'px'; };
  left = new Spring(0, SPR.snappy, render); right = new Spring(0, SPR.snappy, render);
  let current = -1, timer = 0;
  return {
    moveTo(btn, instant){
      const l = btn.offsetLeft + inset, r = btn.offsetLeft + btn.offsetWidth - inset, idx = [...btn.parentNode.children].indexOf(btn);
      clearTimeout(timer);
      if (instant || current < 0) { left.set(l); right.set(r); current = idx; return; }
      const fwd = idx > current; current = idx;
      (fwd ? right : left).to(fwd ? r : l, SPR.snappy);
      timer = setTimeout(() => (fwd ? left : right).to(fwd ? l : r, SPR.bouncy), reduced ? 0 : 90);
    },
    place(l, r){ clearTimeout(timer); left.set(l); right.set(r); }
  };
}
function segment(seg, onPick){
  const flow = flowing(seg.querySelector('.ind'), 0), buttons = $$('button', seg);
  const pick = (b, instant) => { buttons.forEach(x => x.setAttribute('aria-pressed', x === b)); flow.moveTo(b, instant); onPick && onPick(b); };
  buttons.forEach(b => b.addEventListener('click', () => pick(b)));
  requestAnimationFrame(() => flow.moveTo(buttons.find(b => b.getAttribute('aria-pressed') === 'true') || buttons[0], true));
  return { pick, refresh: () => flow.moveTo(buttons.find(b => b.getAttribute('aria-pressed') === 'true'), true) };
}

      const disp = $('#kpNum', sh), go = $('#kpGo', sh);
      const upd = () => { disp.textContent = amount; $('#kpDisp', sh).classList.toggle('zero', !amount); go.disabled = !amount; go.textContent = label(); go.classList.toggle('primary', m !== 'heal'); go.style.background = m === 'heal' ? 'color-mix(in srgb,var(--heal) 30%,var(--low))' : ''; };
      segment($('#kpSeg', sh), b => { m = b.dataset.v; upd(); });
      sh.addEventListener('click', e => {
        const k = e.target.closest('[data-k]'), a = e.target.closest('[data-add]'), s = e.target.closest('[data-set]');
        if (k) { const v = k.dataset.k; amount = v === 'c' ? Math.floor(amount/10) : Math.min(9999, +(String(amount) + v)); upd(); }
        if (a) { amount = Math.min(9999, amount + +a.dataset.add); upd(); }
        if (s) { amount = +s.dataset.set; upd(); }
      });
      go.addEventListener('click', () => { const am = amount, mm = m; close(); setTimeout(() => applyHp(mm, am), reduced ? 0 : 160); });
    }});
}
function condSheet(){
  openSheet(`<h2 class="bs-title">Состояния</h2><div class="bs-sub">Отметьте, что действует на героя. Снять можно здесь или крестиком в Обзоре.</div>
    <div class="chips" id="condPick">${CONDITIONS.map(c => `<button type="button" class="chip" data-key="${c}" aria-pressed="${hero.conds.includes(c)}" data-cond="${c}"><span class="tick">${icon('check')}</span>${c}</button>`).join('')}</div>
    <button type="button" class="btn primary" data-close style="height:52px">Готово</button>`, {onOpen(sh, close){
      sh.addEventListener('click', e => {
        const c = e.target.closest('[data-cond]');
        if (c) {
          const on = c.getAttribute('aria-pressed') !== 'true';
          // The chip grows instantly; neighbours glide to their new places.
          flip($('#condPick', sh), () => c.setAttribute('aria-pressed', on));
          hero.conds = on ? [...hero.conds, c.dataset.cond] : hero.conds.filter(x => x !== c.dataset.cond);
        }
        if (e.target.closest('[data-close]')) close();
      });
    }, onClose(){ refreshConds(); }});
}
function weaponSheet(i){
  const w = hero.weapons[i];
  openSheet(`<div style="display:flex;gap:12px;align-items:center;--wk:var(--a${w.kind === 'ranged' ? 4 : 1})"><span class="wtile" style="width:48px;height:48px">${icon('sword')}</span><div><h2 class="bs-title">${w.n}</h2><div class="bs-sub" style="margin:0">${KIND[w.kind]} · экипировано</div></div></div>
    <div class="wacts" style="--wk:var(--a1)"><button type="button" class="wpill watk" data-roll="atk:${i}">${facet}<span><small>Атака</small><b class="num">${fmt(w.atk)}</b></span></button>
      <button type="button" class="wpill wdmg" data-dmg="${i}" style="--dt:var(--a${DTYPE[w.type] ?? 2})"><span class="dtype"></span><span><small>Урон · ${w.type}</small><b class="num">${w.dice}</b></span></button></div>
    ${w.tags.length ? `<div class="wtags">${w.tags.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
    <div class="bs-sub" style="margin:0">Свойства, заряды и описание предмета придут вместе с инвентарём и Кузницей.</div>`,
    {onOpen(sh, close){ sh.addEventListener('click', e => { const r = e.target.closest('[data-roll]'), d = e.target.closest('[data-dmg]');
      if (r) { close(); setTimeout(() => rollSheet(r.dataset.roll), 220); }
      if (d) { close(); setTimeout(() => dmgSheet(+d.dataset.dmg), 220); } }); }});
}
function acSheet(){
  const h = hero;
  openSheet(`<h2 class="bs-title">Класс доспеха</h2><div class="bs-sub">Из чего складывается сейчас</div>
    ${h.ac.map(([n, v, ic]) => `<div class="acrow"><span class="ai">${icon(ic)}</span><span>${n}</span><b>${v > 0 && h.ac[0][0] !== n ? '+' : ''}${v}</b></div>`).join('')}
    <div class="actotal"><span>Итого</span><b class="num">${h.acTotal}</b></div>
    <div class="bs-sub" style="margin:0">Считается автоматически из надетого снаряжения. Если мастер решил иначе, значение можно закрепить вручную — расчёт останется виден рядом.</div>
    <button type="button" class="btn" data-pin style="height:50px">Закрепить вручную</button>`, {onOpen(sh){ sh.addEventListener('click', e => { if (e.target.closest('[data-pin]')) toast('Ручная КД — в редакторе параметров'); }); }});
}
// Damage: dice are rolled, the total locks in like the d20 result.
function dmgSheet(i){
  const w = hero.weapons[i], m = w.dice.match(/(\d+)к(\d+)(?:([+−-])(\d+))?/);
  const count = +m[1], sides = +m[2], bonus = m[3] ? (m[3] === '+' ? 1 : -1) * +m[4] : 0;
  let crit = false;
  openSheet(`<h2 class="bs-title">Урон · ${w.n}</h2><div class="bs-sub">${w.dice} ${w.type}</div>
    <button type="button" class="toggle" id="critT" role="switch" aria-checked="false"><span class="switch"></span>Критическое попадание — кости удваиваются</button>
    <div class="kp-display" id="dmgOut"><span class="num" id="dmgNum">—</span></div><div class="rwhy" id="dmgWhy">Касание кнопки — бросок</div>
    <button type="button" class="btn primary" id="dmgGo" style="height:52px">Бросить урон</button>`, {onOpen(sh){
      $('#critT', sh).addEventListener('click', e => { crit = !crit; e.currentTarget.setAttribute('aria-checked', crit); });
      $('#dmgGo', sh).addEventListener('click', () => {
        const n = count * (crit ? 2 : 1), rolls = Array.from({length:n}, () => 1 + Math.floor(Math.random()*sides)), total = Math.max(0, rolls.reduce((a,b) => a+b, 0) + bonus);
        const el = $('#dmgNum', sh); el.textContent = ''; odometer(el, total, 2);
        $('#dmgWhy', sh).textContent = `к${sides}: ${rolls.join(' + ')}${bonus ? ` ${bonus > 0 ? '+' : '−'} ${Math.abs(bonus)}` : ''}${crit ? ' · крит' : ''}`;
      });
    }});
}

/* ---------- rolls ---------- */
function rollInfo(code){
  const h = hero, [kind, a, id] = code.split(':');
  if (kind === 'init') return ['Инициатива', mod(h.ab.dex)];
  if (kind === 'ab') return ['Проверка: ' + AB.find(x => x[0] === a)[1], mod(h.ab[a])];
  if (kind === 'save') return ['Спасбросок: ' + AB.find(x => x[0] === a)[1], mod(h.ab[a]) + (h.saves.includes(a) ? h.pb : 0)];
  if (kind === 'sk') return [SKILLS[a].find(s => s[0] === id)[1], mod(h.ab[a]) + (h.skills.includes(id) ? h.pb : 0)];
  if (kind === 'free') return ['Бросок к20', 0];
  if (kind === 'atk') return ['Атака: ' + h.weapons[+a].n, h.weapons[+a].atk];
  return ['Бросок', 0];
}
const HEX = '50,4 90,27 90,73 50,96 10,73 10,27';
const dieSvg = () => `<svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="face" points="${HEX}"/><polyline class="facet" points="50,4 28,62 72,62 50,4"/><polyline class="facet" points="10,27 28,62 50,96 72,62 90,27"/><line class="facet" x1="10" y1="73" x2="28" y2="62"/><line class="facet" x1="90" y1="73" x2="72" y2="62"/><polygon class="rim" points="${HEX}" pathLength="100"/></svg>`;
function rollSheet(code){
  const [title, bonus] = rollInfo(code); let mode = 'normal', dice = [], rolling = false;
  openSheet(`<h2 class="bs-title">${title}</h2><div class="bs-sub">к20 ${bonus >= 0 ? '+' : '−'} ${Math.abs(bonus)}</div>
    ${segHTML([['dis','Помеха'],['normal','Обычный'],['adv','Преимущество']],'normal','wide').replace('class="seg wide"','class="seg wide" id="rSeg"')}
    <div class="dice-row" id="dRow"></div><div class="rline" id="rLine"><span class="r num"></span><span class="m num">${bonus >= 0 ? '+' : '−'} ${Math.abs(bonus)}</span><span class="e">=</span><span class="t num"></span></div>
    <div class="rwhy" id="rWhy">Касание кубика — бросок</div><button type="button" class="btn primary" id="rGo" style="height:52px">Бросить</button>`, {onOpen(sh){
      const row = $('#dRow', sh), line = $('#rLine', sh), why = $('#rWhy', sh);
      const build = animate => {
        const n = mode === 'normal' ? 1 : 2;
        row.innerHTML = Array.from({length:n}, () => `<div class="die-wrap${n > 1 ? ' small' : ''}"><i class="die-glow"></i><button type="button" class="die" aria-label="Бросить">${dieSvg()}<span class="n num">20</span></button><i class="die-shadow"></i></div>`).join('');
        dice = $$('.die-wrap', row).map(w => { const d = {w, el:$('.die', w), sh:$('.die-shadow', w), glow:$('.die-glow', w), rim:$('.rim', w), n:$('.n', w), y:0, r:0, sq:0, falling:false};
          const draw = () => { d.el.style.transform = `translateY(${d.y}px) rotate(${d.r}deg) scale(${1+.025*d.sq},${1-.035*d.sq})`; const l = clamp(-d.y/24,0,1); d.sh.style.transform = `scale(${1-.3*l})`; d.sh.style.opacity = 1 - .45*l; };
          d.ys = new Spring(0, SPR.snappy, v => { d.y = v; draw(); if (d.falling && v >= -1) { d.falling = false; d.ss.set(1); d.ss.to(0, SPR.snappy); } });
          d.rs = new Spring(0, SPR.gentle, v => { d.r = v; draw(); }); d.ss = new Spring(0, SPR.snappy, v => { d.sq = v; draw(); });
          d.el.addEventListener('click', go); return d; });
        if (animate && !reduced) dice.forEach((d, i) => { d.ys.set(12); d.rs.set(i ? 18 : -18); setTimeout(() => { d.ys.to(0, SPR.gentle); d.rs.to(0, SPR.gentle); }, 80*i); });
        $$('span', line).forEach(s => s.classList.remove('in'));
      };
      segment($('#rSeg', sh), b => { mode = b.dataset.v; build(true); });
      build(false);
      function go(){
        if (rolling) return; rolling = true; $$('span', line).forEach(s => s.classList.remove('in'));
        const res = dice.map(() => 1 + Math.floor(Math.random()*20)), T = reduced ? 0 : 1, ease = getComputedStyle(document.documentElement).getPropertyValue('--e-snappy') || 'ease-out';
        dice.forEach(d => { d.w.classList.remove('dropped','crit','fail'); d.glow.getAnimations().forEach(a => a.cancel()); });
        dice.forEach((d, i) => setTimeout(() => {
          d.ys.to(-20, SPR.snappy, -320); d.rs.to(d.r + 360 + Math.random()*120, SPR.gentle, 1100);
          let wait = 38; const flick = () => { d.n.textContent = 1 + Math.floor(Math.random()*20); wait *= 1.24; if (wait < 200 && T) d.tm = setTimeout(flick, wait); }; flick();
          setTimeout(() => { d.falling = true; d.ys.to(0, SPR.snappy); }, 200*T);
          setTimeout(() => { clearTimeout(d.tm); d.n.textContent = res[i]; d.rs.to(Math.round(d.r/360)*360, SPR.gentle); if (T) d.n.animate([{transform:'scale(.86)',opacity:.4},{transform:'scale(1)',opacity:1}], {duration:420, easing:ease}); }, 560*T);
        }, 70*i*T));
        setTimeout(() => {
          const keep = mode === 'adv' ? Math.max(...res) : mode === 'dis' ? Math.min(...res) : res[0], ki = res.indexOf(keep), k = dice[ki];
          dice.forEach((d, i) => { if (dice.length > 1 && i !== ki) d.w.classList.add('dropped'); });
          if (keep === 20) { k.w.classList.add('crit'); if (T) { k.glow.animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1)',offset:.3},{opacity:.8,offset:.6},{opacity:0,transform:'scale(1.06)'}], {duration:2400, easing:'ease-out'}); k.rim.animate([{strokeDashoffset:0,opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.8},{strokeDashoffset:-200,opacity:0}], {duration:1600}); } }
          else if (keep === 1) { k.w.classList.add('fail'); k.ys.to(3, SPR.gentle); k.rs.to(k.r - 6, SPR.gentle); }
          const [r, m, e, t] = line.children; r.textContent = keep; [r, m, e].forEach((el, j) => setTimeout(() => el.classList.add('in'), 130*j*T));
          setTimeout(() => { t.classList.add('in'); odometer(t, keep + bonus, 2); }, 300*T);
          why.style.color = keep === 20 ? 'var(--tertiary)' : ''; why.textContent = keep === 20 ? 'Естественная 20' : keep === 1 ? 'Естественная 1' : dice.length > 1 ? `Взято ${mode === 'adv' ? 'большее' : 'меньшее'} из ${res.join(' и ')}` : ' ';
          setTimeout(() => rolling = false, 320*T);
        }, (640 + 70*(dice.length-1))*T);
      }
      $('#rGo', sh).addEventListener('click', go);
    }});
}

/* ---------- sheet interactions ---------- */
sheetEl.addEventListener('click', e => {
  const t = e.target;
  const kp = t.closest('[data-act="keypad"]'); if (kp) return keypad(kp.dataset.mode || 'dmg');
  const r = t.closest('[data-roll]'); if (r) return rollSheet(r.dataset.roll);
  const d = t.closest('[data-dmg]'); if (d) return dmgSheet(+d.dataset.dmg);
  const w = t.closest('[data-weapon]'); if (w) return weaponSheet(+w.dataset.weapon);
  const un = t.closest('[data-uncond]'); if (un) { hero.conds = hero.conds.filter(c => c !== un.dataset.uncond); refreshConds(); return; }
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'conds') condSheet();
  if (act === 'ac') acSheet();
  if (act === 'levelup') toast(hero.classes.length > 1 ? 'Повышение: выбор класса для нового уровня — волна 6' : 'Мастер повышения — волна 6');
  if (act === 'death') { const roll = 1 + Math.floor(Math.random()*20); if (roll === 20) { hero.hp = 1; hero.ok = hero.bad = 0; pulse('v-heal'); } else if (roll === 1) hero.bad = Math.min(3, hero.bad + 2); else if (roll >= 10) hero.ok = Math.min(3, hero.ok + 1); else hero.bad = Math.min(3, hero.bad + 1); toast('Спасбросок от смерти: к20 = ' + roll); renderVitals(); }
  if (act === 'short') toast('Короткий отдых: выбор костей хитов — волна 3');
  if (act === 'long') { hero.hp = hero.max; hero.ok = hero.bad = 0; pulse('v-heal'); renderVitals(); toast('Длинный отдых: ОЗ восстановлены, отметки — за вами'); }
  if (act === 'combat') toast('Экран боя — волна 3');
});

/* ---------- variant controls ---------- */
function controlsHTML(){
  return `<div class="opt"><span class="lbl">Выбрано</span><span class="hint">Лобби — колода · вкладки — островок сверху · характеристики — сетка и список.</span></div>
    <div class="opt"><span class="lbl">Палитра</span>${segHTML([['monokai','Monokai'],['dune','Rose of Dune'],['nord','Nord']], palette).replace('class="seg "','class="seg" data-var="palette"')}</div>
    <button type="button" class="toggle" id="rm" role="switch" aria-checked="${reduced}"><span class="switch"></span>Меньше движения</button>`;
}
let palette = 'monokai';
function bindControls(root){
  $$('[data-var]', root).forEach(seg => segment(seg, b => {
    const k = seg.dataset.var, v = b.dataset.v;
    if (k === 'palette') { palette = v; applyPalette(v); return; }
    if (vars[k] === v) return; vars[k] = v;
    if (k === 'lobby') renderLobby();
    if (!sheetEl.hidden) { const t = tab; renderSheet(); requestAnimationFrame(() => { xSpring.set(-t*stepW()); tab = t; dockFlow.moveTo($$('#dock button')[t], true); $$('#dock button').forEach((x, j) => x.setAttribute('aria-selected', j === t)); arrive(); fitHeight(); }); }
  }));
  $('#rm', root).addEventListener('click', e => { reduced = !reduced; e.currentTarget.setAttribute('aria-checked', reduced); document.documentElement.classList.toggle('reduce', reduced); });
}
$('#controls').innerHTML = controlsHTML(); bindControls($('#controls'));
$('#vbtn').addEventListener('click', () => openSheet(`<h2 class="bs-title">Варианты прототипа</h2>${controlsHTML()}`, {onOpen(sh){ bindControls(sh); }, onClose(){ $('#controls').innerHTML = controlsHTML(); bindControls($('#controls')); }}));
addEventListener('resize', () => { if (!sheetEl.hidden && xSpring) { xSpring.set(-tab*stepW()); dockFlow.moveTo($$('#dock button')[tab], true); fitHeight(); } });
if (reduced) document.documentElement.classList.add('reduce');
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
applyPalette('monokai'); renderLobby();
</script>
</body>
