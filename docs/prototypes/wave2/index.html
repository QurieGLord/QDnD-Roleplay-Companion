<script>
'use strict';
/* Spells and lists generated from assets/data/spells (app data). */
const SPELLS = {"vicious-mockery": {"n": "Злая насмешка", "l": 0, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы обрушиваете на существо в пределах дистанции поток оскорблений, пронизанный тонкими чарами. Если цель может слышать вас (хотя ей не нужно понимать вас), она должна преуспеть в спасброске Мудрости или получить 1к4 психического урона и иметь помеху на следующий бросок атаки, который она совершает до конца своего следующего хода.\nУрон этого заклинания увеличивается на 1к4, когда вы достигаете 5-го уровня (2к4), 11-го уровня (3к4) и 17-го уровня (4к4).", "h": null, "cl": ["bard"]}, "minor-illusion": {"n": "Малая иллюзия", "l": 0, "s": "Иллюзия", "t": "1 действие", "r": "30 фт.", "d": "1 мин.", "c": "S · M", "m": "Немного овечьей шерсти.", "k": false, "ri": false, "x": "Вы создаете звук или образ объекта в пределах дистанции, который длится в течение длительности. Иллюзия заканчивается, если вы отпускаете ее действием или накладываете это заклинание снова.\nЕсли вы создаете звук, его громкость может варьироваться от шепота до крика. Это может быть ваш голос, голос кого-то другого, рык льва, бой барабанов или любой другой звук, который вы выберете. Звук продолжается непрерывно в течение длительности, или вы можете создавать дискретные звуки в разное время до окончания действия заклинания.\nЕсли вы создаете образ объекта - такого как стул, грязные следы или маленький сундук - он должен быть не больше 5-футового куба. Изображение не может создавать звук, свет, запах или любой другой сенсорный эффект. Физическое взаимодействие с изображением показывает, что это иллюзия, потому что вещи могут проходить сквозь него.\nЕсли существо использует свое действие для изучения звука или образа, существо может определить, что это иллюзия, с успешной проверкой Интеллекта (Расследование) против вашей Сл спасброска заклинаний. Если существо распознает иллюзию как таковую, иллюзия становится слабой для существа.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "prestidigitation": {"n": "Фокусы", "l": 0, "s": "Преобразование", "t": "1 действие", "r": "10 фт.", "d": "1 ч.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Это заклинание - небольшой магический трюк, который начинающие заклинатели используют для практики. Вы создаете один из следующих магических эффектов в пределах дистанции:\n- Вы создаете мгновенный, безвредный сенсорный эффект, такой как сноп искр, порыв ветра, слабые музыкальные ноты или странный запах.\n- Вы мгновенно зажигаете или тушите свечу, факел или небольшой костер.\n- Вы мгновенно очищаете или загрязняете объект объемом не более 1 кубического фута.\n- Вы охлаждаете, нагреваете или придаете вкус до 1 кубического фута неживой материи в течение 1 часа.\n- Вы заставляете цвет, небольшую метку или символ появляться на объекте или поверхности в течение 1 часа.\n- Вы создаете немагическую безделушку или иллюзорное изображение, которое может поместиться в вашей руке и которое длится до конца вашего следующего хода.\nЕсли вы накладываете это заклинание несколько раз, вы можете иметь до трех его не мгновенных эффектов активными одновременно, и вы можете отменить такой эффект действием.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "healing-word": {"n": "Лечащее слово", "l": 1, "s": "Воплощение", "t": "1 бонусное действие", "r": "60 фт.", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Существо по вашему выбору, которое вы можете видеть в пределах дистанции, восстанавливает количество хитов, равное 1к4 + ваш модификатор базовой характеристики заклинания. Это заклинание не действует на нежить или конструктов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, лечение увеличивается на 1к4 за каждый круг ячейки выше 1-го.", "cl": ["bard", "cleric", "druid"]}, "thunderwave": {"n": "Волна грома", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "На себя", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Волна громоподобной силы исходит от вас. Каждое существо в 15-футовом кубе, исходящем от вас, должно совершить спасбросок Телосложения. При провале существо получает 2к8 урона звуком и отталкивается на 10 футов от вас. При успехе существо получает половину урона и не отталкивается.\nКроме того, незакрепленные предметы, которые полностью находятся в области действия, автоматически отталкиваются на 10 футов от вас эффектом заклинания, и заклинание издает громоподобный гул, слышимый на расстоянии 300 футов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "druid", "sorcerer", "wizard"]}, "sleep": {"n": "Сон", "l": 1, "s": "Очарование", "t": "1 действие", "r": "90 фт.", "d": "1 мин.", "c": "V · S · M", "m": "Щепотка мелкого песка, лепестки розы или сверчок.", "k": false, "ri": false, "x": "Это заклинание погружает существ в магический сон. Бросьте 5к8; сумма - это количество хитов существ, на которые может воздействовать это заклинание. Существа в пределах 20 футов от точки, которую вы выбираете в пределах дистанции, затрагиваются в порядке возрастания их текущих хитов (игнорируя существ без сознания).\nНачиная с существа с наименьшим текущим количеством хитов, каждое существо, затронутое этим заклинанием, падает без сознания, пока заклинание не закончится, спящий не получит урон или кто-то не использует действие, чтобы потрясти или ударить спящего, чтобы разбудить его. Вычтите хиты каждого существа из общего количества, прежде чем переходить к следующему существу с наименьшим количеством хитов. Хиты существа должны быть равны или меньше оставшегося общего количества, чтобы это существо было затронуто.\nНежить и существа, иммунные к очарованию, не подвержены воздействию этого заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, бросайте дополнительные 2к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "sorcerer", "wizard"]}, "charm-person": {"n": "Очарование личности", "l": 1, "s": "Очарование", "t": "1 действие", "r": "30 фт.", "d": "1 ч.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы пытаетесь очаровать гуманоида, которого вы можете видеть в пределах дистанции. Он должен совершить спасбросок Мудрости, и делает это с преимуществом, если вы или ваши спутники сражаетесь с ним. Если он проваливает спасбросок, он очарован вами, пока заклинание не закончится или пока вы или ваши спутники не сделаете что-либо вредное для него. Очарованное существо считает вас дружелюбным знакомым. Когда заклинание заканчивается, существо знает, что оно было очаровано вами.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете выбрать одно дополнительное существо за каждый круг ячейки выше 1-го. Существа должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["bard", "druid", "sorcerer", "warlock", "wizard"]}, "heroism": {"n": "Героизм", "l": 1, "s": "Очарование", "t": "1 действие", "r": "Касание", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Добровольное существо, которого вы касаетесь, наполняется храбростью. До окончания действия заклинания существо иммунно к состоянию испуга и получает временные хиты, равные вашему модификатору базовой характеристики заклинания, в начале каждого своего хода. Когда заклинание заканчивается, цель теряет все оставшиеся временные хиты от этого заклинания.", "h": null, "cl": ["bard", "paladin"]}, "shatter": {"n": "Дробящий звук", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V · S · M", "m": "Щепотка слюды.", "k": false, "ri": false, "x": "Внезапный громкий звон, болезненно интенсивный, раздается в точке по вашему выбору в пределах дистанции. Каждое существо в сфере радиусом 10 футов с центром в этой точке должно совершить спасбросок Телосложения. Существо получает 3к8 урона звуком при провале или половину этого урона при успехе. Существо, сделанное из неорганического материала, такого как камень, кристалл или металл, имеет помеху на этот спасбросок.\nНемагический объект, который не носит и не несет существо, также получает урон, если он находится в области заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, урон увеличивается на 1к8 за каждый круг ячейки выше 2-го.", "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "invisibility": {"n": "Невидимость", "l": 2, "s": "Иллюзия", "t": "1 действие", "r": "Касание", "d": "Вплоть до 1 ч.", "c": "V · S · M", "m": "Ресница, заключенная в гуммиарабик.", "k": true, "ri": false, "x": "Существо, которого вы касаетесь, становится невидимым, пока заклинание не закончится. Все, что цель носит или несет, невидимо, пока находится на ней. Заклинание заканчивается для цели, если она атакует или накладывает заклинание.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы можете нацелиться на одно дополнительное существо за каждый круг ячейки выше 2-го.", "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "hypnotic-pattern": {"n": "Гипнотический узор", "l": 3, "s": "Иллюзия", "t": "1 действие", "r": "120 фт.", "d": "Вплоть до 1 мин.", "c": "S · M", "m": "Светящаяся палочка благовоний или хрустальный флакон, наполненный фосфоресцирующим материалом.", "k": true, "ri": false, "x": "Вы создаете извивающийся узор цветов, который переплетается в воздухе внутри 30-футового куба в пределах дистанции. Узор появляется на мгновение и исчезает. Каждое существо в области, которое видит узор, должно совершить спасбросок Мудрости. При провале существо становится очарованным на время действия. Будучи очарованным этим заклинанием, существо недееспособно и имеет скорость 0.\nЗаклинание заканчивается для затронутого существа, если оно получает какой-либо урон или если кто-то другой использует действие, чтобы встряхнуть существо из его ступора.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "guidance": {"n": "Наставление", "l": 0, "s": "Прорицание", "t": "1 действие", "r": "Касание", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Вы касаетесь одного добровольного существа. Один раз до окончания действия заклинания цель может бросить к4 и добавить выпавшее число к одной проверке характеристики по своему выбору. Она может бросить кость до или после совершения проверки характеристики. После этого заклинание заканчивается.", "h": null, "cl": ["cleric", "druid"]}, "sacred-flame": {"n": "Священное пламя", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Пламя, похожее на пламя, нисходит на существо, которое вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Ловкости или получить 1к8 урона излучением. Цель не получает выгоды от укрытия для этого спасброска.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["cleric"]}, "spare-the-dying": {"n": "Уход за умирающим", "l": 0, "s": "Некромантия", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы касаетесь живого существа, у которого 0 хитов. Существо становится стабилизированным. Это заклинание не действует на нежить или конструктов.", "h": null, "cl": ["cleric"]}, "bless": {"n": "Благословение", "l": 1, "s": "Очарование", "t": "1 действие", "r": "30 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Капля святой воды.", "k": true, "ri": false, "x": "Вы благословляете до трех существ по вашему выбору в пределах дистанции. Всякий раз, когда цель совершает бросок атаки или спасбросок до окончания действия заклинания, цель может бросить к4 и добавить выпавшее число к броску атаки или спасброску.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете выбрать одно дополнительное существо за каждый круг ячейки выше 1-го.", "cl": ["cleric", "paladin"]}, "cure-wounds": {"n": "Лечение ран", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Существо, которого вы касаетесь, восстанавливает количество хитов, равное 1к8 + ваш модификатор базовой характеристики заклинания. Это заклинание не действует на нежить или конструктов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, лечение увеличивается на 1к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "cleric", "druid", "paladin", "ranger"]}, "shield-of-faith": {"n": "Щит веры", "l": 1, "s": "Ограждение", "t": "1 бонусное действие", "r": "60 фт.", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Небольшой пергамент с написанным на нем текстом из святого писания.", "k": true, "ri": false, "x": "Мерцающее поле появляется и окружает существо по вашему выбору в пределах дистанции, предоставляя ему бонус +2 к КД на время действия.", "h": null, "cl": ["cleric", "paladin"]}, "command": {"n": "Приказ", "l": 1, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "1 раунд", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы произносите команду из одного слова существу, которое вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Мудрости или следовать команде в свой следующий ход. Заклинание не имеет эффекта, если цель нежить, если она не понимает ваш язык, или если ваша команда непосредственно вредна для нее.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете воздействовать на одно дополнительное существо за каждый круг ячейки выше 1-го. Существа должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["cleric", "paladin"]}, "guiding-bolt": {"n": "Направляющий снаряд", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "1 раунд", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вспышка света устремляется к существу по вашему выбору в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 4к6 урона излучением, и следующий бросок атаки, совершенный по этой цели до конца вашего следующего хода, имеет преимущество благодаря мистическому тусклому свету, который мерцает на цели до тех пор.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 1-го.", "cl": ["cleric"]}, "druidcraft": {"n": "Друидизм", "l": 0, "s": "Преобразование", "t": "1 действие", "r": "30 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Шепча духам природы, вы создаете один из следующих эффектов в пределах дистанции:\n- Вы создаете крошечный, безвредный сенсорный эффект, который предсказывает, какой будет погода в вашем месте на следующие 24 часа. Эффект может проявиться как золотая сфера для ясного неба, облако для дождя, падающие снежинки для снега и так далее. Эффект сохраняется в течение 1 раунда.\n- Вы мгновенно заставляете цветок расцвести, семя прорасти или листовую почку раскрыться.\n- Вы создаете мгновенный, безвредный сенсорный эффект, такой как падающие листья, дуновение ветра, звук маленького животного или слабый запах скунса. Эффект должен поместиться в куб с ребром 5 футов.\n- Вы мгновенно зажигаете или тушите свечу, факел или небольшой костер.", "h": null, "cl": ["druid"]}, "produce-flame": {"n": "Сотворение пламени", "l": 0, "s": "Вызов", "t": "1 действие", "r": "На себя", "d": "10 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Мерцающее пламя появляется в вашей руке. Пламя остается там на время действия и не вредит ни вам, ни вашему снаряжению. Пламя излучает яркий свет в радиусе 10 футов и тусклый свет еще на 10 футов. Заклинание заканчивается, если вы отпускаете его действием или если вы накладываете его снова.\nВы также можете атаковать пламенем, хотя это и заканчивает заклинание. Когда вы накладываете это заклинание или в качестве действия в более поздний ход, вы можете метнуть пламя в существо в пределах 30 футов от вас. Совершите дальнобойную атаку заклинанием. При попадании цель получает 1к8 урона огнем.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["druid"]}, "goodberry": {"n": "Чудо-ягоды", "l": 1, "s": "Преобразование", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S · M", "m": "Ветка омелы.", "k": false, "ri": false, "x": "В вашей руке появляется до десяти ягод, наполненных магией на время действия. Существо может использовать свое действие, чтобы съесть одну ягоду. Поедание ягоды восстанавливает 1 хит, и ягода обеспечивает достаточно пищи, чтобы поддерживать существо в течение одного дня.\nЯгоды теряют свою силу, если они не были съедены в течение 24 часов после накладывания заклинания.", "h": null, "cl": ["druid", "ranger"]}, "entangle": {"n": "Опутывание", "l": 1, "s": "Вызов", "t": "1 действие", "r": "90 фт.", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Хватающие сорняки и лозы прорастают из земли в квадрате с ребром 20 футов, начиная с точки в пределах дистанции. В течение длительности эти растения превращают землю в области в труднопроходимую местность.\nСущество в области, когда вы накладываете заклинание, должно преуспеть в спасброске Силы или быть опутанным опутывающими растениями, пока заклинание не закончится. Существо, опутанное растениями, может использовать свое действие, чтобы совершить проверку Силы против вашей Сл спасброска заклинаний. При успехе оно освобождается.\nКогда заклинание заканчивается, созданные растения увядают.", "h": null, "cl": ["druid"]}, "faerie-fire": {"n": "Огонь фей", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 1 мин.", "c": "V", "m": null, "k": true, "ri": false, "x": "Каждый объект в 20-футовом кубе в пределах дистанции очерчивается синим, зеленым или фиолетовым светом (по вашему выбору). Любое существо в области, когда заклинание накладывается, также очерчивается светом, если оно проваливает спасбросок Ловкости. На время действия объекты и затронутые существа излучают тусклый свет в радиусе 10 футов.\nЛюбой бросок атаки против затронутого существа или объекта имеет преимущество, если атакующий может его видеть, и затронутое существо или объект не могут получить выгоду от невидимости.", "h": null, "cl": ["druid"]}, "shillelagh": {"n": "Дубинка", "l": 0, "s": "Преобразование", "t": "1 бонусное действие", "r": "Касание", "d": "1 мин.", "c": "V · S · M", "m": "Омела, лист клевера и дубинка или посох.", "k": false, "ri": false, "x": "Дерево дубинки или посоха, которое вы держите, наполняется силой природы. В течение длительности вы можете использовать свою базовую характеристику заклинания вместо Силы для бросков атаки и урона рукопашных атак, использующих это оружие, и кость урона оружия становится к8. Оружие также становится магическим, если оно еще не является таковым. Заклинание заканчивается, если вы накладываете его снова или если вы выпускаете оружие из рук.", "h": null, "cl": ["druid"]}, "moonbeam": {"n": "Лунный луч", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Несколько семян лунного семени и кусок опалесцирующего полевого шпата.", "k": true, "ri": false, "x": "Серебристый луч бледного света светит вниз в цилиндре радиусом 5 футов и высотой 40 футов, центрированном на точке в пределах дистанции. Тусклый свет наполняет цилиндр. Когда существо входит в область заклинания впервые за ход или начинает там свой ход, оно поглощается призрачным пламенем, которое вызывает жгучую боль, и оно должно совершить спасбросок Телосложения. Оно получает 2к10 урона излучением при провале или половину этого урона при успехе.\nПеревертыш совершает свой спасбросок с помехой. Если он проваливает, он также мгновенно возвращается в свою первоначальную форму и не может принять другую форму, пока не покинет свет заклинания.\nВ каждый свой ход после того, как вы наложили это заклинание, вы можете использовать действие, чтобы переместить луч на 60 футов в любом направлении.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, урон увеличивается на 1к10 за каждый круг ячейки выше 2-го.", "cl": ["druid"]}, "spike-growth": {"n": "Шипы", "l": 2, "s": "Преобразование", "t": "1 действие", "r": "150 фт.", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Семь острых шипов или семь маленьких веточек, каждая заостренная на конце.", "k": true, "ri": false, "x": "Земля в радиусе 20 футов с центром в точке в пределах дистанции скручивается и прорастает твердыми шипами и колючками. Область становится труднопроходимой местностью на время действия. Когда существо входит в область или перемещается в ней, оно получает 2к4 колющего урона за каждые 5 футов, которые оно проходит.\nТрансформация земли замаскирована, чтобы выглядеть естественно. Любое существо, которое не может видеть область во время накладывания заклинания, должно совершить проверку Мудрости (Внимательность) против вашей Сл спасброска заклинаний, чтобы распознать местность как опасную перед тем, как войти в нее.", "h": null, "cl": ["druid", "ranger"]}, "lesser-restoration": {"n": "Малое восстановление", "l": 2, "s": "Ограждение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы касаетесь существа и можете закончить либо одну болезнь, либо одно состояние, влияющее на него. Состояние может быть ослепленным, оглушенным, парализованным или отравленным.", "h": null, "cl": ["bard", "cleric", "druid", "paladin", "ranger"]}, "divine-favor": {"n": "Божественная благосклонность", "l": 1, "s": "Воплощение", "t": "1 бонусное действие", "r": "На себя", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Ваша молитва наполняет вас божественным сиянием. До окончания действия заклинания ваши атаки оружием наносят дополнительные 1к4 урона излучением при попадании.", "h": null, "cl": ["paladin"]}, "protection-from-evil-and-good": {"n": "Защита от добра и зла", "l": 1, "s": "Ограждение", "t": "1 действие", "r": "Касание", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Святая вода или порошкообразное серебро и железо, которые заклинание расходует.", "k": true, "ri": false, "x": "До окончания действия заклинания одно добровольное существо, которого вы касаетесь, защищено от определенных типов существ: аберраций, небожителей, элементалей, фей, исчадий и нежити.\nЗащита дает несколько преимуществ. Существа этих типов совершают броски атаки против цели с помехой. Цель также не может быть очарована, испугана или одержима ими. Если цель уже очарована, испугана или одержима таким существом, цель имеет преимущество на любой новый спасбросок против соответствующего эффекта.", "h": null, "cl": ["cleric", "paladin", "warlock", "wizard"]}, "sanctuary": {"n": "Убежище", "l": 1, "s": "Ограждение", "t": "1 бонусное действие", "r": "30 фт.", "d": "1 мин.", "c": "V · S · M", "m": "Небольшое серебряное зеркало.", "k": false, "ri": false, "x": "Вы защищаете существо в пределах дистанции от атаки. До окончания действия заклинания любое существо, которое пытается нацелиться на защищенное существо атакой или вредоносным заклинанием, должно сначала совершить спасбросок Мудрости. При провале существо должно выбрать новую цель или потерять атаку или заклинание. Это заклинание не защищает защищенное существо от зональных эффектов, таких как взрыв огненного шара.\nЕсли защищенное существо совершает атаку, накладывает заклинание, которое влияет на вражеское существо, или наносит урон другому существу, это заклинание заканчивается.", "h": null, "cl": ["cleric", "paladin"]}, "zone-of-truth": {"n": "Зона правды", "l": 2, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "10 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы создаете магическую зону, которая защищает от обмана, в сфере радиусом 15 футов, центрированной на точке по вашему выбору в пределах дистанции. Пока заклинание длится, существо, которое входит в область заклинания впервые за ход или начинает там свой ход, должно совершить спасбросок Харизмы. При провале существо не может говорить преднамеренную ложь, пока находится в радиусе.\nВы знаете, удалось ли каждому существу пройти спасбросок или нет. Затронутое существо осознает заклинание и может избегать ответов на вопросы, на которые оно обычно лгало бы. Такие существа могут быть уклончивыми в своих ответах, пока они остаются в границах правды.", "h": null, "cl": ["bard", "cleric", "paladin"]}, "find-steed": {"n": "Поиск скакуна", "l": 2, "s": "Вызов", "t": "10 мин.", "r": "30 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы призываете духа, который принимает форму необычайно умного, сильного и верного коня, создавая прочную связь с ним. Появляясь в незанятом пространстве в пределах дистанции, скакун принимает форму, которую вы выбираете: боевой конь, пони, верблюд, лось или мастиф (ваш ГМ может разрешить других животных в качестве скакунов). Скакун имеет статистику выбранной формы, хотя это небожитель, фея или исчадие (по вашему выбору), а не зверь. Кроме того, если ваш скакун имеет Интеллект 5 или меньше, его Интеллект становится 6, и он получает способность понимать один язык по вашему выбору, на котором вы говорите.\nВаш скакун служит вам верховым животным как в бою, так и вне его, и у вас есть инстинктивная связь с ним, которая позволяет вам сражаться как единое целое. Пока вы верхом на нем, вы можете сделать так, чтобы любое заклинание, которое вы накладываете, нацеленное только на вас, также нацеливалось на вашего скакуна.\nКогда скакун падает до 0 хитов, он исчезает, не оставляя после себя физической формы. Вы также можете отпустить своего скакуна в любое время действием, заставляя его исчезнуть. В любом случае, повторное накладывание этого заклинания призывает того же скакуна, восстановленного до полного здоровья.", "h": null, "cl": ["paladin"]}, "aid": {"n": "Помощь", "l": 2, "s": "Ограждение", "t": "1 действие", "r": "30 фт.", "d": "8 ч.", "c": "V · S · M", "m": "Крошечная полоска белой ткани.", "k": false, "ri": false, "x": "Ваши заклинания воодушевляют ваших союзников стойкостью и решимостью. Выберите до трех существ в пределах дистанции. Максимум хитов и текущие хиты каждой цели увеличиваются на 5 на время действия заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, хиты увеличиваются на 5 за каждый круг ячейки выше 2-го.", "cl": ["cleric", "paladin"]}, "hunters-mark": {"n": "Метка охотника", "l": 1, "s": "Прорицание", "t": "1 бонусное действие", "r": "90 фт.", "d": "Вплоть до 1 ч.", "c": "V", "m": null, "k": true, "ri": false, "x": "Вы выбираете существо, которое вы можете видеть в пределах дистанции, и мистически помечаете его как свою добычу. До окончания действия заклинания вы наносите дополнительные 1к6 урона цели каждый раз, когда вы попадаете по ней атакой оружием, и вы имеете преимущество на любую проверку Мудрости (Внимательность) или Мудрости (Выживание), которую вы совершаете, чтобы найти ее. Если цель опускается до 0 хитов до окончания этого заклинания, вы можете использовать бонусное действие в один из ваших последующих ходов, чтобы пометить новое существо.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го или 4-го круга, вы можете поддерживать концентрацию на заклинании до 8 часов. Если вы используете ячейку заклинания 5-го круга или выше, вы можете поддерживать концентрацию на заклинании до 24 часов.", "cl": ["ranger"]}, "fire-bolt": {"n": "Огненный снаряд", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы бросаете сгусток огня в существо или объект в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1к10 урона огнем. Горючий предмет, попавший под это заклинание, воспламеняется, если его никто не несет и не носит.\nУрон этого заклинания увеличивается на 1к10, когда вы достигаете 5-го уровня (2к10), 11-го уровня (3к10) и 17-го уровня (4к10).", "h": null, "cl": ["sorcerer", "wizard"]}, "mage-hand": {"n": "Рука мага", "l": 0, "s": "Вызов", "t": "1 действие", "r": "30 фт.", "d": "1 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Спектральная, парящая рука появляется в точке, которую вы выбираете в пределах дистанции. Рука длится в течение длительности или пока вы не отпустите ее действием. Рука исчезает, если она когда-либо находится более чем в 30 футах от вас или если вы накладываете это заклинание снова.\nВы можете использовать свое действие, чтобы управлять рукой. Вы можете использовать руку, чтобы манипулировать объектом, открыть незапертую дверь или контейнер, убрать или положить предмет из открытого контейнера или вылить содержимое флакона. Вы можете перемещать руку на расстояние до 30 футов каждый раз, когда вы ее используете.\nРука не может атаковать, активировать магические предметы или нести более 10 фунтов.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "shocking-grasp": {"n": "Шоковое прикосновение", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Молния срывается с вашей руки, чтобы поразить существо, которое вы пытаетесь коснуться. Совершите рукопашную атаку заклинанием по цели. Вы имеете преимущество на бросок атаки, если цель носит доспехи из металла. При попадании цель получает 1к8 урона молнией, и она не может использовать реакции до начала своего следующего хода.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["sorcerer", "wizard"]}, "burning-hands": {"n": "Огненные ладони", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "На себя", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Когда вы держите руки с соприкасающимися большими пальцами и растопыренными остальными пальцами, тонкий лист пламени вырывается из ваших кончиков пальцев. Каждое существо в 15-футовом конусе должно совершить спасбросок Ловкости. Существо получает 3к6 урона огнем при провале или половину этого урона при успехе.\nОгонь воспламеняет любые горючие предметы в области, которые никто не несет и не носит.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 1-го.", "cl": ["sorcerer", "wizard"]}, "shield": {"n": "Щит", "l": 1, "s": "Ограждение", "t": "1 реакция", "r": "На себя", "d": "1 раунд", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Невидимый барьер магической силы появляется и защищает вас. До начала вашего следующего хода вы получаете бонус +5 к КД, в том числе против триггерной атаки, и вы не получаете урона от магической стрелы.", "h": null, "cl": ["sorcerer", "wizard"]}, "misty-step": {"n": "Туманный шаг", "l": 2, "s": "Вызов", "t": "1 бонусное действие", "r": "На себя", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы на мгновение окружаетесь серебристым туманом и телепортируетесь на расстояние до 30 футов в незанятое пространство, которое вы можете видеть.", "h": null, "cl": ["sorcerer", "warlock", "wizard"]}, "scorching-ray": {"n": "Опаляющий луч", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы создаете три луча огня и направляете их на цели в пределах дистанции. Вы можете направить их на одну цель или на несколько.\nСовершите дальнобойную атаку заклинанием для каждого луча. При попадании цель получает 2к6 урона огнем.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы создаете один дополнительный луч за каждый круг ячейки выше 2-го.", "cl": ["sorcerer", "wizard"]}, "fireball": {"n": "Огненный шар", "l": 3, "s": "Воплощение", "t": "1 действие", "r": "150 фт.", "d": "Мгновенная", "c": "V · S · M", "m": "Крошечный шарик из гуано летучей мыши и серы.", "k": false, "ri": false, "x": "Яркий луч вылетает из вашего указательного пальца в точку, которую вы выбираете в пределах дистанции, а затем взрывается с низким ревом пламени. Каждое существо в сфере радиусом 20 футов с центром в этой точке должно совершить спасбросок Ловкости. Существо получает 8к6 урона огнем при провале или половину этого урона при успехе.\nОгонь распространяется за углы. Он воспламеняет горючие предметы в области, которые никто не несет и не носит.", "h": "Если вы накладываете это заклинание, используя ячейку 4-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 3-го.", "cl": ["sorcerer", "wizard"]}, "haste": {"n": "Ускорение", "l": 3, "s": "Преобразование", "t": "1 действие", "r": "30 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Стружка корня лакрицы.", "k": true, "ri": false, "x": "Выберите добровольное существо, которое вы можете видеть в пределах дистанции. До окончания действия заклинания скорость цели удваивается, она получает бонус +2 к КД, она имеет преимущество на спасброски Ловкости, и она получает дополнительное действие в каждый свой ход. Это действие может быть использовано только для совершения действий Атака (только одна атака оружием), Рывок, Отход, Прятаться или Использование предмета.\nКогда заклинание заканчивается, цель не может двигаться или совершать действия до конца своего следующего хода, так как волна летаргии накатывает на нее.", "h": null, "cl": ["sorcerer", "wizard"]}, "eldritch-blast": {"n": "Мистический заряд", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Луч потрескивающей энергии устремляется к существу в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1к10 урона силовым полем.\nЗаклинание создает больше одного луча, когда вы достигаете более высоких уровней: два луча на 5-м уровне, три луча на 11-м уровне и четыре луча на 17-м уровне. Вы можете направить лучи в одну цель или в несколько. Совершите отдельный бросок атаки для каждого луча.", "h": null, "cl": ["warlock"]}, "hellish-rebuke": {"n": "Адское возмездие", "l": 1, "s": "Воплощение", "t": "1 реакция", "r": "60 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы указываете пальцем, и существо, которое нанесло вам урон, на мгновение окружается адским пламенем. Существо должно совершить спасбросок Ловкости. Оно получает 2к10 урона огнем при провале или половину этого урона при успехе.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к10 за каждый круг ячейки выше 1-го.", "cl": ["warlock"]}, "hold-person": {"n": "Удержание личности", "l": 2, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Небольшой, прямой кусок железа.", "k": true, "ri": false, "x": "Выберите гуманоида, которого вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Мудрости или быть парализованной на время действия. В конце каждого своего хода цель может совершить еще один спасбросок Мудрости. При успехе заклинание заканчивается на цели.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы можете нацелиться на одного дополнительного гуманоида за каждый круг ячейки выше 2-го. Гуманоиды должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["bard", "cleric", "druid", "sorcerer", "warlock", "wizard"]}, "darkness": {"n": "Тьма", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 10 мин.", "c": "V · M", "m": "Мех летучей мыши и капля дегтя или кусок угля.", "k": true, "ri": false, "x": "Магическая тьма распространяется из точки, которую вы выбираете в пределах дистанции, заполняя сферу радиусом 15 футов в течение длительности. Тьма огибает углы. Существо с темным зрением не может видеть сквозь эту тьму, и немагический свет не может освещать ее.\nЕсли точка, которую вы выбираете, находится на предмете, который вы держите, или на том, который никто не носит и не несет, тьма исходит от предмета и движется вместе с ним. Полное накрытие источника тьмы непрозрачным предметом, таким как миска или шлем, блокирует тьму.\nЕсли какая-либо часть области этого заклинания перекрывается областью света, созданного заклинанием 2-го круга или ниже, заклинание, создавшее свет, рассеивается.", "h": null, "cl": ["sorcerer", "warlock", "wizard"]}, "counterspell": {"n": "Контрзаклинание", "l": 3, "s": "Ограждение", "t": "1 реакция", "r": "60 фт.", "d": "Мгновенная", "c": "S", "m": null, "k": false, "ri": false, "x": "Вы пытаетесь прервать существо в процессе накладывания заклинания. Если существо накладывает заклинание 3-го круга или ниже, его заклинание проваливается и не имеет эффекта. Если оно накладывает заклинание 4-го круга или выше, совершите проверку своей базовой характеристики заклинания. Сл равна 10 + круг заклинания. При успехе заклинание существа проваливается и не имеет эффекта.", "h": "Если вы накладываете это заклинание, используя ячейку 4-го круга или выше, прерванное заклинание не имеет эффекта, если его круг меньше или равен кругу ячейки, которую вы использовали.", "cl": ["sorcerer", "warlock", "wizard"]}, "fly": {"n": "Полет", "l": 3, "s": "Преобразование", "t": "1 действие", "r": "Касание", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Перо крыла любой птицы.", "k": true, "ri": false, "x": "Вы касаетесь согласного существа. Цель получает скорость полета 60 футов на время действия. Когда заклинание заканчивается, цель падает, если она все еще находится в воздухе, если только она не может остановить падение.", "h": "Если вы накладываете это заклинание, используя ячейку 4-го круга или выше, вы можете нацелиться на одно дополнительное существо за каждый круг ячейки выше 3-го.", "cl": ["sorcerer", "warlock", "wizard"]}, "banishment": {"n": "Изгнание", "l": 4, "s": "Ограждение", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Предмет, неприятный для цели.", "k": true, "ri": false, "x": "Вы пытаетесь отправить одно существо, которое вы можете видеть в пределах дистанции, в другой план существования. Цель должна преуспеть в спасброске Харизмы, иначе будет изгнана.\nЕсли цель родом с плана существования, на котором вы находитесь, вы изгоняете цель в безвредный полуплан. Пока она там, цель недееспособна. Цель остается там до окончания действия заклинания, после чего она снова появляется в пространстве, которое она оставила, или в ближайшем незанятом пространстве, если это пространство занято.\nЕсли цель родом с другого плана существования, отличного от того, на котором вы находитесь, цель изгоняется с возвращением на свой родной план. Если заклинание заканчивается до истечения 1 минуты, цель снова появляется в пространстве, которое она оставила, или в ближайшем незанятом пространстве, если это пространство занято. В противном случае цель не возвращается.", "h": "Если вы накладываете это заклинание, используя ячейку 5-го круга или выше, вы можете выбрать одно дополнительное существо за каждый круг ячейки выше 4-го.", "cl": ["cleric", "paladin", "sorcerer", "warlock", "wizard"]}, "dimension-door": {"n": "Дверь в пространстве", "l": 4, "s": "Вызов", "t": "1 действие", "r": "500 фт.", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы телепортируетесь из своего текущего местоположения в любое другое место в пределах дистанции. Вы прибываете точно в нужное место. Это может быть место, которое вы видите, место, которое вы можете визуализировать, или место, const byLvl = (l, steps) => { let v; for (const [from, x] of steps) if (l >= from) v = x; return v; };

// up from 2nd); multiclass casters add full levels and half of half levels.
function slotsFor(h){
  const cs = h.classes.filter(c => FULLC.includes(c.id) || HALFC.includes(c.id)); if (!cs.length) return null;
  const cl = cs.length === 1 && HALFC.includes(cs[0].id) ? (cs[0].lvl < 2 ? 0 : Math.ceil(cs[0].lvl / 2)) : cs.reduce((t, c) => t + (FULLC.includes(c.id) ? c.lvl : Math.floor(c.lvl / 2)), 0);
  const row = FULL_SLOTS[Math.min(20, cl)] || []; return row.length ? Object.fromEntries(row.map((m, i) => [i + 1, {max:m, left:m}])) : null;
}
// The highest circle a class can learn by its own level.
const maxCircle = c => HALFC.includes(c.id) ? (c.lvl < 2 ? 0 : Math.min(5, Math.ceil(c.lvl / 4))) : c.id === 'warlock' ? Math.min(5, Math.ceil(c.lvl / 2)) : Math.min(9, Math.ceil(c.lvl / 2));
const topCircle = h => Math.max(0, ...Object.values(h.spell || {}).filter(e => !e.arcanum).map(e => SPELLS[e.id].l));
// Prototype only: try the hero at another level. Instrument state resets.
function setLevel(h, ci, lvl){
  const c = h.classes[ci], others = h.classes.reduce((t, x, i) => t + (i === ci ? 0 : x.lvl), 0);
  c.lvl = clamp(lvl, 1, 20 - others);

function setupHero(h){

  const wl = h.classes.find(c => c.id === 'warlock');
  h.pact = wl ? {circle:Math.min(5, Math.ceil(wl.lvl / 2)), max:byLvl(wl.lvl, [[1,1],[2,2],[11,3],[17,4]])} : null; if (h.pact) h.pact.left = h.pact.max;

  h.classes.forEach(c => {
    if (!c.list) return;
    const ids = LISTS[c.list], top = maxCircle(c);
    const cap = c.prep ? Math.max(1, c.mod + (c.id === 'paladin' ? Math.floor(c.lvl/2) : c.lvl)) : 0;
    let prepared = 0;
    ids.forEach(id => {

      if (arcN ? !(h.arc && h.arc[arcN]) : sp.l > top) return;

      else { entry.prep = prepared < cap; if (entry.prep) prepared++; }

let xSpring = null;
function bindCarousel(){

  const step = () => wrap.clientWidth;
  const fit = () => { const p = $$('.cpanel', strip)[clsIndex]; if (p) wrap.style.height = p.offsetHeight + 'px'; };
  xSpring = new Spring(-clsIndex * step(), SPR.snappy, x => { strip.style.transform = `translateX(${x}px)`; });
  xSpring.set(-clsIndex * step()); fit();
  wrap.fit = fit;
  if (h.classes.length < 2) return;
  const seg = segment($('#clsSeg'), b => go(+b.dataset.v));
  const go = (i, v) => { const prev = clsIndex; clsIndex = clamp(i, 0, h.classes.length-1); seg.buttons.forEach((x,j) => x.setAttribute('aria-pressed', j === clsIndex)); seg.flow.moveTo(seg.buttons[clsIndex]); if (prev !== clsIndex) buzz.tick(); xSpring.to(-clsIndex*step(), v === undefined ? SPR.snappy : SPR.bouncy, v); fit(); };
  // Horizontal drag inside the panels switches the class; vertical scrolls.
  let sw = null;
  wrap.addEventListener('pointerdown', e => { if (e.target.closest('button,input,.slider,.vessel,.scrolls')) return; sw = {x0:e.clientX, y0:e.clientY, base:xSpring.x, axis:null, s:[[e.timeStamp,e.clientX]]}; });
  wrap.addEventListener('pointermove', e => {
    if (!sw) return; const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.axis && Math.hypot(dx, dy) > 7) { sw.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; if (sw.axis === 'x') { xSpring.stop(); wrap.setPointerCapture(e.pointerId); } }
    if (sw.axis !== 'x') return;
    const min = -(h.classes.length-1) * step(); let x = sw.base + dx;
    if (x > 0) x *= .3; else if (x < min) x = min + (x - min) * .3;
    xSpring.set(x); sw.s.push([e.timeStamp, e.clientX]); if (sw.s.length > 6) sw.s.shift();
    const f = -x / step(), i = clamp(Math.floor(f), 0, seg.buttons.length-1), j = clamp(i+1, 0, seg.buttons.length-1), t = clamp(f-i, 0, 1);
    seg.flow.place(lerp(seg.buttons[i].offsetLeft, seg.buttons[j].offsetLeft, t), lerp(seg.buttons[i].offsetLeft + seg.buttons[i].offsetWidth, seg.buttons[j].offsetLeft + seg.buttons[j].offsetWidth, t));
  });
  const end = () => {
    if (!sw) return; const w = sw; sw = null; if (w.axis !== 'x') return;
    const a = w.s[0], b = w.s[w.s.length-1], v = (b[1]-a[1]) / Math.max(1, b[0]-a[0]) * 1000;
    let target = Math.round(-(xSpring.x + v*.18) / step()); if (target === clsIndex && Math.abs(v) > 500) target += v < 0 ? 1 : -1;

function odo(v, key, cls = ''){
  const s = String(v);
  return `<span class="odo ${cls}" data-odo="${key}" data-v="${s}" aria-label="${s}">${[...s].map(ch => /\d/.test(ch) ? `<span class="od"><span class="ods" style="--d:${ch}">${DIG}</span></span>` : `<span class="oc">${ch}</span>`).join('')}</span>`;
}
const digits = s => [...String(s)].filter(ch => /\d/.test(ch));
function spinTo(el, from, to){
  const strips = $$('.ods', el);
  strips.forEach((st, i) => { st.style.transition = 'none'; st.style.setProperty('--d', from[i]); });
  void el.offsetWidth;
  strips.forEach((st, i) => { st.style.transition = ''; st.style.transitionDelay = (strips.length - 1 - i) * 45 + 'ms'; st.style.setProperty('--d', to[i]); });
}
// Live update without a re-render (drag, keypad).
function setOdo(el, v){
  if (!el) return; const s = String(v); if (el.dataset.v === s) return;
  const was = el.dataset.v; el.dataset.v = s; el.setAttribute('aria-label', s);
  if (digits(was).length === digits(s).length && [...was].length === [...s].length) { $$('.ods', el).forEach((st, i) => st.style.setProperty('--d', digits(s)[i])); return; }
  const n = document.createElement('span'); n.innerHTML = odo(s, el.dataset.odo, el.className.replace(/\bodo\b/, '').trim()); const fresh = n.firstElementChild;
  el.replaceWith(fresh); if (!reduced) fresh.animate([{transform:'translateY(.25em)', opacity:0}, {transform:'none', opacity:1}], {duration:320, easing:springEasing(SPR.snappy, .32)});
}
// State-driven re-renders keep their motion: drums roll from the old value
// and keyed elements glide from where they were (FLIP).
function live(render){
  const o = {}, f = {};
  $$('[data-odo]').forEach(el => o[el.dataset.odo] = el.dataset.v);
  $$('[data-flip]').forEach(el => f[el.dataset.flip] = el.getBoundingClientRect());
  const hs = {}; $$('.cpanel .inst[id], .cpanel .lite[id]').forEach(el => hs[el.id] = el.offsetHeight);
  render();
  if (!reduced) $$('.cpanel .inst[id], .cpanel .lite[id]').forEach(el => { const a = hs[el.id], b = el.offsetHeight; if (!a || Math.abs(a - b) < 2) return;
    el.animate([{height:a + 'px'}, {height:b + 'px'}], {duration:520, easing:springEasing(SPR.gentle, .52)}); });
  if (reduced) return;
  $$('[data-odo]').forEach(el => { const was = o[el.dataset.odo], now = el.dataset.v; if (was === undefined || was === now) return;
    if (digits(was).length === digits(now).length && [...was].length === [...now].length) spinTo(el, digits(was), digits(now));
    else el.animate([{transform:'translateY(.25em)', opacity:0}, {transform:'none', opacity:1}], {duration:320, easing:springEasing(SPR.snappy, .32)}); });
  $$('[data-flip]').forEach(el => { const a = f[el.dataset.flip], b = el.getBoundingClientRect();
    if (!a) { el.animate([{transform:'scale(.4)', opacity:0}, {transform:'none', opacity:1}], {duration:460, easing:springEasing(SPR.bouncy, .46)}); return; }
    const dx = a.left - b.left, dy = a.top - b.top; if (Math.abs(dx) + Math.abs(dy) < 1) return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'none'}], {duration:640, easing:springEasing(SPR.bouncy, .64)}); });
}

// Dice tumble in place, their faces flickering, and land on the result.
const DSHAPE = {
  d6:'<rect class="face" x="9" y="9" width="82" height="82" rx="18"/>',
  d8:'<polygon class="face" points="50,4 95,50 50,96 5,50"/><polyline class="fac" points="5,50 50,36 95,50"/>',
  d10:'<polygon class="face" points="50,4 92,40 82,84 50,96 18,84 8,40"/><polyline class="fac" points="8,40 50,58 92,40"/>',
  d20:'<polygon class="face" points="50,4 92,28 92,72 50,96 8,72 8,28"/><polygon class="fac" points="50,24 74,64 26,64"/>'};
const die = (d, val, {tag = 'span', attrs = '', cls = ''} = {}) => `<${tag} ${tag === 'button' ? 'type="button"' : ''} class="die2 ${d} ${cls}" ${attrs}><svg viewBox="0 0 100 100" aria-hidden="true">${DSHAPE[d]}</svg><b>${val}</b></${tag}>`;
function tumble(els, finals, sides, done){
  els = els.filter(Boolean);
  if (reduced || !els.length) { els.forEach((el, i) => { ($('b', el) || el).textContent = finals[i]; }); return done(); }
  const t0 = performance.now(), dur = 640; let last = 0, n = 0;
  els.forEach(el => { el.classList.remove('landed'); el.classList.add('tumble'); });
  const step = now => {
    const p = (now - t0) / dur;
    if (p >= 1) { els.forEach((el, i) => { ($('b', el) || el).textContent = finals[i]; el.classList.remove('tumble'); el.classList.add('landed'); }); buzz.light(); return setTimeout(done, 260); }
    if (now - last > 45 + p * 110) { last = now; els.forEach(el => { ($('b', el) || el).textContent = 1 + Math.floor(Math.random() * sides); }); if (n++ < 6) buzz.tick(); }
    requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const roll = (n, d) => Array.from({length:n}, () => 1 + Math.floor(Math.random() * d));
const sum = a => a.reduce((x, y) => x + y, 0);
// A result lifts off the element it came from.
function floatUp(el, text, color){
  if (!el || reduced) return;
  const pr = phone.getBoundingClientRect(), r = el.getBoundingClientRect(), f = document.createElement('span');
  f.className = 'float'; f.textContent = text; if (color) f.style.color = color;
  f.style.left = (r.left + r.width / 2 - pr.left) + 'px'; f.style.top = (r.top - pr.top) + 'px'; phone.appendChild(f);
  f.animate([{transform:'translate(-50%,0) scale(.6)', opacity:0}, {transform:'translate(-50%,-20px) scale(1.12)', opacity:1, offset:.22}, {transform:'translate(-50%,-64px) scale(1)', opacity:0}], {duration:1400, easing:'cubic-bezier(.2,0,0,1)'}).onfinish = () => f.remove();
}

// Peek: details live behind the surface. Tap an informational token, or
// hold any control, to read it in a glass bubble beside it.
const phone = $('#phone');
let peekEl = null, peekT = 0, holdT = 0, holdXY = null, swallow = false;
function showPeek(t){
  hidePeek(); const [title, text] = t.dataset.peek.split('|');
  const r = t.getBoundingClientRect(), pr = phone.getBoundingClientRect();
  const p = document.createElement('div'); p.className = 'peek glass'; p.innerHTML = `<b>${title}</b>${text ? `<span>${text}</span>` : ''}`; phone.appendChild(p);
  const w = p.offsetWidth, hh = p.offsetHeight, left = clamp(r.left + r.width / 2 - pr.left - w / 2, 12, pr.width - w - 12);
  let top = r.top - pr.top - hh - 10, below = false; if (top < 64) { top = r.bottom - pr.top + 10; below = true; }
  p.style.left = left + 'px'; p.style.top = top + 'px'; p.style.transformOrigin = `${r.left + r.width / 2 - pr.left - left}px ${below ? 0 : hh}px`;
  requestAnimationFrame(() => p.classList.add('in')); peekEl = p; buzz.tick();
  clearTimeout(peekT); peekT = setTimeout(hidePeek, 4600);
}
function hidePeek(){ if (!peekEl) return; const p = peekEl; peekEl = null; p.classList.remove('in'); setTimeout(() => p.remove(), 220); }
phone.addEventListener('pointerdown', e => {
  if (peekEl) hidePeek();
  const t = e.target.closest('[data-peek]'); if (!t) return;
  holdXY = [e.clientX, e.clientY]; clearTimeout(holdT); holdT = setTimeout(() => { holdXY = null; swallow = true; showPeek(t); }, 430);
}, true);
phone.addEventListener('pointermove', e => { if (holdXY && Math.hypot(e.clientX - holdXY[0], e.clientY - holdXY[1]) > 8) { clearTimeout(holdT); holdXY = null; } }, true);
['pointerup','pointercancel'].forEach(k => phone.addEventListener(k, () => { clearTimeout(holdT); holdXY = null; }, true));
phone.addEventListener('click', e => {
  if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); return; }
  const t = e.target.closest('[data-peek]'); if (t && !e.target.closest('button,[data-a]')) showPeek(t);
}, true);
phone.addEventListener('contextmenu', e => { if (e.target.closest('[data-peek],.hold,.vessel')) e.preventDefault(); });
document.addEventListener('scroll', hidePeek, true);

// Numbers typed on a keypad, like the HP keypad of Overview.
function keypadSheet({kicker, title, modes, mode, onDone}){
  let val = '', m = mode;
  openSheet(`<span class="bs-kicker">${kicker}</span><h2 class="bs-title">${title}</h2>
    ${modes ? segHTML(modes, m, 'kpSeg') : ''}
    <div class="kp-val" id="kpVal">${odo(0, 'kp')}</div>
    <div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'x'].map(k => k === '' ? '<span></span>' : `<button type="button" data-k="${k}" aria-label="${k === 'x' ? 'Стереть' : k}">${k === 'x' ? icon('back') : k}</button>`).join('')}</div>
    <button type="button" class="btn primary wide" id="kpGo" style="height:54px" disabled>Готово</button>`, {onOpen(sh, close){
      if (modes) segment($('#kpSeg', sh), b => { m = b.dataset.v; buzz.tick(); });
      const show = () => { setOdo($('#kpVal .odo', sh), +val || 0); $('#kpGo', sh).disabled = !+val; };
      $$('.kp button', sh).forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; buzz.tick(); if (k === 'x') val = val.slice(0, -1); else if (val.length < 3) val = (val + k).replace(/^0+/, ''); show(); }));
      $('#kpGo', sh).addEventListener('click', () => { const n = +val; buzz.light(); close(0, () => onDone(n, m)); });
    }});
}
// A stepper that repeats while held, faster the longer it is held.
function stepper(btn, onStep){
  let t = 0, n = 0;
  const go = () => { onStep(+btn.dataset.d); buzz.tick(); t = setTimeout(go, n++ < 4 ? 260 : 70); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); n = 0; go(); });
  ['pointerup','pointerleave','pointercancel'].forEach(k => btn.addEventListener(k, () => clearTimeout(t)));
}

const SIGIL = '<svg viewBox="0 0 100 110" aria-hidden="true"><polygon class="face" points="50,4 94,29 94,81 50,106 6,81 6,29"/><path class="rune" d="M50 22v66M30 40l40 30M70 40 30 70"/></svg>';

/* ---------- class instruments ---------- */
// Each ability is an object of its class with its own gesture and event;
// at rest a label and a number, the rest behind a peek.
const REST = {short:['cup','Короткий'], long:['moon','Длительный']};
const rest = (k, label) => `<button type="button" class="rest" data-a="rest" data-r="${k}" data-peek="${k === 'short' ? 'Короткий отдых' : 'Длительный отдых'}|Коснитесь, чтобы восстановить${label ? ' ' + label : ''}">${icon(REST[k][0])}${REST[k][1]}</button>`;
function head(c){
  return `<div class="chead"><div><h2>${c.name}</h2><button type="button" class="sub" data-a="sub">${c.sub} ${icon('fwd')}</button></div><button type="button" class="lvchip" data-a="lvl" data-peek="Уровень|Прототип: коснитесь, чтобы примерить другой">Уровень <b>${odo(c.lvl, 'lv' + c.id)}</b></button></div>`;
}
const CLASS = {};
function st(h, key, init){ h.st = h.st || {}; if (!(key in h.st)) h.st[key] = init(); return h.st[key]; }
function classHTML(h, c){ const f = CLASS[c.id] || (c.kit ? KIT : null); return head(c) + `<div class="stack">${f ? f.html(h, c) : ''}</div>`; }
const lockTool = (ic, n, l) => `<span class="bt lockd" data-peek="${n.replace('&shy;', '')}|Откроется на ${l} уровне">${icon(ic)}<b>${n}</b><span class="bv">${icon('lock')} ${l}</span></span>`;
const lockCell = (n, l) => `<div class="cell2 lockd" data-peek="${n}|Откроется на ${l} уровне"><span class="cap">${n}</span>${icon('lock')}<span class="hint">с ${l} уровня</span></div>`;
const fuse = (n, at, cls = '') => `<div class="fuse ${cls}">${Array.from({length:n}, (_, i) => `<i class="${i < at - 1 ? 'burnt' : i === at - 1 ? 'now' : ''}"></i>`).join('')}</div>`;

// Barbarian · Rage. Hold the bar to fly into a rage: heat floods in and
// the instrument flares once. Claws count the rages, a fuse burns the
// minute down, the three marks of rage light up while it lasts.
const EXH = ['', 'помеха на проверки', 'скорость вдвое меньше', 'помеха на атаки и спасброски', 'максимум ОЗ вдвое меньше', 'скорость 0', 'смерть'];
CLASS.barbarian = {
  html(h, c){ const n = Math.min(6, byLvl(c.lvl, [[1,2],[3,3],[6,4],[12,5],[17,6]])), dmg = byLvl(c.lvl, [[1,2],[9,3],[16,4]]), inf = c.lvl >= 20;
    const s = st(h, 'rage', () => ({left:n, max:n, on:false, round:1, frenzy:false, reckless:false, exh:0}));
    return `<div class="inst barb ${s.on ? 'on' : ''} ${s.reckless ? 'reck' : ''}" style="--acc:var(--a0)" id="barb"><i class="heat"></i><i class="hazard"></i>
      <div class="inst-h"><span class="cap">${s.on ? 'В ярости' : 'Ярость'}</span><span class="hgrp">${s.exh ? `<span class="used exhc" data-peek="Истощение ${s.exh}|${EXH.slice(1, s.exh + 1).join(' · ')}">${icon('skull')}${odo(s.exh, 'exh')}</span>` : ''}${rest('long', 'ярость')}</span></div>
      <div class="row" style="margin-top:12px;align-items:flex-end">
        <div class="claws" data-peek="Ярость|${inf ? 'Без ограничений' : s.left + ' из ' + s.max + ' до длительного отдыха'}">${Array.from({length:s.max}, (_, i) => `<i class="claw ${i < s.left ? '' : 'off'}" data-flip="claw${i}"></i>`).join('')}</div>
        <div class="dmg" data-peek="Урон ярости|+${dmg} к урону рукопашными атаками на Силе"><span class="huge">${inf ? '∞' : '+' + dmg}</span><small>урон</small></div></div>
      <div class="rbadges">
        <span class="rb" data-peek="Сопротивление|Дробящий, колющий и рубящий урон по вам — вдвое меньше">${icon('shield')}<small>Стойкость</small></span>
        <span class="rb" data-peek="Сила|Преимущество на проверки и спасброски Силы">${icon('up')}<small>Сила</small></span>
        ${c.lvl >= 3 ? `<button type="button" class="rb tog" data-a="frenzy" aria-pressed="${s.frenzy}" data-peek="Бешенство|Бонусная атака рукопашным оружием каждый ход ярости. После — 1 степень истощения">${icon('axe')}<small>Бешенство</small></button>` : `<span class="rb lockd" data-peek="Бешенство|Путь берсерка, 3 уровень">${icon('lock')}<small>Бешенство</small></span>`}</div>
      ${s.on ? `<div data-peek="Минута ярости|10 раундов. Кончается раньше, если за ход вы не атаковали и не получили урон">${fuse(10, s.round)}</div>
        <div class="rctl"><button type="button" class="ghost" data-a="end">Конец</button><div class="rnum"><small>раунд</small>${odo(s.round, 'rround', 'big')}<span class="of">/ 10</span></div><button type="button" class="ember" data-a="rnext" aria-label="Следующий раунд">${icon('fwd')}</button></div>`
        : `<button type="button" class="hold" id="hold" ${s.left ? '' : 'disabled'}><i class="fill"></i><span>${s.left ? 'Удерживайте — ярость' : 'Вернёт длительный отдых'}</span></button>`}
      ${c.lvl < 2 ? '' : `<button type="button" class="reck-t" role="switch" aria-checked="${s.reckless}" data-a="reckless" data-peek="Безрассудная атака|Первая атака в ход — с преимуществом. До вашего хода атаки по вам тоже с преимуществом"><span class="rk">${icon('strikes')}</span><b>Безрассудная атака</b><span class="switch"></span></button>`}
    </div>`; },
  act(a, el, h){ const s = h.st.rage;
    if (a === 'rnext') { if (s.round < 10) s.round++; buzz.tick(); if (s.round === 10) toast('Последний раунд ярости'); }
    if (a === 'end') { s.on = false; s.round = 1; if (s.frenzy) { s.exh = Math.min(6, s.exh + 1); s.frenzy = false; toast('Бешенство: +1 степень истощения'); } buzz.light(); }
    if (a === 'frenzy') { s.frenzy = !s.frenzy; buzz.tick(); }
    if (a === 'reckless') { s.reckless = !s.reckless; buzz.tick(); if (s.reckless) return remount(() => replay($('#barb'), 'jolt')); }
    remount(); },
  rest(h){ const s = h.st.rage; Object.assign(s, {left:s.max, on:false, round:1, exh:Math.max(0, s.exh - 1)}); },
  bind(sec, h, c){ const s = h.st.rage, hold = $('#hold', sec); if (!hold || hold.disabled) return;
    const fill = $('.fill', hold); let t0 = 0, raf = 0, ticks = 0;
    const tick = now => { const p = clamp((now - t0) / 650, 0, 1); fill.style.transform = `scaleX(${p})`;
      if (p > (ticks + 1) / 3 && ticks < 2) { ticks++; buzz.tick(); }
      if (p >= 1) { raf = 0; if (c.lvl < 20) s.left--; s.on = true; s.round = 1; buzz.medium(); remount(() => replay($('#barb'), 'flare')); return; }
      raf = requestAnimationFrame(tick); };
    hold.addEventListener('pointerdown', e => { t0 = performance.now(); ticks = 0; try { hold.setPointerCapture(e.pointerId); } catch {} raf = requestAnimationFrame(tick); });
    const cancel = () => { if (!raf) return; cancelAnimationFrame(raf); raf = 0; const from = parseFloat((fill.style.transform.match(/[\d.]+/) || [0])[0]);
      new Spring(from, SPR.snappy, v => fill.style.transform = `scaleX(${Math.max(0, v)})`).to(0); };
    ['pointerup','pointercancel','pointerleave'].forEach(k => hold.addEventListener(k, cancel)); }
};

      n.addEventListener('pointerup', e => { if (y0 === null) return; const dy = e.clientY - y0; y0 = null; n.style.transform = '';

// Cleric · Channel Divinity. A sun between two ways: the beam swings to
// the chosen one, touching the sun channels it. Preserve Life then hands
// out ten drops of light; Turn Undead burns its minute down.
const TARGET_MAX = 6;
CLASS.cleric = {
  html(h, c){ const n = byLvl(c.lvl, [[1,0],[2,1],[6,2],[18,3]]), heal = 5 * c.lvl, dc = 8 + pb(h) + c.mod, unit = Math.ceil(heal / 10), nd = Math.ceil(heal / unit);
    const s = st(h, 'chan', () => ({left:n, max:n, pick:1, phase:null, drops:null, rounds:1, targets:2}));
    const dv = k => k < nd - 1 ? unit : heal - unit * (nd - 1);
    const domain = `<div class="lite dom" style="--acc:var(--a2)"><span class="cap">Домен жизни</span>
      <div class="dom-row"><span class="adept" data-peek="Адепт жизни|Лечащие заклинания 1 круга и выше восстанавливают ещё 2 + круг ячейки">${icon('heart')}<b>+2 + круг</b><small>к лечению</small></span>
        ${['bless','cure-wounds'].map(id => `<button type="button" class="medal" data-a="cast" data-k="${id}@cleric" data-peek="${SPELLS[id].n}|Всегда подготовлено доменом. Коснитесь — наложить">${icon(id === 'bless' ? 'star' : 'heart')}<small>${SPELLS[id].n}</small></button>`).join('')}</div></div>`;
    if (c.lvl < 2) return locked(c, 'Божественный канал', 2, 'Изгнание нежити и Сохранение жизни') + domain;
    const rays = Array.from({length:18}, (_, i) => { const a = i / 18 * Math.PI * 2, r2 = i % 2 ? 66 : 76; return `<line x1="${(80 + Math.cos(a) * 50).toFixed(1)}" y1="${(80 + Math.sin(a) * 50).toFixed(1)}" x2="${(80 + Math.cos(a) * r2).toFixed(1)}" y2="${(80 + Math.sin(a) * r2).toFixed(1)}"/>`; }).join('');
    const way = i => `<button type="button" class="way2" data-a="pick" data-i="${i}" aria-pressed="${s.pick === i}" data-peek="${i ? 'Сохранение жизни|' + heal + ' ОЗ между ранеными в 30 фт., каждому не выше половины его максимума' : 'Изгнание нежити|Нежить в 30 фт.: спасбросок Мудрости Сл ' + dc + ', иначе бежит 1 минуту' + (c.lvl >= 5 ? '. Уничтожение нежити: ПО ' + byLvl(c.lvl, [[5,'½'],[8,'1'],[11,'2'],[14,'3'],[17,'4']]) + ' и ниже' : '')}"><span class="wg">${icon(i ? 'heart' : 'skull')}</span><b>${i ? 'Сохранение' : 'Изгнание'}</b><small>${i ? heal + ' ОЗ' : 'Сл ' + dc}</small></button>`;
    let phase = '';
    // Preserve Life: the drops of healing go to numbered targets, not to named people.
    if (s.phase === 'life') { const own = i => s.drops.map((o, k) => o === i ? `<i class="drop ${dv(k) < unit ? 'small' : ''}" data-flip="dr${k}"></i>` : '').join('');
      phase = `<div class="dist"><div class="dpool">${s.drops.map((o, k) => o === null ? `<i class="drop ${dv(k) < unit ? 'small' : ''}" data-flip="dr${k}"></i>` : '').join('') || '<small>всё распределено</small>'}</div>
        <div class="hint c" style="margin:8px 0 0">Коснитесь цели — отдать каплю</div>
        <div class="allies">${Array.from({length:s.targets}, (_, i) => `<button type="button" class="ally2" data-a="drop" data-i="${i}" data-flip="tg${i}"><b>Цель ${i + 1}</b><span class="adr">${own(i)}</span>${odo(s.drops.reduce((t, o, k) => t + (o === i ? dv(k) : 0), 0), 'al' + i, 'aln')}</button>`).join('')}
          ${s.targets < TARGET_MAX ? `<button type="button" class="ally2 add" data-a="tadd" aria-label="Ещё цель">${icon('plus')}<b>цель</b></button>` : ''}</div>
        <div class="two"><button type="button" class="ghost" data-a="undo">Вернуть</button><button type="button" class="go" data-a="done">Готово</button></div></div>`; }
    if (s.phase === 'turn') phase = `<div class="dist">${fuse(10, s.rounds, 'gold')}<div class="rctl"><button type="button" class="ghost" data-a="tend">Снять</button><div class="rnum"><small>нежить бежит</small>${odo(s.rounds, 'trnd', 'big')}<span class="of">/ 10</span></div><button type="button" class="ember" data-a="tnext" aria-label="Следующий раунд">${icon('fwd')}</button></div></div>`;
    return `<div class="inst cler ${s.left ? '' : 'spent'}" style="--acc:var(--a2)" id="cler">
      <div class="inst-h"><span class="cap">Божественный канал</span>${rest('short', 'канал')}</div>
      <div class="altar">${way(0)}
        <button type="button" class="sun2" id="sun" data-a="channel" style="--aim:${s.pick ? 0 : 180}deg" aria-label="Направить канал"><svg viewBox="0 0 160 160" aria-hidden="true"><defs><radialGradient id="beamG" cx="0" cy=".5" r="1"><stop offset="0" stop-color="var(--a2)" stop-opacity=".7"/><stop offset="1" stop-color="var(--a2)" stop-opacity="0"/></radialGradient></defs><g class="beam"><path d="M80 80 L160 40 A90 90 0 0 1 160 120 Z" fill="url(#beamG)"/></g><g class="rays">${rays}</g></svg><span class="core">${odo(s.left, 'chan', 'big')}${s.max > 1 ? `<small>из ${s.max}</small>` : ''}</span></button>
        ${way(1)}</div>
      <div class="hint c">${s.left ? 'Коснитесь солнца — направить' : 'Канал вернёт короткий отдых'}</div>
      ${phase}</div>${domain}`; },
  act(a, el, h, c){ const s = h.st.chan, heal = 5 * c.lvl, unit = Math.ceil(heal / 10), nd = Math.ceil(heal / unit);
    if (a === 'pick') { s.pick = +el.dataset.i; buzz.tick(); return remount(); }
    if (a === 'channel') { if (!s.left) return toast('Канал вернёт короткий отдых'); s.left--; buzz.medium();
      if (s.pick) { s.phase = 'life'; s.drops = Array(nd).fill(null); s.targets = 2; } else { s.phase = 'turn'; s.rounds = 1; }
      return remount(() => replay($('#sun'), 'burst')); }
    if (a === 'drop') { const k = s.drops.indexOf(null); if (k < 0) return; s.drops[k] = +el.dataset.i; buzz.tick(); return remount(); }
    if (a === 'tadd') { s.targets = Math.min(TARGET_MAX, s.targets + 1); buzz.tick(); return remount(); }
    if (a === 'undo') { const k = s.drops.map(o => o !== null).lastIndexOf(true); if (k >= 0) s.drops[k] = null; buzz.tick(); return remount(); }
    if (a === 'done') { const n = s.drops.reduce((t, o, k) => t + (o !== null ? (k < nd - 1 ? unit : heal - unit * (nd - 1)) : 0), 0); s.phase = null; buzz.light(); toast(`Сохранение жизни: ${n} ОЗ`); return remount(); }
    if (a === 'tnext') { if (s.rounds < 10) s.rounds++; buzz.tick(); if (s.rounds === 10) { s.phase = null; toast('Нежить перестаёт бежать'); } return remount(); }
    if (a === 'tend') { s.phase = null; buzz.light(); return remount(); }
    if (a === 'cast') castSheet(h, el.dataset.k); },
  rest(h){ const s = h.st.chan; Object.assign(s, {left:s.max, phase:null}); }
};

      ${c.lvl >= 2 ? `<div class="cell2 sculpt" style="--acc:var(--a1)" data-peek="Ваяние заклинаний|Выберите 1 + круг существ: они проходят спасбросок и не получают урона от вашего воплощения"><span class="cap">Ваяние · ${odo(1 + sc, 'sculpt')}</span>
        <svg class="blastsvg" viewBox="0 0 100 64" aria-hidden="true"><circle class="area" cx="50" cy="32" r="28"/>${[[34,20],[62,18],[50,32],[30,42],[68,44],[50,52]].map(([x, y], i) => `<circle class="${i < 1 + sc ? 'safe' : 'hit'}" cx="${x}" cy="${y}" r="5"/>`).join('')}</svg>
        <span class="schips">${[1,2,3,4,5].filter(n => h.slots[n]).map(n => `<button type="button" data-a="sc" data-n="${n}" aria-pressed="${sc === n}">${n}</button>`).join('')}</span></div>` : ''}</div>`; },
  act(a, el, h, c){ const s = h.st.rec, budget = Math.ceil(c.lvl / 2);

      if (s.pick.includes(el.dataset.k)) { s.pick.splice(s.pick.indexOf(n + '.' + (v.left + mine.length - 1)), 1); buzz.tick(); return remount(); }
      const used = s.pick.reduce((t, x) => t + +x.split('.')[0], 0); if (used + n > budget) { replay(el, 'wobble'); return toast(`Бюджет — ${budget} ${plural(budget, 'круг', 'круга', 'кругов')}`); }

// Universal kit: a class (or subclass) whose features arrive as data —
// third-party, homebrew or imported — is drawn in the same language.
// The first resource becomes the instrument; dice, modes and choices
// become objects; passives become marks. A motif gives it character.
const MOTIF = {
  rune:`<svg viewBox="0 0 100 110" aria-hidden="true"><polygon class="face" points="50,4 94,29 94,81 50,106 6,81 6,29"/><path class="rune" d="M50 26v58M34 42l32 26M66 42 34 68"/></svg>`,
  flame:`<svg viewBox="0 0 100 110" aria-hidden="true"><path class="face" d="M50 6c6 22 34 32 34 62a34 34 0 0 1-68 0c0-16 9-26 17-33 2 13 8 20 17 22C46 42 42 24 50 6z"/></svg>`,
  leaf:`<svg viewBox="0 0 100 110" aria-hidden="true"><path class="face" d="M14 96C14 44 44 12 92 8c-4 52-34 84-78 88z"/><path class="rune" d="M14 96 70 34"/></svg>`,
  star:`<svg viewBox="0 0 100 110" aria-hidden="true"><path class="face" d="M50 6l13 31 33 3-25 22 8 33-29-17-29 17 8-33L4 40l33-3z"/></svg>`};
const kitLvl = (v, l) => Array.isArray(v) ? byLvl(l, v) : v;
function kitHTML(h, c){
  const s = st(h, 'kit', () => ({})), l = c.lvl, live2 = c.kit.filter(f => !f.from || l >= f.from), locked2 = c.kit.filter(f => f.from && l < f.from);
  live2.forEach(f => { if ((f.kind === 'uses' || f.kind === 'pool') && !(f.k in s)) s[f.k] = kitLvl(f.max, l); });
  const main = live2.find(f => f.kind === 'uses' || f.kind === 'pool');
  const cost = f => f.cost ? `<small class="kc">${icon('spark')}${f.cost === main.k ? '1 ' + main.unit1 : f.cost}</small>` : '';
  const block = f => {
    const max = kitLvl(f.max, l), d = f.d ? `data-peek="${f.n}|${f.d}"` : '';
    if (f.kind === 'uses') return `<div class="inst kit" style="--acc:var(--a${c.acc})" id="kit-${f.k}"><div class="inst-h"><span class="cap">${f.n}</span>${f.rest ? rest(f.rest, f.n.toLowerCase()) : ''}</div>
      <div class="row" style="margin-top:12px;align-items:flex-end"><div style="white-space:nowrap">${odo(s[f.k], 'k-' + f.k, 'huge')}<span class="of">/ ${max}</span></div><span class="hint">${f.hint || 'коснитесь знака — потратить'}</span></div>
      <div class="ktoks">${Array.from({length:max}, (_, i) => `<button type="button" class="ktok ${i < s[f.k] ? '' : 'off'}" data-a="kuse" data-k="${f.k}" ${d} aria-label="${f.n}">${MOTIF[c.motif] || MOTIF.rune}</button>`).join('')}</div></div>`;
    if (f.kind === 'pool') return `<div class="inst kit" style="--acc:var(--a${c.acc})"><div class="inst-h"><span class="cap">${f.n}</span>${f.rest ? rest(f.rest, f.n.toLowerCase()) : ''}</div>
      <div class="row" style="margin-top:12px;align-items:flex-end"><div style="white-space:nowrap">${odo(s[f.k], 'k-' + f.k, 'huge')}<span class="of">/ ${max} ${f.unit || ''}</span></div>
        <button type="button" class="ghost" style="padding:0 18px" data-a="kpool" data-k="${f.k}" ${d}>${icon('minus')} Потратить</button></div>
      <div class="hpbar" style="margin-top:12px"><i style="width:${s[f.k] / max * 100}%;background:var(--acc)"></i></div></div>`;
    return ''; };
  const obj = f => { const d = f.d ? `data-peek="${f.n}|${f.d}"` : '';
    if (f.kind === 'dice') return `<button type="button" class="kobj" data-a="kdice" data-k="${f.k}" ${d}>${die('d6', s[f.k] || kitLvl(f.dice, l), {attrs:`id="kd-${f.k}"`, cls:'sm'})}<b>${f.n}</b>${cost(f)}</button>`;
    if (f.kind === 'toggle') return `<button type="button" class="kobj ${s[f.k] ? 'on' : ''}" data-a="ktog" data-k="${f.k}" aria-pressed="${!!s[f.k]}" ${d}><span class="kg">${icon(f.ic || 'shield')}</span><b>${f.n}</b>${s[f.k] ? `<small class="kc">раунд ${s[f.k]} / ${f.rounds}</small>` : cost(f)}</button>`;
    return ''; };
  const choice = f => `<div class="lite" style="--acc:var(--a${c.acc})"><div class="inst-h"><span class="cap">${f.n}</span><span class="used">${s[f.k] !== undefined ? 'пробуждена' : 'выберите'}</span></div>
    <div class="kchoice">${f.options.map(([n, ic, x], i) => `<button type="button" class="way2" data-a="kpick" data-k="${f.k}" data-i="${i}" aria-pressed="${s[f.k] === i}" data-peek="${n}|${x}"><span class="wg">${icon(ic)}</span><b>${n}</b><small>${x.split(',')[0]}</small></button>`).join('')}</div></div>`;
  const objs = live2.filter(f => f.kind === 'dice' || f.kind === 'toggle'), pas = live2.filter(f => f.kind === 'passive');
  return live2.filter(f => f.kind === 'uses' || f.kind === 'pool').map(block).join('')
    + (objs.length ? `<div class="kobjs" style="--acc:var(--a${c.acc})">${objs.map(obj).join('')}</div>` : '')
    + live2.filter(f => f.kind === 'choice').map(choice).join('')
    + (pas.length || locked2.length ? `<div class="rbadges kpas">${pas.map(f => `<span class="rb" style="--acc:var(--a${c.acc})" data-peek="${f.n}|${f.d}">${icon(f.ic || 'spark')}<small>${f.n}</small></span>`).join('')}${locked2.map(f => `<span class="rb lockd" data-peek="${f.n}|Откроется на ${f.from} уровне">${icon('lock')}<small>${f.n}</small></span>`).join('')}</div>` : '');
}
const KIT = {
  html(h, c){ return kitHTML(h, c); },
  act(a, el, h, c){ const s = h.st.kit, f = c.kit.find(x => x.k === el.dataset.k), main = c.kit.find(x => x.kind === 'uses' || x.kind === 'pool');
    const pay = () => { if (!f.cost) return true; if (!s[f.cost]) { toast(`Нет: ${main.n.toLowerCase()}`); return false; } s[f.cost]--; return true; };
    if (a === 'kuse') { if (!s[f.k]) return toast(`${f.n}: вернёт отдых`); s[f.k]--; buzz.light(); return remount(() => replay($$(`#kit-${f.k} .ktok`)[s[f.k]], 'crack')); }
    if (a === 'kpool') return keypadSheet({kicker:f.n, title:'Сколько потратить', onDone:n => { s[f.k] = Math.max(0, s[f.k] - n); remount(); }});
    if (a === 'kdice') { if (!pay()) return; const [n, d] = String(kitLvl(f.dice, c.lvl)).split('к').map(Number), r = sum(roll(n, d));
      return tumble([$('#kd-' + f.k)], [r], d * n, () => { s[f.k] = r; floatUp($('#kd-' + f.k), '+' + r, `var(--a${c.acc})`); remount(); }); }
    if (a === 'ktog') { if (s[f.k]) { s[f.k] = s[f.k] >= f.rounds ? 0 : s[f.k] + 1; buzz.tick(); return remount(); } if (!pay()) return; s[f.k] = 1; buzz.medium(); return remount(() => replay(el.isConnected ? el : $(`[data-a="ktog"][data-k="${f.k}"]`), 'ev')); }
    if (a === 'kpick') { s[f.k] = s[f.k] === +el.dataset.i ? undefined : +el.dataset.i; buzz.tick(); return remount(); } },
  rest(h, c, k){ const s = h.st.kit; c.kit.forEach(f => { if ((f.kind === 'uses' || f.kind === 'pool') && (f.rest === k || k === 'long')) s[f.k] = kitLvl(f.max, c.lvl); if (f.kind === 'toggle') s[f.k] = 0; }); }
};
CLASS.custom = KIT;

// Features that arrive at a later level show as a locked plate of their

function aboutOf(h, c, cap){
  const key = cap.trim(), f = ABOUT[c.id + '|' + key] || ABOUT[key] || ABOUT[key === 'В ярости' ? 'Ярость' : ''];
  if (f) return {t:key === 'В ярости' ? 'Ярость' : key === 'Восстановление' ? 'Магическое восстановление' : key === 'Источник' ? 'Источник магии' : key, ...f(h, c)};
  const k = (c.kit || []).find(x => x.n === key); if (k) return {t:k.n, k:{uses:'Заряды', pool:'Запас', dice:'Кости', toggle:'Режим', choice:'Выбор', passive:'Пассивное'}[k.kind] + (k.rest ? ' · ' + (k.rest === 'short' ? 'короткий' : 'длительный') + ' отдых' : ''), p:[k.d]};
  return null;
}

}

/* ---------- level ruler (prototype: try any level 1–20) ---------- */
function levelSheet(h, ci){
  const c = h.classes[ci], others = h.classes.reduce((t, x, i) => t + (i === ci ? 0 : x.lvl), 0), top = 20 - others; let pick = c.lvl;
  openSheet(`<span class="bs-kicker">${c.name} · прототип</span><h2 class="bs-title">Уровень</h2><div class="bs-sub">В приложении уровень меняет повышение — здесь можно примерить любой</div>
    <div class="lvbig">${odo(pick, 'lvpick', 'huge')}</div>
    <div class="ruler" id="ruler"><div class="rl">${Array.from({length:20}, (_, i) => `<button type="button" data-l="${i + 1}" ${i + 1 > top ? 'disabled' : ''} aria-pressed="${i + 1 === pick}"><b>${i + 1}</b><i></i></button>`).join('')}</div></div>
    <button type="button" class="btn primary wide" id="lvGo" style="height:54px">Применить</button>`, {onOpen(sh, close){
      const r = $('#ruler', sh), btns = $$('[data-l]', sh), set = l => { if (l === pick) return; pick = l; btns.forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === l)); setOdo($('[data-odo="lvpick"]', sh), l); buzz.tick(); };
      requestAnimationFrame(() => { r.scrollLeft = btns[pick - 1].offsetLeft - r.clientWidth / 2 + 22; });
      btns.forEach(b => b.addEventListener('click', () => { set(+b.dataset.l); r.scrollTo({left:b.offsetLeft - r.clientWidth / 2 + 22, behavior:'smooth'}); }));
      // Scrolling the ruler ticks through the levels under the centre mark.
      r.addEventListener('scroll', () => { const mid = r.scrollLeft + r.clientWidth / 2; let best = btns[0]; btns.forEach(b => { if (!b.disabled && Math.abs(b.offsetLeft + 22 - mid) < Math.abs(best.offsetLeft + 22 - mid)) best = b; }); set(+best.dataset.l); });
      $('#lvGo', sh).addEventListener('click', () => close(0, () => { setLevel(h, ci, pick); buzz.medium(); renderSheetKeep(); toast(`${c.name}: уровень ${pick}`); }));
    }});
}

/* ---------- mounting ---------- */
function bindPanel(sec, c){
  const f = CLASS[c.id] || (c.kit ? KIT : null); if (!f) return;
  sec.onclick = e => { if (sec.skip) return; const el = e.target.closest('[data-a]'); if (!el || !sec.contains(el) || el.disabled) return; const a = el.dataset.a;
    if (a === 'lvl') return levelSheet(hero, hero.classes.indexOf(c));
    if (a === 'sub') { buzz.tick(); return subSheet(c); }
    if (a === 'rest') { if (!f.rest) return; f.rest(hero, c, el.dataset.r); buzz.medium(); toast((el.dataset.r === 'short' ? 'Короткий' : 'Длительный') + ' отдых: восстановлено'); return renderPageKeep(); }
    f.act && f.act(a, el, hero, c, sec); };
  f.bind && f.bind(sec, hero, c);
  // Block titles open the full text of the ability.
  $$('.inst-h > .cap, .lite > .cap', sec).forEach(cp => { const ab = aboutOf(hero, c, cp.textContent); if (!ab) return;
    cp.classList.add('capb'); cp.setAttribute('role', 'button'); cp.insertAdjacentHTML('beforeend', icon('info', 'ci'));
    cp.onclick = e => { e.stopPropagation(); buzz.tick(); aboutSheet(ab, c); }; });
}
