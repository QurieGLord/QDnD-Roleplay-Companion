/* Fighter */
.cham{clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.cham.inst,.cham.cell2{border-radius:6px}
.cell2.lit{background:color-mix(in srgb,var(--a0) 22%,var(--low))}
.result{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--heal) 16%,transparent);font-size:13px;animation:ev 520ms var(--e-snappy)}
.result .icon{width:18px;height:18px;color:var(--heal)}
.result b{font:600 24px/1 var(--display)}
.apips{display:flex;gap:8px;margin:4px 0}
.apips i{width:18px;height:18px;border-radius:5px;transform:rotate(45deg);background:var(--a0)}
.apips i.off{background:transparent;box-shadow:inset 0 0 0 2px var(--outline)}
.ignite{animation:ignite 700ms var(--e-snappy)}
@keyframes ignite{0%{transform:rotate(45deg) scale(.3);filter:brightness(2)}60%{transform:rotate(45deg) scale(1.3)}100%{transform:rotate(45deg)}}
.critrow{display:flex;align-items:center;gap:12px}

/* Monk: an ensō of ki */
.enso-wrap{position:relative;display:grid;place-items:center;margin-top:6px}
.enso{position:relative;width:210px;height:210px;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy)}
.enso:active{transform:scale(.96)}
.enso svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-4deg)}
.enso .track{fill:none;stroke:color-mix(in srgb,var(--fg) 5%,transparent);stroke-width:20}
.enso .ki{fill:none;stroke:color-mix(in srgb,var(--fg) 88%,var(--a2));stroke-width:15;stroke-linecap:round;transition:stroke 500ms,opacity 500ms,stroke-width 500ms}
.enso .ki:nth-child(odd){stroke-width:17}
.enso.many .ki,.enso.many .ki:nth-child(odd){stroke-width:9}
.enso .ki.off{stroke:color-mix(in srgb,var(--fg) 10%,transparent);stroke-width:8}
.enso .ki.pre{stroke:var(--a2);animation:breathe2 1.4s ease-in-out infinite}
@keyframes breathe2{50%{stroke-width:22;opacity:.75}}
.enso .ki.ink{animation:ink 600ms var(--e-exit) forwards}
@keyframes ink{to{stroke-width:40;opacity:0}}
.enso .ec{position:relative;display:flex;flex-direction:column;align-items:center}
.enso .ec small{font:600 12px/1 var(--body);color:var(--muted);margin-top:6px}
.stamp{position:absolute;right:18px;top:24px;padding:8px 12px;border-radius:10px;border:3px solid var(--a0);color:var(--a0);font:700 20px/1 var(--display);transform:rotate(-12deg);animation:stamp 500ms var(--e-snappy)}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg)}}
.scrolls{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:12px -18px 0;padding:6px 18px 4px}
.scrolls::-webkit-scrollbar{display:none}
.scroll{flex:0 0 104px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,#f3e6c8 12%,var(--low)),color-mix(in srgb,#f3e6c8 6%,var(--low)));border-radius:6px;transition:transform 500ms var(--e-snappy),background 300ms,box-shadow 300ms}
.scroll .rod{display:block;width:calc(100% + 16px);height:8px;border-radius:4px;background:color-mix(in srgb,var(--a2) 45%,var(--cont))}
.scroll .glyph{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);margin-top:4px}
.scroll .glyph .icon{width:26px;height:26px}
.scroll b{font:600 12.5px/1.15 var(--body);min-height:29px}
.scroll .dots{display:flex;gap:4px;min-height:12px;font:600 11px/1 var(--body);color:var(--muted)}
.scroll .dots i{width:10px;height:10px;border-radius:50%;background:var(--a2)}
.scroll small{font-size:11px;color:var(--muted);margin-bottom:2px}
.scroll[aria-pressed="true"]{transform:translateY(-6px);background:linear-gradient(180deg,color-mix(in srgb,var(--a2) 26%,var(--low)),color-mix(in srgb,var(--a2) 12%,var(--low)));box-shadow:0 14px 26px -16px var(--a2)}
.scroll[disabled]{opacity:.4}
.mtools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:20px;background:var(--low);--acc:var(--a2);transition:transform var(--d-snappy) var(--e-snappy)}
.mt:active{transform:scale(.95)}
.mt b{font:600 12.5px/1 var(--body)}
.mt>.icon{width:30px;height:30px;color:var(--a2);margin:6px 0}

/* Paladin: vessel of light */
.poolv{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--a2) 14%,transparent);font:600 17px/1 var(--display)}
.poolv .icon{width:16px;height:16px;color:var(--a2)}
.poolv small{font:500 12px/1 var(--body);color:var(--muted)}
.vessel{position:relative;height:72px;margin-top:14px;border-radius:36px;background:color-mix(in srgb,var(--fg) 6%,transparent);overflow:hidden;touch-action:none;cursor:ew-resize;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a2) 22%,transparent)}
.vessel .liquid{position:absolute;left:0;top:0;bottom:0;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 45%,var(--cont)),color-mix(in srgb,var(--a2) 60%,var(--cont)));transition:width 600ms var(--e-snappy)}
.vessel .shim{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.55) 1.2px,transparent 2px) 0 0/22px 18px,radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 1.6px) 11px 9px/22px 18px;animation:shim 3.4s linear infinite;opacity:.7}
@keyframes shim{to{background-position:0 -36px,11px -27px}}
.vessel .pour{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,#fff 50%,var(--a2)),var(--a2));box-shadow:0 0 22px var(--a2);transition:left 420ms var(--e-snappy),width 420ms var(--e-snappy)}
.vessel .knob{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--surface);box-shadow:0 6px 18px -4px rgba(0,0,0,.6);transition:left 420ms var(--e-snappy),transform 260ms var(--e-snappy)}
.vessel .knob .icon{width:22px;height:22px}
.vessel.drag .pour,.vessel.drag .knob{transition:none}
.vessel.drag .knob{transform:scale(1.15)}
.vessel .pour.rise{transition:transform 600ms var(--e-exit),opacity 600ms;transform:translateY(-40px) scaleY(.4);opacity:0}
.smite .radiance{position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 70% 60%,rgba(255,255,240,.9),color-mix(in srgb,var(--a2) 60%,transparent) 40%,transparent 70%);pointer-events:none}
.smite.flash .radiance{animation:radiance 1100ms var(--e-exit)}
@keyframes radiance{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.smite.done{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a2) 55%,transparent),0 20px 40px -24px color-mix(in srgb,var(--a2) 50%,black)}
.srings{display:flex;gap:8px;align-items:center;margin-top:12px}
.sgap{flex:1}
.sring{width:66px;height:66px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a2) 35%,transparent);transition:background-color 300ms,box-shadow 300ms,transform var(--d-snappy) var(--e-snappy)}
.sring b{font:600 22px/1 var(--display)}
.sring .marks{gap:3px}
.sring .mark{width:7px;height:7px}
.sring[aria-pressed="true"]{background:color-mix(in srgb,var(--a2) 24%,var(--cont));box-shadow:inset 0 0 0 2.5px var(--a2),0 0 22px -6px var(--a2)}
.sring[disabled]{opacity:.35}
.sring:active{transform:scale(.92)}
.stog{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--muted);transition:background-color 300ms,color 300ms}
.stog .icon{width:22px;height:22px}
.stog[aria-pressed="true"]{background:color-mix(in srgb,var(--a0) 26%,var(--cont));color:var(--fg)}
.sdice{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;min-height:46px;--acc:var(--a2)}
.sdice .die2{width:46px;height:46px}
.smite-go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:92px;height:92px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,#fff 40%,var(--a2)),var(--a2) 60%,color-mix(in srgb,var(--a1) 70%,var(--a2)));color:color-mix(in srgb,var(--surface) 90%,black);
  box-shadow:0 0 0 6px color-mix(in srgb,var(--a2) 16%,transparent),0 14px 30px -10px var(--a2);transition:transform var(--d-snappy) var(--e-snappy)}
.smite-go b{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.smite-go .icon{width:24px;height:24px}
.smite-go:active{transform:scale(.9)}
.smite-go[disabled]{opacity:.35}
.chan3{display:flex;align-items:stretch;gap:8px;margin-top:12px}
.cdv{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:22px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:center;transition:transform var(--d-snappy) var(--e-snappy),background-color 400ms,box-shadow 400ms}
.cdv:active{transform:scale(.95)}
.cdv[disabled]{opacity:.4}
.cdv b{font:600 13px/1.2 var(--body)}
.cdv small{font:600 13px/1 var(--display);color:var(--muted)}
.swd{width:30px;height:84px;overflow:visible;transform:rotate(30deg)}
.swd .blade{fill:color-mix(in srgb,var(--fg) 22%,var(--cont));stroke:color-mix(in srgb,var(--fg) 60%,transparent);stroke-width:2;transition:fill 600ms}
.swd .guard,.swd .pommel{fill:var(--a2)}
.swd .grip{fill:color-mix(in srgb,var(--a1) 50%,var(--cont))}
.swd .shine{transform:translateY(90px);opacity:0}
.cdv.lit{background:color-mix(in srgb,var(--a2) 20%,var(--cont));box-shadow:0 0 30px -10px var(--a2)}
.cdv.lit .blade{fill:color-mix(in srgb,#fff 60%,var(--a2));filter:drop-shadow(0 0 8px var(--a2))}
.cdv.lit .shine{animation:shine 2s ease-in-out infinite;opacity:1}
@keyframes shine{0%{transform:translateY(90px)}100%{transform:translateY(-50px)}}
.cdv.ignite{animation:ev 700ms var(--e-snappy)}
.rings{width:84px;height:84px}
.rings circle{fill:none;stroke:var(--a4);stroke-width:2.5;transform-origin:40px 40px}
.rings circle:nth-child(2){opacity:.6}
.rings circle:nth-child(3){opacity:.3}
.cdv.wave .rings circle{animation:waveo 900ms var(--e-exit)}
.cdv.wave .rings circle:nth-child(2){animation-delay:100ms}
.cdv.wave .rings circle:nth-child(3){animation-delay:200ms}
@keyframes waveo{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.cflame{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:46px;color:var(--a1)}
.cflame .icon{width:28px;height:28px;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{30%{transform:scaleY(1.08) rotate(-3deg)}60%{transform:scaleY(.95) rotate(2deg)}}
.cflame small{font:600 12px/1 var(--display);color:var(--muted)}
.cflame.out{color:var(--outline)}
.cflame.out .icon{animation:none}
.sense{display:flex;align-items:center;gap:14px;padding:14px 16px}
.sense[disabled]{opacity:.5}
.sense .ft{display:flex;flex-direction:column;gap:6px}
.sense .ft b{font:600 17px/1.2 var(--display)}
.eyesvg{width:96px;height:56px;flex:none;overflow:visible}
.eyesvg .eyeg{transform-origin:60px 35px;transform:scaleY(.06);transition:transform 600ms var(--e-snappy)}
.eyesvg .lid{fill:color-mix(in srgb,var(--a4) 18%,var(--cont));stroke:var(--a4);stroke-width:3}
.eyesvg .iris{fill:var(--a4)}
.eyesvg .pupil{fill:var(--surface)}
.eyesvg .lash{fill:none;stroke:var(--a4);stroke-width:3;stroke-linecap:round;transition:opacity 300ms}
.eyesvg .rip{fill:none;stroke:var(--a4);stroke-width:2;opacity:0;transform-origin:60px 35px}
.sense.open .eyeg{transform:none}
.sense.open .lash{opacity:0}
.sense.open .rip{animation:rip 2.4s ease-out infinite}
.sense.open .rip.r2{animation-delay:1.2s}
@keyframes rip{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
.sense.open{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a4) 50%,transparent)}
.eyes{display:flex;gap:6px}
.eye{width:20px;height:12px;border-radius:50%;background:var(--a4);position:relative}
.eye::after{content:"";position:absolute;inset:3px 7px;border-radius:50%;background:var(--surface)}
.eye.off{background:transparent;box-shadow:inset 0 0 0 1.6px var(--outline)}
.eye.off::after{display:none}

/* Ranger */
.hunt{display:flex;gap:14px;align-items:center;margin-top:10px}
.hunt .ft{min-width:0;display:flex;flex-direction:column;gap:8px}
.scope{width:112px;height:112px;flex:none;overflow:visible}
.scope circle{fill:none;stroke:var(--a3);transition:r 700ms var(--e-snappy),opacity 400ms}
.scope .r1{stroke-width:2;opacity:.35}
.scope .r2{stroke-width:2;opacity:.55}
.scope .r3{stroke-width:3}
.scope .cross{stroke:var(--a3);stroke-width:2.5;stroke-linecap:round;transform-origin:59px 59px;transition:transform 800ms var(--e-snappy),opacity 400ms;opacity:.35}
.scope.lock .cross{transform:rotate(45deg);opacity:1}
.scope .dot{fill:var(--a0);opacity:0;transition:opacity 300ms 300ms}
.scope.lock .dot{opacity:1;animation:throb 1.2s ease-in-out infinite;transform-origin:59px 59px}
.scope.lockin{animation:lockin 700ms var(--e-snappy)}
@keyframes lockin{0%{transform:scale(1.3) rotate(-30deg)}100%{transform:none}}
.tname{font:600 22px/1.15 var(--display);letter-spacing:-.01em;text-align:left;display:inline-flex;align-items:center;gap:4px}
.tname .icon{width:18px;height:18px;color:var(--muted)}
.tname.dim{color:var(--muted)}
.mdmg{display:flex;align-items:center;gap:10px}
.mdmg .die2{--acc:var(--a3)}
.colos .cg,.patron .cg{color:var(--acc)}
.colos .cg .icon,.patron .cg .icon{width:26px;height:26px}
.colos .die2{position:absolute;right:12px;top:12px}
.colos.used .cg{opacity:.4}
.radar .radarsvg{width:48px;height:48px}
.radar svg{width:100%;height:100%}
.radar circle{fill:none;stroke:var(--a4);stroke-width:1.6;opacity:.5}
.radar .sweep{fill:color-mix(in srgb,var(--a4) 40%,transparent);transform-origin:30px 30px;opacity:.3}
.radar.on .sweep{animation:spin 1.6s linear infinite;opacity:1}
.radar.on{background:color-mix(in srgb,var(--a4) 18%,var(--low))}
.flipc{position:relative;height:118px;perspective:600px;text-align:left;--fl:0deg}
.flipc .fc{position:absolute;inset:0;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:5px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform 700ms var(--e-snappy);
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 16%,var(--low)),var(--low) 85%)}
.flipc .front .fg{color:var(--acc)}
.flipc .front .fg .icon{width:28px;height:28px}
.flipc .front b{font:600 19px/1.1 var(--display);margin-top:auto}
.flipc .back{transform:rotateY(180deg);justify-content:center;gap:8px}
.flipc .bk{display:flex;align-items:center;gap:8px;font:600 12.5px/1.2 var(--body)}
.flipc .bk .icon{width:16px;height:16px;color:var(--acc);flex:none}
.flipc.flipped .front{transform:rotateY(-180deg)}
.flipc.flipped .back{transform:none}

/* Rogue: a scene of shadow and light */
.scene{position:relative;height:150px;margin-top:12px;border-radius:22px;overflow:hidden;background:color-mix(in srgb,var(--fg) 4%,transparent)}
.scene .shade{position:absolute;inset:0;background:radial-gradient(70% 90% at 15% 60%,rgba(0,0,0,.55),transparent 70%);opacity:.3;transition:opacity 600ms}
.rogue.hid .scene .shade{opacity:1}
.scene .beam{position:absolute;right:-30px;top:-40px;width:260px;height:260px;background:conic-gradient(from 200deg at 85% 15%,transparent 0deg,color-mix(in srgb,var(--a2) 35%,transparent) 20deg,transparent 46deg);opacity:0;transition:opacity 500ms}
.rogue.lit .scene .beam{opacity:1}
.scene .ring{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px}
.scene .ring circle{fill:none;stroke:color-mix(in srgb,var(--fg) 22%,transparent);stroke-width:1.5;stroke-dasharray:4 5}
.scene .tgt{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a0) 22%,var(--cont));color:var(--a0)}
.scene .tgt .icon{width:24px;height:24px}
.tk{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transition:left 700ms var(--e-snappy),top 700ms var(--e-snappy),opacity 500ms,filter 500ms,transform var(--d-snappy) var(--e-snappy)}
.tk .icon{width:46px;height:46px;padding:10px;border-radius:50%;background:var(--cont);box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
.tk small{font:600 11px/1 var(--body);color:var(--muted)}
.tk:active{transform:scale(.92)}
.tk.you{left:14px;top:46px;color:var(--a4)}
.rogue.hid .tk.you{opacity:.5;filter:blur(.6px)}
.rogue.hid .tk.you .icon{background:color-mix(in srgb,var(--a5) 30%,var(--cont))}
.tk.ally{left:calc(100% - 66px);top:84px;color:var(--a3)}
.tk.ally.near{left:calc(50% + 30px);top:58px}
.tk.sun{right:12px;top:10px;left:auto;color:var(--muted)}
.tk.sun .icon{width:40px;height:40px;padding:9px}
.tk.sun.on{color:var(--a2)}
.d6s{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:180px;--acc:var(--a4)}
.d6s .die2{width:44px;height:44px;transform:translateY(10px);filter:brightness(.45) saturate(.4);transition:transform 520ms var(--e-snappy),filter 520ms}
.d6s.many .die2{width:34px;height:34px}
.rogue.armed .d6s .die2{transform:none;filter:none}
.rogue.armed .d6s .die2:nth-child(2){transition-delay:70ms}
.rogue.armed .d6s .die2:nth-child(3){transition-delay:140ms}
.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mv{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:18px;background:color-mix(in srgb,var(--fg) 5%,transparent);transition:background-color 300ms,transform var(--d-snappy) var(--e-snappy),opacity 300ms}
.mv .mg{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--a4)}
.mv .mg .icon{width:24px;height:24px}
.mv b{font:600 12px/1 var(--body)}
.mv .mvv{font:600 12.5px/1 var(--display);color:var(--muted);min-height:13px}
.mv.on{background:color-mix(in srgb,var(--a4) 24%,var(--cont))}
.mv.on .mvv{color:var(--fg)}
.mv.on .mg .icon{animation:ev 600ms var(--e-snappy)}
.mv[disabled]{opacity:.35}
.mv:active{transform:scale(.94)}
.dodge{flex-direction:row;align-items:center;gap:12px}
.dodge .dg{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a5) 20%,var(--cont));color:var(--a5)}
.dodge .ft{flex:1;display:flex;flex-direction:column;gap:4px}
.dodgev{display:flex;align-items:baseline;gap:10px}
.dodgev s{font:600 18px/1 var(--display);color:var(--muted)}

/* Sorcerer: two orbs of liquid magic */
.orbs3{position:relative;display:grid;grid-template-columns:1fr 54px 1fr;align-items:start;gap:4px;margin-top:12px}
.orbc{display:flex;flex-direction:column;align-items:center;gap:10px}
.orb2{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;touch-action:none}
.orb2 svg{position:absolute;inset:0;width:100%;height:100%}
.orb2 .og{fill:color-mix(in srgb,var(--fg) 5%,transparent);stroke:color-mix(in srgb,var(--acc) 45%,transparent);stroke-width:2}
.orb2 .liq{transition:transform 900ms var(--e-gentle)}
.orb2 .w1{fill:color-mix(in srgb,var(--acc) 70%,var(--cont));animation:wave 3.2s linear infinite}
.orb2 .w2{fill:color-mix(in srgb,var(--acc) 40%,transparent);animation:wave 5s linear infinite reverse;transform:translateY(-4px)}
@keyframes wave{to{transform:translateX(60px)}}
.orb2 .bub{fill:rgba(255,255,255,.5);animation:bub 3s ease-in infinite}
.orb2 .b2{animation-delay:1s}
.orb2 .b3{animation-delay:2s}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.orb2 .reserve{position:absolute;left:18%;right:18%;top:12%;border-radius:8px;background:repeating-linear-gradient(-45deg,color-mix(in srgb,#fff 40%,transparent) 0 4px,transparent 4px 8px);animation:ev 500ms}
.orb2 .ov{position:relative;display:flex;flex-direction:column;align-items:center;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.orb2 .ov small{font:600 11.5px/1 var(--body);margin-top:4px}
.orbs3 .chan{display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:28px}
.orbs3 .chan button{width:48px;height:44px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 22%,var(--cont));transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms}
.orbs3 .chan button:active{transform:scale(.9)}
.orbs3 .chan button[disabled]{opacity:.3}
.orbs3 .chan small{font:600 11px/1 var(--body);color:var(--muted);margin-bottom:6px}
.flasks{display:flex;gap:6px}
.flask{position:relative;width:30px;height:40px;border-radius:8px 8px 12px 12px;overflow:hidden;background:color-mix(in srgb,var(--fg) 6%,transparent);display:grid;place-items:center;transition:box-shadow 300ms,transform var(--d-snappy) var(--e-snappy)}
.flask i{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--a5) 60%,var(--cont));transition:height 600ms var(--e-snappy)}
.flask b{position:relative;font:600 13px/1 var(--display)}
.flask[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--a5);transform:translateY(-3px)}
.tether{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tether path{fill:none;stroke:var(--a1);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 9;filter:drop-shadow(0 0 6px var(--a1));animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.spark{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--a1);box-shadow:0 0 12px var(--a1);pointer-events:none;z-index:3}
.runes{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:10px}
.rune{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:20px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:left;transition:background-color 400ms,box-shadow 400ms,transform var(--d-snappy) var(--e-snappy)}
.rune .rg{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--a1);background:color-mix(in srgb,var(--a1) 14%,transparent);transition:transform 500ms var(--e-snappy)}
.rune b{font:600 13.5px/1.2 var(--body)}
.rune small{font:600 12px/1 var(--display);color:var(--muted)}
.rune.armed{background:color-mix(in srgb,var(--a1) 22%,var(--cont));box-shadow:inset 0 0 0 1.5px var(--a1),0 0 24px -10px var(--a1)}
.rune.armed .rg{transform:rotate(45deg);background:var(--a1);color:var(--surface)}
.rune:active{transform:scale(.95)}

/* Warlock: the pact circle */
.wlk.dark{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--a5) 12%,var(--low)),#000 120%)}
.pact{position:relative;width:220px;height:220px;margin:8px auto 0}
.pact svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pact .spin{transform-origin:110px 110px;animation:spin 80s linear infinite}
.pact .o1{fill:none;stroke:color-mix(in srgb,var(--a5) 40%,transparent);stroke-width:1.5;stroke-dasharray:1 7}
.pact .o2{fill:none;stroke:color-mix(in srgb,var(--a5) 25%,transparent);stroke-width:1}
.pact line{stroke:color-mix(in srgb,var(--a5) 70%,transparent);stroke-width:2;transition:opacity 500ms}
.pact line.dead{stroke-dasharray:3 6;opacity:.3}
.sigil2{position:absolute;width:62px;height:68px;margin:-34px 0 0 -31px;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy),filter 400ms}
.sigil2 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sigil2 .face{fill:color-mix(in srgb,var(--a5) 34%,var(--cont));stroke:var(--a5);stroke-width:3.5;stroke-linejoin:round}
.sigil2 .rune{fill:none;stroke:color-mix(in srgb,var(--a5) 70%,var(--fg));stroke-width:2;stroke-linecap:round;opacity:.18}
.sigil2 b{position:relative;font:600 20px/1 var(--display)}
.sigil2:not(.off){filter:drop-shadow(0 0 10px color-mix(in srgb,var(--a5) 60%,transparent))}
.sigil2.off .face{fill:transparent;stroke:var(--outline);stroke-dasharray:6 5}
.sigil2.off b{color:var(--muted)}
.sigil2:active{transform:scale(.9)}
.sigil2.crack{animation:crack 600ms var(--e-exit)}
@keyframes crack{30%{transform:scale(1.15) rotate(-8deg)}60%{transform:scale(.9) rotate(4deg)}100%{transform:none}}
.sigil2.ignite{animation:ign 800ms var(--e-snappy)}
@keyframes ign{0%{transform:scale(.4);filter:brightness(2.5)}60%{transform:scale(1.15)}100%{transform:none}}
.pact .pc{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.pact .pc small{font:600 12px/1 var(--body);color:var(--muted);margin-top:4px}
.blast3{position:relative;height:110px;margin-top:10px;border-radius:20px;background:color-mix(in srgb,var(--fg) 4%,transparent)}
.blast3 .bh{position:absolute;left:10px;top:50%;margin-top:-18px;color:var(--a5)}
.blast3 .bh .icon{width:32px;height:36px}
.blast3 .bsvg{position:absolute;left:30px;right:56px;top:7px;height:96px;width:calc(100% - 86px)}
.blast3 .bm{fill:none;stroke:color-mix(in srgb,var(--a5) 30%,transparent);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 7}
.blast3 .bm.fire{stroke:var(--a5);stroke-dasharray:240;stroke-dashoffset:240;filter:drop-shadow(0 0 6px var(--a5));animation:beam 520ms var(--e-snappy) forwards}
@keyframes beam{to{stroke-dashoffset:0}}
.blast3 .bm.miss{stroke:color-mix(in srgb,var(--fg) 15%,transparent);filter:none}
.blast3 .bres{position:absolute;right:8px;top:7px;bottom:7px;width:46px}
.blast3 .br{position:absolute;right:0;transform:translateY(-50%);--acc:var(--a5)}
.blast3 .br.miss{opacity:.35}
.seals{display:flex;flex-direction:column;gap:8px}
.seal2{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:22px;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,#f3e6c8 10%,var(--low)),var(--low))}
.seal2 .paper{flex:1;display:flex;flex-direction:column;gap:4px}
.seal2 .paper b{font:600 18px/1.15 var(--display)}
.seal2 .paper small{font-size:12px;color:var(--muted)}
.seal2 .wax{position:relative;width:60px;height:60px;flex:none;display:grid;place-items:center}
.seal2 .wax i{position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--a0) 75%,var(--cont)),color-mix(in srgb,var(--a0) 35%,var(--cont)));transition:transform 500ms var(--e-snappy),opacity 500ms}
.seal2 .wax .hl{clip-path:polygon(0 0,55% 0,45% 100%,0 100%);border-radius:50%}
.seal2 .wax .hr{clip-path:polygon(55% 0,100% 0,100% 100%,45% 100%);border-radius:50%}
.seal2 .wax b{position:relative;font:700 24px/1 var(--display);color:var(--fg)}
.seal2.break .hl,.seal2.broken .hl{transform:translate(-8px,6px) rotate(-18deg);opacity:.55}
.seal2.break .hr,.seal2.broken .hr{transform:translate(8px,6px) rotate(18deg);opacity:.55}
.seal2.broken b{color:var(--muted)}
.seal2[disabled]{opacity:.5}
.invs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.inv{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:center;transition:background-color 300ms,transform var(--d-snappy) var(--e-snappy)}
.inv .ig{color:var(--a5)}
.inv .ig .icon{width:24px;height:24px}
.inv b{font:600 11.5px/1.15 var(--body)}
.inv.on{background:color-mix(in srgb,var(--a5) 24%,var(--cont))}
.inv:active{transform:scale(.94)}

/* Wizard: crystals and the ritual circle */
.ritual{display:flex;align-items:center;gap:12px;margin-top:12px}
.circ{position:relative;width:140px;height:140px;flex:none;cursor:pointer}
.circ svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.circ .spin{transform-origin:70px 70px;animation:spin 40s linear infinite}
.circ .rr{fill:none;stroke:color-mix(in srgb,var(--a4) 35%,transparent);stroke-width:1.5;stroke-dasharray:2 6}
.circ .rr2{fill:none;stroke:color-mix(in srgb,var(--a4) 22%,transparent);stroke-width:1}
.circ .notch path{fill:none;stroke:color-mix(in srgb,var(--fg) 12%,transparent);stroke-width:7;stroke-linecap:round;transition:stroke 400ms}
.circ .notch path.on{stroke:var(--a2);filter:drop-shadow(0 0 5px var(--a2))}
.circ .cc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none}
.circ .cc small{font:600 14px/1 var(--display);color:var(--muted)}
.circ.cast .spin{animation-duration:1.2s}
.circ.cast{animation:ev 600ms var(--e-snappy)}
.wiz.done .circ{opacity:.5}
.gems{flex:1;display:flex;gap:10px;justify-content:space-around}
.gcol{display:flex;flex-direction:column;align-items:center;gap:7px}
.gcol small{font:600 11px/1 var(--body);color:var(--muted)}
.gem{width:20px;height:20px;transform:rotate(45deg);border-radius:4px;transition:background 400ms,box-shadow 400ms,transform 400ms var(--e-snappy)}
.gem.g2{width:22px;height:22px}
.gem.g3{width:24px;height:24px}
.gem.g4,.gem.g5{width:26px;height:26px}
.gem.lit{background:linear-gradient(135deg,color-mix(in srgb,#fff 45%,var(--a4)),var(--a4));box-shadow:0 0 12px -2px var(--a4)}
.gem.dim{background:transparent;box-shadow:inset 0 0 0 2px var(--outline)}
.gem.picked{position:absolute;margin:-12px 0 0 -12px;background:linear-gradient(135deg,#fff,var(--a2));box-shadow:0 0 14px var(--a2)}
.gem.wobble{animation:wob 400ms}
@keyframes wob{25%{transform:rotate(30deg)}75%{transform:rotate(60deg)}}
.gslot{width:20px;height:20px;transform:rotate(45deg);border-radius:4px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a2) 40%,transparent);opacity:.6}
.bookg{width:40px;height:46px;position:relative;perspective:200px}
.bookg::before{content:"";position:absolute;inset:3px 0 0 4px;border-radius:3px 8px 8px 3px;background:color-mix(in srgb,#f3e6c8 60%,var(--cont))}
.bookg .cover{position:absolute;inset:0;border-radius:4px 10px 10px 4px;background:linear-gradient(135deg,color-mix(in srgb,var(--a4) 70%,var(--cont)),color-mix(in srgb,var(--a4) 35%,var(--cont)));transform-origin:left;transition:transform 500ms var(--e-snappy);box-shadow:inset 4px 0 0 rgba(0,0,0,.2)}
.bookg.open .cover{animation:bopen 700ms var(--e-snappy)}
@keyframes bopen{50%{transform:rotateY(-130deg)}100%{transform:none}}
.sculpt .blastsvg{width:100%;height:58px}
.sculpt .area{fill:color-mix(in srgb,var(--a1) 22%,transparent);stroke:var(--a1);stroke-width:1.5;stroke-dasharray:3 3}
.sculpt .safe{fill:var(--a4);stroke:var(--surface);stroke-width:2;transition:fill 300ms}
.sculpt .hit{fill:var(--a0);opacity:.8;transition:fill 300ms}
.schips{display:flex;gap:4px}
.schips button{width:28px;height:28px;border-radius:9px;font:600 12.5px/1 var(--display);background:color-mix(in srgb,var(--fg) 7%,transparent)}
.schips button[aria-pressed="true"]{background:var(--a1);color:var(--surface)}
.bkcount{display:flex;align-items:baseline;gap:4px}
.bkcount small{margin-left:8px;font-size:13px;color:var(--muted)}
.bkpage{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:18px;background:linear-gradient(90deg,color-mix(in srgb,#f3e6c8 8%,var(--low)),var(--low))}
.bkrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;text-align:left;transition:background-color 200ms}
.bkrow b{flex:1;font:600 14.5px/1.2 var(--body)}
.bkrow small{font-size:12px;color:var(--muted)}
.bkrow .star2{color:var(--outline);transition:color 300ms,transform 400ms var(--e-snappy)}
.bkrow.on .star2{color:var(--a2);transform:rotate(72deg) scale(1.1)}
.bkrow.on{background:color-mix(in srgb,var(--a4) 10%,transparent)}

/* Universal kit for third-party and custom features */
.ktoks{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ktok{width:48px;height:54px;position:relative;transition:transform var(--d-snappy) var(--e-snappy),filter 400ms}
.ktok svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ktok .face{fill:color-mix(in srgb,var(--acc) 34%,var(--cont));stroke:var(--acc);stroke-width:4;stroke-linejoin:round}
.ktok .rune{fill:none;stroke:color-mix(in srgb,var(--acc) 60%,var(--fg));stroke-width:3;stroke-linecap:round;opacity:.6}
.ktok:not(.off){filter:drop-shadow(0 0 8px color-mix(in srgb,var(--acc) 50%,transparent))}
.ktok.off .face{fill:transparent;stroke:var(--outline);stroke-dasharray:6 5}
.ktok.off .rune{opacity:.15}
.ktok:active{transform:scale(.9)}
.ktok.crack{animation:crack 600ms var(--e-exit)}
.kobjs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kobj{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:22px;background:var(--low);text-align:left;transition:background-color 300ms,transform var(--d-snappy) var(--e-snappy)}
.kobj b{font:600 14px/1.2 var(--body)}
.kobj .kg{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.kobj .kg .icon{width:22px;height:22px}
.kobj .kc{display:inline-flex;align-items:center;gap:4px;font:600 11.5px/1 var(--body);color:var(--muted)}
.kobj .kc .icon{width:12px;height:12px}
.kobj.on{background:color-mix(in srgb,var(--acc) 22%,var(--cont))}
.kobj.on .kg{background:var(--acc);color:var(--surface);animation:throb 1.6s ease-in-out infinite}
.kobj:active{transform:scale(.96)}
.kchoice{display:flex;gap:6px;margin-top:10px}
.kpas{margin-top:0}

/* Level ruler */
.lvbig{text-align:center;padding:4px 0}
.ruler{overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:6px 0;scroll-snap-type:x mandatory;position:relative;-webkit-mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.ruler::-webkit-scrollbar{display:none}
.ruler .rl{display:flex;gap:0;padding:0 calc(50% - 22px)}
.ruler button{flex:0 0 44px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;scroll-snap-align:center;color:var(--muted)}
.ruler button b{font:600 16px/1 var(--display);transition:transform 300ms var(--e-snappy),color 300ms}
.ruler button i{width:2px;height:22px;border-radius:1px;background:color-mix(in srgb,var(--fg) 25%,transparent)}
.ruler button:nth-child(4n) i{height:32px}
.ruler button[aria-pressed="true"]{color:var(--fg)}
.ruler button[aria-pressed="true"] b{transform:scale(1.35)}
.ruler button[aria-pressed="true"] i{background:var(--secondary);height:36px;width:3px}
.ruler button[disabled]{opacity:.25}

/* Cast sheet */
.effect{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 20%,var(--low)),var(--low))}
.effect b{font:600 40px/1 var(--display);letter-spacing:-.02em}
.effect span{font-size:13.5px;color:color-mix(in srgb,var(--fg) 78%,transparent)}
.ladder2{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.rung2{flex:0 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px;border-radius:20px;background:var(--low);transition:background-color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.rung2 small{font:600 11px/1 var(--body);color:var(--muted)}
.rung2 b{font:600 24px/1 var(--display);display:grid;place-items:center;min-height:24px}
.rung2 b .icon{width:22px;height:22px}
.rung2 .mk{display:flex;gap:3px;font:600 10.5px/1 var(--body);color:var(--muted)}
.rung2 .mk i{width:7px;height:7px;border-radius:50%;background:var(--secondary)}
.rung2 .mk i.off{background:transparent;box-shadow:inset 0 0 0 1.4px var(--outline)}
.rung2[aria-pressed="true"]{background:color-mix(in srgb,var(--secondary) 22%,var(--low));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--secondary) 60%,transparent);transform:translateY(-2px)}
.rung2[disabled]{opacity:.35;pointer-events:none}
.facts2 .cell b{font:600 15px/1.25 var(--body)}
.more{display:flex;align-items:center;gap:6px;font:600 13px/1 var(--body);color:var(--secondary)}
.more .icon{width:16px;height:16px;transition:transform var(--d-snappy) var(--e-standard)}
.more.open .icon{transform:rotate(180deg)}
.tag .icon{width:13px;height:13px;vertical-align:-2px}

/* Top bar: hit points in beast form and temporary hit points */
.cmhp.beast b{color:var(--a3)}
.cmhp.beast .mini-hp i{background:var(--a3)}
.cmhp .paw{width:14px;height:14px;color:var(--a3);margin-right:2px;vertical-align:-2px}
.cmhp .tmp{font:600 11px/1 var(--display);color:var(--a4);margin-left:4px}
.ovhp{padding:18px;border-radius:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--a3) 18%,var(--low)),var(--low))}
.ovhp .row b{font:600 18px/1.2 var(--display)}


/* Fourth pass: clarity and calm */
.capb{cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 0;-webkit-tap-highlight-color:transparent}
.capb .ci{width:14px;height:14px;opacity:.7;transition:opacity 200ms,transform var(--d-snappy) var(--e-snappy)}
.capb:active .ci{opacity:1;transform:scale(1.2)}
.howto{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--acc) 14%,var(--low));font-size:14px;line-height:1.4}
.howto .icon{width:18px;height:18px;color:var(--acc);flex:none;margin-top:1px}
.chead button.sub{display:block;text-align:left;font:600 13.5px/1.3 var(--body);color:var(--secondary);margin-top:6px;padding:2px 0}
.chead button.sub:active{opacity:.6}
.feats{display:flex;flex-direction:column;gap:6px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--low)}
.feat .fl{flex:none;min-width:34px;height:28px;padding:0 8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:3px;font:600 13px/1 var(--display);background:var(--sc)}
.feat .fl .icon{width:12px;height:12px}
.feat b{display:block;font:600 14.5px/1.25 var(--body)}
.feat span{font-size:12.5px;color:var(--muted)}
.feat.later{opacity:.55}
.feat.later .fl{background:transparent;box-shadow:inset 0 0 0 1.4px var(--outline)}
.exhc{color:var(--a1)}
.exhc .icon{width:13px;height:13px}

/* Cleric: the altar fits a narrow phone; numbered targets */
.sun2{width:128px;height:128px}
.sun2 svg{inset:-4px;width:136px;height:136px}
.sun2 .core{width:74px;height:74px}
.way2{min-width:0}
.way2 b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.allies{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.ally2.add{color:var(--muted);box-shadow:inset 0 0 0 1.5px dashed var(--outline);background:transparent;border:1.5px dashed var(--outline)}
.ally2.add .icon{width:20px;height:20px}

/* Monk: calm kata cards */
.kcard{flex:0 0 112px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:12px;border-radius:20px;text-align:left;background:var(--low);
  box-shadow:inset 0 0 0 1.5px transparent;transition:transform 500ms var(--e-snappy),box-shadow 300ms,background-color 300ms}
.kcard .glyph{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--a2) 16%,transparent);color:var(--a2);transition:background-color 300ms,color 300ms}
.kcard .glyph .icon{width:22px;height:22px}
.kcard b{font:600 13px/1.2 var(--body);min-height:31px}
.kcard .dots{display:flex;gap:4px;align-items:center;min-height:10px;font:600 11px/1 var(--body);color:var(--muted)}
.kcard .dots i{width:9px;height:9px;border-radius:50%;background:var(--a2)}
.kcard small{font-size:11.5px;color:var(--muted)}
.kcard[aria-pressed="true"]{transform:translateY(-4px);background:color-mix(in srgb,var(--a2) 14%,var(--low));box-shadow:inset 0 0 0 1.5px var(--a2)}
.kcard[aria-pressed="true"] .glyph{background:var(--a2);color:var(--surface)}
.kcard[disabled]{opacity:.4}
.kcard:active{transform:scale(.97)}

/* Paladin: quieter, more solemn */
.vessel{height:64px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a2) 20%,transparent)}
.vessel .liquid{background:linear-gradient(90deg,color-mix(in srgb,var(--a2) 26%,var(--cont)),color-mix(in srgb,var(--a2) 40%,var(--cont)))}
.vessel .pour{background:color-mix(in srgb,var(--a2) 78%,var(--cont));box-shadow:none}
.vessel .knob{width:38px;height:38px;margin:-19px 0 0 -19px;box-shadow:0 4px 12px -4px rgba(0,0,0,.55)}
.vessel .knob .icon{width:19px;height:19px}
.smite .radiance{background:radial-gradient(circle at 70% 60%,color-mix(in srgb,var(--a2) 40%,transparent),transparent 65%)}
.smite.done{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a2) 40%,transparent)}
.sring[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--a2)}
.smite-go{width:84px;height:84px;border-radius:26px;background:var(--a2);box-shadow:none}
.cdv.lit{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a2) 55%,transparent)}
.cdv.lit .blade{filter:none}
.sense.open .rip.r2{display:none}
.sense.open{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a4) 40%,transparent)}

/* Rogue: conditions, not a scene */
.rogue .plane{position:absolute;z-index:-1;border-radius:30px;background:color-mix(in srgb,var(--a4) 10%,transparent);transition:transform 800ms var(--e-gentle),opacity 600ms}
.rogue .p1{inset:35% -25% -35% 40%;transform:rotate(-14deg)}
.rogue .p2{inset:60% 30% -45% -25%;transform:rotate(9deg);background:color-mix(in srgb,var(--a5) 9%,transparent)}
.rogue.armed .p1{transform:rotate(-4deg) translate(-24px,-12px)}
.rogue.armed .p2{transform:rotate(2deg) translate(14px,-12px)}
.rogue.dis .plane{opacity:.3}
.conds{display:flex;align-items:center;gap:6px;margin-top:14px}
.conds .or{font:600 11.5px/1 var(--body);color:var(--muted);flex:none}
.cond{flex:1;display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:left;min-width:0;transition:background-color 300ms,box-shadow 300ms,transform var(--d-snappy) var(--e-snappy)}
.cond .icon{width:22px;height:22px;color:var(--a4);flex:none}
.cond b{font:600 13.5px/1.2 var(--body)}
.cond[aria-pressed="true"]{background:color-mix(in srgb,var(--a4) 22%,var(--cont));box-shadow:inset 0 0 0 1.5px var(--a4)}
.cond:active{transform:scale(.97)}
.cond.bad{width:100%;margin-top:8px}
.cond.bad b{flex:1}
.cond.bad .icon{color:var(--a2)}
.cond.bad[aria-checked="true"]{background:color-mix(in srgb,var(--a2) 14%,var(--cont))}
.cond.bad[aria-checked="true"] .switch{background:var(--a2)}
.cond.bad[aria-checked="true"] .switch::after{left:22px;background:var(--surface)}

/* Sorcerer: say what flows where */
.orbs3{grid-template-columns:1fr 34px 1fr}
.olab{font:600 12px/1.25 var(--body);color:var(--muted);text-align:center}
.chanx{display:grid;place-items:center;height:100%;padding-bottom:30px;color:var(--muted)}
.chanx .icon{width:22px;height:22px}
.sorc .flasks{justify-content:center;align-items:center;margin-top:12px}
.sorc .flasks span{font:600 12px/1 var(--body);color:var(--muted);margin-right:4px}
.conv{margin-top:12px}
.conv .go{height:auto;min-height:58px;flex-direction:column;gap:3px;padding:8px}
.conv .go b{font:600 14px/1.2 var(--body)}
.conv .go small{font:500 12px/1 var(--body);color:var(--muted)}

/* Warlock: plain sigils, beams that say hit or miss */
.sigrow{display:flex;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.sigil3{position:relative;width:66px;height:72px;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy),filter 400ms}
.sigil3 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sigil3 .face{fill:color-mix(in srgb,var(--a5) 34%,var(--cont));stroke:var(--a5);stroke-width:3.5;stroke-linejoin:round}
.sigil3 .rune{fill:none;stroke:color-mix(in srgb,var(--a5) 70%,var(--fg));stroke-width:2;stroke-linecap:round;opacity:.16}
.sigil3 b{position:relative;font:600 20px/1 var(--display)}
.sigil3.off .face{fill:transparent;stroke:var(--outline);stroke-dasharray:6 5}
.sigil3.off b{color:var(--muted)}
.sigil3:active{transform:scale(.9)}
.sigil3.crack{animation:crack 600ms var(--e-exit)}
.sigil3.ignite{animation:ign 800ms var(--e-snappy)}
.blast3{height:60px}
.blast3 .bh{margin-top:-16px}
.blast3 .bh .icon{width:28px;height:30px}
.blast3 .bsvg{right:10px;top:0;height:60px;width:calc(100% - 46px)}
.brow3{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.br2{display:flex;flex-direction:column;align-items:center;gap:4px;--acc:var(--a5);transition:opacity 300ms,transform var(--d-snappy) var(--e-snappy)}
.br2 small{font:600 11.5px/1 var(--body);color:var(--muted)}
.br2.miss{opacity:.4}
.br2.miss small{color:var(--a0)}
.br2:active{transform:scale(.92)}
.inv small{font:500 10.5px/1 var(--body);color:var(--muted)}
.inv.on small{color:var(--fg)}

/* Wizard: rows of slot crystals and a budget */
.meter2{display:flex;gap:4px;width:120px}
.meter2 i{flex:1;height:12px;border-radius:6px;background:color-mix(in srgb,var(--fg) 10%,transparent);transition:background-color 300ms,box-shadow 300ms}
.meter2 i.on{background:var(--a2);box-shadow:0 0 8px -2px var(--a2)}
.gemrows{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.grow2{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:color-mix(in srgb,var(--fg) 4%,transparent)}
.grow2 small{width:54px;font:600 12px/1 var(--body);color:var(--muted);flex:none}
.gems2{flex:1;display:flex;gap:12px}
.gcount{font:600 14px/1 var(--display);color:var(--muted)}
.gem.sel{background:linear-gradient(135deg,#fff,var(--a2));box-shadow:0 0 12px var(--a2);animation:selp 1.4s ease-in-out infinite}
@keyframes selp{50%{transform:rotate(45deg) scale(1.15)}}
.gem.restore{animation:restore 480ms var(--e-snappy) forwards}
@keyframes restore{to{transform:rotate(225deg) scale(1.2);background:var(--a4)}}

/* Gallery of all twelve classes and the hero dock */
.gal{position:absolute;inset:0;z-index:35;background:var(--surface);overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.gal::-webkit-scrollbar{display:none}
.gal[hidden]{display:none}
.gal-in{padding:54px 16px 112px}
.gal .kick{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--tertiary)}
.gal h2{font:600 34px/1.02 var(--display);letter-spacing:-.03em;margin:10px 0 8px}
.gal p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.4}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gtile{--acc:var(--a0);position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:14px;min-height:156px;text-align:left;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 22%,var(--low)) 0%,var(--low) 78%);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 8%,transparent);transition:transform var(--d-snappy) var(--e-snappy)}
.gtile:active{transform:scale(.96)}
.gtile[aria-current="true"]{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 70%,transparent)}
.gtile .gi{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 26%,var(--cont));color:var(--acc);margin-bottom:4px}
.gtile .gi .icon{width:22px;height:22px}
.gtile b{font:600 19px/1.1 var(--display);letter-spacing:-.015em}
.gtile .lv{font-size:12px;color:var(--muted);line-height:1.3}
.gtile .tg{margin-top:auto;font:600 12px/1.25 var(--body);color:color-mix(in srgb,var(--acc) 75%,var(--fg))}
.gtile .n{position:absolute;right:14px;top:12px;font:600 13px/1 var(--display);color:var(--muted);opacity:.7}
.gtile{animation:tileIn 560ms var(--e-snappy) both;animation-delay:calc(var(--i) * 28ms)}
@keyframes tileIn{from{transform:translateY(18px) scale(.97);opacity:0}}
.reduce .gtile{animation:none}

.dock{position:absolute;left:50%;bottom:18px;z-index:36;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;touch-action:pan-y}
.dock button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy),background-color 200ms}
.dock button:active{transform:scale(.9);background:color-mix(in srgb,var(--fg) 8%,transparent)}
.dock .grid{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.dock .grid[aria-pressed="true"]{background:var(--secondary);color:var(--surface)}
.dock .dl{width:158px;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden}
.dock .dl b{display:flex;align-items:center;gap:7px;font:600 14.5px/1.1 var(--body);white-space:nowrap}
.dock .dl b i{width:8px;height:8px;border-radius:50%;flex:none}
.dock .dl small{font:500 11.5px/1 var(--body);color:var(--muted)}
.toast{bottom:90px}
.page{padding-bottom:128px}

/* Magic section */
.facts{display:flex;gap:10px;align-items:stretch}
.fact{flex:1;border-radius:18px;padding:11px 12px;background:var(--low)}
.fact small{display:block;font:600 11px/1 var(--body);letter-spacing:.05em;color:var(--muted)}
.fact b{display:block;font:600 22px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.src{border-radius:var(--r-xl);background:var(--low);padding:14px}
.src-head{display:flex;align-items:center;gap:8px;font:600 14px/1.2 var(--body)}
.src-head i{width:8px;height:8px;border-radius:50%}
.src .facts{margin-top:10px}
.src .fact{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.prep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.prep b{color:var(--fg);font-family:var(--display)}
.prep button{color:var(--secondary);font:600 13px/1 var(--body)}
.conc{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--a5) 18%,var(--low))}
.conc .icon{color:var(--a5)}
.conc b{flex:1;font:600 14px/1.25 var(--body)}
.conc small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.console{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.ccol{border-radius:18px;padding:10px 6px 10px;background:var(--low);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform var(--d-snappy) var(--e-snappy)}
.ccol:active{transform:scale(.96)}
.ccol small{font:600 11px/1 var(--body);letter-spacing:.04em;color:var(--muted)}
.ccol b{font:600 20px/1 var(--display)}
.ccol .marks{gap:4px;justify-content:center}
.ccol .mark{width:9px;height:9px}
.ccol.pact{background:color-mix(in srgb,var(--a5) 14%,var(--low))}
.circle{border-radius:var(--r-xl);background:var(--low);overflow:hidden}
.circle-h{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%}
.circle-h .cn{font:600 16px/1.2 var(--display);min-width:68px}
.circle-h .cn small{display:block;font:500 12px/1.2 var(--body);color:var(--muted)}
.circle-h .marks{flex:1;gap:6px}
.circle-h .mark{width:15px;height:15px}
.circle-h .left{font:600 14px/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.circle-h .chev{width:18px;height:18px;color:var(--muted);transition:transform var(--d-snappy) var(--e-standard)}
.circle.open .circle-h .chev{transform:rotate(180deg)}
.spells{padding:0 6px 6px}
.sp{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 10px;border-radius:16px;width:100%;transition:background-color 160ms,opacity 300ms}
.sp:active{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.sp.unprep{opacity:.55}
.sp .star{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--muted)}
.sp .star .icon{width:17px;height:17px}
.sp .star.on{color:var(--a2)}
.sp .star.on .icon{fill:currentColor}
.sp .star.lock{color:var(--secondary)}
.sp .st{flex:1;min-width:0}
.sp .st b{display:block;font:600 15px/1.25 var(--body)}
.sp .st span{font-size:12px;color:var(--muted)}
.sp .badges{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px}
.sp .badges i{font:600 10px/1 var(--body);font-style:normal;padding:3px 5px;border-radius:6px;background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--muted)}
.cast{width:44px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary);transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms}
.cast:active{transform:scale(.92)}
.cast .icon{width:20px;height:20px}
.cast.off{opacity:.35}
.passives .frow .ficon{background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--muted)}

/* Bottom sheets */
.modal{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,8,6,.45);opacity:0}
.bsheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:var(--cont);box-shadow:0 -14px 40px -16px rgba(0,0,0,.6);transform:translateY(100%);touch-action:none}
.grab{height:28px;display:grid;place-items:center;flex:none;cursor:grab}
.grab i{width:36px;height:4px;border-radius:999px;background:var(--outline)}
.bs-body{overflow-y:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.bs-kicker{font:600 13px/1 var(--body);color:var(--secondary)}
.bs-title{font:600 26px/1.12 var(--display);letter-spacing:-.02em;margin:0}
.bs-sub{color:var(--muted);font-size:13.5px;margin-top:-8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border-radius:16px;padding:11px 12px;background:var(--low)}
.cell small{display:block;font:600 11px/1 var(--body);color:var(--muted);letter-spacing:.04em}
.cell b{display:block;font:600 14px/1.3 var(--body);margin-top:5px}
.prose{font-size:15px;line-height:1.55;white-space:pre-line}
.prose h4{font:600 16px/1.2 var(--display);margin:6px 0 4px}
.ladder{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.rung{min-width:64px;padding:10px 10px 9px;border-radius:18px;background:var(--low);text-align:center;transition:background-color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.rung small{display:block;font:500 11px/1.2 var(--body);color:var(--muted)}
.rung b{font:600 18px/1.1 var(--display)}
.rung[aria-pressed="true"]{background:color-mix(in srgb,var(--secondary) 22%,var(--low));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--secondary) 60%,transparent)}
.rung[disabled]{opacity:.35;pointer-events:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--a5) 14%,var(--low));font-size:13.5px}
.note .icon{width:18px;height:18px;color:var(--a5);margin-top:1px}

/* Almanac */
.alm{background:var(--surface);transform:translateX(100%);transition:transform 0s}
.alm-top{position:absolute;left:0;right:0;top:0;z-index:5;padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px}
.alm-row{display:flex;align-items:center;gap:10px}
.alm-row h3{flex:1;font:600 20px/1.1 var(--display);margin:0}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:23px;background:var(--low)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 15px/1 var(--body)}
.search .icon{width:18px;height:18px;color:var(--muted)}
.circles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.circles button{flex:none;min-width:40px;height:34px;padding:0 12px;border-radius:17px;font:600 13px/1 var(--body);color:var(--muted);box-shadow:inset 0 0 0 1.4px var(--outline)}
.circles button[aria-pressed="true"]{background:var(--sc);color:var(--fg);box-shadow:none;border-radius:12px}
.alm-list{padding:224px 16px 40px;display:flex;flex-direction:column;gap:8px}
.alm-h{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 6px 4px}
.atile{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--low);width:100%;transition:transform var(--d-snappy) var(--e-snappy)}
.atile:active{transform:scale(.985)}
.atile .lv{width:40px;height:44px;border-radius:14px;display:grid;place-items:center;font:600 18px/1 var(--display);background:color-mix(in srgb,var(--secondary) 14%,var(--cont));flex:none}
.atile.mine .lv{background:color-mix(in srgb,var(--primary) 22%,var(--cont))}
.atile .ft{flex:1;min-width:0}
.atile b{display:block;font:600 15px/1.25 var(--body)}
.atile span{font-size:12px;color:var(--muted)}
.atile .st{font:600 11.5px/1 var(--body);padding:6px 8px;border-radius:999px;flex:none}
.st.mine{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--fg)}
.st.ok{background:color-mix(in srgb,var(--heal) 16%,transparent);color:var(--fg)}
.st.later{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--muted)}
</style>
</head>
