это заклинание, используя ячейку 2-го круга или выше, вы можете выбрать одно дополнительное существо за каждый круг ячейки выше 1-го.", "cl": ["cleric", "paladin"]}, "cure-wounds": {"n": "Лечение ран", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Существо, которого вы касаетесь, восстанавливает количество хитов, равное 1к8 + ваш модификатор базовой характеристики заклинания. Это заклинание не действует на нежить или конструктов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, лечение увеличивается на 1к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "cleric", "druid", "paladin", "ranger"]}, "shield-of-faith": {"n": "Щит веры", "l": 1, "s": "Ограждение", "t": "1 бонусное действие", "r": "60 фт.", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Небольшой пергамент с написанным на нем текстом из святого писания.", "k": true, "ri": false, "x": "Мерцающее поле появляется и окружает существо по вашему выбору в пределах дистанции, предоставляя ему бонус +2 к КД на время действия.", "h": null, "cl": ["cleric", "paladin"]}, "command": {"n": "Приказ", "l": 1, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "1 раунд", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы произносите команду из одного слова существу, которое вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Мудрости или следовать команде в свой следующий ход. Заклинание не имеет эффекта, если цель нежить, если она не понимает ваш язык, или если ваша команда непосредственно вредна для нее.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете воздействовать на одно дополнительное существо за каждый круг ячейки выше 1-го. Существа должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["cleric", "paladin"]}, "guiding-bolt": {"n": "Направляющий снаряд", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "1 раунд", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вспышка света устремляется к существу по вашему выбору в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 4к6 урона излучением, и следующий бросок атаки, совершенный по этой цели до конца вашего следующего хода, имеет преимущество благодаря мистическому тусклому свету, который мерцает на цели до тех пор.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 1-го.", "cl": ["cleric"]}, "druidcraft": {"n": "Друидизм", "l": 0, "s": "Преобразование", "t": "1 действие", "r": "30 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Шепча духам природы, вы создаете один из следующих эффектов в пределах дистанции:\n- Вы создаете крошечный, безвредный сенсорный эффект, который предсказывает, какой будет погода в вашем месте на следующие 24 часа. Эффект может проявиться как золотая сфера для ясного неба, облако для дождя, падающие снежинки для снега и так далее. Эффект сохраняется в течение 1 раунда.\n- Вы мгновенно заставляете цветок расцвести, семя прорасти или листовую почку раскрыться.\n- Вы создаете мгновенный, безвредный сенсорный эффект, такой как падающие листья, дуновение ветра, звук маленького животного или слабый запах скунса. Эффект должен поместиться в куб с ребром 5 футов.\n- Вы мгновенно зажигаете или тушите свечу, факел или небольшой костер.", "h": null, "cl": ["druid"]}, "produce-flame": {"n": "Сотворение пламени", "l": 0, "s": "Вызов", "t": "1 действие", "r": "На себя", "d": "10 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Мерцающее пламя появляется в вашей руке. Пламя остается там на время действия и не вредит ни вам, ни вашему снаряжению. Пламя излучает яркий свет в радиусе 10 футов и тусклый свет еще на 10 футов. Заклинание заканчивается, если вы отпускаете его действием или если вы накладываете его снова.\nВы также можете атаковать пламенем, хотя это и заканчивает заклинание. Когда вы накладываете это заклинание или в качестве действия в более поздний ход, вы можете метнуть пламя в существо в пределах 30 футов от вас. Совершите дальнобойную атаку заклинанием. При попадании цель получает 1к8 урона огнем.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["druid"]}, "goodberry": {"n": "Чудо-ягоды", "l": 1, "s": "Преобразование", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S · M", "m": "Ветка омелы.", "k": false, "ri": false, "x": "В вашей руке появляется до десяти ягод, наполненных магией на время действия. Существо может использовать свое действие, чтобы съесть одну ягоду. Поедание ягоды восстанавливает 1 хит, и ягода обеспечивает достаточно пищи, чтобы поддерживать существо в течение одного дня.\nЯгоды теряют свою силу, если они не были съедены в течение 24 часов после накладывания заклинания.", "h": null, "cl": ["druid", "ranger"]}, "entangle": {"n": "Опутывание", "l": 1, "s": "Вызов", "t": "1 действие", "r": "90 фт.", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Хватающие сорняки и лозы прорастают из земли в квадрате с ребром 20 футов, начиная с точки в пределах дистанции. В течение длительности эти растения превращают землю в области в труднопроходимую местность.\nСущество в области, когда вы накладываете заклинание, должно преуспеть в спасброске Силы или быть опутанным опутывающими растениями, пока заклинание не закончится. Существо, опутанное растениями, может использовать свое действие, чтобы совершить проверку Силы против вашей Сл спасброска заклинаний. При успехе оно освобождается.\nКогда заклинание заканчивается, созданные растения увядают.", "h": null, "cl": ["druid"]}, "faerie-fire": {"n": "Огонь фей", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 1 мин.", "c": "V", "m": null, "k": true, "ri": false, "x": "Каждый объект в 20-футовом кубе в пределах дистанции очерчивается синим, зеленым или фиолетовым светом (по вашему выбору). Любое существо в области, когда заклинание накладывается, также очерчивается светом, если оно проваливает спасбросок Ловкости. На время действия объекты и затронутые существа излучают тусклый свет в радиусе 10 футов.\nЛюбой бросок атаки против затронутого существа или объекта имеет преимущество, если атакующий может его видеть, и затронутое существо или объект не могут получить выгоду от невидимости.", "h": null, "cl": ["druid"]}, "shillelagh": {"n": "Дубинка", "l": 0, "s": "Преобразование", "t": "1 бонусное действие", "r": "Касание", "d": "1 мин.", "c": "V · S · M", "m": "Омела, лист клевера и дубинка или посох.", "k": false, "ri": false, "x": "Дерево дубинки или посоха, которое вы держите, наполняется силой природы. В течение длительности вы можете использовать свою базовую характеристику заклинания вместо Силы для бросков атаки и урона рукопашных атак, использующих это оружие, и кость урона оружия становится к8. Оружие также становится магическим, если оно еще не является таковым. Заклинание заканчивается, если вы накладываете его снова или если вы выпускаете оружие из рук.", "h": null, "cl": ["druid"]}, "moonbeam": {"n": "Лунный луч", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Несколько семян лунного семени и кусок опалесцирующего полевого шпата.", "k": true, "ri": false, "x": "Серебристый луч бледного света светит вниз в цилиндре радиусом 5 футов и высотой 40 футов, центрированном на точке в пределах дистанции. Тусклый свет наполняет цилиндр. Когда существо входит в область заклинания впервые за ход или начинает там свой ход, оно поглощается призрачным пламенем, которое вызывает жгучую боль, и оно должно совершить спасбросок Телосложения. Оно получает 2к10 урона излучением при провале или половину этого урона при успехе.\nПеревертыш совершает свой спасбросок с помехой. Если он проваливает, он также мгновенно возвращается в свою первоначальную форму и не может принять другую форму, пока не покинет свет заклинания.\nВ каждый свой ход после того, как вы наложили это заклинание, вы можете использовать действие, чтобы переместить луч на 60 футов в любом направлении.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, урон увеличивается на 1к10 за каждый круг ячейки выше 2-го.", "cl": ["druid"]}, "spike-growth": {"n": "Шипы", "l": 2, "s": "Преобразование", "t": "1 действие", "r": "150 фт.", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Семь острых шипов или семь маленьких веточек, каждая заостренная на конце.", "k": true, "ri": false, "x": "Земля в радиусе 20 футов с центром в точке в пределах дистанции скручивается и прорастает твердыми шипами и колючками. Область становится труднопроходимой местностью на время действия. Когда существо входит в область или перемещается в ней, оно получает 2к4 колющего урона за каждые 5 футов, которые оно проходит.\nТрансформация земли замаскирована, чтобы выглядеть естественно. Любое существо, которое не может видеть область во время накладывания заклинания, должно совершить проверку Мудрости (Внимательность) против вашей Сл спасброска заклинаний, чтобы распознать местность как опасную перед тем, как войти в нее.", "h": null, "cl": ["druid", "ranger"]}, "lesser-restoration": {"n": "Малое восстановление", "l": 2, "s": "Ограждение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы касаетесь существа и можете закончить либо одну болезнь, либо одно состояние, влияющее на него. Состояние может быть ослепленным, оглушенным, парализованным или отравленным.", "h": null, "cl": ["bard", "cleric", "druid", "paladin", "ranger"]}, "divine-favor": {"n": "Божественная благосклонность", "l": 1, "s": "Воплощение", "t": "1 бонусное действие", "r": "На себя", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Ваша молитва наполняет вас божественным сиянием. До окончания действия заклинания ваши атаки оружием наносят дополнительные 1к4 урона излучением при попадании.", "h": null, "cl": ["paladin"]}, "protection-from-evil-and-good": {"n": "Защита от добра и зла", "l": 1, "s": "Ограждение", "t": "1 действие", "r": "Касание", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Святая вода или порошкообразное серебро и железо, которые заклинание расходует.", "k": true, "ri": false, "x": "До окончания действия заклинания одно добровольное существо, которого вы касаетесь, защищено от определенных типов существ: аберраций, небожителей, элементалей, фей, исчадий и нежити.\nЗащита дает несколько преимуществ. Существа этих типов совершают броски атаки против цели с помехой. Цель также не может быть очарована, испугана или одержима ими. Если цель уже очарована, испугана или одержима таким существом, цель имеет преимущество на любой новый спасбросок против соответствующего эффекта.", "h": null, "cl": ["cleric", "paladin", "warlock", "wizard"]}, "sanctuary": {"n": "Убежище", "l": 1, "s": "Ограждение", "t": "1 бонусное действие", "r": "30 фт.", "d": "1 мин.", "c": "V · S · M", "m": "Небольшое серебряное зеркало.", "k": false, "ri": false, "x": "Вы защищаете существо в пределах дистанции от атаки. До окончания действия заклинания любое существо, которое пытается нацелиться на защищенное существо атакой или вредоносным заклинанием, должно сначала совершить спасбросок Мудрости. При провале существо должно выбрать новую цель или потерять атаку или заклинание. Это заклинание не защищает защищенное существо от зональных эффектов, таких как взрыв огненного шара.\nЕсли защищенное существо совершает атаку, накладывает заклинание, которое влияет на вражеское существо, или наносит урон другому существу, это заклинание заканчивается.", "h": null, "cl": ["cleric", "paladin"]}, "zone-of-truth": {"n": "Зона правды", "l": 2, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "10 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы создаете магическую зону, которая защищает от обмана, в сфере радиусом 15 футов, центрированной на точке по вашему выбору в пределах дистанции. Пока заклинание длится, существо, которое входит в область заклинания впервые за ход или начинает там свой ход, должно совершить спасбросок Харизмы. При провале существо не может говорить преднамеренную ложь, пока находится в радиусе.\nВы знаете, удалось ли каждому существу пройти спасбросок или нет. Затронутое существо осознает заклинание и может избегать ответов на вопросы, на которые оно обычно лгало бы. Такие существа могут быть уклончивыми в своих ответах, пока они остаются в границах правды.", "h": null, "cl": ["bard", "cleric", "paladin"]}, "find-steed": {"n": "Поиск скакуна", "l": 2, "s": "Вызов", "t": "10 мин.", "r": "30 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы призываете духа, который принимает форму необычайно умного, сильного и верного коня, создавая прочную связь с ним. Появляясь в незанятом пространстве в пределах дистанции, скакун принимает форму, которую вы выбираете: боевой конь, пони, верблюд, лось или мастиф (ваш ГМ может разрешить других животных в качестве скакунов). Скакун имеет статистику выбранной формы, хотя это небожитель, фея или исчадие (по вашему выбору), а не зверь. Кроме того, если ваш скакун имеет Интеллект 5 или меньше, его Интеллект становится 6, и он получает способность понимать один язык по вашему выбору, на котором вы говорите.\nВаш скакун служит вам верховым животным как в бою, так и вне его, и у вас есть инстинктивная связь с ним, которая позволяет вам сражаться как единое целое. Пока вы верхом на нем, вы можете сделать так, чтобы любое заклинание, которое вы накладываете, нацеленное только на вас, также нацеливалось на вашего скакуна.\nКогда скакун падает до 0 хитов, он исчезает, не оставляя после себя физической формы. Вы также можете отпустить своего скакуна в любое время действием, заставляя его исчезнуть. В любом случае, повторное накладывание этого заклинания призывает того же скакуна, восстановленного до полного здоровья.", "h": null, "cl": ["paladin"]}, "aid": {"n": "Помощь", "l": 2, "s": "Ограждение", "t": "1 действие", "r": "30 фт.", "d": "8 ч.", "c": "V · S · M", "m": "Крошечная полоска белой ткани.", "k": false, "ri": false, "x": "Ваши заклинания воодушевляют ваших союзников стойкостью и решимостью. Выберите до трех существ в пределах дистанции. Максимум хитов и текущие хиты каждой цели увеличиваются на 5 на время действия заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, хиты увеличиваются на 5 за каждый круг ячейки выше 2-го.", "cl": ["cleric", "paladin"]}, "hunters-mark": {"n": "Метка охотника", "l": 1, "s": "Прорицание", "t": "1 бонусное действие", "r": "90 фт.", "d": "Вплоть до 1 ч.", "c": "V", "m": null, "k": true, "ri": false, "x": "Вы выбираете существо, которое вы можете видеть в пределах дистанции, и мистически помечаете его как свою добычу. До окончания действия заклинания вы наносите дополнительные 1к6 урона цели каждый раз, когда вы попадаете по ней атакой оружием, и вы имеете преимущество на любую проверку Мудрости (Внимательность) или Мудрости (Выживание), которую вы совершаете, чтобы найти ее. Если цель опускается до 0 хитов до окончания этого заклинания, вы можете использовать бонусное действие в один из ваших последующих ходов, чтобы пометить новое существо.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го или 4-го круга, вы можете поддерживать концентрацию на заклинании до 8 часов. Если вы используете ячейку заклинания 5-го круга или выше, вы можете поддерживать концентрацию на заклинании до 24 часов.", "cl": ["ranger"]}, "fire-bolt": {"n": "Огненный снаряд", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы бросаете сгусток огня в существо или объект в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1к10 урона огнем. Горючий предмет, попавший под это заклинание, воспламеняется, если его никто не несет и не носит.\nУрон этого заклинания увеличивается на 1к10, когда вы достигаете 5-го уровня (2к10), 11-го уровня (3к10) и 17-го уровня (4к10).", "h": null, "cl": ["sorcerer", "wizard"]}, "mage-hand": {"n": "Рука мага", "l": 0, "s": "Вызов", "t": "1 действие", "r": "30 фт.", "d": "1 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Спектральная, парящая рука появляется в точке, которую вы выбираете в пределах дистанции. Рука длится в течение длительности или пока вы не отпустите ее действием. Рука исчезает, если она когда-либо находится более чем в 30 футах от вас или если вы накладываете это заклинание снова.\nВы можете использовать свое действие, чтобы управлять рукой. Вы можете использовать руку, чтобы манипулировать объектом, открыть незапертую дверь или контейнер, убрать или положить предмет из открытого контейнера или вылить содержимое флакона. Вы можете перемещать руку на расстояние до 30 футов каждый раз, когда вы ее используете.\nРука не может атаковать, активировать магические предметы или нести более 10 фунтов.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "shocking-grasp": {"n": "Шоковое прикосновение", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Молния срывается с вашей руки, чтобы поразить существо, которое вы пытаетесь коснуться. Совершите рукопашную атаку заклинанием по цели. Вы имеете преимущество на бросок атаки, если цель носит доспехи из металла. При попадании цель получает 1к8 урона молнией, и она не может использовать реакции до начала своего следующего хода.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["sorcerer", "wizard"]}, "burning-hands": {"n": "Огненные ладони", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "На себя", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Когда вы держите руки с соприкасающимися большими пальцами и растопыренными остальными пальцами, тонкий лист пламени вырывается из ваших кончиков пальцев. Каждое существо в 15-футовом конусе должно совершить спасбросок Ловкости. Существо получает 3к6 урона огнем при провале или половину этого урона при успехе.\nОгонь воспламеняет любые горючие предметы в области, которые никто не несет и не носит.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 1-го.", "cl": ["sorcerer", "wizard"]}, "shield": {"n": "Щит", "l": 1, "s": "Ограждение", "t": "1 реакция", "r": "На себя", "d": "1 раунд", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Невидимый барьер магической силы появляется и защищает вас. До начала вашего следующего хода вы получаете бонус +5 к КД, в том числе против триггерной атаки, и вы не получаете урона от магической стрелы.", "h": null, "cl": ["sorcerer", "wizard"]}, "misty-step": {"n": "Туманный шаг", "l": 2, "s": "Вызов", "t": "1 бонусное действие", "r": "На себя", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы на мгновение окружаетесь серебристым туманом и телепортируетесь на расстояние до 30 футов в незанятое пространство, которое вы можете видеть.", "h": null, "cl": ["sorcerer", "warlock", "wizard"]}, "scorching-ray": {"n": "Опаляющий луч", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы создаете три луча огня и направляете их на цели в пределах дистанции. Вы можете направить их на одну цель или на несколько.\nСовершите дальнобойную атаку заклинанием для каждого луча. При попадании цель получает 2к6 урона огнем.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы создаете один дополнительный луч за каждый круг ячейки выше 2-го.", "cl": ["sorcerer", "wizard"]}, "fireball": {"n": "Огненный шар", "l": 3, "s": "Воплощение", "t": "1 действие", "r": "150 фт.", "d": "Мгновенная", "c": "V · S · M", "m": "Крошечный шарик из гуано летучей мыши и серы.", "k": false, "ri": false, "x": "Яркий луч вылетает из вашего указательного пальца в точку, которую вы выбираете в пределах дистанции, а затем взрывается с низким ревом пламени. Каждое существо в сфере радиусом 20 футов с центром в этой точке должно совершить спасбросок Ловкости. Существо получает 8к6 урона огнем при провале или половину этого урона при успехе.\nОгонь распространяется за углы. Он воспламеняет горючие предметы в области, которые никто не несет и не носит.", "h": "Если вы накладываете это заклинание, используя ячейку 4-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 3-го.", "cl": ["sorcerer", "wizard"]}, "haste": {"n": "Ускорение", "l": 3, "s": "Преобразование", "t": "1 действие", "r": "30 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Стружка корня лакрицы.", "k": true, "ri": false, "x": "Выберите добровольное существо, которое вы можете видеть в пределах дистанции. До окончания действия заклинания скорость цели удваивается, она получает бонус +2 к КД, она имеет преимущество на спасброски Ловкости, и она получает дополнительное действие в каждый свой ход. Это действие может быть использовано только для совершения действий Атака (только одна атака оружием), Рывок, Отход, Прятаться или Использование предмета.\nКогда заклинание заканчивается, цель не может двигаться или совершать действия до конца своего следующего хода, так как волна летаргии накатывает на нее.", "h": null, "cl": ["sorcerer", "wizard"]}, "eldritch-blast": {"n": "Мистический заряд", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Луч потрескивающей энергии устремляется к существу в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1к10 урона силовым полем.\nЗаклинание создает больше одного луча, когда вы достигаете более высоких уровней: два луча на 5-м уровне, три луча на 11-м уровне и четыре луча на 17-м уровне. Вы можете направить лучи в одну цель или в несколько. Совершите отдельный бросок атаки для каждого луча.", "h": null, "cl": ["warlock"]}, "hellish-rebuke": {"n": "Адское возмездие", "l": 1, "s": "Воплощение", "t": "1 реакция", "r": "60 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы указываете пальцем, и существо, которое нанесло вам урон, на мгновение окружается адским пламенем. Существо должно совершить спасбросок Ловкости. Оно получает 2к10 урона огнем при провале или половину этого урона при успехе.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к10 за каждый круг ячейки выше 1-го.", "cl": ["warlock"]}, "hold-person": {"n": "Удержание личности", "l": 2, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Небольшой, прямой кусок железа.", "k": true, "ri": false, "x": "Выберите гуманоида, которого вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Мудрости или быть парализованной на время действия. В конце каждого своего хода цель может совершить еще один спасбросок Мудрости. При успехе заклинание заканчивается на цели.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы можете нацелиться на одного дополнительного гуманоида за каждый круг ячейки выше 2-го. Гуманоиды должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["bard", "cleric", "druid", "sorcerer", "warlock", "wizard"]}, "darkness": {"n": "Тьма", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 10 мин.", "c": "V · M", "m": "Мех летучей мыши и капля дегтя или кусок угля.", "k": true, "ri": false, "x": "Магическая тьма распространяется из точки, которую вы выбираете в пределах дистанции, заполняя сферу радиусом 15 футов в течение длительности. Тьма огибает углы. Существо с темным зрением не может видеть сквозь эту тьму, и немагический свет не может освещать ее.\nЕсли точка, которую вы выбираете, находится на предмете, который вы держите, или на том, который никто не носит и не несет, тьма исходит от предмета и движется вместе с ним. Полное накрытие источника тьмы непрозрачным предметом, таким как миска или шлем, блокирует тьму.\nЕсли какая-либо часть области этого заклинания перекрывается областью света, созданного заклинанием 2-го круга или ниже, заклинание, создавшее свет, рассеивается.", "h": null, "cl": ["sorcerer", "warlock", "wizard"]}, "counterspell": {"n": "Контрзаклинание", "l": 3, "s": "Ограждение", "t": "1 реакция", "r": "60 фт.", "d": "Мгновенная", "c": "S", "m": null, "k": false, "ri": false, "x": "Вы пытаетесь прервать существо в процессе накладывания заклинания. Если существо накладывает заклинание 3-го круга или ниже, его заклинание проваливается и не имеет эффекта. Если оно накладывает заклинание 4-го круга или выше, совершите проверку своей базовой характеристики заклинания. Сл равна 10 + круг заклинания. При успехе заклинание существа проваливается и не имеет эффекта.", "h": "Если вы накладываете это заклинание, используя ячейку 4-го круга или выше, прерванное заклинание не имеет эффекта, если его круг меньше или равен кругу ячейки, которую вы использовали.", "cl": ["sorcerer", "warlock", "wizard"]}, "fly": {"n": "Полет", "l": 3, "s": "Преобразование", "t": "1 действие", "r": "Касание", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Перо крыла любой птицы.", "k": true, "ri": false, "x": "Вы касаетесь согласного существа. Цель получает скорость полета 60 футов на время действия. Когда заклинание заканчивается, цель падает, если она все function classHTML(h, c){ const f = CLASS[c.id]; return head(c) + `<div class="stack">${f ? f.html(h, c) : ''}</div>`; }
function rollDice(n, d){ return Array.from({length:n}, () => 1 + Math.floor(Math.random()*d)); }

// Barbarian · Rage. Hold the bar to fly into a rage: it fills with heat and
// ticks as it goes; the whole instrument flares once and stays tense while
// raging. Uses are drawn as claws; rounds are counted to the minute.
CLASS.barbarian = {
  html(h){ const s = st(h, 'rage', () => ({left:3, max:3, on:false, round:1, frenzy:false, reckless:false, exh:0}));
    return `<div class="inst barb ${s.on ? 'on' : ''}" style="--acc:var(--a0)" id="barb"><i class="heat"></i>
      <div class="inst-h"><span class="cap">${s.on ? 'В ярости' : 'Ярость'}</span>${rest('long')}</div>
      <div class="row" style="margin-top:14px;align-items:flex-end"><div><div class="huge num">+2</div><div class="sub" style="margin-top:6px">к урону атаками Силы в ярости</div></div>
        <div class="claws" aria-label="Осталось ${s.left} из ${s.max}">${Array.from({length:s.max},(_,i) => `<i class="claw ${i < s.left ? '' : 'off'}"></i>`).join('')}</div></div>
      <div class="effects" style="margin-top:16px">
        <div class="eff"><b>Сопротивление</b><span>дробящий, колющий, рубящий урон</span></div>
        <div class="eff"><b>Преимущество</b><span>проверки и спасброски Силы</span></div>
        <div class="eff"><b>Бешенство</b><span>${s.frenzy ? 'бонусная атака каждый ход' : 'по желанию при входе'}</span></div></div>
      <div style="margin-top:14px">${s.on ? `
        <div class="rounds"><button type="button" class="pip" data-a="rprev" aria-label="Раунд назад">−</button><div class="rd"><b class="num">Раунд ${s.round}</b><span class="sub">из 10 · кончится раньше без атак и урона</span></div><button type="button" class="pip" data-a="rnext" aria-label="Следующий раунд">+</button></div>
        <button type="button" class="ghost" style="width:100%;margin-top:10px" data-a="end">Завершить ярость</button>` : `
        <button type="button" class="hold" id="hold" ${s.left ? '' : 'disabled'}><i class="fill"></i><span>${s.left ? 'Удерживайте, чтобы впасть в ярость' : 'Ярость восстановит длительный отдых'}</span></button>`}</div>
      <button type="button" class="swrow" role="switch" aria-checked="${s.on ? s.frenzy : s.reckless}" data-a="${s.on ? 'frenzy' : 'reckless'}" style="margin-top:10px"><span class="ft"><b>${s.on ? 'Бешенство' : 'Безрассудная атака'}</b><span class="sub">${s.on ? 'после ярости — 1 степень истощения' : 'преимущество на атаки Силы в этот ход; по вам — тоже'}</span></span><span class="switch"></span></button>
      ${s.exh ? `<div class="warn" style="margin-top:10px">${icon('timer')}<span>Истощение: ${s.exh} — после Бешенства</span></div>` : ''}
    </div>`; },
  bind(sec, h){ const s = h.st.rage, hold = $('#hold', sec);
    sec.onclick = e => { const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
      if (a === 'rnext') { s.round = Math.min(10, s.round + 1); buzz.tick(); if (s.round === 10) toast('Последний раунд ярости'); }
      if (a === 'rprev') { s.round = Math.max(1, s.round - 1); buzz.tick(); }
      if (a === 'end') { s.on = false; if (s.frenzy) { s.exh++; s.frenzy = false; } buzz.light(); toast('Ярость завершена'); }
      if (a === 'frenzy') { s.frenzy = !s.frenzy; buzz.tick(); }
      if (a === 'reckless') { s.reckless = !s.reckless; buzz.tick(); }
      remount(); };
    if (!hold || hold.disabled) return;
    const fill = $('.fill', hold); let t0 = 0, raf = 0, ticks = 0;
    const tick = now => { const p = clamp((now - t0) / 650, 0, 1); fill.style.transform = `scaleX(${p})`;
      if (p > (ticks + 1) / 3 && ticks < 2) { ticks++; buzz.tick(); }
      if (p >= 1) { raf = 0; s.left--; s.on = true; s.round = 1; buzz.medium(); toast('Ярость! +2 к урону, сопротивление'); remount(() => replay($('#barb'), 'flare')); return; }
      raf = requestAnimationFrame(tick); };
    hold.addEventListener('pointerdown', e => { t0 = performance.now(); ticks = 0; hold.setPointerCapture(e.pointerId); raf = requestAnimationFrame(tick); });
    const cancel = () => { if (!raf) return; cancelAnimationFrame(raf); raf = 0; const from = parseFloat((fill.style.transform.match(/[\d.]+/) || [0])[0]);
      const sp = new Spring(from, SPR.snappy, v => fill.style.transform = `scaleX(${Math.max(0, v)})`); sp.to(0); };
    hold.addEventListener('pointerup', cancel); hold.addEventListener('pointercancel', cancel); hold.addEventListener('pointerleave', cancel); }
};

// Bard · Inspiration. A tray of real d8 tokens; flick one upwards (or tap
// the button) and it flies off to the ally along the rhythm lines. The
// ally keeps the die and rolls it; Cutting Words spends the same pool.
CLASS.bard = {
  html(h){ const s = st(h, 'insp', () => ({left:4, max:4, given:0}));
    return `<div class="inst bard" style="--acc:var(--a0)" id="bard">
      <svg class="waves" viewBox="0 0 420 120" preserveAspectRatio="none" aria-hidden="true"><path d="M-60 60 Q -30 20 0 60 T 60 60 T 120 60 T 180 60 T 240 60 T 300 60 T 360 60 T 420 60 T 480 60"/><path d="M-60 72 Q -30 40 0 72 T 60 72 T 120 72 T 180 72 T 240 72 T 300 72 T 360 72 T 420 72 T 480 72"/><path d="M-60 48 Q -30 30 0 48 T 60 48 T 120 48 T 180 48 T 240 48 T 300 48 T 360 48 T 420 48 T 480 48"/></svg>
      <div class="inst-h"><span class="cap">Вдохновение</span>${rest('short')}</div>
      <div class="row" style="margin-top:14px;align-items:flex-end"><div><span class="huge num">${s.left}</span><span class="of num">/ ${s.max}</span><div class="sub" style="margin-top:6px">кость к8 · смахните вверх</div></div>
        <div class="tray" id="tray">${Array.from({length:s.max},(_,i) => `<span class="tok ${i < s.left ? '' : 'off'}" data-i="${i}">${D8}<b>к8</b></span>`).join('')}</div></div>
      ${s.given ? `<div class="ticket" style="margin-top:14px">${icon('note')}<b>У союзников: ${s.given} ${plural(s.given,'кость','кости','костей')} к8</b><button type="button" data-a="spent">одна использована</button></div>` : ''}
      <button type="button" class="go" style="margin-top:14px" data-a="give" ${s.left ? '' : 'disabled'}>${icon('fwd')} Вдохновить союзника</button></div>
    <div class="two">
      <button type="button" class="cell2" style="--acc:var(--a1)" data-a="cut" ${s.left ? '' : 'disabled'}><span class="cap">Острые слова</span><b>Реакция</b><span class="sub">вычесть к8 из броска врага · из того же запаса</span></button>
      <div class="cell2" style="--acc:var(--a4)"><span class="cap">Песнь отдыха</span><span class="big num">к6</span><span class="sub">союзникам за короткий отдых</span></div></div>`; },
  give(h, how){ const s = h.st.insp; if (!s.left) return toast('Вдохновение вернёт короткий отдых');
    const tok = $$('#tray .tok:not(.off)').pop(); s.left--; if (how !== 'cut') s.given++; buzz.light();
    replay($('#bard'), 'sing');
    if (tok && !reduced) { tok.classList.add('fly'); setTimeout(() => remount(), 560); } else remount();
    toast(how === 'cut' ? 'Острые слова: враг вычитает к8' : 'Кость к8 у союзника · 10 минут'); },
  bind(sec, h){ const me = this;
    sec.onclick = e => { const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
      if (a === 'give') me.give(h); if (a === 'cut') me.give(h, 'cut');
      if (a === 'spent') { h.st.insp.given = Math.max(0, h.st.insp.given - 1); buzz.tick(); remount(); } };
    $$('#tray .tok:not(.off)', sec).forEach(tok => { let y0 = null;
      tok.addEventListener('pointerdown', e => { y0 = e.clientY; tok.setPointerCapture(e.pointerId); });
      tok.addEventListener('pointermove', e => { if (y0 === null) return; const dy = Math.min(0, e.clientY - y0); tok.style.transform = `translateY(${dy * .6}px) rotate(${dy * -.15}deg)`; });
      tok.addEventListener('pointerup', e => { const dy = e.clientY - y0; y0 = null; if (dy < -36) me.give(h); else { tok.style.transform = ''; } }); }); }
};

// Cleric · Channel Divinity. A sun at the centre with its charges; the rays
// turn towards the chosen way, and channelling bursts them outwards.
CLASS.cleric = {
  ways: [['turn','Изгнание нежити','Нежить в 30 фт. · спасбросок Мудрости Сл 13 · бежит 1 минуту'],['life','Сохранение жизни','10 ОЗ между ранеными в 30 фт. · не выше половины их максимума']],
  html(h){ const s = st(h, 'chan', () => ({left:1, max:1, pick:0})); const w = this.ways;
    const rays = Array.from({length:16},(_,i) => { const a = i / 16 * Math.PI * 2, r1 = 50, r2 = 70; return `<line class="${(s.pick === 0 ? [13,14,15,0] : [0,1,2,3]).includes(i) ? 'hi' : ''}" x1="${74 + Math.cos(a)*r1}" y1="${74 + Math.sin(a)*r1}" x2="${74 + Math.cos(a)*r2}" y2="${74 + Math.sin(a)*r2}"/>`; }).join('');
    return `<div class="inst" style="--acc:var(--a2)">
      <div class="inst-h"><span class="cap">Божественный канал</span>${rest('short')}</div>
      <div class="row" style="margin-top:12px;align-items:center">
        <div class="sun ${s.left ? '' : 'dim'}" id="sun"><svg viewBox="0 0 148 148"><g class="rays">${rays}</g></svg><div class="core"><div><b class="num">${s.left}</b><span>из ${s.max}</span></div></div></div>
        <div class="ways">${w.map((x,i) => `<button type="button" class="way" data-a="pick" data-i="${i}" aria-pressed="${s.pick === i}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</div></div>
      <button type="button" class="go" style="margin-top:14px" data-a="channel" ${s.left ? '' : 'disabled'}>${s.left ? 'Направить: ' + w[s.pick][1].toLowerCase() : 'Канал восстановит короткий отдых'}</button></div>
    <div class="lite" style="--acc:var(--a2)"><span class="cap">Домен жизни</span><div style="margin-top:6px"><b>Адепт жизни</b><div class="sub">заклинания лечения 1 круга и выше восстанавливают ещё 2 + круг ячейки</div></div>
      <div class="chiprow" style="margin-top:10px"><span class="chipx">${icon('lock')} Благословение</span><span class="chipx">${icon('lock')} Лечение ран</span></div></div>`; },
  bind(sec, h){ const s = h.st.chan, me = this;
    sec.onclick = e => { const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a;
      if (a === 'pick') { s.pick = +el.dataset.i; buzz.tick(); remount(); }
      if (a === 'channel' && s.left) { s.left--; buzz.medium(); toast(me.ways[s.pick][1] + (s.pick ? ': 10 ОЗ' : ': Сл 13')); remount(() => replay($('#sun'), 'burst')); } }; }
};

// Druid · Wild Shape. The hero and the beast are two states of one organic
// shape: choosing a form morphs it, the beast's hit points sit on top and
// the hero waits underneath; overflow damage passes to the hero.
CLASS.druid = {
  forms: {moon:[['Бурый медведь','1',34,11,'40 фт., лазание 30','Укус +6 · 1к8+4 · Когти +6 · 2к6+4'],['Гигантский паук','1',26,14,'30 фт., лазание 30','Укус +5 · 1к8+3 и яд 2к8'],['Волк','¼',11,13,'40 фт.','Укус +4 · 2к4+2, сбивает с ног']],
          land:[['Волк','¼',11,13,'40 фт.','Укус +4 · 2к4+2, сбивает с ног'],['Пантера','¼',13,12,'50 фт., лазание 40','Укус +4 · 1к6+2 · Когти +4 · 1к4+2'],['Кабан','¼',11,11,'40 фт.','Клыки +3 · 1к6+1, натиск']]},
  html(h, c){ const s = st(h, 'wild' + c.lvl, () => ({left:2, max:2, form:null, hp:0, fmax:0})); const moon = c.sub.includes('луны');
    const list = this.forms[moon ? 'moon' : 'land'], f = s.form !== null ? list[s.form] : null;
    return `<div class="inst druid ${f ? 'beast' : ''}" style="--acc:var(--a3)" id="druid"><i class="blob"></i>
      <div class="inst-h"><span class="cap">Дикий облик</span>${rest('short')}</div>
      ${f ? `
      <div class="tname" style="margin-top:10px">${icon('paw')} ${f[0]}</div>
      <div class="row" style="margin-top:8px;align-items:flex-end"><div><span class="huge num">${s.hp}</span><span class="of num">/ ${s.fmax}</span><div class="sub" style="margin-top:6px">ОЗ облика</div></div>
        <div style="text-align:right"><div class="big num">${f[3]}</div><div class="sub">КД · ${f[4]}</div></div></div>
      <div class="hpbar" style="margin-top:12px"><i style="width:${s.hp / s.fmax * 100}%"></i></div>
      <div class="sub" style="margin-top:10px">${f[5]}</div>
      <div class="heroline" style="margin-top:12px">${icon('heart')}<span>Герой ждёт под обликом: <b>${h.hp} / ${h.max}</b> ОЗ · урон сверх облика переходит герою</span></div>
      <div class="three" style="margin-top:12px"><button type="button" class="ghost" data-a="hit">Урон −7</button><button type="button" class="ghost" data-a="mend">Лечение +5</button><button type="button" class="go soft" data-a="leave">Выйти</button></div>` : `
      <div class="row" style="margin-top:14px;align-items:flex-end"><div><span class="huge num">${s.left}</span><span class="of num">/ ${s.max}</span><div class="sub" style="margin-top:6px">${moon ? 'бонусным действием · ПО до 1' : 'действием · ПО до ¼, без плавания и полёта'} · до ${Math.floor(c.lvl/2)} ч</div></div>
        <div class="leaves">${Array.from({length:s.max},(_,i) => `<i class="leaf ${i < s.left ? '' : 'off'}"></i>`).join('')}</div></div>
      <div class="forms" style="margin-top:14px">${list.map((x,i) => `<button type="button" class="form" data-a="shape" data-i="${i}" ${s.left ? '' : 'disabled'}><b>${x[0]}</b><span class="stats"><span><span>ОЗ</span>${x[2]}</span><span><span>КД</span>${x[3]}</span><span><span>ПО</span>${x[1]}</span></span><span class="atk">${x[5]}</span></button>`).join('')}</div>`}
    </div>`; },
  bind(sec, h, c){ const s = h.st['wild' + c.lvl], list = this.forms[c.sub.includes('луны') ? 'moon' : 'land'];
    sec.onclick = e => { const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a;
      if (a === 'shape' && s.left) { s.left--; s.form = +el.dataset.i; s.hp = s.fmax = list[s.form][2]; buzz.medium(); toast('Облик: ' + list[s.form][0]); }
      if (a === 'hit') { s.hp -= 7; buzz.light(); if (s.hp <= 0) { const over = -s.hp; h.hp = Math.max(0, h.hp - over); s.form = null; toast(over ? `Облик сброшен · ${over} урона герою` : 'Облик сброшен'); renderSheetKeep(); return; } }
      if (a === 'mend') { s.hp = Math.min(s.fmax, s.hp + 5); buzz.light(); }
      if (a === 'leave') { s.form = null; buzz.light(); toast('Снова в облике героя'); }
      remount(() => replay($('#druid'), 'ev')); }; }
};

// Fighter · the accepted connected surface, now chamfered: Second Wind with
// its d10 and the healed result; Action Surge and Indomitable beside it.
CLASS.fighter = {
  html(h){ const s = st(h, 'f', () => ({wind:1, surge:1, indom:1, last:null, surgeOn:false}));
    return `<div class="inst cham" style="--acc:var(--a4)">
      <div class="inst-h"><span class="cap">Второе дыхание</span>${rest('short')}</div>
      <div class="row" style="margin-top:14px"><div><div class="big num">1к10 + 9</div><div class="sub" style="margin-top:6px">ОЗ бонусным действием · ${s.wind}/1</div></div>
        <button type="button" class="d10" id="d10" data-a="wind" ${s.wind ? '' : 'disabled'} aria-label="Бросить к10">${D10}<b>к10</b></button></div>
      ${s.last ? `<div class="result" style="margin-top:12px"><b class="num">+${s.last.heal}</b><span>ОЗ · к10 выпало ${s.last.roll}</span></div>` : ''}</div>
    <div class="two">
      <button type="button" class="cell2 cham" style="--acc:var(--a0);background:color-mix(in srgb,var(--a0) 13%,var(--low))" data-a="surge" ${s.surge ? '' : 'disabled'}><span class="cap">Всплеск действий</span><span class="big num">${s.surge}/1</span>
        <span class="sub">${s.surgeOn ? 'Ещё одно действие в этом ходу' : 'Дополнительное действие'}</span><span class="apips">${s.surgeOn ? '<i></i><i></i>' : '<i></i><i class="off"></i>'}</span></button>
      <button type="button" class="cell2 cham" style="--acc:var(--a2);background:color-mix(in srgb,var(--a2) 10%,var(--low))" data-a="indom" ${s.indom ? '' : 'disabled'}><span class="cap">Несгибаемый</span><span class="big num">${s.indom}/1</span><span class="sub">перебросить проваленный спасбросок</span><span class="sub">${icon('moon')}</span></button></div>
    <div class="lite critrow" style="--acc:var(--a2)"><span class="d20" style="--acc:var(--a2)">${D20}<b>19–20</b></span><div><b>Улучшенный критический удар</b><div class="sub">критическое попадание на 19 и 20 · Чемпион</div></div></div>`; },
  bind(sec, h){ const s = h.st.f;
    sec.onclick = e => { const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
      if (a === 'wind' && s.wind) { s.wind = 0; const r = rollDice(1, 10)[0]; s.last = {roll:r, heal:Math.min(h.max - h.hp, r + 9)}; h.hp += s.last.heal; buzz.medium();
        const d = $('#d10'); replay(d, 'roll'); setTimeout(() => { renderSheetKeep(); }, reduced ? 0 : 520); return; }
      if (a === 'surge' && s.surge) { s.surge = 0; s.surgeOn = true; buzz.medium(); toast('Всплеск действий: ещё одно действие'); }
      if (a === 'indom' && s.indom) { s.indom = 0; buzz.light(); toast('Несгибаемый: перебросьте спасбросок'); }
      remount(); }; }
};

// Monk · Ki. River stones of the pool; choosing a kata makes the stones it
// would cost breathe, and using it dissolves exactly those stones.
CLASS.monk = {
  katas: [['flurry','Шквал ударов',1,'Бонусное','два безоружных удара после атаки'],['patient','Терпеливая оборона',1,'Бонусное','Уклонение'],['step','Поступь ветра',1,'Бонусное','Рывок или Отход, прыжок ×2'],['stun','Оглушающий удар',1,'При попадании','Тел. Сл 14 — ошеломлён до конца твоего хода'],['whole','Целостность тела',0,'Действие','18 ОЗ · раз в длительный отдых']],
  html(h){ const s = st(h, 'ki', () => ({left:6, max:6, pick:null, whole:1})); const k = s.pick ? this.katas.find(x => x[0] === s.pick) : null, cost = k ? k[2] : 0;
    return `<div class="inst" style="--acc:var(--a2)" id="monk">

        <div class="chiprow" style="justify-content:flex-end"><span class="chipx">Боевые искусства <b>к6</b></span><span class="chipx">Скорость <b>+15</b> фт.</span></div></div>
      <div class="stones" style="margin-top:14px" id="stones">${Array.from({length:s.max},(_,i) => `<i class="stone ${i >= s.left ? 'off' : i >= s.left - cost ? 'pre' : ''}"></i>`).join('')}</div>
      <div class="katas" style="margin-top:14px">${this.katas.map(x => `<button type="button" class="kata" data-a="pick" data-k="${x[0]}" aria-pressed="${s.pick === x[0]}"><b>${x[1]}</b><span class="cost">${x[2] ? '<i></i>'.repeat(x[2]) + ' ' + x[2] + ' ци' : (x[0] === 'whole' ? s.whole + '/1' : 'без ци')} · ${x[3]}</span><span class="desc">${x[4]}</span></button>`).join('')}</div>
      <button type="button" class="go" style="margin-top:14px" data-a="use" ${k && s.left >= cost && (k[0] !== 'whole' || s.whole) ? '' : 'disabled'}>${k ? k[1] + (cost ? ' · ' + cost + ' ци' : '') : 'Выберите приём'}</button></div>`; },
  bind(sec, h){ const s = h.st.ki, me = this;
    sec.onclick = e => { const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a;
      if (a === 'pick') { s.pick = s.pick === el.dataset.k ? null : el.dataset.k; buzz.tick(); const x = $('.katas', sec).scrollLeft; remount(() => { $('.katas').scrollLeft = x; }); return; }
      if (a === 'use') { const k = me.katas.find(x => x[0] === s.pick); const pre = $$('#stones .pre', sec);
        if (k[0] === 'whole') { s.whole = 0; h.hp = Math.min(h.max, h.hp + 18); }
        s.left -= k[2]; buzz.light(); pre.forEach((st, i) => setTimeout(() => { st.classList.add('go-away'); buzz.tick(); }, i * 90));
        toast(k[1]); setTimeout(() => { s.pick = null; remount(); }, reduced ? 0 : 420 + pre.length * 90); } }; }
};

// Paladin · Lay on Hands. A vessel of healing: drag the handle to measure
// out how much to pour; the pour drains from the vessel. Smite picks its
// slot right in place; Divine Sense and the oath channel sit below.
CLASS.paladin = {

      ${s.smite ? `<div class="result" style="margin-top:10px;background:color-mix(in srgb,var(--a0) 16%,transparent)"><b class="num">${s.smite.total}</b><span>излучением · ${s.smite.rolls.join(' + ')}</span></div>` : ''}</div>
    <div class="two">
      <button type="button" class="cell2" style="--acc:var(--a4)" data-a="sense" ${s.sense ? '' : 'disabled'}><span class="cap">Божественное чувство</span><span class="eyes">${Array.from({length:4},(_,i) => `<i class="eye ${i < s.sense ? '' : 'off'}"></i>`).join('')}</span><span class="sub">действие · 60 фт. · до конца следующего хода</span></button>
      <div class="cell2" style="--acc:var(--a2)"><span class="cap">Канал · ${s.chan}/1</span><button type="button" class="chipx" data-a="weapon" ${s.chan ? '' : 'disabled'}>Священное оружие</button><button type="button" class="chipx" data-a="turn" ${s.chan ? '' : 'disabled'}>Изгнание нечестивых</button></div></div>`; },
  bind(sec, h){ const s = h.st.lay, vessel = $('#vessel', sec);
    sec.onclick = e => { const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a;
      if (a === 'heal' && s.left) { const n = Math.min(s.amt, s.left); vessel.classList.add('pour-now'); s.left -= n; buzz.light(); toast(`Наложение рук: +${n} ОЗ`); setTimeout(() => { s.amt = clamp(s.amt, 1, Math.max(1, s.left)); remount(); }, reduced ? 0 : 560); return; }
      if (a === 'cure' && s.left >= 5) { s.left -= 5; s.amt = clamp(s.amt, 1, Math.max(1, s.left)); buzz.light(); toast('Болезнь или яд излечены'); }

      if (a === 'smite') { const c = +el.dataset.c; h.slots[c].left--; const rolls = rollDice(c + 1 + (s.undead ? 1 : 0), 8); s.smite = {rolls, total:rolls.reduce((x,y) => x+y)}; buzz.medium(); renderPageKeep(); return; }
      if (a === 'sense' && s.sense) { s.sense--; buzz.light(); toast('Божественное чувство: нежить, исчадия, небожители рядом'); }
      if ((a === 'weapon' || a === 'turn') && s.chan) { s.chan = 0; buzz.light(); toast(a === 'weapon' ? 'Священное оружие: +3 к атакам, 1 минута' : 'Изгнание нечестивых: Сл 13'); }
      remount(); };
    if (!vessel || !s.left) return;
    let drag = false;
    const set = e => { const r = vessel.getBoundingClientRect(); const x = clamp(e.clientX - r.left, 0, r.width);
      const v = clamp(Math.round(s.left - x / r.width * s.max), 1, s.left);

};

  flow(dir){ if (reduced) return; const orbs = $('#orbs'), r = orbs.getBoundingClientRect(), a = $(dir === 'make' ? '#orbP' : '#orbS').getBoundingClientRect(), b = $(dir === 'make' ? '#orbS' : '#orbP').getBoundingClientRect();
    for (let i = 0; i < 5; i++) { const sp = document.createElement('i'); sp.className = 'spark'; orbs.appendChild(sp);
      const x0 = a.left + a.width/2 - r.left, y0 = a.top + a.height/2 - r.top, x1 = b.left + b.width/2 - r.left, y1 = b.top + b.height/2 - r.top;

    <div class="two"><div class="cell2" style="--acc:var(--a4)"><span class="cap">Книга</span><span class="big num">${Object.values(h.spell).filter(e => SPELLS[e.id].l > 0).length}</span><span class="sub">заклинаний · ${c.cap} к подготовке</span></div>
      <div class="cell2" style="--acc:var(--a1)"><span class="cap">Воплощение</span><b>Ваяние заклинаний</b><span class="sub">союзники вне области · Могущественный заговор</span></div></div>`; },
  bind(sec, h, c){ const s = h.st.rec, budget = Math.ceil(c.lvl / 2);
    sec.onclick = e => { const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a;

      if (a === 'pick') { if (s.done) return; const k = el.dataset.k, cc = +k.split('.')[0], i = s.pick.indexOf(k), sum = s.pick.reduce((t,x) => t + +x.split('.')[0], 0);

};

/* ---------- magic section ---------- */
function sources(h){ return h.classes.filter(c => c.list); }
function heroSpells(h){ return Object.entries(h.spell).map(([key, e]) => ({key, ...e, sp:SPELLS[e.id]})); }
function slotMarks(v, cls = ''){ return `<span class="marks">${Array.from({length:v.max},(_,i) => `<i class="mark ${cls} ${i < v.left ? '' : 'off'}"></i>`).join('')}</span>`; }
function magicHTML(h){
  const src = sources(h), all = heroSpells(h).filter(s => !s.arcanum);
  const circles = [...new Set(all.map(s => s.sp.l))].sort((a,b) => a-b);
  const castable = s => s.sp.l === 0 || (h.pact ? h.pact.left > 0 && s.sp.l <= h.pact.circle : Object.entries(h.slots || {}).some(([c,v]) => +c >= s.sp.l && v.left > 0));
  const row = s => {
    const c = h.classes.find(x => x.id === s.cls), prepCls = c.prep && s.sp.l > 0;
    const star = s.always ? `<span class="star lock" title="Всегда подготовлено">${icon('lock')}</span>` : prepCls ? `<button type="button" class="star ${s.prep ? 'on' : ''}" data-prep="${s.key}" aria-label="Подготовка">${icon('star')}</button>` : `<span class="star">${icon(s.sp.l ? 'bookmark' : 'spark')}</span>`;
    return `<div class="sp ${s.prep ? '' : 'unprep'}" style="--acc:${clsAcc(c)}">${star}<button type="button" class="st" data-spell="${s.key}"><b>${s.sp.n}<span class="badges">${s.sp.k ? '<i>К</i>' : ''}${s.sp.ri ? '<i>Р</i>' : ''}</span></b><span>${s.sp.s} · ${s.sp.t}${src.length > 1 ? ` · <span style="color:${clsAcc(c)}">${c.name}</span>` : ''}</span></button>
      <button type="button" class="cast ${s.prep && castable(s) ? '' : 'off'}" data-cast="${s.key}" aria-label="Наложить">${icon('wand')}</button></div>`;
  };
  const group = c => {
    const spells = all.filter(s => s.sp.l === c).sort((a,b) => (b.prep - a.prep) || a.sp.n.localeCompare(b.sp.n, 'ru'));
    const slot = c > 0 && h.slots && h.slots[c];
    const isOpen = open.has(String(c));
    const headA = c === 0 ? `<span class="cn">Заговоры<small>без ячеек</small></span><span class="marks"></span><span class="left">${spells.length}</span>`
      : `<span class="cn">${c} круг<small>${spells.filter(s => s.prep).length} ${plural(spells.filter(s => s.prep).length,'заклинание','заклинания','заклинаний')}</small></span>${vars.magic === 'a' && slot ? slotMarks(slot) + `<span class="left num">${slot.left}/${slot.max}</span>` : `<span class="marks"></span><span class="left">${spells.length}</span>`}`;
    return `<div class="circle ${isOpen ? 'open' : ''}" data-circle="${c}"><button type="button" class="circle-h" data-toggle="${c}">${headA}${icon('down','chev')}</button>
      <div class="reveal ${isOpen ? 'open' : ''}"><div><div class="spells">${spells.map(row).join('')}</div></div></div></div>`;
  };
  // Circles above the known spells (multiclass upcasting) still get a slot row in A.
  const slotOnly = h.slots ? Object.keys(h.slots).map(Number).filter(c => !circles.includes(c)) : [];
  const conc = h.conc ? SPELLS[h.conc.split('@')[0]] : null;
  return `<div class="sec-title">Магия<button type="button" class="btn tonal sm" data-act="almanac">${icon('book')} Альманах</button></div>
    ${conc ? `<div class="conc" id="conc">${icon('timer')}<b>Концентрация: ${conc.n}<small>${conc.d}</small></b><button type="button" class="btn sm" data-act="endconc">Прервать</button></div>` : ''}
    ${src.map(c => { const dc = 8 + pb(h) + c.mod, atk = pb(h) + c.mod; const prepN = heroSpells(h).filter(s => s.cls === c.id && s.sp.l > 0 && s.prep && !s.always).length;
      return `<div class="src">${src.length > 1 ? `<div class="src-head"><i style="background:${clsAcc(c)}"></i>${c.name} ${c.lvl}</div>` : ''}
        <div class="facts"><div class="fact"><small>${ABBR[c.ab]}</small><b>${fmt(c.mod)}</b></div><div class="fact"><small>СЛ СПАСА</small><b>${dc}</b></div><div class="fact"><small>АТАКА</small><b>${fmt(atk)}</b></div></div>
        ${c.prep ? `<div class="prep"><span>Подготовлено <b>${prepN} / ${c.cap}</b>${c.always ? ' · ещё ' + c.always.length + ' всегда' : ''}</span></div>` : `<div class="prep"><span>Известно <b>${heroSpells(h).filter(s => s.cls === c.id && s.sp.l > 0 && !s.arcanum).length}</b> · заговоров <b>${heroSpells(h).filter(s => s.cls === c.id && s.sp.l === 0).length}</b></span></div>`}</div>`; }).join('')}

function renderPageKeep(){ const y = $('#scroller').scrollTop; renderPage(); $('#scroller').scrollTop = y; }
function spendSlot(c, el){

function togglePrep(key){

/* ---------- casting: one sheet, an honest ladder of circles ---------- */
function castSheet(h, key, after){
  const s = h.spell[key], sp = SPELLS[s.id], c = h.classes.find(x => x.id === s.cls);
  if (!s.prep) return toast('Сначала подготовьте заклинание');

  let rungs = [];
  if (s.arcanum) rungs = [{k:'arc', label:'Арканум', v:'6 круг', left:h.arc[6].left}];
  else if (sp.l === 0) rungs = [];
  else if (h.pact) rungs = [{k:'pact', label:'Договор', v:h.pact.circle + ' круг', left:h.pact.left}];
  else rungs = Object.entries(h.slots).filter(([cc]) => +cc >= sp.l).map(([cc, v]) => ({k:cc, label:cc + ' круг', v:cc + ' круг', left:v.left}));
  if (sp.ri) rungs.push({k:'ritual', label:'Ритуал', v:'+10 мин', left:1});
  let pick = (rungs.find(r => r.left > 0 && r.k !== 'ritual') || rungs.find(r => r.left > 0) || {}).k;
  const conc = sp.k && h.conc && h.conc !== key ? SPELLS[h.conc.split('@')[0]] : null;
  openSheet(`<span class="bs-kicker">${sp.l ? sp.l + ' круг' : 'Заговор'} · ${sp.s}</span><h2 class="bs-title">${sp.n}</h2>
    <div class="facts"><div class="fact"><small>ИСТОЧНИК</small><b style="font-size:16px;color:${clsAcc(c)}">${c.name}</b></div><div class="fact"><small>СЛ СПАСА</small><b>${dc}</b></div><div class="fact"><small>АТАКА</small><b>${fmt(atk)}</b></div></div>
    ${rungs.length ? `<div><div class="muted" style="font-size:13px;margin-bottom:8px">Чем оплатить</div><div class="ladder" id="ladder">${rungs.map(r => `<button type="button" class="rung" data-k="${r.k}" aria-pressed="${r.k === pick}" ${r.left ? '' : 'disabled'}><small>${r.label}</small><b class="num">${r.k === 'ritual' ? 'Р' : r.left}</b><small>${r.k === 'ritual' ? r.v : 'осталось'}</small></button>`).join('')}</div></div>` : '<div class="note">' + icon('spark') + '<span>Заговор — без ячейки. Урон растёт с уровнем персонажа.</span></div>'}
    ${sp.h && rungs.length > 1 ? `<div class="note">${icon('spark')}<span id="upcast">${sp.h.slice(0, 160)}${sp.h.length > 160 ? '…' : ''}</span></div>` : ''}
    ${conc ? `<div class="note">${icon('timer')}<span>Сейчас концентрация на «${conc.n}». Новое заклинание её прервёт.</span></div>` : ''}
    <div class="grid2"><div class="cell"><small>ВРЕМЯ</small><b>${sp.t}</b></div><div class="cell"><small>ДИСТАНЦИЯ</small><b>${sp.r}</b></div></div>
    <button type="button" class="btn primary wide" id="castGo" style="height:54px">${icon('wand')} ${pick === 'ritual' ? 'Провести ритуал' : 'Наложить'}</button>`, {onOpen(sh, close){
      $$('.rung', sh).forEach(b => b.addEventListener('click', () => { pick = b.dataset.k; buzz.tick(); $$('.rung', sh).forEach(x => x.setAttribute('aria-pressed', x === b)); $('#castGo', sh).innerHTML = icon('wand') + ' ' + (pick === 'ritual' ? 'Провести ритуал' : 'Наложить'); }));
      $('#castGo', sh).addEventListener('click', () => {
        let paid = '';
        if (pick === 'arc') { h.arc[6].left--; paid = 'Арканум'; }
        else if (pick === 'pact') { h.pact.left--; paid = 'ячейка договора'; }
        else if (pick === 'ritual') paid = 'ритуал';
        else if (pick) { h.slots[pick].left--; paid = `ячейка ${pick} круга`; }
        if (sp.k) h.conc = key;
        buzz.light();
        close(0, () => { renderPageKeep(); toast(`${sp.n}${paid ? ' · ' + paid : ''}`); replay($('#conc'), 'pop'); after && after(); });
      });
    }});
}

/* ---------- spell details ---------- */

    <div class="pair">${owner && owner.prep && sp.l && !s.always ? `<button type="button" class="btn" id="dPrep">${s.prep ? 'Убрать из подготовки' : 'Подготовить'}</button>` : '<span></span>'}

/* ---------- Almanac: a screen of its own ---------- */
const alm = $('#alm');
let almState = {q:'', avail:'ok', circle:null};
function openAlmanac(){
  alm.innerHTML = `<div class="scroller" id="almScroll"><div class="alm-list" id="almList"></div></div>
    <div class="alm-top glass"><div class="alm-row"><button type="button" class="round" data-act="almback" aria-label="Назад">${icon('back')}</button><h3>Альманах</h3><span class="muted" style="font-size:12.5px" id="almCount"></span></div>
      <label class="search">${icon('search')}<input id="almQ" placeholder="Название, школа или «огонь»" autocomplete="off"></label>
      ${segHTML([['ok','Доступные'],['mine','В листе'],['all','Все']], almState.avail, 'almSeg')}
      <div class="circles" id="almC"><button type="button" data-c="" aria-pressed="${almState.circle === null}">Все</button>${['Заговоры',1,2,3,4,5,6].map((c,i) => `<button type="button" data-c="${i}" aria-pressed="${almState.circle === i}">${c}</button>`).join('')}</div></div>`;
  alm.hidden = false;
  const spring = new Spring(1, SPR.gentle, v => { alm.style.transform = `translateX(${v*100}%)`; sheet.style.transform = `translateX(${-v*0 - (1-v)*18}%) scale(${1 - (1-v)*.02})`; sheet.style.filter = `brightness(${1 - (1-v)*.3})`; });
  spring.set(1); spring.to(0, SPR.gentle); buzz.tick();
  alm.close = () => { spring.onRest = () => { if (spring.x >= .999) { alm.hidden = true; sheet.style.transform = ''; sheet.style.filter = ''; } }; spring.to(1, SPR.gentle); };
  segment($('#almSeg'), b => { almState.avail = b.dataset.v; renderAlm(); });
  $('#almQ').addEventListener('input', e => { almState.q = e.target.value; renderAlm(); });
  $$('#almC button').forEach(b => b.addEventListener('click', () => { almState.circle = b.dataset.c === '' ? null : +b.dataset.c; $$('#almC button').forEach(x => x.setAttribute('aria-pressed', x === b)); buzz.tick(); renderAlm(); }));
  alm.addEventListener('click', e => { if (e.target.closest('[data-act="almback"]')) alm.close(); const t = e.target.closest('[data-aspell]'); if (t) detailSheet(hero, t.dataset.aspell, true); });
  renderAlm();
}
function renderAlm(){
  const h = hero, q = almState.q.trim().toLowerCase();
  const mine = new Map(heroSpells(h).map(s => [s.id, s.key]));
  // Highest circle a class can learn by its own level (SRD 2014): full
  // casters ceil(lvl/2), half casters ceil(lvl/4) from level 2, pact up to 5.
  const maxCircle = c => c.id === 'paladin' || c.id === 'ranger' ? (c.lvl < 2 ? 0 : Math.ceil(c.lvl/4)) : c.id === 'warlock' ? Math.min(5, Math.ceil(c.lvl/2)) : Math.min(9, Math.ceil(c.lvl/2));
  const status = id => { if (mine.has(id)) return 'mine'; const sp = SPELLS[id]; const own = h.classes.filter(c => c.list && sp.cl.includes(c.id)); if (!own.length) return 'other'; return own.some(c => sp.l <= maxCircle(c)) ? 'ok' : 'later'; };
  let rows = Object.entries(SPELLS).map(([id, sp]) => ({id, sp, st:status(id)}));
  // «Доступные» — what the hero's own classes can take now; «Все» shows the
  // rest too, with an honest reason instead of hiding it.
  if (almState.avail === 'ok') rows = rows.filter(r => r.st === 'ok' || r.st === 'mine'); if (almState.avail === 'mine') rows = rows.filter(r => r.st === 'mine');
  if (almState.circle !== null) rows = rows.filter(r => r.sp.l === almState.circle);
  if (q) rows = rows.filter(r => (r.sp.n + ' ' + r.sp.s + ' ' + (r.sp.x || '')).toLowerCase().includes(q));
  rows.sort((a,b) => a.sp.l - b.sp.l || a.sp.n.localeCompare(b.sp.n, 'ru'));
  $('#almCount').textContent = rows.length + ' ' + plural(rows.length, 'заклинание', 'заклинания', 'заклинаний');
  let last = -1, html = '';
  rows.forEach(r => { if (r.sp.l !== last && !q) { html += `<div class="alm-h">${r.sp.l ? r.sp.l + ' круг' : 'Заговоры'}</div>`; last = r.sp.l; }
    html += `<button type="button" class="atile ${r.st === 'mine' ? 'mine' : ''}" data-aspell="${r.st === 'mine' ? mine.get(r.id) : r.id}"><span class="lv">${r.sp.l || '∞'}</span><span class="ft"><b>${r.sp.n}</b><span>${r.sp.s} · ${r.sp.t}${r.sp.k ? ' · К' : ''}${r.sp.ri ? ' · Р' : ''}</span></span><span class="st ${r.st === 'other' ? 'later' : r.st}">${r.st === 'mine' ? 'в листе' : r.st === 'ok' ? 'доступно' : r.st === 'later' ? 'позже' : 'не из списка'}</span></button>`; });
  $('#almList').innerHTML = html || '<div class="muted" style="text-align:center;padding:40px 0">Ничего не найдено</div>';
}

/* ---------- controls ---------- */
function controlsHTML(){
  return `<div class="opt"><span class="lbl">Герой</span><div class="heroes">${HEROES.map(h => `<button type="button" data-hero="${h.id}" aria-pressed="${h === hero}"><i style="background:var(--a${h.acc})"></i>${h.classes.map(c => c.name + ' ' + c.lvl).join(' / ')}</button>`).join('')}</div></div>
    <div class="opt"><span class="lbl">Ячейки в Магии</span>${segHTML([['a','A · в кругах'],['b','B · пульт']], vars.magic).replace('class="seg"','class="seg" data-var="magic"')}<span class="hint">A — отметки ячеек в заголовке своего круга, рядом с заклинаниями. B — отдельный пульт ячеек над списками.</span></div>
    <div class="opt"><span class="lbl">Палитра</span>${segHTML([['monokai','Monokai'],['dune','Rose of Dune'],['nord','Nord']], palette).replace('class="seg"','class="seg" data-var="palette"')}</div>
    <button type="button" class="toggle" id="rm" role="switch" aria-checked="${reduced}"><span class="switch"></span>Меньше движения</button>`;
}
function bindControls(root, closeSheet){
  $$('[data-hero]', root).forEach(b => b.addEventListener('click', () => { const i = HEROES.findIndex(h => h.id === b.dataset.hero); closeSheet && closeSheet(); if (!gal.hidden) hideGallery(); selectHero(i); }));
  $$('[data-var]', root).forEach(seg => segment(seg, b => { const k = seg.dataset.var, v = b.dataset.v; if (k === 'palette') { palette = v; applyPalette(v); return; } vars[k] = v; renderPageKeep(); }));
  $('#rm', root).addEventListener('click', e => { reduced = !reduced; e.currentTarget.setAttribute('aria-checked', reduced); document.documentElement.classList.toggle('reduce', reduced); });
}
/* ---------- gallery of all twelve classes, and the hero dock ---------- */
const TAG = {barbarian:'Ярость удержанием', bard:'Кости вдохновения — смахнуть', cleric:'Жрец и Друид · карусель', druid:'Облик зверя поверх героя',
  fighter:'Второе дыхание и к10', monk:'Камни ци и ката', paladin:'Сосуд наложения рук', ranger:'Прицел метки охотника',
  rogue:'Кости выходят из тени', sorcerer:'Сферы источника магии', warlock:'Печати договора', wizard:'Доска ячеек'};
const gal = $('#gal'), dock = $('#dock');
function galleryHTML(){
  return `<div class="gal-in"><span class="kick">Волна 2 · Магия</span><h2>Двенадцать классов</h2><p>У каждого класса — свой инструмент на вкладке Магии. Выберите героя; переключать можно и в доке снизу.</p>
    <div class="gtiles">${HEROES.map((h, i) => `<button type="button" class="gtile" style="--acc:var(--a${h.acc});--i:${i}" data-gi="${i}" aria-current="${h === hero}"><span class="n">${i + 1}</span>
      <span class="gi">${icon(h.glyph)}</span><b>${h.classes.map(c => c.name).join(' / ')}</b><span class="lv">${h.classes.map(c => c.lvl + ' · ' + c.sub).join(' / ')}</span><span class="tg">${TAG[h.id]}</span></button>`).join('')}</div></div>`;
}
function renderDock(){
  const i = HEROES.indexOf(hero);
  dock.innerHTML = `<button type="button" class="grid" data-d="grid" aria-pressed="${!gal.hidden}" aria-label="Все классы">${icon('grid')}</button>
    <button type="button" data-d="prev" aria-label="Предыдущий класс">${icon('back')}</button>
    <span class="dl"><b><i style="background:var(--a${hero.acc})"></i>${hero.classes.map(c => c.name).join(' / ')}</b><small>${i + 1} из ${HEROES.length}</small></span>
    <button type="button" data-d="next" aria-label="Следующий класс">${icon('fwd')}</button>`;
}
// Switching heroes slides the sheet a little in the direction of travel.
function selectHero(i, dir = 0){
  hero = HEROES[(i + HEROES.length) % HEROES.length]; clsIndex = 0; open.clear(); open.add('1');
  alm.hidden = true; sheet.style.transform = ''; sheet.style.filter = '';
  renderSheet(); renderDock(); buzz.tick();
  $('#controls').innerHTML = controlsHTML(); bindControls($('#controls'));
  if (dir && !reduced) sheet.animate([{transform:`translateX(${dir * 28}px)`, opacity:.4}, {transform:'none', opacity:1}], {duration:520, easing:springEasing(SPR.snappy, .52)});
}
function showGallery(){
  gal.innerHTML = galleryHTML(); gal.hidden = false; gal.scrollTop = 0; renderDock();
  if (!reduced) gal.animate([{opacity:0, transform:'scale(1.03)'}, {opacity:1, transform:'none'}], {duration:420, easing:springEasing(SPR.gentle, .42)});
}
function hideGallery(){
  renderDock();
  if (reduced) { gal.hidden = true; return; }
  gal.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'scale(1.04)'}], {duration:320, easing:'cubic-bezier(.3,0,.8,.15)'}).onfinish = () => { gal.hidden = true; renderDock(); };
  sheet.animate([{transform:'scale(.96)', opacity:.6}, {transform:'none', opacity:1}], {duration:560, easing:springEasing(SPR.gentle, .56)});
}
gal.addEventListener('click', e => { const t = e.target.closest('[data-gi]'); if (!t) return; selectHero(+t.dataset.gi); hideGallery(); });
dock.addEventListener('click', e => { if (dock.swiped) { dock.swiped = false; return; } const d = e.target.closest('[data-d]')?.dataset.d; if (!d) return; const i = HEROES.indexOf(hero);
  if (d === 'grid') { gal.hidden ? showGallery() : hideGallery(); buzz.tick(); return; }
  if (!gal.hidden) hideGallery();
  selectHero(i + (d === 'next' ? 1 : -1), d === 'next' ? 1 : -1); });
// A horizontal swipe along the dock flips through the heroes too.
{ let x0 = null; dock.addEventListener('pointerdown', e => { x0 = e.clientX; });
  dock.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) { dock.swiped = true; if (!gal.hidden) hideGallery(); selectHero(HEROES.indexOf(hero) + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); } }); }

$('#controls').innerHTML = controlsHTML(); bindControls($('#controls'));
$('#vbtn').addEventListener('click', () => openSheet(`<h2 class="bs-title">Варианты прототипа</h2>${controlsHTML()}`, {onOpen(sh, close){ bindControls(sh, close); }, onClose(){ $('#controls').innerHTML = controlsHTML(); bindControls($('#controls')); }}));
sheet.addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t && t.dataset.tab !== '2') toast('Эта вкладка — волна 1, здесь показана Магия'); if (e.target.closest('[data-act="dice"]')) toast('Броски кубов — волна 3'); });
addEventListener('resize', () => { if (xSpring && $('#stripWrap')) { xSpring.set(-clsIndex * $('#stripWrap').clientWidth); $('#stripWrap').fit(); } });
if (reduced) document.documentElement.classList.add('reduce');
applyPalette('monokai'); renderSheet(); showGallery();
</script>
</body>
</html>
