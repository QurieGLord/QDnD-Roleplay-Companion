<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>QDnD · Волна 2</title>
<style>
/* Wave 2 prototype: the Magic tab (class panels and their carousel,
   spellcasting, slots, spell lists), casting, spell details and the
   Almanac. Built on the accepted wave 0/1 language: fonts are the app's
   own, colours mirror AppPalettes, springs mirror AppMotion. */
@font-face{font-family:Rubik;font-weight:400;src:url(../../../assets/fonts/Rubik-Regular.ttf)}
@font-face{font-family:Rubik;font-weight:500;src:url(../../../assets/fonts/Rubik-Medium.ttf)}
@font-face{font-family:Rubik;font-weight:600;src:url(../../../assets/fonts/Rubik-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(../../../assets/fonts/Inter-Bold.ttf)}
:root{
  --page:#221f19; --surface:#2A2720; --fg:#FAF7F0; --muted:#c3bfb5; --low:#302D26; --cont:#3C382E;
  --high:#4C473C; --highest:#5E594B; --primary:#FE5685; --on-primary:#191512; --secondary:#66D9EF;
  --tertiary:#FD971F; --pc:#49313C; --sc:#314146; --tc:#473B2C; --outline:#79705B;
  --heal:#A6E22E; --a0:#FE5685; --a1:#FD971F; --a2:#FFD866; --a3:#A6E22E; --a4:#66D9EF; --a5:#AB9DF2;
  --display:Rubik,"Segoe UI",Roboto,system-ui,sans-serif; --body:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --r-md:12px; --r-lg:16px; --r-lgp:20px; --r-xl:28px; --r-xlp:32px;
  --e-snappy:cubic-bezier(.2,0,0,1); --e-gentle:cubic-bezier(.2,0,0,1); --d-snappy:450ms; --d-gentle:620ms;
  --e-standard:cubic-bezier(.2,0,0,1); --e-enter:cubic-bezier(.05,.7,.1,1); --e-exit:cubic-bezier(.3,0,.8,.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.reduce *,.reduce *::before,.reduce *::after{transition-duration:1ms!important;animation:none!important}

/* Stage */
.stage{min-height:100%;display:flex;gap:36px;align-items:flex-start;justify-content:center;padding:28px 16px}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:46px;overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 10px #12110e,0 30px 70px -20px rgba(0,0,0,.7);isolation:isolate}
.panel{width:340px;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.panel h1{font:600 30px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.panel p{margin:0;color:var(--muted);font-size:14px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lbl{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt .hint{font-size:12.5px;color:var(--muted)}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.heroes button{padding:8px 10px;border-radius:14px;background:var(--low);font:600 12.5px/1.2 var(--body);color:var(--muted);display:flex;gap:8px;align-items:center}
.heroes button i{width:8px;height:8px;border-radius:50%;flex:none}
.heroes button[aria-pressed="true"]{background:var(--sc);color:var(--fg)}
@media (max-width:760px){.stage{padding:0;display:block}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.panel{display:none}}
.vbtn{position:absolute;right:0;top:46%;z-index:40;width:34px;height:44px;border-radius:14px 0 0 14px;display:grid;place-items:center;opacity:.85}
.vbtn .icon{width:18px;height:18px}
@media (min-width:761px){.vbtn{display:none}}

/* Glass: only for layers floating over live content */
.glass{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 .7px 0 color-mix(in srgb,var(--fg) 14%,transparent),0 10px 30px -12px rgba(0,0,0,.55)}

/* Segments with a flowing indicator */
.seg{position:relative;display:flex;background:var(--low);border-radius:999px;padding:4px;isolation:isolate;max-width:100%}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--sc);z-index:-1}
.seg button{position:relative;flex:1;text-align:center;padding:9px 12px;border-radius:999px;font:600 13px/1.1 var(--body);color:var(--muted);white-space:nowrap;transition:color 240ms var(--e-snappy)}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.toggle{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--body);color:var(--muted)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--high);position:relative;transition:background-color 240ms var(--e-snappy);flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:999px;background:var(--muted);transition:left var(--d-snappy) var(--e-snappy),background-color 240ms}
.toggle[aria-checked="true"] .switch{background:var(--secondary)}
.toggle[aria-checked="true"] .switch::after{left:22px;background:var(--surface)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;font:600 14px/1 var(--body);
  background:var(--high);color:var(--fg);box-shadow:inset 0 0 0 100px transparent;transition:transform var(--d-snappy) var(--e-snappy),box-shadow 260ms var(--e-standard),opacity 200ms}
.btn:active{transform:scale(.975);box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--fg) 9%,transparent);transition:transform 160ms var(--e-standard),box-shadow 120ms}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:color-mix(in srgb,var(--secondary) 16%,var(--low))}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:18px;font:600 13px/1.2 var(--body);color:var(--muted);
  box-shadow:inset 0 0 0 1.4px var(--outline);transition:background-color 220ms,color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{border-radius:12px;background:var(--tc);color:var(--fg);box-shadow:none}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 8%,transparent);flex:none;transition:transform var(--d-snappy) var(--e-snappy)}
.round:active{transform:scale(.92)}

/* App layers */
.layer{position:absolute;inset:0;overflow:hidden}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.topbar{position:absolute;left:0;right:0;top:0;z-index:20;padding:8px 14px 10px;display:flex;align-items:center;gap:10px}
.tb-hav{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none}
.tb-hav .icon{width:17px;height:17px}
.tb-title{font:600 17px/1.2 var(--display);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmhp{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:78px}
.cmhp b{font:600 14px/1 var(--display);font-variant-numeric:tabular-nums}
.mini-hp{height:4px;width:100%;border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.mini-hp i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.island-wrap{position:absolute;left:0;right:0;top:58px;z-index:19;padding:6px 14px 10px}
.island{position:relative;display:flex;padding:6px;border-radius:999px;isolation:isolate}
.island .ind{position:absolute;top:6px;bottom:6px;border-radius:999px;z-index:-1;background:color-mix(in srgb,var(--secondary) 24%,color-mix(in srgb,var(--surface) 40%,transparent))}
.island button{flex:1;height:50px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.island button[aria-selected="true"]{color:var(--fg)}
.island button[aria-selected="true"] .icon{transform:scale(1.1)}
.page{padding:150px 16px 120px;display:flex;flex-direction:column;gap:14px}
.sec-title{font:600 20px/1.2 var(--display);letter-spacing:-.015em;margin:8px 2px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title small{font:500 13px/1 var(--body);color:var(--muted)}
.muted{color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:60;padding:13px 16px;border-radius:var(--r-lgp);font-size:14px;
  transform:translateY(30px);opacity:0;transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms;pointer-events:none}
.toast.show{transform:none;opacity:1}

/* Class carousel: a flowing class switch and panels that follow the finger */
.cls-switch .seg button{display:flex;align-items:center;justify-content:center;gap:7px}
.cls-switch .lvl{font:600 12px/1 var(--display);opacity:.8}
.strip-wrap{position:relative;overflow:hidden;touch-action:pan-y;transition:height 420ms var(--e-standard);margin:0 -16px}
.strip{display:flex;align-items:flex-start;will-change:transform}
.cpanel{flex:0 0 100%;padding:0 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.chead h2{font:600 28px/1.05 var(--display);letter-spacing:-.025em;margin:0}
.chead>div{flex:1;min-width:0}
.chead .sub{display:block;font:600 13.5px/1.3 var(--body);color:var(--secondary);margin-top:6px}
.chead .sub .icon{width:15px;height:15px;vertical-align:-3px}
.lvchip{font:600 12.5px/1 var(--body);padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--muted);flex:none}
.lvchip b{color:var(--fg);font-family:var(--display)}

/* Shared class module language */
.mod{position:relative;border-radius:var(--r-xl);padding:16px;overflow:hidden;background:var(--low);isolation:isolate}
.mod .glow{position:absolute;inset:-50% -25% auto auto;width:80%;height:170%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 26%,transparent),transparent 72%);opacity:.7;transition:opacity 500ms,transform 700ms var(--e-gentle)}
.mod-title{font:600 18px/1.2 var(--display);letter-spacing:-.01em}
.mod-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font:600 15px/1 var(--display);font-variant-numeric:tabular-nums;padding:7px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.count.big{font-size:32px;padding:0;background:none;letter-spacing:-.02em}
.foot{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:10px}
.foot .icon{width:14px;height:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:var(--r-lgp);padding:14px;background:var(--low);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform var(--d-snappy) var(--e-snappy)}
.mini:active{transform:scale(.98)}
.mini b{font:600 15px/1.2 var(--display)}
.mini .v{font:600 26px/1 var(--display);font-variant-numeric:tabular-nums}
.marks{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mark{width:14px;height:14px;border-radius:50%;background:var(--acc,var(--secondary));box-shadow:inset 0 0 0 0 transparent;
  transition:background-color 260ms,box-shadow 260ms,transform var(--d-snappy) var(--e-snappy)}
.mark.off{background:transparent;box-shadow:inset 0 0 0 1.8px var(--outline);transform:scale(.86)}
.mark.lg{width:18px;height:18px}
.action{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:24px;font:600 14.5px/1 var(--body);width:100%;
  background:color-mix(in srgb,var(--acc) 22%,var(--cont));transition:transform var(--d-snappy) var(--e-snappy),background-color 300ms}
.action:active{transform:scale(.975)}
.action[disabled]{opacity:.45;pointer-events:none}
.die{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy)}
.die svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.die .face{fill:color-mix(in srgb,var(--acc) 20%,var(--cont));stroke:var(--acc);stroke-width:3;stroke-linejoin:round}
.die .facet{fill:none;stroke:color-mix(in srgb,var(--acc) 50%,transparent);stroke-width:2}
.die b{position:relative;font:600 15px/1 var(--display)}
.die:active{transform:scale(.94)}
.list{border-radius:var(--r-xl);background:var(--low);padding:6px}
.frow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;width:100%;transition:background-color 160ms}
.frow:active{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.frow .ficon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,var(--cont));color:var(--acc);flex:none}
.frow .ficon .icon{width:18px;height:18px}
.frow .ft{flex:1;min-width:0}
.frow .ft b{display:block;font:600 15px/1.25 var(--body)}
.frow .ft span{font-size:12.5px;color:var(--muted)}
.frow .chev{color:var(--muted);width:18px;height:18px}
.frow .cost{font:600 12px/1 var(--body);padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--fg);flex:none}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12px/1 var(--body);padding:7px 11px;border-radius:999px;color:var(--muted);box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--fg) 14%,transparent)}
.tag.on{color:var(--fg);background:color-mix(in srgb,var(--acc) 18%,transparent);box-shadow:none}
.pop{animation:pop 520ms var(--e-snappy)}
@keyframes pop{30%{transform:scale(1.04)}100%{transform:none}}
.flash::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--acc);animation:fade 700ms var(--e-exit) forwards;pointer-events:none}
@keyframes fade{from{opacity:1}to{opacity:0}}
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--d-gentle) var(--e-standard),opacity 180ms var(--e-exit)}
.reveal>div{overflow:hidden;min-height:0}
.reveal.open{grid-template-rows:1fr;opacity:1;transition:grid-template-rows var(--d-gentle) var(--e-standard),opacity 300ms var(--e-enter) 80ms}

/* Class instruments: one cohesive surface per class, its own gesture and
   shape drawn from the mechanic, large numbers, one expressive event. */
.inst{position:relative;border-radius:30px;padding:18px;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 15%,var(--low)) 0%,var(--low) 72%);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 8%,transparent),0 20px 40px -28px rgba(0,0,0,.75)}
.inst-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.cap{font:600 11.5px/1.1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--acc) 72%,var(--fg))}
.rest{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--body);color:var(--muted);padding:7px 10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);flex:none}
.rest .icon{width:14px;height:14px}
.huge{font:600 60px/.92 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.of{font:500 22px/1 var(--display);color:var(--muted);margin-left:6px}
.big{font:600 34px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{font-size:12.5px;line-height:1.35;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative}
.stack{display:flex;flex-direction:column;gap:12px}
.lite{border-radius:24px;padding:14px 16px;background:var(--low);position:relative;overflow:hidden}
.lite b{font:600 15px/1.25 var(--body)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell2{border-radius:22px;padding:14px;background:var(--low);display:flex;flex-direction:column;gap:6px;text-align:left;position:relative;overflow:hidden;
  transition:transform var(--d-snappy) var(--e-snappy),background-color 300ms}
.cell2:active{transform:scale(.97)}
.cell2 b{font:600 15px/1.2 var(--body)}
.cell2[disabled]{opacity:.5}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;width:100%;font:600 15px/1 var(--body);position:relative;overflow:hidden;
  background:var(--acc);color:color-mix(in srgb,var(--surface) 88%,black);transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms,background-color 300ms}
.go:active{transform:scale(.975)}
.go[disabled]{opacity:.4;pointer-events:none}
.go.soft{background:color-mix(in srgb,var(--acc) 22%,var(--cont));color:var(--fg)}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font:600 14px/1 var(--body);background:color-mix(in srgb,var(--fg) 7%,transparent);transition:transform var(--d-snappy) var(--e-snappy)}
.ghost:active{transform:scale(.97)}
.swrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:left}
.swrow .ft{flex:1}
.swrow b{display:block;font:600 14.5px/1.25 var(--body)}
.swrow span.sub{display:block}
.swrow[aria-checked="true"] .switch{background:var(--acc)}
.swrow[aria-checked="true"] .switch::after{left:22px;background:var(--surface)}
.ev{animation:ev 640ms var(--e-snappy)}
@keyframes ev{25%{transform:scale(1.025)}100%{transform:none}}

/* Barbarian: claws for uses; hold the bar to rage; heat floods in once */
.barb .heat{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity 700ms var(--e-standard);
  background:radial-gradient(110% 70% at 85% -10%,color-mix(in srgb,var(--a0) 55%,transparent),transparent 62%),radial-gradient(80% 60% at 0% 110%,color-mix(in srgb,var(--a1) 40%,transparent),transparent 60%)}
.barb.on .heat{opacity:1}
.barb.on{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a0) 70%,transparent),0 20px 44px -24px color-mix(in srgb,var(--a0) 60%,black)}
.barb.flare{animation:flare 820ms var(--e-snappy)}
@keyframes flare{0%{transform:scale(.985)}30%{transform:scale(1.02);filter:brightness(1.25)}100%{transform:none;filter:none}}
.claws{display:flex;gap:10px;align-items:flex-end;padding-right:6px}
.claw{width:12px;height:52px;border-radius:7px;transform:skewX(-16deg);background:linear-gradient(180deg,var(--a1),var(--a0));transition:background 300ms,box-shadow 300ms,height 400ms var(--e-snappy)}
.claw:nth-child(2){height:60px}
.claw.off{background:transparent;box-shadow:inset 0 0 0 2px var(--outline)}
.hold{position:relative;height:60px;border-radius:30px;width:100%;overflow:hidden;background:color-mix(in srgb,var(--fg) 8%,transparent);font:600 15px/1 var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
.hold .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--a1),var(--a0))}
.hold span{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:100%}
.hold[disabled]{opacity:.4}
.effects{display:flex;flex-direction:column;gap:6px}
.eff{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-radius:16px;padding:10px 12px;background:color-mix(in srgb,var(--fg) 5%,transparent);transition:opacity 400ms,background-color 400ms}
.eff b{font:600 13.5px/1.2 var(--body);flex:none}
.eff span{font-size:12px;color:var(--muted);line-height:1.3;text-align:right}
.barb:not(.on) .eff{opacity:.45}
.barb.on .eff{background:color-mix(in srgb,var(--a0) 14%,transparent)}
.rounds{display:flex;align-items:center;gap:12px}
.rounds .rd{flex:1;text-align:center}
.rounds .rd b{display:block;font:600 26px/1 var(--display)}
.pip{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 8%,transparent);font:600 22px/1 var(--display)}
.warn{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--a1) 16%,transparent);font-size:13px}

/* Bard: rhythm lines; a tray of d8 tokens — flick one up to inspire */
.bard .waves{position:absolute;left:0;right:0;top:40px;height:120px;z-index:-1;opacity:.45;pointer-events:none}
.bard .waves path{fill:none;stroke:var(--a0);stroke-width:1.6;stroke-linecap:round}
.bard .waves path:nth-child(2){stroke:var(--a5);opacity:.8}
.bard .waves path:nth-child(3){stroke:var(--a4);opacity:.6}
.bard.sing .waves path{animation:sing 1200ms var(--e-standard)}
@keyframes sing{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
.tray{display:flex;gap:8px}
.tok{width:46px;height:52px;position:relative;display:grid;place-items:center;touch-action:none;transition:transform var(--d-snappy) var(--e-snappy),opacity 300ms}
.tok svg{position:absolute;inset:0;width:100%;height:100%}
.tok .face{fill:color-mix(in srgb,var(--a0) 28%,var(--cont));stroke:var(--a0);stroke-width:3;stroke-linejoin:round}
.tok .fac{fill:none;stroke:color-mix(in srgb,var(--a0) 55%,transparent);stroke-width:2}
.tok b{position:relative;font:600 12px/1 var(--display)}
.tok.off .face{fill:transparent;stroke:var(--outline)}
.tok.off .fac,.tok.off b{opacity:.35}
.tok.fly{transition:transform 620ms var(--e-enter),opacity 620ms;transform:translate(40px,-150px) rotate(40deg) scale(.6)!important;opacity:0}
.ticket{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--a0) 12%,transparent);font-size:13px;animation:ev 520ms var(--e-snappy)}
.ticket b{flex:1;font-weight:600}
.ticket button{font:600 12.5px/1 var(--body);color:var(--a0)}

/* Cleric: a sun of Channel Divinity; the rays turn to the chosen way */
.sun{position:relative;width:148px;height:148px;flex:none;display:grid;place-items:center}
.sun svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sun .rays{transform-origin:74px 74px;transition:transform 700ms var(--e-snappy)}
.sun .rays line{stroke:var(--a2);stroke-width:3;stroke-linecap:round;opacity:.22;transition:opacity 400ms}
.sun .rays line.hi{opacity:1}
.sun .core{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--a2) 55%,var(--cont)),color-mix(in srgb,var(--a2) 18%,var(--cont)));box-shadow:0 0 0 6px color-mix(in srgb,var(--a2) 14%,transparent),0 12px 30px -12px color-mix(in srgb,var(--a2) 60%,black)}
.sun .core b{display:block;font:600 34px/1 var(--display)}
.sun .core span{font-size:11px;color:color-mix(in srgb,var(--fg) 80%,transparent)}
.sun.dim .core{background:color-mix(in srgb,var(--fg) 7%,var(--cont));box-shadow:none}
.sun.dim .rays line{opacity:.12}
.sun.burst .rays{animation:burst 900ms var(--e-exit)}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.35);opacity:.2}100%{transform:scale(1)}}
.ways{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.way{padding:12px;border-radius:18px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:left;transition:background-color 260ms,box-shadow 260ms,transform var(--d-snappy) var(--e-snappy)}
.way b{display:block;font:600 14px/1.2 var(--body)}
.way span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.way[aria-pressed="true"]{background:color-mix(in srgb,var(--a2) 20%,var(--cont));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a2) 65%,transparent)}
.way:active{transform:scale(.98)}

/* Druid: an organic shape that morphs between the hero and the beast */
.druid .blob{position:absolute;z-index:-1;width:260px;height:240px;right:-70px;top:-80px;opacity:.55;
  background:radial-gradient(circle at 40% 40%,color-mix(in srgb,var(--a3) 60%,transparent),color-mix(in srgb,var(--a3) 10%,transparent) 70%);
  border-radius:42% 58% 55% 45%/48% 42% 58% 52%;transition:border-radius 900ms var(--e-gentle),transform 900ms var(--e-gentle),opacity 600ms}
.druid.beast .blob{border-radius:64% 36% 30% 70%/58% 30% 70% 42%;transform:translate(-60px,40px) rotate(28deg) scale(1.25);opacity:.75}
.leaves{display:flex;gap:6px}
.leaf{width:26px;height:38px;border-radius:0 100% 0 100%;background:linear-gradient(160deg,var(--a3),color-mix(in srgb,var(--a3) 50%,var(--a4)));transform:rotate(-12deg);transition:background 300ms,box-shadow 300ms}
.leaf.off{background:transparent;box-shadow:inset 0 0 0 2px var(--outline)}
.forms{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.forms::-webkit-scrollbar{display:none}
.form{flex:0 0 172px;scroll-snap-align:start;border-radius:22px;padding:14px;background:color-mix(in srgb,var(--fg) 6%,transparent);text-align:left;display:flex;flex-direction:column;gap:8px;
  transition:transform var(--d-snappy) var(--e-snappy)}
.form:active{transform:scale(.97)}
.form b{font:600 16px/1.2 var(--display)}
.form .stats{display:flex;gap:10px;font:600 13px/1 var(--display)}
.form .stats span{color:var(--muted);font:500 11px/1 var(--body);display:block;margin-bottom:3px}
.form .atk{font-size:12px;color:var(--muted);line-height:1.3}
.form[disabled]{opacity:.45}
.hpbar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a3),color-mix(in srgb,var(--a3) 60%,var(--a2)));transition:width 500ms var(--e-snappy)}
.heroline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--fg) 5%,transparent);font-size:12.5px;color:var(--muted)}
.heroline b{color:var(--fg);font-family:var(--display)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Fighter: a faceted, chamfered surface; d10 and its result */
.cham{clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.cham.inst,.cham.cell2{border-radius:6px}
.d10{width:76px;height:84px;position:relative;display:grid;place-items:center;flex:none;transition:transform var(--d-snappy) var(--e-snappy)}
.d10 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.d10 .face{fill:color-mix(in srgb,var(--a4) 28%,var(--cont));stroke:var(--a4);stroke-width:3;stroke-linejoin:round}
.d10 .fac{fill:none;stroke:color-mix(in srgb,var(--a4) 55%,transparent);stroke-width:2}
.d10 b{position:relative;font:600 16px/1 var(--display)}
.d10:active{transform:scale(.93)}
.d10[disabled]{opacity:.4}
.d10.roll{animation:roll 640ms var(--e-snappy)}
@keyframes roll{0%{transform:rotate(0)}60%{transform:rotate(380deg) scale(1.08)}100%{transform:rotate(360deg)}}
.result{display:flex;align-items:baseline;gap:8px;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--heal) 16%,transparent);font-size:13px;animation:ev 520ms var(--e-snappy)}
.result b{font:600 22px/1 var(--display)}
.apips{display:flex;gap:6px;margin-top:2px}
.apips i{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);background:var(--a0)}
.apips i.off{background:transparent;box-shadow:inset 0 0 0 2px var(--outline)}
.critrow{display:flex;align-items:center;gap:12px}
.d20{width:48px;height:52px;position:relative;display:grid;place-items:center;flex:none}
.d20 svg{position:absolute;inset:0;width:100%;height:100%}
.d20 .face{fill:color-mix(in srgb,var(--a2) 22%,var(--cont));stroke:var(--a2);stroke-width:3;stroke-linejoin:round}
.d20 b{position:relative;font:600 13px/1 var(--display)}

/* Monk: river stones of ki; kata cards preview their price */
.stones{display:flex;gap:8px;flex-wrap:wrap}
.stone{width:38px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--a2) 85%,white),var(--a2) 55%,color-mix(in srgb,var(--a2) 60%,black));
  box-shadow:0 6px 12px -6px rgba(0,0,0,.6);transition:transform 420ms var(--e-snappy),opacity 420ms,background 300ms,box-shadow 300ms}
.stone.off{background:transparent;box-shadow:inset 0 0 0 2px var(--outline);transform:scale(.8)}
.stone.pre{animation:breathe 1200ms ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-4px);box-shadow:0 0 0 4px color-mix(in srgb,var(--a2) 35%,transparent)}}
.stone.go-away{transform:scale(.2) translateY(-20px);opacity:0}
.katas{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.katas::-webkit-scrollbar{display:none}
.kata{flex:0 0 150px;scroll-snap-align:start;border-radius:20px;padding:12px;background:color-mix(in srgb,var(--fg) 6%,transparent);text-align:left;display:flex;flex-direction:column;gap:6px;
  transition:background-color 260ms,box-shadow 260ms,transform var(--d-snappy) var(--e-snappy)}
.kata b{font:600 14px/1.2 var(--body)}
.kata .cost{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.kata .cost i{width:12px;height:10px;border-radius:50%;background:var(--a2)}
.kata .desc{font-size:12px;color:var(--muted);line-height:1.3}
.kata[aria-pressed="true"]{background:color-mix(in srgb,var(--a2) 20%,var(--cont));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a2) 65%,transparent)}
.kata:active{transform:scale(.97)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--body);padding:8px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.chipx b{font-family:var(--display)}

/* Paladin: a vessel of healing; drag the handle to measure out */
.vessel{position:relative;height:64px;border-radius:32px;background:color-mix(in srgb,var(--fg) 7%,transparent);overflow:hidden;touch-action:none;cursor:ew-resize}
.vessel .liquid{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 55%,var(--cont)),color-mix(in srgb,var(--a2) 55%,var(--cont)));transition:width 500ms var(--e-snappy)}
.vessel .pour{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--heal) 70%,transparent) 0 8px,color-mix(in srgb,var(--heal) 50%,transparent) 8px 16px)}
.vessel .handle{position:absolute;top:8px;bottom:8px;width:6px;margin-left:-3px;border-radius:3px;background:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--fg) 20%,transparent)}
.vessel .vlab{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding:0 18px;font:600 12.5px/1 var(--body);color:var(--fg);pointer-events:none;mix-blend-mode:normal}
.vessel.pour-now .pour{transition:width 600ms var(--e-exit),opacity 600ms;opacity:0}
.smites{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.smt{border-radius:20px;padding:12px;background:color-mix(in srgb,var(--fg) 6%,transparent);text-align:left;transition:transform var(--d-snappy) var(--e-snappy),background-color 200ms}
.smt small{display:block;font:600 11px/1 var(--body);letter-spacing:.06em;color:var(--muted)}
.smt b{display:block;font:600 26px/1.1 var(--display);margin:4px 0}
.smt span{font-size:11.5px;color:var(--muted)}
.smt:active{transform:scale(.96);background:color-mix(in srgb,var(--a0) 22%,var(--cont))}
.smt[disabled]{opacity:.35}
.eyes{display:flex;gap:6px}
.eye{width:22px;height:14px;border-radius:50%/50%;background:var(--a4);position:relative}
.eye::after{content:"";position:absolute;inset:3px 7px;border-radius:50%;background:var(--surface)}
.eye.off{background:transparent;box-shadow:inset 0 0 0 1.6px var(--outline)}
.eye.off::after{display:none}

/* Ranger: a scope that locks onto the marked target */
.scope{width:118px;height:118px;flex:none;overflow:visible}
.scope circle{fill:none;stroke:var(--a3);transition:r 600ms var(--e-snappy),opacity 400ms,stroke-width 400ms}
.scope .r1{stroke-width:2;opacity:.35}
.scope .r2{stroke-width:2;opacity:.55}
.scope .r3{stroke-width:3}
.scope .cross{stroke:var(--a3);stroke-width:2.5;stroke-linecap:round;transform-origin:59px 59px;transition:transform 700ms var(--e-snappy),opacity 400ms;opacity:.35}
.scope.lock .cross{transform:rotate(45deg);opacity:1}
.scope .dot{fill:var(--a0);opacity:0;transition:opacity 300ms 300ms}
.scope.lock .dot{opacity:1}
.scope.lock .r1{opacity:.15}
.tname{font:600 22px/1.15 var(--display);letter-spacing:-.01em}
.tname .icon{width:20px;height:20px;vertical-align:-2px;color:var(--acc)}
.used{font:600 11.5px/1 var(--body);padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--muted)}

/* Rogue: overlapping shadow planes; the dice come out of the shadow */
.rogue .plane{position:absolute;z-index:-1;border-radius:30px;background:color-mix(in srgb,var(--a4) 12%,transparent);transition:transform 700ms var(--e-gentle)}
.rogue .p1{inset:30% -20% -30% 35%;transform:rotate(-14deg)}
.rogue .p2{inset:55% 30% -40% -25%;transform:rotate(9deg);background:color-mix(in srgb,var(--a5) 10%,transparent)}
.rogue.armed .p1{transform:rotate(-6deg) translate(-20px,-10px)}
.rogue.armed .p2{transform:rotate(2deg) translate(10px,-10px)}
.d6s{display:flex;gap:8px}
.d6{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:600 20px/1 var(--display);
  background:color-mix(in srgb,var(--a4) 22%,var(--cont));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a4) 65%,transparent);
  transform:translateY(10px);filter:brightness(.55) saturate(.4);transition:transform 520ms var(--e-snappy),filter 520ms}
.rogue.armed .d6{transform:none;filter:none}
.rogue.armed .d6:nth-child(2){transition-delay:70ms}
.rogue.armed .d6:nth-child(3){transition-delay:140ms}
.d6 .pipdots{font-size:10px;letter-spacing:2px;color:var(--a4)}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:left;width:100%}
.chk .box{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--outline);flex:none;transition:background-color 200ms,box-shadow 200ms}
.chk .box .icon{width:16px;height:16px;opacity:0;color:var(--on-primary)}
.chk[aria-checked="true"] .box{background:var(--a4);box-shadow:none}
.chk[aria-checked="true"] .box .icon{opacity:1}
.chk.bad[aria-checked="true"] .box{background:var(--a0)}
.chk b{font:600 14px/1.2 var(--body);flex:1}
.cun{display:flex;gap:6px}
.cun button{flex:1;padding:12px 6px;border-radius:16px;background:color-mix(in srgb,var(--fg) 6%,transparent);font:600 13px/1.1 var(--body);text-align:center;transition:background-color 220ms}
.cun button[aria-pressed="true"]{background:color-mix(in srgb,var(--a4) 24%,var(--cont))}

/* Sorcerer: two orbs joined by a channel; magic flows either way */
.orbs{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:6px}
.orb{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;text-align:center;background:color-mix(in srgb,var(--fg) 6%,transparent);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 40%,transparent)}
.orb .lvl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,color-mix(in srgb,var(--acc) 70%,var(--cont)),color-mix(in srgb,var(--acc) 35%,var(--cont)));transition:height 600ms var(--e-snappy)}
.orb .lvl::before{content:"";position:absolute;left:-10%;right:-10%;top:-6px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--acc) 50%,var(--cont))}
.orb div{position:relative}
.orb b{display:block;font:600 40px/1 var(--display)}
.orb span{font-size:11.5px;color:var(--fg);opacity:.85}
.orb.slots{--acc:var(--a5)}
.chan{display:flex;flex-direction:column;gap:8px;align-items:center;position:relative}
.chan button{width:52px;height:44px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 22%,var(--cont));transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms}
.chan button:active{transform:scale(.92)}
.chan button[disabled]{opacity:.35}
.chan small{font:600 11px/1 var(--body);color:var(--muted)}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--a1);box-shadow:0 0 12px var(--a1);pointer-events:none;z-index:3}
.mm{display:flex;gap:8px}
.mm button{flex:1;border-radius:18px;padding:12px;background:color-mix(in srgb,var(--fg) 6%,transparent);text-align:left;transition:transform var(--d-snappy) var(--e-snappy)}
.mm button:active{transform:scale(.97)}
.mm b{display:block;font:600 14px/1.2 var(--body)}
.mm span{font-size:12px;color:var(--muted)}

/* Warlock: pact sigils in a triangle; the Arcanum is a sealed page */
.sigils{display:flex;justify-content:center;gap:14px;margin:6px 0 2px}
.sigil{width:74px;height:82px;position:relative;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy),opacity 400ms,filter 400ms}
.sigil:nth-child(2){transform:translateY(-14px)}
.sigil svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sigil .face{fill:color-mix(in srgb,var(--a5) 30%,var(--cont));stroke:var(--a5);stroke-width:3;stroke-linejoin:round}
.sigil .rune{fill:none;stroke:color-mix(in srgb,var(--a5) 70%,var(--fg));stroke-width:2;stroke-linecap:round;opacity:.18}
.sigil b{position:relative;font:600 22px/1 var(--display)}
.sigil small{position:relative;display:block;font:500 10px/1 var(--body);color:var(--muted);margin-top:2px}
.sigil.off .face{fill:transparent;stroke:var(--outline);stroke-dasharray:6 5}
.sigil.off .rune{opacity:.15}
.sigil.off b{color:var(--muted)}
.sigil.crack{animation:crack 600ms var(--e-exit)}
@keyframes crack{30%{transform:scale(1.12) rotate(-6deg)}100%{transform:none}}
.seal{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 26px/1 var(--display);
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--a0) 70%,var(--cont)),color-mix(in srgb,var(--a0) 30%,var(--cont)));box-shadow:0 0 0 5px color-mix(in srgb,var(--a0) 16%,transparent)}
.seal.off{background:color-mix(in srgb,var(--fg) 6%,var(--cont));box-shadow:none;color:var(--muted)}
.blast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--fg) 5%,transparent)}
.blast .ft{flex:1}
.blast b{display:block;font:600 14.5px/1.2 var(--body)}
.beams{display:flex;gap:4px;margin-top:6px}
.beams i{width:22px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--a5),var(--a0))}

/* Wizard: a board of slots; spent cells gather into a recovery */
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:10px}
.brow small{width:54px;font:600 12px/1 var(--body);color:var(--muted)}
.cells{display:flex;gap:8px;flex-wrap:wrap}
.cellb{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,color-mix(in srgb,var(--a4) 70%,var(--cont)),color-mix(in srgb,var(--a4) 35%,var(--cont)));
  transition:background 300ms,box-shadow 300ms,transform var(--d-snappy) var(--e-snappy)}
.cellb.spent{background:transparent;box-shadow:inset 0 0 0 2px var(--outline)}
.cellb.sel{background:color-mix(in srgb,var(--a2) 22%,transparent);box-shadow:inset 0 0 0 2px var(--a2)}
.cellb:active{transform:scale(.9)}
.cellb.big6{opacity:.35}
.meter{display:flex;gap:4px;width:120px}
.meter i{flex:1;height:10px;border-radius:5px;background:color-mix(in srgb,var(--fg) 9%,transparent);transition:background-color 260ms}
.meter i.on{background:var(--a2)}
.board.ripple .cellb:not(.spent){animation:ev 520ms var(--e-snappy)}

/* Gallery of all twelve classes and the hero dock */
.gal{position:absolute;inset:0;z-index:35;background:var(--surface);overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.gal::-webkit-scrollbar{display:none}
.gal[hidden]{display:none}
.gal-in{padding:54px 16px 112px}
.gal .kick{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--tertiary)}
.gal h2{font:600 34px/1.02 var(--display);letter-spacing:-.03em;margin:10px 0 8px}
.gal p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.4}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gtile{--acc:var(--a0);position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:14px;min-height:156px;text-align:left;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 22%,var(--low)) 0%,var(--low) 78%);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 8%,transparent);transition:transform var(--d-snappy) var(--e-snappy)}
.gtile:active{transform:scale(.96)}
.gtile[aria-current="true"]{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 70%,transparent)}
.gtile .gi{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 26%,var(--cont));color:var(--acc);margin-bottom:4px}
.gtile .gi .icon{width:22px;height:22px}
.gtile b{font:600 19px/1.1 var(--display);letter-spacing:-.015em}
.gtile .lv{font-size:12px;color:var(--muted);line-height:1.3}
.gtile .tg{margin-top:auto;font:600 12px/1.25 var(--body);color:color-mix(in srgb,var(--acc) 75%,var(--fg))}
.gtile .n{position:absolute;right:14px;top:12px;font:600 13px/1 var(--display);color:var(--muted);opacity:.7}
.gtile{animation:tileIn 560ms var(--e-snappy) both;animation-delay:calc(var(--i) * 28ms)}
@keyframes tileIn{from{transform:translateY(18px) scale(.97);opacity:0}}
.reduce .gtile{animation:none}

.dock{position:absolute;left:50%;bottom:18px;z-index:36;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;touch-action:pan-y}
.dock button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy),background-color 200ms}

.dock .grid[aria-pressed="true"]{background:var(--secondary);color:var(--surface)}

.dock .dl b i{width:8px;height:8px;border-radius:50%;flex:none}
.dock .dl small{font:500 11.5px/1 var(--body);color:var(--muted)}
.toast{bottom:90px}
.page{padding-bottom:128px}

/* Magic section */
.facts{display:flex;gap:10px;align-items:stretch}
.fact{flex:1;border-radius:18px;padding:11px 12px;background:var(--low)}
.fact small{display:block;font:600 11px/1 var(--body);letter-spacing:.05em;color:var(--muted)}
.fact b{display:block;font:600 22px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.src{border-radius:var(--r-xl);background:var(--low);padding:14px}
.src-head{display:flex;align-items:center;gap:8px;font:600 14px/1.2 var(--body)}

.src .facts{margin-top:10px}
.src .fact{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.prep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.prep b{color:var(--fg);font-family:var(--display)}
.prep button{color:var(--secondary);font:600 13px/1 var(--body)}
.conc{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--a5) 18%,var(--low))}

.conc b{flex:1;font:600 14px/1.25 var(--body)}
.conc small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.console{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.ccol{border-radius:18px;padding:10px 6px 10px;background:var(--low);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform var(--d-snappy) var(--e-snappy)}
.ccol:active{transform:scale(.96)}
.ccol small{font:600 11px/1 var(--body);letter-spacing:.04em;color:var(--muted)}

.ccol .marks{gap:4px;justify-content:center}

.circle-h .left{font:600 14px/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}

.circle.open .circle-h .chev{transform:rotate(180deg)}
.spells{padding:0 6px 6px}

.sp:active{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.sp.unprep{opacity:.55}

.modal{position:absolute;inset:0;z-index:50;pointer-events:none}

.cell{border-radius:16px;padding:11px 12px;background:var(--low)}

.cell b{display:block;font:600 14px/1.3 var(--body);margin-top:5px}
.prose{font-size:15px;line-height:1.55;white-space:pre-line}

.rung small{display:block;font:500 11px/1.2 var(--body);color:var(--muted)}
.rung b{font:600 18px/1.1 var(--display)}
.rung[aria-pressed="true"]{background:color-mix(in srgb,var(--secondary) 22%,var(--low));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--secondary) 60%,transparent)}
.rung[disabled]{opacity:.35;pointer-events:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--a5) 14%,var(--low));font-size:13.5px}
.note .icon{width:18px;height:18px;color:var(--a5);margin-top:1px}

/* Almanac */
.alm{background:var(--surface);transform:translateX(100%);transition:transform 0s}
.alm-top{position:absolute;left:0;right:0;top:0;z-index:5;padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px}
.alm-row{display:flex;align-items:center;gap:10px}
.alm-row h3{flex:1;font:600 20px/1.1 var(--display);margin:0}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:23px;background:var(--low)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 15px/1 var(--body)}
.search .icon{width:18px;height:18px;color:var(--muted)}
.circles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.circles button{flex:none;min-width:40px;height:34px;padding:0 12px;border-radius:17px;font:600 13px/1 var(--body);color:var(--muted);box-shadow:inset 0 0 0 1.4px var(--outline)}
.circles button[aria-pressed="true"]{background:var(--sc);color:var(--fg);box-shadow:none;border-radius:12px}
.alm-list{padding:224px 16px 40px;display:flex;flex-direction:column;gap:8px}
.alm-h{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 6px 4px}
.atile{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--low);width:100%;transition:transform var(--d-snappy) var(--e-snappy)}
.atile:active{transform:scale(.985)}
.atile .lv{width:40px;height:44px;border-radius:14px;display:grid;place-items:center;font:600 18px/1 var(--display);background:color-mix(in srgb,var(--secondary) 14%,var(--cont));flex:none}
.atile.mine .lv{background:color-mix(in srgb,var(--primary) 22%,var(--cont))}
.atile .ft{flex:1;min-width:0}
.atile b{display:block;font:600 15px/1.25 var(--body)}
.atile span{font-size:12px;color:var(--muted)}
.atile .st{font:600 11.5px/1 var(--body);padding:6px 8px;border-radius:999px;flex:none}
.st.mine{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--fg)}
.st.ok{background:color-mix(in srgb,var(--heal) 16%,transparent);color:var(--fg)}
.st.later{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--muted)}
</style>

'use strict';

const SPELLS = {"vicious-mockery": {"n": "Злая насмешка", "l": 0, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы обрушиваете на существо в пределах дистанции поток оскорблений, пронизанный тонкими чарами. Если цель может слышать вас (хотя ей не нужно понимать вас), она должна преуспеть в спасброске Мудрости или получить 1к4 психического урона и иметь помеху на следующий бросок атаки, который она совершает до конца своего следующего хода.\nУрон этого заклинания увеличивается на 1к4, когда вы достигаете 5-го уровня (2к4), 11-го уровня (3к4) и 17-го уровня (4к4).", "h": null, "cl": ["bard"]}, "minor-illusion": {"n": "Малая иллюзия", "l": 0, "s": "Иллюзия", "t": "1 действие", "r": "30 фт.", "d": "1 мин.", "c": "S · M", "m": "Немного овечьей шерсти.", "k": false, "ri": false, "x": "Вы создаете звук или образ объекта в пределах дистанции, который длится в течение длительности. Иллюзия заканчивается, если вы отпускаете ее действием или накладываете это заклинание снова.\nЕсли вы создаете звук, его громкость может варьироваться от шепота до крика. Это может быть ваш голос, голос кого-то другого, рык льва, бой барабанов или любой другой звук, который вы выберете. Звук продолжается непрерывно в течение длительности, или вы можете создавать дискретные звуки в разное время до окончания действия заклинания.\nЕсли вы создаете образ объекта - такого как стул, грязные следы или маленький сундук - он должен быть не больше 5-футового куба. Изображение не может создавать звук, свет, запах или любой другой сенсорный эффект. Физическое взаимодействие с изображением показывает, что это иллюзия, потому что вещи могут проходить сквозь него.\nЕсли существо использует свое действие для изучения звука или образа, существо может определить, что это иллюзия, с успешной проверкой Интеллекта (Расследование) против вашей Сл спасброска заклинаний. Если существо распознает иллюзию как таковую, иллюзия становится слабой для существа.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "prestidigitation": {"n": "Фокусы", "l": 0, "s": "Преобразование", "t": "1 действие", "r": "10 фт.", "d": "1 ч.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Это заклинание - небольшой магический трюк, который начинающие заклинатели используют для практики. Вы создаете один из следующих магических эффектов в пределах дистанции:\n- Вы создаете мгновенный, безвредный сенсорный эффект, такой как сноп искр, порыв ветра, слабые музыкальные ноты или странный запах.\n- Вы мгновенно зажигаете или тушите свечу, факел или небольшой костер.\n- Вы мгновенно очищаете или загрязняете объект объемом не более 1 кубического фута.\n- Вы охлаждаете, нагреваете или придаете вкус до 1 кубического фута неживой материи в течение 1 часа.\n- Вы заставляете цвет, небольшую метку или символ появляться на объекте или поверхности в течение 1 часа.\n- Вы создаете немагическую безделушку или иллюзорное изображение, которое может поместиться в вашей руке и которое длится до конца вашего следующего хода.\nЕсли вы накладываете это заклинание несколько раз, вы можете иметь до трех его не мгновенных эффектов активными одновременно, и вы можете отменить такой эффект действием.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "healing-word": {"n": "Лечащее слово", "l": 1, "s": "Воплощение", "t": "1 бонусное действие", "r": "60 фт.", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Существо по вашему выбору, которое вы можете видеть в пределах дистанции, восстанавливает количество хитов, равное 1к4 + ваш модификатор базовой характеристики заклинания. Это заклинание не действует на нежить или конструктов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, лечение увеличивается на 1к4 за каждый круг ячейки выше 1-го.", "cl": ["bard", "cleric", "druid"]}, "thunderwave": {"n": "Волна грома", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "На себя", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Волна громоподобной силы исходит от вас. Каждое существо в 15-футовом кубе, исходящем от вас, должно совершить спасбросок Телосложения. При провале существо получает 2к8 урона звуком и отталкивается на 10 футов от вас. При успехе существо получает половину урона и не отталкивается.\nКроме того, незакрепленные предметы, которые полностью находятся в области действия, автоматически отталкиваются на 10 футов от вас эффектом заклинания, и заклинание издает громоподобный гул, слышимый на расстоянии 300 футов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "druid", "sorcerer", "wizard"]}, "sleep": {"n": "Сон", "l": 1, "s": "Очарование", "t": "1 действие", "r": "90 фт.", "d": "1 мин.", "c": "V · S · M", "m": "Щепотка мелкого песка, лепестки розы или сверчок.", "k": false, "ri": false, "x": "Это заклинание погружает существ в магический сон. Бросьте 5к8; сумма - это количество хитов существ, на которые может воздействовать это заклинание. Существа в пределах 20 футов от точки, которую вы выбираете в пределах дистанции, затрагиваются в порядке возрастания их текущих хитов (игнорируя существ без сознания).\nНачиная с существа с наименьшим текущим количеством хитов, каждое существо, затронутое этим заклинанием, падает без сознания, пока заклинание не закончится, спящий не получит урон или кто-то не использует действие, чтобы потрясти или ударить спящего, чтобы разбудить его. Вычтите хиты каждого существа из общего количества, прежде чем переходить к следующему существу с наименьшим количеством хитов. Хиты существа должны быть равны или меньше оставшегося общего количества, чтобы это существо было затронуто.\nНежить и существа, иммунные к очарованию, не подвержены воздействию этого заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, бросайте дополнительные 2к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "sorcerer", "wizard"]}, "charm-person": {"n": "Очарование личности", "l": 1, "s": "Очарование", "t": "1 действие", "r": "30 фт.", "d": "1 ч.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы пытаетесь очаровать гуманоида, которого вы можете видеть в пределах дистанции. Он должен совершить спасбросок Мудрости, и делает это с преимуществом, если вы или ваши спутники сражаетесь с ним. Если он проваливает спасбросок, он очарован вами, пока заклинание не закончится или пока вы или ваши спутники не сделаете что-либо вредное для него. Очарованное существо считает вас дружелюбным знакомым. Когда заклинание заканчивается, существо знает, что оно было очаровано вами.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете выбрать одно дополнительное существо за каждый круг ячейки выше 1-го. Существа должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["bard", "druid", "sorcerer", "warlock", "wizard"]}, "heroism": {"n": "Героизм", "l": 1, "s": "Очарование", "t": "1 действие", "r": "Касание", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Добровольное существо, которого вы касаетесь, наполняется храбростью. До окончания действия заклинания существо иммунно к состоянию испуга и получает временные хиты, равные вашему модификатору базовой характеристики заклинания, в начале каждого своего хода. Когда заклинание заканчивается, цель теряет все оставшиеся временные хиты от этого заклинания.", "h": null, "cl": ["bard", "paladin"]}, "shatter": {"n": "Дробящий звук", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V · S · M", "m": "Щепотка слюды.", "k": false, "ri": false, "x": "Внезапный громкий звон, болезненно интенсивный, раздается в точке по вашему выбору в пределах дистанции. Каждое существо в сфере радиусом 10 футов с центром в этой точке должно совершить спасбросок Т
