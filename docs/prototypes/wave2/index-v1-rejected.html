<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>QDnD · Волна 2</title>
<style>
/* Wave 2 prototype: the Magic tab (class panels and their carousel,
   spellcasting, slots, spell lists), casting, spell details and the
   Almanac. Built on the accepted wave 0/1 language: fonts are the app's
   own, colours mirror AppPalettes, springs mirror AppMotion. */
@font-face{font-family:Rubik;font-weight:400;src:url(../../../assets/fonts/Rubik-Regular.ttf)}
@font-face{font-family:Rubik;font-weight:500;src:url(../../../assets/fonts/Rubik-Medium.ttf)}
@font-face{font-family:Rubik;font-weight:600;src:url(../../../assets/fonts/Rubik-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(../../../assets/fonts/Inter-Bold.ttf)}
:root{
  --page:#221f19; --surface:#2A2720; --fg:#FAF7F0; --muted:#c3bfb5; --low:#302D26; --cont:#3C382E;
  --high:#4C473C; --highest:#5E594B; --primary:#FE5685; --on-primary:#191512; --secondary:#66D9EF;
  --tertiary:#FD971F; --pc:#49313C; --sc:#314146; --tc:#473B2C; --outline:#79705B;
  --heal:#A6E22E; --a0:#FE5685; --a1:#FD971F; --a2:#FFD866; --a3:#A6E22E; --a4:#66D9EF; --a5:#AB9DF2;
  --display:Rubik,"Segoe UI",Roboto,system-ui,sans-serif; --body:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --r-md:12px; --r-lg:16px; --r-lgp:20px; --r-xl:28px; --r-xlp:32px;
  --e-snappy:cubic-bezier(.2,0,0,1); --e-gentle:cubic-bezier(.2,0,0,1); --d-snappy:450ms; --d-gentle:620ms;
  --e-standard:cubic-bezier(.2,0,0,1); --e-enter:cubic-bezier(.05,.7,.1,1); --e-exit:cubic-bezier(.3,0,.8,.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.reduce *,.reduce *::before,.reduce *::after{transition-duration:1ms!important;animation:none!important}

/* Stage */
.stage{min-height:100%;display:flex;gap:36px;align-items:flex-start;justify-content:center;padding:28px 16px}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:46px;overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 10px #12110e,0 30px 70px -20px rgba(0,0,0,.7);isolation:isolate}
.panel{width:340px;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.panel h1{font:600 30px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.panel p{margin:0;color:var(--muted);font-size:14px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lbl{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt .hint{font-size:12.5px;color:var(--muted)}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.heroes button{padding:8px 10px;border-radius:14px;background:var(--low);font:600 12.5px/1.2 var(--body);color:var(--muted);display:flex;gap:8px;align-items:center}
.heroes button i{width:8px;height:8px;border-radius:50%;flex:none}
.heroes button[aria-pressed="true"]{background:var(--sc);color:var(--fg)}
@media (max-width:760px){.stage{padding:0;display:block}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.panel{display:none}}
.vbtn{position:absolute;right:0;top:46%;z-index:40;width:34px;height:44px;border-radius:14px 0 0 14px;display:grid;place-items:center;opacity:.85}
.vbtn .icon{width:18px;height:18px}
@media (min-width:761px){.vbtn{display:none}}

/* Glass: only for layers floating over live content */
.glass{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 .7px 0 color-mix(in srgb,var(--fg) 14%,transparent),0 10px 30px -12px rgba(0,0,0,.55)}

/* Segments with a flowing indicator */
.seg{position:relative;display:flex;background:var(--low);border-radius:999px;padding:4px;isolation:isolate;max-width:100%}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--sc);z-index:-1}
.seg button{position:relative;flex:1;text-align:center;padding:9px 12px;border-radius:999px;font:600 13px/1.1 var(--body);color:var(--muted);white-space:nowrap;transition:color 240ms var(--e-snappy)}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.toggle{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--body);color:var(--muted)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--high);position:relative;transition:background-color 240ms var(--e-snappy);flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:999px;background:var(--muted);transition:left var(--d-snappy) var(--e-snappy),background-color 240ms}
.toggle[aria-checked="true"] .switch{background:var(--secondary)}
.toggle[aria-checked="true"] .switch::after{left:22px;background:var(--surface)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;font:600 14px/1 var(--body);
  background:var(--high);color:var(--fg);box-shadow:inset 0 0 0 100px transparent;transition:transform var(--d-snappy) var(--e-snappy),box-shadow 260ms var(--e-standard),opacity 200ms}
.btn:active{transform:scale(.975);box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--fg) 9%,transparent);transition:transform 160ms var(--e-standard),box-shadow 120ms}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:color-mix(in srgb,var(--secondary) 16%,var(--low))}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:18px;font:600 13px/1.2 var(--body);color:var(--muted);
  box-shadow:inset 0 0 0 1.4px var(--outline);transition:background-color 220ms,color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{border-radius:12px;background:var(--tc);color:var(--fg);box-shadow:none}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 8%,transparent);flex:none;transition:transform var(--d-snappy) var(--e-snappy)}
.round:active{transform:scale(.92)}

/* App layers */
.layer{position:absolute;inset:0;overflow:hidden}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.topbar{position:absolute;left:0;right:0;top:0;z-index:20;padding:8px 14px 10px;display:flex;align-items:center;gap:10px}
.tb-hav{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none}
.tb-hav .icon{width:17px;height:17px}
.tb-title{font:600 17px/1.2 var(--display);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmhp{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:78px}
.cmhp b{font:600 14px/1 var(--display);font-variant-numeric:tabular-nums}
.mini-hp{height:4px;width:100%;border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.mini-hp i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.island-wrap{position:absolute;left:0;right:0;top:58px;z-index:19;padding:6px 14px 10px}
.island{position:relative;display:flex;padding:6px;border-radius:999px;isolation:isolate}
.island .ind{position:absolute;top:6px;bottom:6px;border-radius:999px;z-index:-1;background:color-mix(in srgb,var(--secondary) 24%,color-mix(in srgb,var(--surface) 40%,transparent))}
.island button{flex:1;height:50px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.island button[aria-selected="true"]{color:var(--fg)}
.island button[aria-selected="true"] .icon{transform:scale(1.1)}
.page{padding:150px 16px 120px;display:flex;flex-direction:column;gap:14px}
.sec-title{font:600 20px/1.2 var(--display);letter-spacing:-.015em;margin:8px 2px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title small{font:500 13px/1 var(--body);color:var(--muted)}
.muted{color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:60;padding:13px 16px;border-radius:var(--r-lgp);font-size:14px;
  transform:translateY(30px);opacity:0;transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms;pointer-events:none}
.toast.show{transform:none;opacity:1}

/* Class carousel: a flowing class switch and panels that follow the finger */
.cls-switch .seg button{display:flex;align-items:center;justify-content:center;gap:7px}
.cls-switch .lvl{font:600 12px/1 var(--display);opacity:.8}
.strip-wrap{position:relative;overflow:hidden;touch-action:pan-y;transition:height 420ms var(--e-standard);margin:0 -16px}
.strip{display:flex;align-items:flex-start;will-change:transform}
.cpanel{flex:0 0 100%;padding:0 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.chead h2{font:600 28px/1.05 var(--display);letter-spacing:-.025em;margin:0}
.chead .sub{display:inline-flex;align-items:center;gap:4px;font:600 13.5px/1.2 var(--body);color:var(--secondary);margin-top:6px}
.lvchip{font:600 12.5px/1 var(--body);padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--muted);flex:none}
.lvchip b{color:var(--fg);font-family:var(--display)}

/* Shared class module language */
.mod{position:relative;border-radius:var(--r-xl);padding:16px;overflow:hidden;background:var(--low);isolation:isolate}
.mod .glow{position:absolute;inset:-50% -25% auto auto;width:80%;height:170%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 26%,transparent),transparent 72%);opacity:.7;transition:opacity 500ms,transform 700ms var(--e-gentle)}
.mod-title{font:600 18px/1.2 var(--display);letter-spacing:-.01em}
.mod-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font:600 15px/1 var(--display);font-variant-numeric:tabular-nums;padding:7px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.count.big{font-size:32px;padding:0;background:none;letter-spacing:-.02em}
.foot{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:10px}
.foot .icon{width:14px;height:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:var(--r-lgp);padding:14px;background:var(--low);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform var(--d-snappy) var(--e-snappy)}
.mini:active{transform:scale(.98)}
.mini b{font:600 15px/1.2 var(--display)}
.mini .v{font:600 26px/1 var(--display);font-variant-numeric:tabular-nums}
.marks{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mark{width:14px;height:14px;border-radius:50%;background:var(--acc,var(--secondary));box-shadow:inset 0 0 0 0 transparent;
  transition:background-color 260ms,box-shadow 260ms,transform var(--d-snappy) var(--e-snappy)}
.mark.off{background:transparent;box-shadow:inset 0 0 0 1.8px var(--outline);transform:scale(.86)}
.mark.lg{width:18px;height:18px}
.action{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:24px;font:600 14.5px/1 var(--body);width:100%;
  background:color-mix(in srgb,var(--acc) 22%,var(--cont));transition:transform var(--d-snappy) var(--e-snappy),background-color 300ms}
.action:active{transform:scale(.975)}
.action[disabled]{opacity:.45;pointer-events:none}
.die{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy)}
.die svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.die .face{fill:color-mix(in srgb,var(--acc) 20%,var(--cont));stroke:var(--acc);stroke-width:3;stroke-linejoin:round}
.die .facet{fill:none;stroke:color-mix(in srgb,var(--acc) 50%,transparent);stroke-width:2}
.die b{position:relative;font:600 15px/1 var(--display)}
.die:active{transform:scale(.94)}
.list{border-radius:var(--r-xl);background:var(--low);padding:6px}
.frow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;width:100%;transition:background-color 160ms}
.frow:active{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.frow .ficon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,var(--cont));color:var(--acc);flex:none}
.frow .ficon .icon{width:18px;height:18px}
.frow .ft{flex:1;min-width:0}
.frow .ft b{display:block;font:600 15px/1.25 var(--body)}
.frow .ft span{font-size:12.5px;color:var(--muted)}
.frow .chev{color:var(--muted);width:18px;height:18px}
.frow .cost{font:600 12px/1 var(--body);padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--fg);flex:none}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12px/1 var(--body);padding:7px 11px;border-radius:999px;color:var(--muted);box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--fg) 14%,transparent)}
.tag.on{color:var(--fg);background:color-mix(in srgb,var(--acc) 18%,transparent);box-shadow:none}
.pop{animation:pop 520ms var(--e-snappy)}
@keyframes pop{30%{transform:scale(1.04)}100%{transform:none}}
.flash::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--acc);animation:fade 700ms var(--e-exit) forwards;pointer-events:none}
@keyframes fade{from{opacity:1}to{opacity:0}}
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--d-gentle) var(--e-standard),opacity 180ms var(--e-exit)}
.reveal>div{overflow:hidden;min-height:0}
.reveal.open{grid-template-rows:1fr;opacity:1;transition:grid-template-rows var(--d-gentle) var(--e-standard),opacity 300ms var(--e-enter) 80ms}

/* Class-specific shapes (identity matrix) */
.barb.raging{background:color-mix(in srgb,var(--a0) 16%,var(--low));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a0) 55%,transparent)}
.barb .state{font:600 13px/1 var(--body);padding:7px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);transition:background-color 300ms}
.barb.raging .state{background:var(--a0);color:var(--on-primary)}
.barb .effects{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:10px}
.petals{display:flex;gap:6px}
.petal{width:22px;height:30px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--acc);transition:background-color 300ms,box-shadow 300ms,transform 600ms var(--e-snappy),opacity 400ms}
.petal.off{background:transparent;box-shadow:inset 0 0 0 1.8px var(--outline)}
.petal.fly{transform:translate(60px,-30px) rotate(25deg) scale(.4);opacity:0}
.channel-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--fg) 5%,transparent);width:100%;
  transition:background-color 260ms,box-shadow 260ms,transform var(--d-snappy) var(--e-snappy)}
.channel-opt[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 20%,var(--cont));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 60%,transparent)}
.channel-opt .ft{flex:1}
.channel-opt b{display:block;font:600 14.5px/1.25 var(--body);color:var(--fg)}
.channel-opt span{font-size:12.5px;color:var(--muted)}
.layers{position:relative;display:grid}
.layers>*{grid-area:1/1}
.lay{border-radius:var(--r-xl);padding:16px;transition:transform 560ms var(--e-gentle),opacity 400ms,filter 400ms}
.lay.back{transform:translateY(-14px) scale(.94);opacity:.55;filter:saturate(.6);pointer-events:none}
.beast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.beast button{padding:10px 8px;border-radius:16px;background:color-mix(in srgb,var(--fg) 6%,transparent);font:600 12.5px/1.25 var(--body);text-align:center}
.beast button small{display:block;color:var(--muted);font-weight:500}
.kibar{display:flex;gap:4px;height:14px;margin:12px 0 4px}
.kibar i{flex:1;border-radius:999px;background:var(--acc);transition:background-color 260ms,opacity 260ms,transform var(--d-snappy) var(--e-snappy)}
.kibar i.spent{background:color-mix(in srgb,var(--fg) 10%,transparent)}
.kibar i.preview{background:color-mix(in srgb,var(--acc) 40%,transparent);transform:scaleY(.7)}
.kact{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;width:100%;transition:background-color 200ms}
.kact[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.kact .ft{flex:1}
.kact b{display:block;font:600 14.5px/1.2 var(--body)}
.kact span{font-size:12px;color:var(--muted)}
.slider{position:relative;height:44px;border-radius:22px;background:color-mix(in srgb,var(--fg) 7%,transparent);overflow:hidden;touch-action:none;margin-top:12px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--heal) 45%,transparent);border-radius:22px}
.slider .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:600 14px/1 var(--body);pointer-events:none}
.focus-frame{border-radius:var(--r-xl);padding:16px;position:relative;background:var(--low);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 45%,transparent);transition:box-shadow 400ms}
.focus-frame.empty{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--fg) 12%,transparent)}
.target{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--acc) 14%,transparent);margin-top:12px;transition:background-color 300ms}
.target b{font:600 15px/1.2 var(--body);flex:1}
.sneak-die{display:flex;gap:8px;align-items:center}
.sneak-die .die{width:54px;height:54px}
.planes{position:relative}
.planes::before{content:"";position:absolute;inset:10px -6px -6px 10px;border-radius:var(--r-xl);background:color-mix(in srgb,var(--acc) 10%,var(--low));z-index:-1;transform:rotate(-2deg);transition:transform 500ms var(--e-gentle)}
.planes.armed::before{transform:rotate(-4deg) translate(4px,4px)}
.exch{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px}
.exbox{border-radius:20px;padding:12px;background:color-mix(in srgb,var(--fg) 6%,transparent);text-align:center;transition:background-color 300ms}
.exbox .v{font:600 28px/1 var(--display)}
.exbox span{font-size:12px;color:var(--muted)}
.exarrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 22%,var(--cont));transition:transform 500ms var(--e-snappy)}
.exarrow.flip{transform:rotate(180deg)}
.hexes{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
.hex{width:46px;height:52px;display:grid;place-items:center;position:relative;transition:transform var(--d-snappy) var(--e-snappy)}
.hex svg{position:absolute;inset:0;width:100%;height:100%}
.hex .face{fill:color-mix(in srgb,var(--acc) 26%,var(--cont));stroke:var(--acc);stroke-width:3;transition:fill 300ms,stroke 300ms}
.hex.off .face{fill:transparent;stroke:var(--outline)}
.hex b{position:relative;font:600 16px/1 var(--display)}
.hex.off b{color:var(--muted)}
.hex:active{transform:scale(.92)}
.recov{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.recov button{min-width:48px;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--fg) 6%,transparent);font:600 13px/1.1 var(--body);text-align:center;transition:background-color 200ms,transform var(--d-snappy) var(--e-snappy)}
.recov button small{display:block;font:500 11px/1.2 var(--body);color:var(--muted)}
.recov button[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 26%,var(--cont))}
.recov button[disabled]{opacity:.35}
.budget{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.budget .num{font-size:26px}

/* Magic section */
.facts{display:flex;gap:10px;align-items:stretch}
.fact{flex:1;border-radius:18px;padding:11px 12px;background:var(--low)}
.fact small{display:block;font:600 11px/1 var(--body);letter-spacing:.05em;color:var(--muted)}
.fact b{display:block;font:600 22px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.src{border-radius:var(--r-xl);background:var(--low);padding:14px}
.src-head{display:flex;align-items:center;gap:8px;font:600 14px/1.2 var(--body)}
.src-head i{width:8px;height:8px;border-radius:50%}
.src .facts{margin-top:10px}
.src .fact{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.prep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.prep b{color:var(--fg);font-family:var(--display)}
.prep button{color:var(--secondary);font:600 13px/1 var(--body)}
.conc{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--a5) 18%,var(--low))}
.conc .icon{color:var(--a5)}
.conc b{flex:1;font:600 14px/1.25 var(--body)}
.conc small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.console{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.ccol{border-radius:18px;padding:10px 6px 10px;background:var(--low);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform var(--d-snappy) var(--e-snappy)}
.ccol:active{transform:scale(.96)}
.ccol small{font:600 11px/1 var(--body);letter-spacing:.04em;color:var(--muted)}
.ccol b{font:600 20px/1 var(--display)}
.ccol .marks{gap:4px;justify-content:center}
.ccol .mark{width:9px;height:9px}
.ccol.pact{background:color-mix(in srgb,var(--a5) 14%,var(--low))}
.circle{border-radius:var(--r-xl);background:var(--low);overflow:hidden}
.circle-h{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%}
.circle-h .cn{font:600 16px/1.2 var(--display);min-width:68px}
.circle-h .cn small{display:block;font:500 12px/1.2 var(--body);color:var(--muted)}
.circle-h .marks{flex:1;gap:6px}
.circle-h .mark{width:15px;height:15px}
.circle-h .left{font:600 14px/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.circle-h .chev{width:18px;height:18px;color:var(--muted);transition:transform var(--d-snappy) var(--e-standard)}
.circle.open .circle-h .chev{transform:rotate(180deg)}
.spells{padding:0 6px 6px}
.sp{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 10px;border-radius:16px;width:100%;transition:background-color 160ms,opacity 300ms}
.sp:active{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.sp.unprep{opacity:.55}
.sp .star{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--muted)}
.sp .star .icon{width:17px;height:17px}
.sp .star.on{color:var(--a2)}
.sp .star.on .icon{fill:currentColor}
.sp .star.lock{color:var(--secondary)}
.sp .st{flex:1;min-width:0}
.sp .st b{display:block;font:600 15px/1.25 var(--body)}
.sp .st span{font-size:12px;color:var(--muted)}
.sp .badges{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px}
.sp .badges i{font:600 10px/1 var(--body);font-style:normal;padding:3px 5px;border-radius:6px;background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--muted)}
.cast{width:44px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary);transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms}
.cast:active{transform:scale(.92)}
.cast .icon{width:20px;height:20px}
.cast.off{opacity:.35}
.passives .frow .ficon{background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--muted)}

/* Bottom sheets */
.modal{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,8,6,.45);opacity:0}
.bsheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:var(--cont);box-shadow:0 -14px 40px -16px rgba(0,0,0,.6);transform:translateY(100%);touch-action:none}
.grab{height:28px;display:grid;place-items:center;flex:none;cursor:grab}
.grab i{width:36px;height:4px;border-radius:999px;background:var(--outline)}
.bs-body{overflow-y:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.bs-kicker{font:600 13px/1 var(--body);color:var(--secondary)}
.bs-title{font:600 26px/1.12 var(--display);letter-spacing:-.02em;margin:0}
.bs-sub{color:var(--muted);font-size:13.5px;margin-top:-8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border-radius:16px;padding:11px 12px;background:var(--low)}
.cell small{display:block;font:600 11px/1 var(--body);color:var(--muted);letter-spacing:.04em}
.cell b{display:block;font:600 14px/1.3 var(--body);margin-top:5px}
.prose{font-size:15px;line-height:1.55;white-space:pre-line}
.prose h4{font:600 16px/1.2 var(--display);margin:6px 0 4px}
.ladder{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.rung{min-width:64px;padding:10px 10px 9px;border-radius:18px;background:var(--low);text-align:center;transition:background-color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.rung small{display:block;font:500 11px/1.2 var(--body);color:var(--muted)}
.rung b{font:600 18px/1.1 var(--display)}
.rung[aria-pressed="true"]{background:color-mix(in srgb,var(--secondary) 22%,var(--low));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--secondary) 60%,transparent)}
.rung[disabled]{opacity:.35;pointer-events:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--a5) 14%,var(--low));font-size:13.5px}
.note .icon{width:18px;height:18px;color:var(--a5);margin-top:1px}

/* Almanac */
.alm{background:var(--surface);transform:translateX(100%);transition:transform 0s}
.alm-top{position:absolute;left:0;right:0;top:0;z-index:5;padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px}
.alm-row{display:flex;align-items:center;gap:10px}
.alm-row h3{flex:1;font:600 20px/1.1 var(--display);margin:0}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:23px;background:var(--low)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 15px/1 var(--body)}
.search .icon{width:18px;height:18px;color:var(--muted)}
.circles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.circles button{flex:none;min-width:40px;height:34px;padding:0 12px;border-radius:17px;font:600 13px/1 var(--body);color:var(--muted);box-shadow:inset 0 0 0 1.4px var(--outline)}
.circles button[aria-pressed="true"]{background:var(--sc);color:var(--fg);box-shadow:none;border-radius:12px}
.alm-list{padding:224px 16px 40px;display:flex;flex-direction:column;gap:8px}
.alm-h{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 6px 4px}
.atile{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--low);width:100%;transition:transform var(--d-snappy) var(--e-snappy)}
.atile:active{transform:scale(.985)}
.atile .lv{width:40px;height:44px;border-radius:14px;display:grid;place-items:center;font:600 18px/1 var(--display);background:color-mix(in srgb,var(--secondary) 14%,var(--cont));flex:none}
.atile.mine .lv{background:color-mix(in srgb,var(--primary) 22%,var(--cont))}
.atile .ft{flex:1;min-width:0}
.atile b{display:block;font:600 15px/1.25 var(--body)}
.atile span{font-size:12px;color:var(--muted)}
.atile .st{font:600 11.5px/1 var(--body);padding:6px 8px;border-radius:999px;flex:none}
.st.mine{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--fg)}
.st.ok{background:color-mix(in srgb,var(--heal) 16%,transparent);color:var(--fg)}
.st.later{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--muted)}
</style>
</head>

<script>
'use strict';
/* Spells and lists generated from assets/data/spells (app data). */
const SPELLS = {"vicious-mockery": {"n": "Злая насмешка", "l": 0, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы обрушиваете на существо в пределах дистанции поток оскорблений, пронизанный тонкими чарами. Если цель может слышать вас (хотя ей не нужно понимать вас), она должна преуспеть в спасброске Мудрости или получить 1к4 психического урона и иметь помеху на следующий бросок атаки, который она совершает до конца своего следующего хода.\nУрон этого заклинания увеличивается на 1к4, когда вы достигаете 5-го уровня (2к4), 11-го уровня (3к4) и 17-го уровня (4к4).", "h": null, "cl": ["bard"]}, "minor-illusion": {"n": "Малая иллюзия", "l": 0, "s": "Иллюзия", "t": "1 действие", "r": "30 фт.", "d": "1 мин.", "c": "S · M", "m": "Немного овечьей шерсти.", "k": false, "ri": false, "x": "Вы создаете звук или образ объекта в пределах дистанции, который длится в течение длительности. Иллюзия заканчивается, если вы отпускаете ее действием или накладываете это заклинание снова.\nЕсли вы создаете звук, его громкость может варьироваться от шепота до крика. Это может быть ваш голос, голос кого-то другого, рык льва, бой барабанов или любой другой звук, который вы выберете. Звук продолжается непрерывно в течение длительности, или вы можете создавать дискретные звуки в разное время до окончания действия заклинания.\nЕсли вы создаете образ объекта - такого как стул, грязные следы или маленький сундук - он должен быть не больше 5-футового куба. Изображение не может создавать звук, свет, запах или любой другой сенсорный эффект. Физическое взаимодействие с изображением показывает, что это иллюзия, потому что вещи могут проходить сквозь него.\nЕсли существо использует свое действие для изучения звука или образа, существо может определить, что это иллюзия, с успешной проверкой Интеллекта (Расследование) против вашей Сл спасброска заклинаний. Если существо распознает иллюзию как таковую, иллюзия становится слабой для существа.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "prestidigitation": {"n": "Фокусы", "l": 0, "s": "Преобразование", "t": "1 действие", "r": "10 фт.", "d": "1 ч.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Это заклинание - небольшой магический трюк, который начинающие заклинатели используют для практики. Вы создаете один из следующих магических эффектов в пределах дистанции:\n- Вы создаете мгновенный, безвредный сенсорный эффект, такой как сноп искр, порыв ветра, слабые музыкальные ноты или странный запах.\n- Вы мгновенно зажигаете или тушите свечу, факел или небольшой костер.\n- Вы мгновенно очищаете или загрязняете объект объемом не более 1 кубического фута.\n- Вы охлаждаете, нагреваете или придаете вкус до 1 кубического фута неживой материи в течение 1 часа.\n- Вы заставляете цвет, небольшую метку или символ появляться на объекте или поверхности в течение 1 часа.\n- Вы создаете немагическую безделушку или иллюзорное изображение, которое может поместиться в вашей руке и которое длится до конца вашего следующего хода.\nЕсли вы накладываете это заклинание несколько раз, вы можете иметь до трех его не мгновенных эффектов активными одновременно, и вы можете отменить такой эффект действием.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "healing-word": {"n": "Лечащее слово", "l": 1, "s": "Воплощение", "t": "1 бонусное действие", "r": "60 фт.", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Существо по вашему выбору, которое вы можете видеть в пределах дистанции, восстанавливает количество хитов, равное 1к4 + ваш модификатор базовой характеристики заклинания. Это заклинание не действует на нежить или конструктов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, лечение увеличивается на 1к4 за каждый круг ячейки выше 1-го.", "cl": ["bard", "cleric", "druid"]}, "thunderwave": {"n": "Волна грома", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "На себя", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Волна громоподобной силы исходит от вас. Каждое существо в 15-футовом кубе, исходящем от вас, должно совершить спасбросок Телосложения. При провале существо получает 2к8 урона звуком и отталкивается на 10 футов от вас. При успехе существо получает половину урона и не отталкивается.\nКроме того, незакрепленные предметы, которые полностью находятся в области действия, автоматически отталкиваются на 10 футов от вас эффектом заклинания, и заклинание издает громоподобный гул, слышимый на расстоянии 300 футов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "druid", "sorcerer", "wizard"]}, "sleep": {"n": "Сон", "l": 1, "s": "Очарование", "t": "1 действие", "r": "90 фт.", "d": "1 мин.", "c": "V · S · M", "m": "Щепотка мелкого песка, лепестки розы или сверчок.", "k": false, "ri": false, "x": "Это заклинание погружает существ в магический сон. Бросьте 5к8; сумма - это количество хитов существ, на которые может воздействовать это заклинание. Существа в пределах 20 футов от точки, которую вы выбираете в пределах дистанции, затрагиваются в порядке возрастания их текущих хитов (игнорируя существ без сознания).\nНачиная с существа с наименьшим текущим количеством хитов, каждое существо, затронутое этим заклинанием, падает без сознания, пока заклинание не закончится, спящий не получит урон или кто-то не использует действие, чтобы потрясти или ударить спящего, чтобы разбудить его. Вычтите хиты каждого существа из общего количества, прежде чем переходить к следующему существу с наименьшим количеством хитов. Хиты существа должны быть равны или меньше оставшегося общего количества, чтобы это существо было затронуто.\nНежить и существа, иммунные к очарованию, не подвержены воздействию этого заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, бросайте дополнительные 2к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "sorcerer", "wizard"]}, "charm-person": {"n": "Очарование личности", "l": 1, "s": "Очарование", "t": "1 действие", "r": "30 фт.", "d": "1 ч.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы пытаетесь очаровать гуманоида, которого вы можете видеть в пределах дистанции. Он должен совершить спасбросок Мудрости, и делает это с преимуществом, если вы или ваши спутники сражаетесь с ним. Если он проваливает спасбросок, он очарован вами, пока заклинание не закончится или пока вы или ваши спутники не сделаете что-либо вредное для него. Очарованное существо считает вас дружелюбным знакомым. Когда заклинание заканчивается, существо знает, что оно было очаровано вами.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете выбрать одно дополнительное существо за каждый круг ячейки выше 1-го. Существа должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["bard", "druid", "sorcerer", "warlock", "wizard"]}, "heroism": {"n": "Героизм", "l": 1, "s": "Очарование", "t": "1 действие", "r": "Касание", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Добровольное существо, которого вы касаетесь, наполняется храбростью. До окончания действия заклинания существо иммунно к состоянию испуга и получает временные хиты, равные вашему модификатору базовой характеристики заклинания, в начале каждого своего хода. Когда заклинание заканчивается, цель теряет все оставшиеся временные хиты от этого заклинания.", "h": null, "cl": ["bard", "paladin"]}, "shatter": {"n": "Дробящий звук", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V · S · M", "m": "Щепотка слюды.", "k": false, "ri": false, "x": "Внезапный громкий звон, болезненно интенсивный, раздается в точке по вашему выбору в пределах дистанции. Каждое существо в сфере радиусом 10 футов с центром в этой точке должно совершить спасбросок Телосложения. Существо получает 3к8 урона звуком при провале или половину этого урона при успехе. Существо, сделанное из неорганического материала, такого как камень, кристалл или металл, имеет помеху на этот спасбросок.\nНемагический объект, который не носит и не несет существо, также получает урон, если он находится в области заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, урон увеличивается на 1к8 за каждый круг ячейки выше 2-го.", "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "invisibility": {"n": "Невидимость", "l": 2, "s": "Иллюзия", "t": "1 действие", "r": "Касание", "d": "Вплоть до 1 ч.", "c": "V · S · M", "m": "Ресница, заключенная в гуммиарабик.", "k": true, "ri": false, "x": "Существо, которого вы касаетесь, становится невидимым, пока заклинание не закончится. Все, что цель носит или несет, невидимо, пока находится на ней. Заклинание заканчивается для цели, если она атакует или накладывает заклинание.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы можете нацелиться на одно дополнительное существо за каждый круг ячейки выше 2-го.", "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "hypnotic-pattern": {"n": "Гипнотический узор", "l": 3, "s": "Иллюзия", "t": "1 действие", "r": "120 фт.", "d": "Вплоть до 1 мин.", "c": "S · M", "m": "Светящаяся палочка благовоний или хрустальный флакон, наполненный фосфоресцирующим материалом.", "k": true, "ri": false, "x": "Вы создаете извивающийся узор цветов, который переплетается в воздухе внутри 30-футового куба в пределах дистанции. Узор появляется на мгновение и исчезает. Каждое существо в области, которое видит узор, должно совершить спасбросок Мудрости. При провале существо становится очарованным на время действия. Будучи очарованным этим заклинанием, существо недееспособно и имеет скорость 0.\nЗаклинание заканчивается для затронутого существа, если оно получает какой-либо урон или если кто-то другой использует действие, чтобы встряхнуть существо из его ступора.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "guidance": {"n": "Наставление", "l": 0, "s": "Прорицание", "t": "1 действие", "r": "Касание", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Вы касаетесь одного добровольного существа. Один раз до окончания действия заклинания цель может бросить к4 и добавить выпавшее число к одной проверке характеристики по своему выбору. Она может бросить кость до или после совершения проверки характеристики. После этого заклинание заканчивается.", "h": null, "cl": ["cleric", "druid"]}, "sacred-flame": {"n": "Священное пламя", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Пламя, похожее на пламя, нисходит на существо, которое вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Ловкости или получить 1к8 урона излучением. Цель не получает выгоды от укрытия для этого спасброска.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["cleric"]}, "spare-the-dying": {"n": "Уход за умирающим", "l": 0, "s": "Некромантия", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы касаетесь живого существа, у которого 0 хитов. Существо становится стабилизированным. Это заклинание не действует на нежить или конструктов.", "h": null, "cl": ["cleric"]}, "bless": {"n": "Благословение", "l": 1, "s": "Очарование", "t": "1 действие", "r": "30 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Капля святой воды.", "k": true, "ri": false, "x": "Вы благословляете до трех существ по вашему выбору в пределах дистанции. Всякий раз, когда цель совершает бросок атаки или спасбросок до окончания действия заклинания, цель может бросить к4 и добавить выпавшее число к броску атаки или спасброску.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете выбрать одно дополнительное существо за каждый круг ячейки выше 1-го.", "cl": ["cleric", "paladin"]}, "cure-wounds": {"n": "Лечение ран", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Существо, которого вы касаетесь, восстанавливает количество хитов, равное 1к8 + ваш модификатор базовой характеристики заклинания. Это заклинание не действует на нежить или конструктов.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, лечение увеличивается на 1к8 за каждый круг ячейки выше 1-го.", "cl": ["bard", "cleric", "druid", "paladin", "ranger"]}, "shield-of-faith": {"n": "Щит веры", "l": 1, "s": "Ограждение", "t": "1 бонусное действие", "r": "60 фт.", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Небольшой пергамент с написанным на нем текстом из святого писания.", "k": true, "ri": false, "x": "Мерцающее поле появляется и окружает существо по вашему выбору в пределах дистанции, предоставляя ему бонус +2 к КД на время действия.", "h": null, "cl": ["cleric", "paladin"]}, "command": {"n": "Приказ", "l": 1, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "1 раунд", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы произносите команду из одного слова существу, которое вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Мудрости или следовать команде в свой следующий ход. Заклинание не имеет эффекта, если цель нежить, если она не понимает ваш язык, или если ваша команда непосредственно вредна для нее.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, вы можете воздействовать на одно дополнительное существо за каждый круг ячейки выше 1-го. Существа должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["cleric", "paladin"]}, "guiding-bolt": {"n": "Направляющий снаряд", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "1 раунд", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вспышка света устремляется к существу по вашему выбору в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 4к6 урона излучением, и следующий бросок атаки, совершенный по этой цели до конца вашего следующего хода, имеет преимущество благодаря мистическому тусклому свету, который мерцает на цели до тех пор.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 1-го.", "cl": ["cleric"]}, "druidcraft": {"n": "Друидизм", "l": 0, "s": "Преобразование", "t": "1 действие", "r": "30 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Шепча духам природы, вы создаете один из следующих эффектов в пределах дистанции:\n- Вы создаете крошечный, безвредный сенсорный эффект, который предсказывает, какой будет погода в вашем месте на следующие 24 часа. Эффект может проявиться как золотая сфера для ясного неба, облако для дождя, падающие снежинки для снега и так далее. Эффект сохраняется в течение 1 раунда.\n- Вы мгновенно заставляете цветок расцвести, семя прорасти или листовую почку раскрыться.\n- Вы создаете мгновенный, безвредный сенсорный эффект, такой как падающие листья, дуновение ветра, звук маленького животного или слабый запах скунса. Эффект должен поместиться в куб с ребром 5 футов.\n- Вы мгновенно зажигаете или тушите свечу, факел или небольшой костер.", "h": null, "cl": ["druid"]}, "produce-flame": {"n": "Сотворение пламени", "l": 0, "s": "Вызов", "t": "1 действие", "r": "На себя", "d": "10 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Мерцающее пламя появляется в вашей руке. Пламя остается там на время действия и не вредит ни вам, ни вашему снаряжению. Пламя излучает яркий свет в радиусе 10 футов и тусклый свет еще на 10 футов. Заклинание заканчивается, если вы отпускаете его действием или если вы накладываете его снова.\nВы также можете атаковать пламенем, хотя это и заканчивает заклинание. Когда вы накладываете это заклинание или в качестве действия в более поздний ход, вы можете метнуть пламя в существо в пределах 30 футов от вас. Совершите дальнобойную атаку заклинанием. При попадании цель получает 1к8 урона огнем.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["druid"]}, "goodberry": {"n": "Чудо-ягоды", "l": 1, "s": "Преобразование", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S · M", "m": "Ветка омелы.", "k": false, "ri": false, "x": "В вашей руке появляется до десяти ягод, наполненных магией на время действия. Существо может использовать свое действие, чтобы съесть одну ягоду. Поедание ягоды восстанавливает 1 хит, и ягода обеспечивает достаточно пищи, чтобы поддерживать существо в течение одного дня.\nЯгоды теряют свою силу, если они не были съедены в течение 24 часов после накладывания заклинания.", "h": null, "cl": ["druid", "ranger"]}, "entangle": {"n": "Опутывание", "l": 1, "s": "Вызов", "t": "1 действие", "r": "90 фт.", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Хватающие сорняки и лозы прорастают из земли в квадрате с ребром 20 футов, начиная с точки в пределах дистанции. В течение длительности эти растения превращают землю в области в труднопроходимую местность.\nСущество в области, когда вы накладываете заклинание, должно преуспеть в спасброске Силы или быть опутанным опутывающими растениями, пока заклинание не закончится. Существо, опутанное растениями, может использовать свое действие, чтобы совершить проверку Силы против вашей Сл спасброска заклинаний. При успехе оно освобождается.\nКогда заклинание заканчивается, созданные растения увядают.", "h": null, "cl": ["druid"]}, "faerie-fire": {"n": "Огонь фей", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 1 мин.", "c": "V", "m": null, "k": true, "ri": false, "x": "Каждый объект в 20-футовом кубе в пределах дистанции очерчивается синим, зеленым или фиолетовым светом (по вашему выбору). Любое существо в области, когда заклинание накладывается, также очерчивается светом, если оно проваливает спасбросок Ловкости. На время действия объекты и затронутые существа излучают тусклый свет в радиусе 10 футов.\nЛюбой бросок атаки против затронутого существа или объекта имеет преимущество, если атакующий может его видеть, и затронутое существо или объект не могут получить выгоду от невидимости.", "h": null, "cl": ["druid"]}, "shillelagh": {"n": "Дубинка", "l": 0, "s": "Преобразование", "t": "1 бонусное действие", "r": "Касание", "d": "1 мин.", "c": "V · S · M", "m": "Омела, лист клевера и дубинка или посох.", "k": false, "ri": false, "x": "Дерево дубинки или посоха, которое вы держите, наполняется силой природы. В течение длительности вы можете использовать свою базовую характеристику заклинания вместо Силы для бросков атаки и урона рукопашных атак, использующих это оружие, и кость урона оружия становится к8. Оружие также становится магическим, если оно еще не является таковым. Заклинание заканчивается, если вы накладываете его снова или если вы выпускаете оружие из рук.", "h": null, "cl": ["druid"]}, "moonbeam": {"n": "Лунный луч", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Несколько семян лунного семени и кусок опалесцирующего полевого шпата.", "k": true, "ri": false, "x": "Серебристый луч бледного света светит вниз в цилиндре радиусом 5 футов и высотой 40 футов, центрированном на точке в пределах дистанции. Тусклый свет наполняет цилиндр. Когда существо входит в область заклинания впервые за ход или начинает там свой ход, оно поглощается призрачным пламенем, которое вызывает жгучую боль, и оно должно совершить спасбросок Телосложения. Оно получает 2к10 урона излучением при провале или половину этого урона при успехе.\nПеревертыш совершает свой спасбросок с помехой. Если он проваливает, он также мгновенно возвращается в свою первоначальную форму и не может принять другую форму, пока не покинет свет заклинания.\nВ каждый свой ход после того, как вы наложили это заклинание, вы можете использовать действие, чтобы переместить луч на 60 футов в любом направлении.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, урон увеличивается на 1к10 за каждый круг ячейки выше 2-го.", "cl": ["druid"]}, "spike-growth": {"n": "Шипы", "l": 2, "s": "Преобразование", "t": "1 действие", "r": "150 фт.", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Семь острых шипов или семь маленьких веточек, каждая заостренная на конце.", "k": true, "ri": false, "x": "Земля в радиусе 20 футов с центром в точке в пределах дистанции скручивается и прорастает твердыми шипами и колючками. Область становится труднопроходимой местностью на время действия. Когда существо входит в область или перемещается в ней, оно получает 2к4 колющего урона за каждые 5 футов, которые оно проходит.\nТрансформация земли замаскирована, чтобы выглядеть естественно. Любое существо, которое не может видеть область во время накладывания заклинания, должно совершить проверку Мудрости (Внимательность) против вашей Сл спасброска заклинаний, чтобы распознать местность как опасную перед тем, как войти в нее.", "h": null, "cl": ["druid", "ranger"]}, "lesser-restoration": {"n": "Малое восстановление", "l": 2, "s": "Ограждение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы касаетесь существа и можете закончить либо одну болезнь, либо одно состояние, влияющее на него. Состояние может быть ослепленным, оглушенным, парализованным или отравленным.", "h": null, "cl": ["bard", "cleric", "druid", "paladin", "ranger"]}, "divine-favor": {"n": "Божественная благосклонность", "l": 1, "s": "Воплощение", "t": "1 бонусное действие", "r": "На себя", "d": "Вплоть до 1 мин.", "c": "V · S", "m": null, "k": true, "ri": false, "x": "Ваша молитва наполняет вас божественным сиянием. До окончания действия заклинания ваши атаки оружием наносят дополнительные 1к4 урона излучением при попадании.", "h": null, "cl": ["paladin"]}, "protection-from-evil-and-good": {"n": "Защита от добра и зла", "l": 1, "s": "Ограждение", "t": "1 действие", "r": "Касание", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Святая вода или порошкообразное серебро и железо, которые заклинание расходует.", "k": true, "ri": false, "x": "До окончания действия заклинания одно добровольное существо, которого вы касаетесь, защищено от определенных типов существ: аберраций, небожителей, элементалей, фей, исчадий и нежити.\nЗащита дает несколько преимуществ. Существа этих типов совершают броски атаки против цели с помехой. Цель также не может быть очарована, испугана или одержима ими. Если цель уже очарована, испугана или одержима таким существом, цель имеет преимущество на любой новый спасбросок против соответствующего эффекта.", "h": null, "cl": ["cleric", "paladin", "warlock", "wizard"]}, "sanctuary": {"n": "Убежище", "l": 1, "s": "Ограждение", "t": "1 бонусное действие", "r": "30 фт.", "d": "1 мин.", "c": "V · S · M", "m": "Небольшое серебряное зеркало.", "k": false, "ri": false, "x": "Вы защищаете существо в пределах дистанции от атаки. До окончания действия заклинания любое существо, которое пытается нацелиться на защищенное существо атакой или вредоносным заклинанием, должно сначала совершить спасбросок Мудрости. При провале существо должно выбрать новую цель или потерять атаку или заклинание. Это заклинание не защищает защищенное существо от зональных эффектов, таких как взрыв огненного шара.\nЕсли защищенное существо совершает атаку, накладывает заклинание, которое влияет на вражеское существо, или наносит урон другому существу, это заклинание заканчивается.", "h": null, "cl": ["cleric", "paladin"]}, "zone-of-truth": {"n": "Зона правды", "l": 2, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "10 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы создаете магическую зону, которая защищает от обмана, в сфере радиусом 15 футов, центрированной на точке по вашему выбору в пределах дистанции. Пока заклинание длится, существо, которое входит в область заклинания впервые за ход или начинает там свой ход, должно совершить спасбросок Харизмы. При провале существо не может говорить преднамеренную ложь, пока находится в радиусе.\nВы знаете, удалось ли каждому существу пройти спасбросок или нет. Затронутое существо осознает заклинание и может избегать ответов на вопросы, на которые оно обычно лгало бы. Такие существа могут быть уклончивыми в своих ответах, пока они остаются в границах правды.", "h": null, "cl": ["bard", "cleric", "paladin"]}, "find-steed": {"n": "Поиск скакуна", "l": 2, "s": "Вызов", "t": "10 мин.", "r": "30 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы призываете духа, который принимает форму необычайно умного, сильного и верного коня, создавая прочную связь с ним. Появляясь в незанятом пространстве в пределах дистанции, скакун принимает форму, которую вы выбираете: боевой конь, пони, верблюд, лось или мастиф (ваш ГМ может разрешить других животных в качестве скакунов). Скакун имеет статистику выбранной формы, хотя это небожитель, фея или исчадие (по вашему выбору), а не зверь. Кроме того, если ваш скакун имеет Интеллект 5 или меньше, его Интеллект становится 6, и он получает способность понимать один язык по вашему выбору, на котором вы говорите.\nВаш скакун служит вам верховым животным как в бою, так и вне его, и у вас есть инстинктивная связь с ним, которая позволяет вам сражаться как единое целое. Пока вы верхом на нем, вы можете сделать так, чтобы любое заклинание, которое вы накладываете, нацеленное только на вас, также нацеливалось на вашего скакуна.\nКогда скакун падает до 0 хитов, он исчезает, не оставляя после себя физической формы. Вы также можете отпустить своего скакуна в любое время действием, заставляя его исчезнуть. В любом случае, повторное накладывание этого заклинания призывает того же скакуна, восстановленного до полного здоровья.", "h": null, "cl": ["paladin"]}, "aid": {"n": "Помощь", "l": 2, "s": "Ограждение", "t": "1 действие", "r": "30 фт.", "d": "8 ч.", "c": "V · S · M", "m": "Крошечная полоска белой ткани.", "k": false, "ri": false, "x": "Ваши заклинания воодушевляют ваших союзников стойкостью и решимостью. Выберите до трех существ в пределах дистанции. Максимум хитов и текущие хиты каждой цели увеличиваются на 5 на время действия заклинания.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, хиты увеличиваются на 5 за каждый круг ячейки выше 2-го.", "cl": ["cleric", "paladin"]}, "hunters-mark": {"n": "Метка охотника", "l": 1, "s": "Прорицание", "t": "1 бонусное действие", "r": "90 фт.", "d": "Вплоть до 1 ч.", "c": "V", "m": null, "k": true, "ri": false, "x": "Вы выбираете существо, которое вы можете видеть в пределах дистанции, и мистически помечаете его как свою добычу. До окончания действия заклинания вы наносите дополнительные 1к6 урона цели каждый раз, когда вы попадаете по ней атакой оружием, и вы имеете преимущество на любую проверку Мудрости (Внимательность) или Мудрости (Выживание), которую вы совершаете, чтобы найти ее. Если цель опускается до 0 хитов до окончания этого заклинания, вы можете использовать бонусное действие в один из ваших последующих ходов, чтобы пометить новое существо.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го или 4-го круга, вы можете поддерживать концентрацию на заклинании до 8 часов. Если вы используете ячейку заклинания 5-го круга или выше, вы можете поддерживать концентрацию на заклинании до 24 часов.", "cl": ["ranger"]}, "fire-bolt": {"n": "Огненный снаряд", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы бросаете сгусток огня в существо или объект в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1к10 урона огнем. Горючий предмет, попавший под это заклинание, воспламеняется, если его никто не несет и не носит.\nУрон этого заклинания увеличивается на 1к10, когда вы достигаете 5-го уровня (2к10), 11-го уровня (3к10) и 17-го уровня (4к10).", "h": null, "cl": ["sorcerer", "wizard"]}, "mage-hand": {"n": "Рука мага", "l": 0, "s": "Вызов", "t": "1 действие", "r": "30 фт.", "d": "1 мин.", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Спектральная, парящая рука появляется в точке, которую вы выбираете в пределах дистанции. Рука длится в течение длительности или пока вы не отпустите ее действием. Рука исчезает, если она когда-либо находится более чем в 30 футах от вас или если вы накладываете это заклинание снова.\nВы можете использовать свое действие, чтобы управлять рукой. Вы можете использовать руку, чтобы манипулировать объектом, открыть незапертую дверь или контейнер, убрать или положить предмет из открытого контейнера или вылить содержимое флакона. Вы можете перемещать руку на расстояние до 30 футов каждый раз, когда вы ее используете.\nРука не может атаковать, активировать магические предметы или нести более 10 фунтов.", "h": null, "cl": ["bard", "sorcerer", "warlock", "wizard"]}, "shocking-grasp": {"n": "Шоковое прикосновение", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "Касание", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Молния срывается с вашей руки, чтобы поразить существо, которое вы пытаетесь коснуться. Совершите рукопашную атаку заклинанием по цели. Вы имеете преимущество на бросок атаки, если цель носит доспехи из металла. При попадании цель получает 1к8 урона молнией, и она не может использовать реакции до начала своего следующего хода.\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).", "h": null, "cl": ["sorcerer", "wizard"]}, "burning-hands": {"n": "Огненные ладони", "l": 1, "s": "Воплощение", "t": "1 действие", "r": "На себя", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Когда вы держите руки с соприкасающимися большими пальцами и растопыренными остальными пальцами, тонкий лист пламени вырывается из ваших кончиков пальцев. Каждое существо в 15-футовом конусе должно совершить спасбросок Ловкости. Существо получает 3к6 урона огнем при провале или половину этого урона при успехе.\nОгонь воспламеняет любые горючие предметы в области, которые никто не несет и не носит.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 1-го.", "cl": ["sorcerer", "wizard"]}, "shield": {"n": "Щит", "l": 1, "s": "Ограждение", "t": "1 реакция", "r": "На себя", "d": "1 раунд", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Невидимый барьер магической силы появляется и защищает вас. До начала вашего следующего хода вы получаете бонус +5 к КД, в том числе против триггерной атаки, и вы не получаете урона от магической стрелы.", "h": null, "cl": ["sorcerer", "wizard"]}, "misty-step": {"n": "Туманный шаг", "l": 2, "s": "Вызов", "t": "1 бонусное действие", "r": "На себя", "d": "Мгновенная", "c": "V", "m": null, "k": false, "ri": false, "x": "Вы на мгновение окружаетесь серебристым туманом и телепортируетесь на расстояние до 30 футов в незанятое пространство, которое вы можете видеть.", "h": null, "cl": ["sorcerer", "warlock", "wizard"]}, "scorching-ray": {"n": "Опаляющий луч", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы создаете три луча огня и направляете их на цели в пределах дистанции. Вы можете направить их на одну цель или на несколько.\nСовершите дальнобойную атаку заклинанием для каждого луча. При попадании цель получает 2к6 урона огнем.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы создаете один дополнительный луч за каждый круг ячейки выше 2-го.", "cl": ["sorcerer", "wizard"]}, "fireball": {"n": "Огненный шар", "l": 3, "s": "Воплощение", "t": "1 действие", "r": "150 фт.", "d": "Мгновенная", "c": "V · S · M", "m": "Крошечный шарик из гуано летучей мыши и серы.", "k": false, "ri": false, "x": "Яркий луч вылетает из вашего указательного пальца в точку, которую вы выбираете в пределах дистанции, а затем взрывается с низким ревом пламени. Каждое существо в сфере радиусом 20 футов с центром в этой точке должно совершить спасбросок Ловкости. Существо получает 8к6 урона огнем при провале или половину этого урона при успехе.\nОгонь распространяется за углы. Он воспламеняет горючие предметы в области, которые никто не несет и не носит.", "h": "Если вы накладываете это заклинание, используя ячейку 4-го круга или выше, урон увеличивается на 1к6 за каждый круг ячейки выше 3-го.", "cl": ["sorcerer", "wizard"]}, "haste": {"n": "Ускорение", "l": 3, "s": "Преобразование", "t": "1 действие", "r": "30 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Стружка корня лакрицы.", "k": true, "ri": false, "x": "Выберите добровольное существо, которое вы можете видеть в пределах дистанции. До окончания действия заклинания скорость цели удваивается, она получает бонус +2 к КД, она имеет преимущество на спасброски Ловкости, и она получает дополнительное действие в каждый свой ход. Это действие может быть использовано только для совершения действий Атака (только одна атака оружием), Рывок, Отход, Прятаться или Использование предмета.\nКогда заклинание заканчивается, цель не может двигаться или совершать действия до конца своего следующего хода, так как волна летаргии накатывает на нее.", "h": null, "cl": ["sorcerer", "wizard"]}, "eldritch-blast": {"n": "Мистический заряд", "l": 0, "s": "Воплощение", "t": "1 действие", "r": "120 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Луч потрескивающей энергии устремляется к существу в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1к10 урона силовым полем.\nЗаклинание создает больше одного луча, когда вы достигаете более высоких уровней: два луча на 5-м уровне, три луча на 11-м уровне и четыре луча на 17-м уровне. Вы можете направить лучи в одну цель или в несколько. Совершите отдельный бросок атаки для каждого луча.", "h": null, "cl": ["warlock"]}, "hellish-rebuke": {"n": "Адское возмездие", "l": 1, "s": "Воплощение", "t": "1 реакция", "r": "60 фт.", "d": "Мгновенная", "c": "V · S", "m": null, "k": false, "ri": false, "x": "Вы указываете пальцем, и существо, которое нанесло вам урон, на мгновение окружается адским пламенем. Существо должно совершить спасбросок Ловкости. Оно получает 2к10 урона огнем при провале или половину этого урона при успехе.", "h": "Если вы накладываете это заклинание, используя ячейку 2-го круга или выше, урон увеличивается на 1к10 за каждый круг ячейки выше 1-го.", "cl": ["warlock"]}, "hold-person": {"n": "Удержание личности", "l": 2, "s": "Очарование", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 1 мин.", "c": "V · S · M", "m": "Небольшой, прямой кусок железа.", "k": true, "ri": false, "x": "Выберите гуманоида, которого вы можете видеть в пределах дистанции. Цель должна преуспеть в спасброске Мудрости или быть парализованной на время действия. В конце каждого своего хода цель может совершить еще один спасбросок Мудрости. При успехе заклинание заканчивается на цели.", "h": "Если вы накладываете это заклинание, используя ячейку 3-го круга или выше, вы можете нацелиться на одного дополнительного гуманоида за каждый круг ячейки выше 2-го. Гуманоиды должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.", "cl": ["bard", "cleric", "druid", "sorcerer", "warlock", "wizard"]}, "darkness": {"n": "Тьма", "l": 2, "s": "Воплощение", "t": "1 действие", "r": "60 фт.", "d": "Вплоть до 10 мин.", "c": "V · M", "m": "Мех летучей мыши и капля дегтя или кусок угля.", "k": true, "ri": false, "x": "Магическая тьма распространяется из точки, которую вы выбираете в пределах дистанции, заполняя сферу радиусом 15 футов в течение длительности. Тьма огибает углы. Существо с темным зрением не может видеть сквозь эту тьму, и немагический свет не может освещать ее.\nЕсли точка, которую вы выбираете, находится на предмете, который вы держите, или на том, который никто не носит и не несет, тьма исходит от предмета и движется вместе с ним. Полное накрытие источника тьмы непрозрачным предметом, таким как миска или шлем, блокирует тьму.\nЕсли какая-либо часть области этого заклинания перекрывается областью света, созданного заклинанием 2-го круга или ниже, заклинание, создавшее свет, рассеивается.", "h": null, "cl": ["sorcerer", "warlock", "wizard"]}, "counterspell": {"n": "Контрзаклинание", "l": 3, "s": "Ограждение", "t": "1 реакция", "r": "60 фт.", "d": "Мгновенная", "c": "S", "m": null, "k": false, "ri": false, "x": "Вы пытаетесь прервать существо в процессе накладывания заклинания. Если существо накладывает заклинание 3-го круга или ниже, его заклинание проваливается и не имеет эффекта. Если оно накладывает заклинание 4-го круга или выше, совершите проверку своей базовой характеристики заклинания. Сл равна 10 + круг заклинания. При успехе заклинание существа проваливается и не имеет эффекта.", "h": "Если вы накладываете это заклинание, используя ячейку 4-го круга или выше, прерванное заклинание не имеет эффекта, если его круг меньше или равен кругу ячейки, которую вы использовали.", "cl": ["sorcerer", "warlock", "wizard"]}, "fly": {"n": "Полет", "l": 3, "s": "Преобразование", "t": "1 действие", "r": "Касание", "d": "Вплоть до 10 мин.", "c": "V · S · M", "m": "Перо крыла любой птицы.", "k": true, "ri": false, "x": "Вы касаетесь согласного существа. Цель получает скорость полета 60 футов на время действия. Когда заклинание заканчивается, цель падает, если она все /* ---------- magic section ---------- */
function sources(h){ return h.classes.filter(c => c.list); }
function heroSpells(h){ return Object.entries(h.spell).map(([key, e]) => ({key, ...e, sp:SPELLS[e.id]})); }
function slotMarks(v, cls = ''){ return `<span class="marks">${Array.from({length:v.max},(_,i) => `<i class="mark ${cls} ${i < v.left ? '' : 'off'}"></i>`).join('')}</span>`; }
function magicHTML(h){
  const src = sources(h), all = heroSpells(h).filter(s => !s.arcanum);
  const circles = [...new Set(all.map(s => s.sp.l))].sort((a,b) => a-b);
  const castable = s => s.sp.l === 0 || (h.pact ? h.pact.left > 0 && s.sp.l <= h.pact.circle : Object.entries(h.slots || {}).some(([c,v]) => +c >= s.sp.l && v.left > 0));

    const c = h.classes.find(x => x.id === s.cls), prepCls = c.prep && s.sp.l > 0;
    const star = s.always ? `<span class="star lock" title="Всегда подготовлено">${icon('lock')}</span>` : prepCls ? `<button type="button" class="star ${s.prep ? 'on' : ''}" data-prep="${s.key}" aria-label="Подготовка">${icon('star')}</button>` : `<span class="star">${icon(s.sp.l ? 'bookmark' : 'spark')}</span>`;
    return `<div class="sp ${s.prep ? '' : 'unprep'}" style="--acc:${clsAcc(c)}">${star}<button type="button" class="st" data-spell="${s.key}"><b>${s.sp.n}<span class="badges">${s.sp.k ? '<i>К</i>' : ''}${s.sp.ri ? '<i>Р</i>' : ''}</span></b><span>${s.sp.s} · ${s.sp.t}${src.length > 1 ? ` · <span style="color:${clsAcc(c)}">${c.name}</span>` : ''}</span></button>

    const slot = c > 0 && h.slots && h.slots[c];
    const isOpen = open.has(String(c));

      <div class="reveal ${isOpen ? 'open' : ''}"><div><div class="spells">${spells.map(row).join('')}</div></div></div></div>`;
  };
  // Circles above the known spells (multiclass upcasting) still get a slot row in A.
  const slotOnly = h.slots ? Object.keys(h.slots).map(Number).filter(c => !circles.includes(c)) : [];
  const conc = h.conc ? SPELLS[h.conc.split('@')[0]] : null;
  return `<div class="sec-title">Магия<button type="button" class="btn tonal sm" data-act="almanac">${icon('book')} Альманах</button></div>
    ${conc ? `<div class="conc" id="conc">${icon('timer')}<b>Концентрация: ${conc.n}<small>${conc.d}</small></b><button type="button" class="btn sm" data-act="endconc">Прервать</button></div>` : ''}
    ${src.map(c => { const dc = 8 + pb(h) + c.mod, atk = pb(h) + c.mod; const prepN = heroSpells(h).filter(s => s.cls === c.id && s.sp.l > 0 && s.prep && !s.always).length;
      return `<div class="src">${src.length > 1 ? `<div class="src-head"><i style="background:${clsAcc(c)}"></i>${c.name} ${c.lvl}</div>` : ''}
        <div class="facts"><div class="fact"><small>${ABBR[c.ab]}</small><b>${fmt(c.mod)}</b></div><div class="fact"><small>СЛ СПАСА</small><b>${dc}</b></div><div class="fact"><small>АТАКА</small><b>${fmt(atk)}</b></div></div>
        ${c.prep ? `<div class="prep"><span>Подготовлено <b>${prepN} / ${c.cap}</b>${c.always ? ' · ещё ' + c.always.length + ' всегда' : ''}</span></div>` : `<div class="prep"><span>Известно <b>${heroSpells(h).filter(s => s.cls === c.id && s.sp.l > 0 && !s.arcanum).length}</b> · заговоров <b>${heroSpells(h).filter(s => s.cls === c.id && s.sp.l === 0).length}</b></span></div>`}</div>`; }).join('')}
