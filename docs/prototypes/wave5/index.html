<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>QDnD · Волна 5</title>
<style>
/* Wave 5 prototype: settings with a live preview, the libraries and their
   imports, moving a hero between devices, the hero's own card editor and
   the launch. Built on the accepted wave 0-4 language: the app's fonts,
   its six palettes in both themes, AppMotion springs. */
@font-face{font-family:Rubik;font-weight:400;src:url(../../../assets/fonts/Rubik-Regular.ttf)}
@font-face{font-family:Rubik;font-weight:500;src:url(../../../assets/fonts/Rubik-Medium.ttf)}
@font-face{font-family:Rubik;font-weight:600;src:url(../../../assets/fonts/Rubik-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(../../../assets/fonts/Inter-Bold.ttf)}
:root{
  --page:#221f19; --surface:#2A2720; --fg:#FAF7F0; --muted:#c3bfb5; --low:#302D26; --cont:#3C382E;
  --high:#4C473C; --highest:#5E594B; --primary:#FE5685; --on-primary:#191512; --secondary:#66D9EF;
  --tertiary:#FD971F; --pc:#49313C; --sc:#314146; --tc:#473B2C; --outline:#79705B;
  --heal:#A6E22E; --a0:#FE5685; --a1:#FD971F; --a2:#FFD866; --a3:#A6E22E; --a4:#66D9EF; --a5:#AB9DF2;
  --display:Rubik,"Segoe UI",Roboto,system-ui,sans-serif; --body:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --r-md:12px; --r-lg:16px; --r-lgp:20px; --r-xl:28px; --r-xlp:32px;
  --e-snappy:cubic-bezier(.2,0,0,1); --e-gentle:cubic-bezier(.2,0,0,1); --d-snappy:450ms; --d-gentle:620ms;
  --e-standard:cubic-bezier(.2,0,0,1); --e-enter:cubic-bezier(.05,.7,.1,1); --e-exit:cubic-bezier(.3,0,.8,.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.reduce *,.reduce *::before,.reduce *::after{transition-duration:1ms!important;animation:none!important}

/* Stage */
.stage{min-height:100%;display:flex;gap:36px;align-items:flex-start;justify-content:center;padding:28px 16px}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:46px;overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 10px #12110e,0 30px 70px -20px rgba(0,0,0,.7);isolation:isolate}
.panel{width:340px;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.panel h1{font:600 30px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.panel p{margin:0;color:var(--muted);font-size:14px}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lbl{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt .hint{font-size:12.5px;color:var(--muted)}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.heroes button{padding:8px 10px;border-radius:14px;background:var(--low);font:600 12.5px/1.2 var(--body);color:var(--muted);display:flex;gap:8px;align-items:center}
.heroes button i{width:8px;height:8px;border-radius:50%;flex:none}
.heroes button[aria-pressed="true"]{background:var(--sc);color:var(--fg)}
@media (max-width:760px){.stage{padding:0;display:block}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.panel{display:none}}
.vbtn{position:absolute;right:0;top:46%;z-index:40;width:34px;height:44px;border-radius:14px 0 0 14px;display:grid;place-items:center;opacity:.85}
.vbtn .icon{width:18px;height:18px}
@media (min-width:761px){.vbtn{display:none}}

/* Glass: only for layers floating over live content */
.glass{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:inset 0 .7px 0 color-mix(in srgb,var(--fg) 14%,transparent),0 10px 30px -12px rgba(0,0,0,.55)}

/* Segments with a flowing indicator */
.seg{position:relative;display:flex;background:var(--low);border-radius:999px;padding:4px;isolation:isolate;max-width:100%}
.seg .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--sc);z-index:-1}
.seg button{position:relative;flex:1;text-align:center;padding:9px 12px;border-radius:999px;font:600 13px/1.1 var(--body);color:var(--muted);white-space:nowrap;transition:color 240ms var(--e-snappy)}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.toggle{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 var(--body);color:var(--muted)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--high);position:relative;transition:background-color 240ms var(--e-snappy);flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:999px;background:var(--muted);transition:left var(--d-snappy) var(--e-snappy),background-color 240ms}
.toggle[aria-checked="true"] .switch{background:var(--secondary)}
.toggle[aria-checked="true"] .switch::after{left:22px;background:var(--surface)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;font:600 14px/1 var(--body);
  background:var(--high);color:var(--fg);box-shadow:inset 0 0 0 100px transparent;transition:transform var(--d-snappy) var(--e-snappy),box-shadow 260ms var(--e-standard),opacity 200ms}
.btn:active{transform:scale(.975);box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--fg) 9%,transparent);transition:transform 160ms var(--e-standard),box-shadow 120ms}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:color-mix(in srgb,var(--secondary) 16%,var(--low))}
.btn.wide{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:18px;font:600 13px/1.2 var(--body);color:var(--muted);
  box-shadow:inset 0 0 0 1.4px var(--outline);transition:background-color 220ms,color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{border-radius:12px;background:var(--tc);color:var(--fg);box-shadow:none}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 8%,transparent);flex:none;transition:transform var(--d-snappy) var(--e-snappy)}
.round:active{transform:scale(.92)}

/* App layers */
.layer{position:absolute;inset:0;overflow:hidden}
.scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.topbar{position:absolute;left:0;right:0;top:0;z-index:20;padding:8px 14px 10px;display:flex;align-items:center;gap:10px}
.tb-hav{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none}
.tb-hav .icon{width:17px;height:17px}
.tb-title{font:600 17px/1.2 var(--display);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmhp{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:78px}
.cmhp b{font:600 14px/1 var(--display);font-variant-numeric:tabular-nums}
.mini-hp{height:4px;width:100%;border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.mini-hp i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.island-wrap{position:absolute;left:0;right:0;top:58px;z-index:19;padding:6px 14px 10px}
.island{position:relative;display:flex;padding:6px;border-radius:999px;isolation:isolate}
.island .ind{position:absolute;top:6px;bottom:6px;border-radius:999px;z-index:-1;background:color-mix(in srgb,var(--secondary) 24%,color-mix(in srgb,var(--surface) 40%,transparent))}
.island button{flex:1;height:50px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.island button[aria-selected="true"]{color:var(--fg)}
.island button[aria-selected="true"] .icon{transform:scale(1.1)}
.page{padding:150px 16px 120px;display:flex;flex-direction:column;gap:14px}
.sec-title{font:600 20px/1.2 var(--display);letter-spacing:-.015em;margin:8px 2px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-title small{font:500 13px/1 var(--body);color:var(--muted)}
.muted{color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:60;padding:13px 16px;border-radius:var(--r-lgp);font-size:14px;
  transform:translateY(30px);opacity:0;transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms;pointer-events:none}
.toast.show{transform:none;opacity:1}

.marks{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.mark{width:14px;height:14px;border-radius:50%;background:var(--acc,var(--secondary));box-shadow:inset 0 0 0 0 transparent;
  transition:background-color 260ms,box-shadow 260ms,transform var(--d-snappy) var(--e-snappy)}
.mark.off{background:transparent;box-shadow:inset 0 0 0 1.8px var(--outline);transform:scale(.86)}
.mark.lg{width:18px;height:18px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12px/1 var(--body);padding:7px 11px;border-radius:999px;color:var(--muted);box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--fg) 14%,transparent)}
.tag.on{color:var(--fg);background:color-mix(in srgb,var(--acc) 18%,transparent);box-shadow:none}
/* Drums of digits */
.odo{display:inline-flex;vertical-align:-.1em;height:1em;line-height:1em;overflow:hidden}
.odo .od{display:inline-block;height:1em;overflow:hidden}
.odo .ods{display:flex;flex-direction:column;transform:translateY(calc(var(--d) * -1em));transition:transform 620ms var(--e-snappy)}
.odo .ods i{display:block;height:1em;line-height:1em;font-style:normal;text-align:center}
.huge .odo,.odo.huge{vertical-align:-.04em}
.float{position:absolute;z-index:70;pointer-events:none;font:700 26px/1 var(--display);letter-spacing:-.02em;color:var(--fg);text-shadow:0 6px 18px rgba(0,0,0,.5)}

/* Peek bubble */
[data-peek]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.peek{position:absolute;z-index:80;max-width:280px;padding:12px 14px;border-radius:18px;display:flex;flex-direction:column;gap:4px;pointer-events:none;
  opacity:0;transform:scale(.86);transition:opacity 160ms,transform 380ms var(--e-snappy)}
.peek.in{opacity:1;transform:none}
.peek b{font:600 14px/1.25 var(--body)}
.peek span{font-size:13px;line-height:1.4;color:color-mix(in srgb,var(--fg) 80%,transparent)}

/* Dice */
.die2{position:relative;width:58px;height:58px;flex:none;display:grid;place-items:center;transition:transform var(--d-snappy) var(--e-snappy),opacity 300ms}
.die2 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.die2 .face{fill:color-mix(in srgb,var(--acc) 24%,var(--cont));stroke:var(--acc);stroke-width:4;stroke-linejoin:round}
.die2 .fac{fill:none;stroke:color-mix(in srgb,var(--acc) 50%,transparent);stroke-width:2.5}
.die2 b{position:relative;font:600 16px/1 var(--display);font-variant-numeric:tabular-nums}
.die2.sm{width:42px;height:42px}
.die2.sm b{font-size:13.5px}
.die2.xl{width:84px;height:84px}
.die2.xl b{font-size:22px}
button.die2:active{transform:scale(.9)}
button.die2[disabled]{opacity:.4}
.die2.tumble{animation:tumble 640ms var(--e-snappy)}
.die2.tumble b{color:color-mix(in srgb,var(--fg) 70%,transparent)}
@keyframes tumble{0%{transform:rotate(0) scale(1)}35%{transform:rotate(200deg) scale(1.16)}70%{transform:rotate(330deg) scale(.96)}100%{transform:rotate(360deg) scale(1)}}
.die2.landed{animation:land 420ms var(--e-snappy)}
@keyframes land{0%{transform:scale(1.25)}100%{transform:none}}

/* Keypad and fields in sheets */
.kp-val{text-align:center;font:600 64px/1 var(--display);letter-spacing:-.03em;padding:6px 0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{height:58px;border-radius:20px;background:var(--low);font:600 22px/1 var(--display);display:grid;place-items:center;transition:transform 120ms,background-color 120ms}
.kp button:active{transform:scale(.94);background:var(--sc)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font:600 12px/1 var(--body);color:var(--muted);letter-spacing:.04em}
.fld input{height:50px;border-radius:16px;border:0;background:var(--low);color:var(--fg);font:500 16px/1 var(--body);padding:0 14px;outline:none;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow 200ms}
.fld input:focus{box-shadow:inset 0 0 0 1.5px var(--secondary)}
.stp{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px;border-radius:18px;background:var(--low)}
.stp>span{font:600 12px/1 var(--body);color:var(--muted);padding-left:6px}
.stp button{width:40px;height:40px;border-radius:14px;background:color-mix(in srgb,var(--fg) 8%,transparent);font:600 20px/1 var(--display);touch-action:none}
.stp .odo{font:600 26px/1 var(--display)}
.mini-h{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.blist{display:flex;flex-direction:column;gap:6px}
.brow2{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--low);text-align:left;transition:transform var(--d-snappy) var(--e-snappy)}
.brow2:active{transform:scale(.98)}
.brow2 .ft{flex:1;min-width:0}
.brow2 .ft>b{display:block;font:600 15px/1.2 var(--body)}
.brow2 .chev{width:18px;height:18px;color:var(--muted)}
.bic{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--a3) 22%,var(--cont));color:var(--a3)}
.bic .icon{width:22px;height:22px}
.bic.big{width:54px;height:54px;border-radius:18px}
.bic.big .icon{width:30px;height:30px}
.bst{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.bst i{font:500 12px/1 var(--body);font-style:normal;color:var(--muted)}
.bst i b{font:600 13px/1 var(--display);color:var(--fg)}
.bcard{position:relative;overflow:hidden;isolation:isolate;display:flex;gap:14px;align-items:center;padding:18px;border-radius:26px;min-height:110px;background:linear-gradient(160deg,color-mix(in srgb,var(--a3) 18%,var(--low)),var(--low))}
.bcard .blob{position:absolute;z-index:-1;width:200px;height:180px;right:-60px;top:-60px;opacity:.55;background:radial-gradient(circle at 40% 40%,color-mix(in srgb,var(--a3) 60%,transparent),transparent 70%);border-radius:64% 36% 30% 70%/58% 30% 70% 42%;animation:blobm 6s ease-in-out infinite alternate}
.bcard .ft>b{display:block;font:600 22px/1.15 var(--display)}
.bcard small{font-size:12px;color:var(--muted)}
@keyframes blobm{to{border-radius:40% 60% 62% 38%/42% 55% 45% 58%;transform:rotate(18deg)}}
.lockedi .lockb{display:flex;align-items:center;gap:10px;margin-top:14px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--muted);font-size:13.5px}
.lockedi .lockb .icon{width:22px;height:22px;flex:none}

/* Cast sheet */
.effect{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 20%,var(--low)),var(--low))}
.effect b{font:600 40px/1 var(--display);letter-spacing:-.02em}
.effect span{font-size:13.5px;color:color-mix(in srgb,var(--fg) 78%,transparent)}
.ladder2{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.rung2{flex:0 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px;border-radius:20px;background:var(--low);transition:background-color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.rung2 small{font:600 11px/1 var(--body);color:var(--muted)}
.rung2 b{font:600 24px/1 var(--display);display:grid;place-items:center;min-height:24px}
.rung2 b .icon{width:22px;height:22px}
.rung2 .mk{display:flex;gap:3px;font:600 10.5px/1 var(--body);color:var(--muted)}
.rung2 .mk i{width:7px;height:7px;border-radius:50%;background:var(--secondary)}
.rung2 .mk i.off{background:transparent;box-shadow:inset 0 0 0 1.4px var(--outline)}
.rung2[aria-pressed="true"]{background:color-mix(in srgb,var(--secondary) 22%,var(--low));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--secondary) 60%,transparent);transform:translateY(-2px)}
.rung2[disabled]{opacity:.35;pointer-events:none}
.facts2 .cell b{font:600 15px/1.25 var(--body)}
.more{display:flex;align-items:center;gap:6px;font:600 13px/1 var(--body);color:var(--secondary)}
.more .icon{width:16px;height:16px;transition:transform var(--d-snappy) var(--e-standard)}
.more.open .icon{transform:rotate(180deg)}
.tag .icon{width:13px;height:13px;vertical-align:-2px}
/* Bottom sheets */
.modal{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,8,6,.45);opacity:0}
.bsheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:var(--cont);box-shadow:0 -14px 40px -16px rgba(0,0,0,.6);transform:translateY(100%);touch-action:none}
.grab{height:28px;display:grid;place-items:center;flex:none;cursor:grab}
.grab i{width:36px;height:4px;border-radius:999px;background:var(--outline)}
.bs-body{overflow-y:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.bs-kicker{font:600 13px/1 var(--body);color:var(--secondary)}
.bs-title{font:600 26px/1.12 var(--display);letter-spacing:-.02em;margin:0}
.bs-sub{color:var(--muted);font-size:13.5px;margin-top:-8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border-radius:16px;padding:11px 12px;background:var(--low)}
.cell small{display:block;font:600 11px/1 var(--body);color:var(--muted);letter-spacing:.04em}
.cell b{display:block;font:600 14px/1.3 var(--body);margin-top:5px}
.prose{font-size:15px;line-height:1.55;white-space:pre-line}
.prose h4{font:600 16px/1.2 var(--display);margin:6px 0 4px}
.ladder{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.rung{min-width:64px;padding:10px 10px 9px;border-radius:18px;background:var(--low);text-align:center;transition:background-color 220ms,box-shadow 220ms,transform var(--d-snappy) var(--e-snappy)}
.rung small{display:block;font:500 11px/1.2 var(--body);color:var(--muted)}
.rung b{font:600 18px/1.1 var(--display)}
.rung[aria-pressed="true"]{background:color-mix(in srgb,var(--secondary) 22%,var(--low));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--secondary) 60%,transparent)}
.rung[disabled]{opacity:.35;pointer-events:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--a5) 14%,var(--low));font-size:13.5px}
.note .icon{width:18px;height:18px;color:var(--a5);margin-top:1px}

/* Class instruments, third pass: each ability an object of its class;
   numbers are drums; details live behind a peek. */
.inst{position:relative;display:block;width:100%;text-align:left;border-radius:30px;padding:18px;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 15%,var(--low)) 0%,var(--low) 72%);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 8%,transparent),0 20px 40px -28px rgba(0,0,0,.75)}
.inst-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.hgrp{display:flex;gap:6px;align-items:center}
.cap{font:600 11.5px/1.1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--acc) 72%,var(--fg))}
.rest{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);color:var(--muted);padding:8px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);flex:none;
  transition:transform var(--d-snappy) var(--e-snappy),background-color 200ms}
.rest:active{transform:scale(.92);background:color-mix(in srgb,var(--acc) 24%,transparent);color:var(--fg)}
.rest .icon{width:14px;height:14px}
.used{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--body);padding:7px 10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--muted);flex:none}
.used .icon{width:13px;height:13px}
.huge{font:600 60px/.92 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.of{font:500 22px/1 var(--display);color:var(--muted);margin-left:6px}
.big{font:600 34px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;line-height:1.3;color:var(--muted)}
.hint.c{text-align:center;margin-top:10px}
.sub{font-size:12.5px;line-height:1.35;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative}
.stack{display:flex;flex-direction:column;gap:12px}
.lite{border-radius:24px;padding:14px 16px;background:var(--low);position:relative;overflow:hidden}
.lite b{font:600 15px/1.25 var(--body)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell2{border-radius:24px;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 12%,var(--low)),var(--low) 80%);display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;position:relative;overflow:hidden;
  transition:transform var(--d-snappy) var(--e-snappy),background-color 300ms,opacity 300ms}
.cell2:active{transform:scale(.97)}
.cell2 b{font:600 15px/1.2 var(--body)}
.cell2[disabled]{opacity:.5}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;width:100%;font:600 15px/1 var(--body);position:relative;overflow:hidden;
  background:var(--acc);color:color-mix(in srgb,var(--surface) 88%,black);transition:transform var(--d-snappy) var(--e-snappy),opacity 200ms,background-color 300ms}
.go:active{transform:scale(.975)}
.go[disabled]{opacity:.38;pointer-events:none}
.go.soft{background:color-mix(in srgb,var(--acc) 22%,var(--cont));color:var(--fg)}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font:600 14px/1 var(--body);background:color-mix(in srgb,var(--fg) 7%,transparent);transition:transform var(--d-snappy) var(--e-snappy)}
.ghost:active{transform:scale(.97)}
.ghost[disabled]{opacity:.4}
.ghost.wide{width:100%;margin-top:10px}
.ev{animation:ev 640ms var(--e-snappy)}
@keyframes ev{25%{transform:scale(1.04)}100%{transform:none}}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chipx{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--body);padding:8px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.chipx b{font-family:var(--display)}
.chipx .icon{width:14px;height:14px}
.lvchip{display:inline-flex;align-items:center;gap:6px;transition:transform var(--d-snappy) var(--e-snappy)}
.lvchip:active{transform:scale(.93)}
.lockd{opacity:.55}
.lockd .icon{width:18px;height:18px}
/* Shared rhythm pieces */
.fuse{display:flex;gap:4px;margin-top:14px}
.fuse i{flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--fg) 10%,transparent);transition:background-color 400ms,transform 400ms var(--e-snappy)}
.fuse i.burnt{background:color-mix(in srgb,var(--acc) 30%,transparent)}
.fuse i.now{background:var(--acc);transform:scaleY(1.6);box-shadow:0 0 12px var(--acc)}
.rctl{display:flex;align-items:center;gap:10px;margin-top:12px}
.rctl .ghost{height:52px;padding:0 16px}
.rnum{flex:1;text-align:center}
.rnum small{display:block;font:600 11px/1 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.ember{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:color-mix(in srgb,var(--surface) 88%,black);box-shadow:0 8px 22px -8px var(--acc);transition:transform var(--d-snappy) var(--e-snappy)}
.ember:active{transform:scale(.88)}
.rbadges{display:flex;gap:8px;margin-top:14px}
.rb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:20px;background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--muted);transition:background-color 400ms,color 400ms,transform var(--d-snappy) var(--e-snappy),box-shadow 400ms}
.rb .icon{width:24px;height:24px}
.rb small{font:600 12px/1 var(--body)}
.rb.tog[aria-pressed="true"]{color:var(--fg);background:color-mix(in srgb,var(--acc) 26%,var(--cont));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 70%,transparent)}
button.rb:active{transform:scale(.94)}

/* Barbarian */
.barb .heat{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity 700ms var(--e-standard);
  background:radial-gradient(110% 70% at 85% -10%,color-mix(in srgb,var(--a0) 55%,transparent),transparent 62%),radial-gradient(80% 60% at 0% 110%,color-mix(in srgb,var(--a1) 40%,transparent),transparent 60%)}
.barb.on .heat{opacity:1}
.barb.on{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a0) 70%,transparent),0 20px 44px -24px color-mix(in srgb,var(--a0) 60%,black)}
.barb.on .rb:not(.tog){color:var(--fg);background:color-mix(in srgb,var(--a0) 18%,transparent)}
.barb.on .rb .icon{animation:throb 1.6s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.12)}}
.barb .hazard{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity 400ms;pointer-events:none;
  background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--a1) 30%,transparent) 0 10px,transparent 10px 20px);
  -webkit-mask:linear-gradient(#000,#000) top/100% 6px no-repeat,linear-gradient(#000,#000) bottom/100% 6px no-repeat;mask:linear-gradient(#000,#000) top/100% 6px no-repeat,linear-gradient(#000,#000) bottom/100% 6px no-repeat}
.barb.reck .hazard{opacity:1;animation:hz 1.2s linear infinite}
@keyframes hz{to{background-position:28px 0}}
.barb.flare{animation:flare 820ms var(--e-snappy)}
@keyframes flare{0%{transform:scale(.985)}30%{transform:scale(1.02);filter:brightness(1.3)}100%{transform:none;filter:none}}
.barb.jolt{animation:jolt 360ms}
@keyframes jolt{20%{transform:translateX(-4px) rotate(-.6deg)}50%{transform:translateX(4px) rotate(.6deg)}80%{transform:translateX(-2px)}}
.claws{display:flex;gap:10px;align-items:flex-end;padding-left:4px}
.claw{width:13px;height:56px;border-radius:7px;transform:skewX(-16deg);background:linear-gradient(180deg,var(--a1),var(--a0));transition:background 300ms,box-shadow 300ms}
.claw:nth-child(even){height:64px}
.claw.off{background:transparent;box-shadow:inset 0 0 0 2px var(--outline)}
.dmg{text-align:right}
.dmg small{display:block;font:600 12px/1 var(--body);color:var(--muted);margin-top:4px}
.hold{position:relative;height:62px;border-radius:31px;width:100%;overflow:hidden;margin-top:14px;background:color-mix(in srgb,var(--fg) 8%,transparent);font:600 15px/1 var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
.hold .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--a1),var(--a0))}
.hold span{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:100%}
.hold[disabled]{opacity:.4}
.reck-t{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px;border-radius:20px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:left}
.reck-t .rk{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 18%,transparent);color:var(--a1)}
.reck-t .rk .icon{width:18px;height:18px}
.reck-t b{font:600 14.5px/1.2 var(--body);flex:1}
.reck-t .rk2{display:flex;gap:4px}
.reck-t .rk2 i{white-space:nowrap;font:600 11.5px/1 var(--body);font-style:normal;padding:6px 8px;border-radius:999px;background:color-mix(in srgb,var(--a1) 22%,transparent);animation:ev 500ms var(--e-snappy)}
.reck-t[aria-checked="true"] .switch{background:var(--a1)}
.reck-t[aria-checked="true"] .switch::after{left:22px;background:var(--surface)}
.exh{display:flex;align-items:center;gap:4px;margin-top:10px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--a1) 12%,transparent)}
.exh i{color:var(--outline)}
.exh i.on{color:var(--a1)}
.exh i .icon{width:18px;height:18px}
.exh small{margin-left:auto;font:600 12px/1 var(--body);color:var(--muted)}

/* Paladin: vessel of light */
.poolv{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--a2) 14%,transparent);font:600 17px/1 var(--display)}
.poolv .icon{width:16px;height:16px;color:var(--a2)}
.poolv small{font:500 12px/1 var(--body);color:var(--muted)}
.vessel{position:relative;height:72px;margin-top:14px;border-radius:36px;background:color-mix(in srgb,var(--fg) 6%,transparent);overflow:hidden;touch-action:none;cursor:ew-resize;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--a2) 22%,transparent)}
.vessel .liquid{position:absolute;left:0;top:0;bottom:0;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 45%,var(--cont)),color-mix(in srgb,var(--a2) 60%,var(--cont)));transition:width 600ms var(--e-snappy)}
.vessel .shim{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.55) 1.2px,transparent 2px) 0 0/22px 18px,radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 1.6px) 11px 9px/22px 18px;animation:shim 3.4s linear infinite;opacity:.7}
@keyframes shim{to{background-position:0 -36px,11px -27px}}
.vessel .pour{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,#fff 50%,var(--a2)),var(--a2));box-shadow:0 0 22px var(--a2);transition:left 420ms var(--e-snappy),width 420ms var(--e-snappy)}
.vessel .knob{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--surface);box-shadow:0 6px 18px -4px rgba(0,0,0,.6);transition:left 420ms var(--e-snappy),transform 260ms var(--e-snappy)}
.vessel .knob .icon{width:22px;height:22px}
.vessel.drag .pour,.vessel.drag .knob{transition:none}
.vessel.drag .knob{transform:scale(1.15)}
.vessel .pour.rise{transition:transform 600ms var(--e-exit),opacity 600ms;transform:translateY(-40px) scaleY(.4);opacity:0}
.smite .radiance{position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(circle at 70% 60%,rgba(255,255,240,.9),color-mix(in srgb,var(--a2) 60%,transparent) 40%,transparent 70%);pointer-events:none}
.smite.flash .radiance{animation:radiance 1100ms var(--e-exit)}
@keyframes radiance{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.smite.done{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a2) 55%,transparent),0 20px 40px -24px color-mix(in srgb,var(--a2) 50%,black)}
.srings{display:flex;gap:8px;align-items:center;margin-top:12px}
.sgap{flex:1}
.sring{width:66px;height:66px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a2) 35%,transparent);transition:background-color 300ms,box-shadow 300ms,transform var(--d-snappy) var(--e-snappy)}
.sring b{font:600 22px/1 var(--display)}
.sring .marks{gap:3px}
.sring .mark{width:7px;height:7px}
.sring[aria-pressed="true"]{background:color-mix(in srgb,var(--a2) 24%,var(--cont));box-shadow:inset 0 0 0 2.5px var(--a2),0 0 22px -6px var(--a2)}
.sring[disabled]{opacity:.35}
.sring:active{transform:scale(.92)}
.stog{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--muted);transition:background-color 300ms,color 300ms}
.stog .icon{width:22px;height:22px}
.stog[aria-pressed="true"]{background:color-mix(in srgb,var(--a0) 26%,var(--cont));color:var(--fg)}
.sdice{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;min-height:46px;--acc:var(--a2)}
.sdice .die2{width:46px;height:46px}
.smite-go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:92px;height:92px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,#fff 40%,var(--a2)),var(--a2) 60%,color-mix(in srgb,var(--a1) 70%,var(--a2)));color:color-mix(in srgb,var(--surface) 90%,black);
  box-shadow:0 0 0 6px color-mix(in srgb,var(--a2) 16%,transparent),0 14px 30px -10px var(--a2);transition:transform var(--d-snappy) var(--e-snappy)}
.smite-go b{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.smite-go .icon{width:24px;height:24px}
.smite-go:active{transform:scale(.9)}
.smite-go[disabled]{opacity:.35}
.chan3{display:flex;align-items:stretch;gap:8px;margin-top:12px}
.cdv{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:22px;background:color-mix(in srgb,var(--fg) 5%,transparent);text-align:center;transition:transform var(--d-snappy) var(--e-snappy),background-color 400ms,box-shadow 400ms}
.cdv:active{transform:scale(.95)}
.cdv[disabled]{opacity:.4}
.cdv b{font:600 13px/1.2 var(--body)}
.cdv small{font:600 13px/1 var(--display);color:var(--muted)}
.swd{width:30px;height:84px;overflow:visible;transform:rotate(30deg)}
.swd .blade{fill:color-mix(in srgb,var(--fg) 22%,var(--cont));stroke:color-mix(in srgb,var(--fg) 60%,transparent);stroke-width:2;transition:fill 600ms}
.swd .guard,.swd .pommel{fill:var(--a2)}
.swd .grip{fill:color-mix(in srgb,var(--a1) 50%,var(--cont))}
.swd .shine{transform:translateY(90px);opacity:0}
.cdv.lit{background:color-mix(in srgb,var(--a2) 20%,var(--cont));box-shadow:0 0 30px -10px var(--a2)}
.cdv.lit .blade{fill:color-mix(in srgb,#fff 60%,var(--a2));filter:drop-shadow(0 0 8px var(--a2))}
.cdv.lit .shine{animation:shine 2s ease-in-out infinite;opacity:1}
@keyframes shine{0%{transform:translateY(90px)}100%{transform:translateY(-50px)}}
.cdv.ignite{animation:ev 700ms var(--e-snappy)}
.rings{width:84px;height:84px}
.rings circle{fill:none;stroke:var(--a4);stroke-width:2.5;transform-origin:40px 40px}
.rings circle:nth-child(2){opacity:.6}
.rings circle:nth-child(3){opacity:.3}
.cdv.wave .rings circle{animation:waveo 900ms var(--e-exit)}
.cdv.wave .rings circle:nth-child(2){animation-delay:100ms}
.cdv.wave .rings circle:nth-child(3){animation-delay:200ms}
@keyframes waveo{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.cflame{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:46px;color:var(--a1)}
.cflame .icon{width:28px;height:28px;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{30%{transform:scaleY(1.08) rotate(-3deg)}60%{transform:scaleY(.95) rotate(2deg)}}
.cflame small{font:600 12px/1 var(--display);color:var(--muted)}
.cflame.out{color:var(--outline)}
.cflame.out .icon{animation:none}
.sense{display:flex;align-items:center;gap:14px;padding:14px 16px}
.sense[disabled]{opacity:.5}
.sense .ft{display:flex;flex-direction:column;gap:6px}
.sense .ft b{font:600 17px/1.2 var(--display)}
.eyesvg{width:96px;height:56px;flex:none;overflow:visible}
.eyesvg .eyeg{transform-origin:60px 35px;transform:scaleY(.06);transition:transform 600ms var(--e-snappy)}
.eyesvg .lid{fill:color-mix(in srgb,var(--a4) 18%,var(--cont));stroke:var(--a4);stroke-width:3}
.eyesvg .iris{fill:var(--a4)}
.eyesvg .pupil{fill:var(--surface)}
.eyesvg .lash{fill:none;stroke:var(--a4);stroke-width:3;stroke-linecap:round;transition:opacity 300ms}
.eyesvg .rip{fill:none;stroke:var(--a4);stroke-width:2;opacity:0;transform-origin:60px 35px}
.sense.open .eyeg{transform:none}
.sense.open .lash{opacity:0}
.sense.open .rip{animation:rip 2.4s ease-out infinite}
.sense.open .rip.r2{animation-delay:1.2s}
@keyframes rip{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
.sense.open{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a4) 50%,transparent)}
.eyes{display:flex;gap:6px}
.eye{width:20px;height:12px;border-radius:50%;background:var(--a4);position:relative}
.eye::after{content:"";position:absolute;inset:3px 7px;border-radius:50%;background:var(--surface)}
.eye.off{background:transparent;box-shadow:inset 0 0 0 1.6px var(--outline)}
.eye.off::after{display:none}

/* Rogue: a scene of shadow and light */
.scene{position:relative;height:150px;margin-top:12px;border-radius:22px;overflow:hidden;background:color-mix(in srgb,var(--fg) 4%,transparent)}
.scene .shade{position:absolute;inset:0;background:radial-gradient(70% 90% at 15% 60%,rgba(0,0,0,.55),transparent 70%);opacity:.3;transition:opacity 600ms}
.rogue.hid .scene .shade{opacity:1}
.scene .beam{position:absolute;right:-30px;top:-40px;width:260px;height:260px;background:conic-gradient(from 200deg at 85% 15%,transparent 0deg,color-mix(in srgb,var(--a2) 35%,transparent) 20deg,transparent 46deg);opacity:0;transition:opacity 500ms}
.rogue.lit .scene .beam{opacity:1}
.scene .ring{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px}
.scene .ring circle{fill:none;stroke:color-mix(in srgb,var(--fg) 22%,transparent);stroke-width:1.5;stroke-dasharray:4 5}
.scene .tgt{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a0) 22%,var(--cont));color:var(--a0)}
.scene .tgt .icon{width:24px;height:24px}
.tk{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transition:left 700ms var(--e-snappy),top 700ms var(--e-snappy),opacity 500ms,filter 500ms,transform var(--d-snappy) var(--e-snappy)}
.tk .icon{width:46px;height:46px;padding:10px;border-radius:50%;background:var(--cont);box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
.tk small{font:600 11px/1 var(--body);color:var(--muted)}
.tk:active{transform:scale(.92)}
.tk.you{left:14px;top:46px;color:var(--a4)}
.rogue.hid .tk.you{opacity:.5;filter:blur(.6px)}
.rogue.hid .tk.you .icon{background:color-mix(in srgb,var(--a5) 30%,var(--cont))}
.tk.ally{left:calc(100% - 66px);top:84px;color:var(--a3)}
.tk.ally.near{left:calc(50% + 30px);top:58px}
.tk.sun{right:12px;top:10px;left:auto;color:var(--muted)}
.tk.sun .icon{width:40px;height:40px;padding:9px}
.tk.sun.on{color:var(--a2)}
.d6s{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:180px;--acc:var(--a4)}
.d6s .die2{width:44px;height:44px;transform:translateY(10px);filter:brightness(.45) saturate(.4);transition:transform 520ms var(--e-snappy),filter 520ms}
.d6s.many .die2{width:34px;height:34px}
.rogue.armed .d6s .die2{transform:none;filter:none}
.rogue.armed .d6s .die2:nth-child(2){transition-delay:70ms}
.rogue.armed .d6s .die2:nth-child(3){transition-delay:140ms}
.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mv{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:18px;background:color-mix(in srgb,var(--fg) 5%,transparent);transition:background-color 300ms,transform var(--d-snappy) var(--e-snappy),opacity 300ms}
.mv .mg{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--a4)}
.mv .mg .icon{width:24px;height:24px}
.mv b{font:600 12px/1 var(--body)}
.mv .mvv{font:600 12.5px/1 var(--display);color:var(--muted);min-height:13px}
.mv.on{background:color-mix(in srgb,var(--a4) 24%,var(--cont))}
.mv.on .mvv{color:var(--fg)}
.mv.on .mg .icon{animation:ev 600ms var(--e-snappy)}
.mv[disabled]{opacity:.35}
.mv:active{transform:scale(.94)}
.dodge{flex-direction:row;align-items:center;gap:12px}

/* ================= Wave 5: settings, libraries, transfer, the hero's card, launch ================= */
// APP_PALETTES holds the app's own colours, dumped from AppPalettes: six
// palettes in both themes and the calm «Базовый» scheme.
const PAL_ORDER = ['monokai', 'gruvbox', 'catppuccin', 'nord', 'everforest', 'roseOfDune'];
const PAL_NOTE = {
  monokai:['Тёплые поверхности, неоновые акценты', 'Warm surfaces, neon accents'],
  gruvbox:['Ретро: охра, мох и кирпич', 'Retro: ochre, moss and brick'],
  catppuccin:['Мягкая пастель', 'Soft pastel'],
  nord:['Сдержанная северная синева', 'Restrained arctic blue'],
  everforest:['Хвоя и тёплый свет', 'Pine and warm light'],
  roseOfDune:['Песок, специи и пыльная роза', 'Sand, spice and dusty rose'],
};
let set = {lang:'ru', mode:'system', palette:'monokai', basic:false};
const T = (ru, en) => set.lang === 'ru' ? ru : en;
const themeDark = () => set.mode === 'dark' || set.mode === 'system';
const palKey = (p = set.palette, dark = themeDark()) => `${p}-${dark ? 'dark' : 'light'}`;
// «Базовый режим» keeps the chosen palette and only calms it: accents lose
// a good part of their colour, surfaces turn nearly neutral, quiet text and
// outlines gain contrast. Glows and gradients go away (body.calm).
const grayOf = h => { const [r, g, b] = hex2(h), y = Math.round(.2126 * r + .7152 * g + .0722 * b); return '#' + [y, y, y].map(v => v.toString(16).padStart(2, '0')).join(''); };
const calmHex = (h, keep) => mix(h, grayOf(h), keep);
function palette(key){
  const p = APP_PALETTES[key];
  if (!set.basic) return p;
  const q = {...p};
  ['surface', 'low', 'cont', 'high', 'highest'].forEach(k => q[k] = calmHex(p[k], .35));
  ['primary', 'secondary', 'tertiary'].forEach(k => q[k] = calmHex(p[k], .62));
  ['pc', 'sc', 'tc'].forEach(k => q[k] = calmHex(p[k], .45));
  q.acc = p.acc.map(c => calmHex(c, .58));
  q.on = p.dark ? mix('#FFFFFF', p.on, .5) : mix('#000000', p.on, .5);
  q.muted = mix(q.on, q.surface, .88);
  q.outline = mix(q.on, q.surface, .5);
  return q;
}
function applyApp(key = palKey()){
  const p = palette(key), s = document.documentElement.style, put = (k, v) => s.setProperty('--' + k, v);
  document.body.classList.toggle('calm', set.basic);
  ['surface', 'low', 'cont', 'high', 'highest', 'primary', 'secondary', 'tertiary', 'outline', 'pc', 'sc', 'tc', 'muted'].forEach(k => put(k, p[k]));
  put('fg', p.on); put('on-primary', p.onPrimary); put('page', mix('#000000', p.surface, p.dark ? .2 : .045));
  p.acc.forEach((c, i) => put('a' + i, c)); put('heal', p.acc[3]);
  s.setProperty('color-scheme', p.dark ? 'dark' : 'light');
}

/* ---------- navigation ---------- */
let stack = [{s:'lobby'}], settingsVariant = 'stage', libVariant = 'shelf', splashVariant = 'roll';
const cur = () => stack[stack.length - 1];
function go(screen){ stack.push(screen); buzz.tick(); show(1); }
function back(){ if (stack.length < 2) return; stack.pop(); buzz.tick(); show(-1); }
function show(dir = 0){
  render();
  const page = $('#app .page5');
  if (!dir || reduced || !page) return;
  page.animate([{transform:`translateX(${dir * 36}px)`, opacity:0}, {transform:'none', opacity:1}], {duration:420, easing:springEasing(SPR.snappy, .42)});
}
let painted = null;
function render(){
  const s = cur(), scr = $('#app .scroller'), y = painted === s && scr ? scr.scrollTop : 0; painted = s;
  const html = {lobby:lobbyHTML, settings:settingsHTML, library:libraryHTML, editor:editorHTML, splash:splashHTML}[s.s](s);
  $('#app').innerHTML = html;
  bind(s);
  if ($('#app .scroller')) $('#app .scroller').scrollTop = y;
  if ($('#controls')?.childElementCount) controls();
}
document.addEventListener('scroll', e => { if (!e.target.classList?.contains('scroller')) return;
  const bar = $('#app .top5'); if (bar && !bar.classList.contains('pinned')) bar.classList.toggle('titled', e.target.scrollTop > 90); }, true);
const top5 = (title, {lead = 'back', actions = '', pinned = false} = {}) => `<div class="top5 glass ${pinned ? 'pinned titled' : ''}">
  ${lead ? `<button type="button" class="round" data-a="${lead}" aria-label="${lead === 'back' ? 'Назад' : 'Закрыть'}">${icon(lead === 'back' ? 'back' : 'x')}</button>` : '<span class="sp40"></span>'}

const seal5 = (ic, acc, cls = '') => `<span class="seal5 ${cls}" style="--acc:var(--a${acc})">${icon(ic)}</span>`;

function splashHTML(){
  return `<div class="splash ${splashVariant}"><div class="sp-glow"></div>

    <div class="sp-ver num">0.19 · Cycle</div></div>`;
}
function runSplash(){
  const el = $('.splash'); if (!el) return;
  const done = () => { if (cur().s !== 'splash') return; stack = [{s:'lobby'}]; render();
    if (!reduced) $('#app .page5').animate([{transform:'translateY(24px) scale(.98)', opacity:0}, {transform:'none', opacity:1}], {duration:620, easing:springEasing(SPR.gentle, .62)}); };
  if (reduced) { el.classList.add('in', 'landed'); return setTimeout(done, 700); }
  requestAnimationFrame(() => el.classList.add('in'));
  if (splashVariant === 'roll') {
    // A die tumbles onto the table, lands on 20 and turns into the mark.
    const d = $('.sp-die .die2');
    setTimeout(() => { buzz.light(); tumble([d], [20], 20, () => { buzz.medium(); el.classList.add('landed'); }); }, 120);
    setTimeout(done, 2500);
  } else { setTimeout(() => el.classList.add('landed'), 150); setTimeout(done, 1700); }
}

// A new theme does not cut in: every colour of the app flows from the old
// value to the new one at once (registered colour properties transition),
// as AnimatedTheme lerps the ColorScheme in the app.
function flood(e, change){
  const root = document.documentElement;
  if (!reduced) root.classList.add('morph');
  change(); applyApp(); live(render);
  clearTimeout(flood.t); flood.t = setTimeout(() => root.classList.remove('morph'), 700);
}

  $$('[data-pal]').forEach(b => b.addEventListener('click', e => {

  $$('[data-mode]').forEach(b => b.addEventListener('click', e => { if (set.mode === b.dataset.mode) return; buzz.light(); flood(e, () => { set.mode = b.dataset.mode; }); }));
  $$('[data-lang]').forEach(b => b.addEventListener('click', () => { if (set.lang === b.dataset.lang) return; set.lang = b.dataset.lang; buzz.tick(); live(render); }));

}

// Import as a book being read: each module's pages flip while its counts roll up.
function importRun(mods, name, kind){
  openSheet(`<span class="bs-kicker">${kind === 'zip' ? 'ZIP' : 'XML'}</span><h2 class="bs-title">Читаем «${name}»</h2>
    <div class="reading"><div class="book5"><i></i><i></i><i></i><i></i></div>
      <div class="rmods">${mods.map((m, i) => `<div class="rmod" data-r="${i}"><span class="ft"><b>${m.name}</b><small class="num" data-rc="${i}">ждёт</small></span><span class="rbar"><i></i></span></div>`).join('')}</div></div>
    <div class="ztot" id="rtot">${KINDS5.map(([k, n], i) => `<span style="--acc:var(--a${i})"><b class="num">${odo(0, 'rt' + k)}</b><small>${n}</small></span>`).join('')}</div>
    <button type="button" class="btn primary wide" data-rdone style="height:54px" disabled>Готово</button>`, {onOpen(sh, close){
      const tot = Object.fromEntries(KINDS5.map(([k]) => [k, 0]));
      let i = 0, dup = 0;
      const nextMod = () => {
        if (i >= mods.length) {
          buzz.medium(); $('[data-rdone]', sh).disabled = false; $('.book5', sh).classList.add('shut');
          const mons = mods.reduce((n, m) => n + (m.monsters || 0), 0);
          if (dup || mons) $('#rtot', sh).insertAdjacentHTML('afterend', `<p class="znote">${icon('info')} Пропущено дублей: ${dup}; монстров: ${mons}.</p>`);
          return;
        }
        const m = mods[i], row = $(`[data-r="${i}"]`, sh); row.classList.add('now');
        $(`[data-rc="${i}"]`, sh).textContent = 'читаем…';
        row.querySelector('.rbar i').animate([{width:'0%'}, {width:'100%'}], {duration:reduced ? 10 : 700, fill:'forwards', easing:'cubic-bezier(.4,0,.2,1)'}).onfinish = () => {
          buzz.tick(); row.classList.remove('now'); row.classList.add('done');
          if (m.dup && mods.some(x => x.combined)) dup += 12;
          $(`[data-rc="${i}"]`, sh).textContent = entryStats(m) || 'пусто';
          KINDS5.forEach(([k]) => { tot[k] += m[k] || 0; setOdo($(`[data-odo="rt${k}"]`, sh), tot[k]); });
          i++; setTimeout(nextMod, reduced ? 0 : 160);
        };
      };
      setTimeout(nextMod, reduced ? 0 : 300);
      $('[data-rdone]', sh).addEventListener('click', () => close(0, () => {
        const src = kind === 'zip'
          ? {id:'n' + Date.now(), kind:'zip', name, date:'сегодня', acc:4, modules:mods.map(m => ({...m, id:m.id || m.name}))}
          : {id:'n' + Date.now(), kind:'xml', name, date:'сегодня', acc:2, ...mods[0]};
        SOURCES.push(src); libEmpty = false;
        if (cur().s !== 'library') stack.push({s:'library'});
        cur().sel = src.id; render();
        const sp = $(`[data-src="${src.id}"]`);
        if (sp && !reduced) { sp.animate([{transform:'translateY(-140px) rotate(-8deg)', opacity:0}, {transform:'none', opacity:1}], {duration:720, easing:springEasing(SPR.bouncy, .72)}); sp.scrollIntoView({inline:'end', block:'nearest'}); }
        toast(`«${name}» на полке`);
      }));
    }});
}

/* ---------- moving a hero ---------- */
function transferSheet(id){
  if (!id) {
    openSheet(`<span class="bs-kicker">${T('Перенос', 'Move')}</span><h2 class="bs-title">${T('Какого героя?', 'Which hero?')}</h2>
      <div class="blist">${HEROES.map(h => `<button type="button" class="brow2" data-hh="${h.id}"><span class="hc-av sm" style="--acc:var(--a${h.acc})">${h.name[0]}</span><span class="ft"><b>${h.name}</b><small class="muted">${h.race} · ${h.cls} ${h.lvl}</small></span>${icon('fwd', 'chev')}</button>`).join('')}
        <button type="button" class="brow2" data-imp>${seal5('download', 3)}<span class="ft"><b>${T('Принять героя из файла', 'Bring a hero in from a file')}</b><small class="muted">.qdnd · .xml</small></span>${icon('fwd', 'chev')}</button></div>`, {onOpen(sh, close){
        $$('[data-hh]', sh).forEach(b => b.addEventListener('click', () => close(0, () => transferSheet(b.dataset.hh))));
        $('[data-imp]', sh).addEventListener('click', () => close(0, () => importHeroSheet('qdnd')));
      }});
    return;
  }
  const h = HEROES.find(x => x.id === id);
  let fmt = 'qdnd', own = true;

/* ---------- controls panel ---------- */
function controls(){
  const at = cur().s;
  $('#controls').innerHTML = `<div class="opt"><span class="lbl">Экран</span><div class="heroes">${[['splash', 'Запуск'], ['lobby', 'Отряд'], ['settings', 'Настройки'], ['library', 'Библиотеки'], ['zip', 'Импорт ZIP'], ['move', 'Перенос героя'], ['import', 'Принять героя'], ['editor', 'Анкета героя']].map(([k, n]) =>
      `<button type="button" data-scr="${k}" aria-pressed="${k === at}">${n}</button>`).join('')}</div></div>
    <div class="opt"><span class="lbl">Настройки · вариант</span>${segHTML([['stage', 'A · витрина'], ['board', 'B · пульт']], settingsVariant, 'svSeg')}<span class="hint">A — живая витрина листа над лентой палитр. B — спокойные группы и сетка палитр.</span></div>
    <div class="opt"><span class="lbl">Библиотеки · вариант</span>${segHTML([['shelf', 'A · полка'], ['catalog', 'B · каталог']], libVariant, 'lvSeg')}<span class="hint">A — источники корешками на полке, книга выдвигается. B — карточки с полосой состава.</span></div>
    <div class="opt"><span class="lbl">Запуск · вариант</span>${segHTML([['roll', 'A · бросок'], ['quiet', 'B · тихий']], splashVariant, 'spSeg')}<span class="hint">A — к20 падает на стол, выпадает 20 и становится знаком. B — знак и надпись проявляются.</span></div>
    <button type="button" class="toggle" id="emptyLib" aria-checked="${libEmpty}"><span class="switch"></span>Пустые библиотеки</button>
    <button type="button" class="toggle" id="redm" aria-checked="${reduced}"><span class="switch"></span>Меньше движения</button>`;
  const shut = () => { modal.innerHTML = ''; modal.style.pointerEvents = 'none'; };
  $$('[data-scr]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.scr; buzz.tick(); shut();
    stack = [{s:'lobby'}];
    if (k === 'splash') stack = [{s:'splash'}];
    if (k === 'settings') stack.push({s:'settings'});
    if (['library', 'zip'].includes(k)) stack.push({s:'library', sel:'core'});
    if (k === 'editor') stack.push({s:'editor', h:'elian'});
    show(1);
    if (k === 'zip') setTimeout(zipSheet, 200);
    if (k === 'move') setTimeout(() => transferSheet('elian'), 200);
    if (k === 'import') setTimeout(() => importHeroSheet('qdnd'), 200); }));
  segment($('#svSeg'), b => { shut(); settingsVariant = b.dataset.v; stack = [{s:'lobby'}, {s:'settings'}]; render(); });
  segment($('#lvSeg'), b => { shut(); libVariant = b.dataset.v; stack = [{s:'lobby'}, {s:'library', sel:'core', open:'core'}]; render(); });
  segment($('#spSeg'), b => { shut(); splashVariant = b.dataset.v; stack = [{s:'splash'}]; render(); });
  $('#emptyLib').addEventListener('click', e => { libEmpty = !libEmpty; e.currentTarget.setAttribute('aria-checked', libEmpty); if (['library', 'settings'].includes(cur().s)) render(); });
  $('#redm').addEventListener('click', e => { reduced = !reduced; document.body.classList.toggle('reduce', reduced); e.currentTarget.setAttribute('aria-checked', reduced); });
}
applyApp();
stack = [{s:'splash'}];
render();
controls();

</script>
</body>
</html>
